<style>
/* PLAN_ARCHIVE_ICONS_V13 */
.v13-icon{width:1em;height:1em;display:inline-block;vertical-align:-.14em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.v13-iconbox{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--surface-2);color:var(--primary);flex:0 0 auto}.v13-plan-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.v13-plan-tabs{display:flex;gap:6px;margin-bottom:15px;background:#eef3f0;padding:5px;border-radius:12px;width:max-content;max-width:100%}.v13-plan-tabs button{border:0;background:transparent;padding:8px 12px;border-radius:8px;font-weight:700;color:var(--muted)}.v13-plan-tabs button.active{background:#fff;color:var(--primary);box-shadow:0 2px 8px rgba(0,0,0,.05)}.v13-archived{opacity:.86}.v13-archive-note{border:1px solid #ddd8c9;background:#fbfaf5;border-radius:12px;padding:11px 12px;margin-bottom:14px}.v13-archive-note strong{display:block;margin-bottom:3px}.v13-danger-zone{border-top:1px solid var(--border);margin-top:18px;padding-top:15px}.v4-evicon .v13-icon,.v5-animal-event .icon .v13-icon{width:19px;height:19px}.animal-icon .v13-icon{width:28px;height:28px}.v13-plan-card-actions{display:flex;gap:8px;justify-content:flex-end;align-items:center;flex-wrap:wrap}.v13-muted-action{background:transparent;border:0;color:var(--muted);font-weight:700;padding:7px 8px;border-radius:8px}.v13-muted-action:hover{background:var(--surface-2);color:var(--text)}
</style>
<script>
/* PLAN_ARCHIVE_ICONS_V13 */
(()=>{
 if(typeof state==='undefined')return;
 state.planListFilter=state.planListFilter||'current';
 const esc13=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const svg13=(name,size=20)=>{const p={
  home:'<path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10.5V20h5v-5h3v5h5v-9.5"/>',
  animal:'<path d="M5 9c0-2 1.7-3.5 3.7-3.5h6.6C17.3 5.5 19 7 19 9v6c0 2-1.7 3.5-3.7 3.5H8.7C6.7 18.5 5 17 5 15V9Z"/><path d="M8 5.5 6 3M16 5.5 18 3M9 12h.01M15 12h.01M10 15c1.3.8 2.7.8 4 0"/>',
  feed:'<path d="M4 20c7-1 12-6 14-16 2 8-1 15-8 17"/><path d="M7 17c3-4 6-7 10-10"/>',
  clean:'<path d="M8 3h8M10 3v5l-4 10h12L14 8V3"/><path d="M8 14h8"/>',
  weight:'<path d="M5 20h14l-1.5-11h-11L5 20Z"/><path d="M9 9a3 3 0 0 1 6 0M12 9l2-2"/>',
  health:'<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8Z"/><path d="M8 12h2l1-2 2 4 1-2h2"/>',
  treatment:'<path d="m9 3 12 12-6 6L3 9l6-6Z"/><path d="m7 11 4-4M13 17l4-4"/>',
  emergency:'<path d="M12 3 2.8 20h18.4L12 3Z"/><path d="M12 9v4M12 17h.01"/>',
  sale:'<path d="M4 6h16v12H4z"/><path d="M8 10h8M8 14h5"/>',
  note:'<path d="M5 4h14v12H9l-4 4V4Z"/>',
  money:'<circle cx="12" cy="12" r="9"/><path d="M15 8.5c-.7-.7-1.7-1-3-1-1.7 0-3 .8-3 2s1 1.8 3 2.2 3 1 3 2.3-1.3 2.2-3 2.2c-1.3 0-2.5-.4-3.3-1.2M12 6v12"/>',
  settings:'<circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1l2-1.5-2-3.4-2.4 1A7 7 0 0 0 15 6.2L14.7 3h-4L10.4 6.2A7 7 0 0 0 8.9 7L6.5 6l-2 3.4L6.5 11a7 7 0 0 0 0 2l-2 1.5 2 3.4 2.4-1a7 7 0 0 0 1.5.8l.3 3.2h4l.3-3.2a7 7 0 0 0 1.5-.8l2.4 1 2-3.4-2-1.5c.1-.3.1-.7.1-1Z"/>',
  edit:'<path d="M4 20h4L19 9l-4-4L4 16v4Z"/><path d="m13.5 6.5 4 4"/>',
  archive:'<path d="M4 7h16v13H4z"/><path d="M3 4h18v3H3zM9 11h6"/>',
  restore:'<path d="M4 12a8 8 0 1 0 2.3-5.7L4 8.6"/><path d="M4 4v4.6h4.6"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>'
 }[name]||'<circle cx="12" cy="12" r="9"/>';return `<svg class="v13-icon" width="${size}" height="${size}" viewBox="0 0 24 24" aria-hidden="true">${p}</svg>`};
 window.uiIcon13=svg13;
 const eventIcon13=t=>svg13(t==='feed'?'feed':t==='clean'?'clean':t==='weight'?'weight':t==='health'||t==='preventive'?'health':t==='treatment'?'treatment':t==='emergency'?'emergency':t==='sale'?'sale':t==='expense'||t==='revenue'?'money':t==='animal'?'animal':'note',19);

 window.setPlanListFilterV13=function(v){state.planListFilter=v;save();render()};
 window.renamePlanV13=function(ev,pid){ev.preventDefault();const p=state.plans.find(x=>x.id===pid),name=new FormData(ev.target).get('name')?.trim();if(!p||!name)return;if(name.length<2){errorV9('اكتب اسمًا واضحًا للخطة.');return}const old=p.name;p.name=name;p.updatedAt=new Date().toISOString();save();closeModal();render();successV9(old===name?'اسم الخطة بدون تغيير.':'تم تحديث اسم الخطة بنجاح.')};
 window.archivePlanV13=function(pid){const p=state.plans.find(x=>x.id===pid);if(!p||p.archived)return;p.archived=true;p.archivedAt=new Date().toISOString();p.archivedReason='';save();closeModal();state.currentPage='plans';state.planListFilter='current';render();successV9('تمت أرشفة الخطة. يمكنك استعادتها لاحقًا من «المؤرشفة».')};
 window.restorePlanV13=function(pid){const p=state.plans.find(x=>x.id===pid);if(!p)return;p.archived=false;p.restoredAt=new Date().toISOString();save();render();successV9('تمت استعادة الخطة إلى قائمة الخطط الحالية.')};
 window.openPlanManageV13=function(pid){const p=state.plans.find(x=>x.id===pid);if(!p)return;modal(`<div class="modal-head"><div><h3>إدارة الخطة</h3><div class="small muted">عدّل الاسم أو أبعد الخطة غير المستخدمة عن العمل اليومي.</div></div><button class="close" onclick="closeModal()">×</button></div><form onsubmit="renamePlanV13(event,'${pid}')"><div class="field"><label>اسم الخطة</label><input name="name" value="${esc13(p.name)}" required></div><div class="modal-actions"><button class="btn" type="button" onclick="closeModal()">إلغاء</button><button class="btn primary"><span class="icon-button-label">${svg13('edit',16)} حفظ الاسم</span></button></div></form>${!p.archived?`<div class="v13-danger-zone"><strong>لا تستخدم هذه الخطة الآن؟</strong><p class="small muted">الأرشفة تخفيها من الرئيسية ومهام اليوم بدون حذف الحيوانات أو السجل أو التكاليف.</p><button class="btn" onclick="archivePlanV13('${pid}')"><span class="icon-button-label">${svg13('archive',16)} أرشفة الخطة</span></button></div>`:`<div class="v13-danger-zone"><button class="btn primary" onclick="restorePlanV13('${pid}');closeModal()"><span class="icon-button-label">${svg13('restore',16)} استعادة الخطة</span></button></div>`}`)};

 const oldPlans13=window.plansPage;
 window.plansPage=function(){if(state.role==='admin')return oldPlans13();const all=state.plans.filter(p=>p.clientId===state.currentClientId),arch=all.filter(p=>p.archived),current=all.filter(p=>!p.archived),show=state.planListFilter==='archived'?arch:current;const cards=show.map(p=>{const n=typeof ezNext==='function'?ezNext(p):null;return `<div class="ez-plan-card ${p.archived?'v13-archived':''}"><div><h3>${esc13(p.name)}</h3><div class="small muted">${statusBadge(p.status)}${p.archived?' • مؤرشفة':''}${!p.archived&&typeof ezDay==='function'?' • اليوم '+ezDay(p):''}</div></div>${p.archived?`<div class="next"><span>الحالة</span><strong>خارج العمل اليومي</strong></div><div class="v13-plan-card-actions"><button class="btn primary small" onclick="restorePlanV13('${p.id}')"><span class="icon-button-label">${svg13('restore',15)} استعادة</span></button></div>`:`<div class="next"><span>التالي</span><strong>${esc13(n?.title||'فتح الخطة')}</strong></div><div class="v13-plan-card-actions"><button class="btn primary small" onclick="openPlan('${p.id}')">فتح</button><button class="v13-muted-action" onclick="openPlanManageV13('${p.id}')" aria-label="إدارة الخطة">${svg13('settings',17)} إدارة</button></div>`}</div>`}).join('')||empty(state.planListFilter==='archived'?'لا توجد خطط مؤرشفة.':'لا توجد خطط حالية.');return layout(`<div class="page-head"><div><h2>خططي</h2><p>احتفظ بالخطط التي تعمل عليها فقط، وأرشف البقية بدون حذف بياناتها.</p></div><button class="btn primary" onclick="openPlanModal()"><span class="icon-button-label">${svg13('plus',17)} خطة جديدة</span></button></div><div class="v13-plan-tabs"><button class="${state.planListFilter!=='archived'?'active':''}" onclick="setPlanListFilterV13('current')">الحالية ${current.length}</button><button class="${state.planListFilter==='archived'?'active':''}" onclick="setPlanListFilterV13('archived')">المؤرشفة ${arch.length}</button></div><div class="ez-plan-list">${cards}</div>`,'خططي','إدارة الخطط الحالية والمؤرشفة')};

 const oldDash13=window.dashboard;
 window.dashboard=function(){if(state.role==='admin')return oldDash13();const ps=state.plans.filter(p=>p.clientId===state.currentClientId&&!p.archived),active=ps.filter(p=>p.status==='active'||p.status==='selling');const body=`<div class="page-head"><div><h2>ماذا تريد أن تفعل اليوم؟</h2><p>الخطط المؤرشفة لا تظهر هنا حتى تبقى مهامك اليومية واضحة.</p></div><button class="btn primary" onclick="openPlanModal()"><span class="icon-button-label">${svg13('plus',17)} إنشاء خطة</span></button></div>${active.length?`<div class="card"><h3>الخطط النشطة</h3><div class="ez-plan-list">${active.map(p=>{const n=ezNext(p);return `<div class="ez-plan-card"><div><h3>${esc13(p.name)}</h3><div class="small muted">اليوم ${ezDay(p)} • ${ezPhase(p)}</div></div><div class="next"><span>الخطوة التالية</span><strong>${esc13(n.title)}</strong></div><div class="actions"><button class="btn primary small" onclick="openPlan('${p.id}');setTimeout(()=>ezRunNext('${p.id}'),0)"><span class="icon-button-label">${svg13('arrow',15)} ابدأ</span></button><button class="btn small" onclick="openPlan('${p.id}')">فتح الخطة</button></div></div>`}).join('')}</div></div>`:`<div class="ez-primary-step"><div class="eyebrow">لا توجد خطة نشطة</div><h2>أنشئ خطة جديدة أو استعد خطة مؤرشفة</h2><p>من «خططي» تستطيع استعادة أي خطة سابقة بدون فقدان بياناتها.</p><button class="btn" onclick="route('plans')">فتح خططي</button></div>`}`;return layout(body,'الرئيسية','مهامك الحالية فقط')};

 const oldPlanPage13=window.planPage;
 window.planPage=function(){const p=plan();if(p?.archived){state.currentPage='plans';state.planListFilter='archived';return plansPage()}let html=oldPlanPage13();if(p&&html.includes('<div class="actions">'))html=html.replace('<div class="actions">',`<div class="actions"><button class="btn" onclick="openPlanManageV13('${p.id}')"><span class="icon-button-label">${svg13('settings',16)} إدارة الخطة</span></button>`);html=html.replace(/>⚙<\/button>/g,`>${svg13('settings',18)}</button>`);return html};

 const oldTimeline13=window.timelineHtmlV4;
 if(typeof herdEventsV4==='function')window.timelineHtmlV4=function(p,limitDays=0){const es=herdEventsV4(p),groups={};es.forEach(e=>(groups[e.date]||(groups[e.date]=[])).push(e));const dates=Object.keys(groups).sort().reverse(),show=limitDays?dates.slice(0,limitDays):dates;if(!show.length)return empty('لا توجد أحداث مسجلة بعد.');const card=e=>{const more=e.details&&String(e.details).trim();return `<div class="v4-event"><div class="v4-time">${typeof localTime==='function'?localTime(e.createdAt):(e.createdAt?new Date(e.createdAt).toLocaleTimeString('ar-SA',{hour:'2-digit',minute:'2-digit'}):'وقت غير مسجل')}</div><div class="v4-evicon">${eventIcon13(e.type)}</div><div><h4>${esc13(e.title)}<span class="v4-scope">${esc13(e.scope)}</span></h4><p>${e.summary||''}</p>${more?`<details><summary>التفاصيل</summary><div class="v4-event-details">${e.details}</div></details>`:''}</div></div>`};return `<div class="v4-timeline">${show.map((d,i)=>`<details class="v4-day" ${i===0?'open':''}><summary><span>${typeof dateLabel==='function'?dateLabel(d):d}</span><span class="v4-day-count">${groups[d].length} حدث</span></summary><div class="v4-events">${groups[d].map(card).join('')}</div></details>`).join('')}</div>`};

 const oldJourney13=window.animalJourneyHtmlV5;
 if(typeof animalEventsV5==='function')window.animalJourneyHtmlV5=function(a){const es=animalEventsV5(a),groups={};es.forEach(e=>(groups[e.date]||(groups[e.date]=[])).push(e));const dates=Object.keys(groups).sort();if(!dates.length)return'<div class="v5-empty">لا توجد أحداث مسجلة لهذا الحيوان بعد.</div>';const card=e=>{const more=e.details&&String(e.details).trim();return `<div class="v5-animal-event"><div class="time">${e.createdAt?new Date(e.createdAt).toLocaleTimeString('ar-SA',{hour:'2-digit',minute:'2-digit'}):'وقت غير مسجل'}</div><div class="icon">${eventIcon13(e.type)}</div><div><h4>${esc13(e.title)}${e.shared?'<span class="shared">حدث مشترك</span>':''}</h4><p>${e.summary||''}</p>${more?`<details><summary>تفاصيل</summary><div class="details">${e.details}</div></details>`:''}</div></div>`};return `<div class="v5-animal-journey">${dates.map((d,i)=>`<details class="v5-animal-day" ${i===dates.length-1?'open':''}><summary><span>${d}</span><span class="count">${groups[d].length} حدث</span></summary><div class="v5-animal-events">${groups[d].map(card).join('')}</div></details>`).join('')}</div>`};

 const oldOpenAnimal13=window.openAnimal;
 window.openAnimal=function(id){oldOpenAnimal13(id);const m=document.querySelector('#modal'),a=state.animals.find(x=>x.id===id);if(!m||!a)return;const animal=m.querySelector('.animal-icon');if(animal)animal.innerHTML=svg13('animal',28);const pin=m.querySelector('.note-pin');if(pin)pin.innerHTML=pin.innerHTML.replace('📌',svg13('note',16))};
 save();render();
})();
</script>
