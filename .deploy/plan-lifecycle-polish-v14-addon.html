<style>
/* PLAN_LIFECYCLE_POLISH_V14 */
:root{--v14-shadow:0 8px 26px rgba(23,74,58,.065);--v14-shadow-hover:0 12px 34px rgba(23,74,58,.10)}
.content{max-width:1320px;padding:26px 30px 38px}.card,.metric,.plan-card{box-shadow:var(--v14-shadow)}
.btn{transition:border-color .16s ease,background .16s ease,color .16s ease,box-shadow .16s ease}.btn:hover{transform:none;box-shadow:0 4px 14px rgba(23,74,58,.08)}
.plan-summary{box-shadow:0 14px 36px rgba(23,74,58,.13);background:linear-gradient(135deg,#173f33 0%,#205944 100%)}
.v14-tabs{display:inline-flex;gap:4px;padding:5px;background:#edf2ef;border:1px solid #e1e8e4;border-radius:13px;margin:0 0 18px;max-width:100%;overflow:auto}.v14-tabs button{border:0;background:transparent;color:var(--muted);font-weight:700;padding:9px 13px;border-radius:9px;white-space:nowrap}.v14-tabs button.active{background:white;color:var(--primary);box-shadow:0 2px 9px rgba(20,55,43,.07)}
.v14-plan-list{display:grid;gap:12px}.v14-plan-card{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(220px,.8fr) auto;gap:18px;align-items:center;background:#fff;border:1px solid var(--border);border-radius:16px;padding:17px 18px;box-shadow:var(--v14-shadow);position:relative;overflow:hidden}.v14-plan-card:before{content:"";position:absolute;right:0;top:0;bottom:0;width:4px;background:var(--primary)}.v14-plan-card.completed:before{background:#7b8781}.v14-plan-card.archived:before{background:#b7945e}.v14-plan-card:hover{border-color:#ccd9d2;box-shadow:var(--v14-shadow-hover)}.v14-plan-title{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.v14-plan-title h3{margin:0;font-size:16px}.v14-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;color:var(--muted);font-size:11px}.v14-next{background:var(--surface-2);border:1px solid #edf1ef;border-radius:11px;padding:10px 12px}.v14-next span{display:block;color:var(--muted);font-size:10px;margin-bottom:3px}.v14-next strong{font-size:13px}.v14-card-actions{display:flex;gap:7px;align-items:center;justify-content:flex-end;flex-wrap:wrap}.v14-empty{padding:34px 20px;text-align:center;background:#fff;border:1px dashed #cad7d0;border-radius:15px;color:var(--muted)}
.v14-readonly-banner{display:flex;gap:12px;align-items:flex-start;border:1px solid #dce3df;background:#f7f9f8;border-radius:15px;padding:15px 16px;margin-bottom:16px}.v14-readonly-icon{width:38px;height:38px;border-radius:11px;background:#e9eeeb;color:#56645d;display:grid;place-items:center;flex:0 0 auto}.v14-readonly-banner h3{margin:0 0 4px;font-size:15px}.v14-readonly-banner p{margin:0;color:var(--muted);font-size:12px;line-height:1.7}.v14-completed-head{background:linear-gradient(135deg,#273a33,#43584f);color:white;border-radius:20px;padding:21px;margin-bottom:16px}.v14-completed-head h2{margin:7px 0 5px}.v14-completed-head p{margin:0;color:#dbe5e0;font-size:12px}.v14-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:17px}.v14-kpi{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:12px}.v14-kpi span{display:block;color:#d3dfda;font-size:10px;margin-bottom:6px}.v14-kpi strong{font-size:16px}.v14-section{margin-top:15px}.v14-section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}.v14-section-head h3{margin:0}.v14-readonly-table .btn{padding:6px 9px}.v14-delete-box{border:1px solid #efcccc;background:#fff8f8;border-radius:13px;padding:13px;margin-top:15px}.v14-delete-box strong{display:block;color:#933939;margin-bottom:4px}.v14-delete-confirm{display:flex;gap:9px;align-items:flex-start;margin-top:12px;font-size:12px}.v14-locked-chip{display:inline-flex;align-items:center;gap:5px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.10);padding:5px 9px;border-radius:999px;font-size:11px;color:#edf4f1}.v11-status-strip{border-radius:13px!important;box-shadow:none!important}.v11-status-strip .btn{white-space:nowrap}.v11-status-button{display:none!important}
@media(max-width:900px){.v14-plan-card{grid-template-columns:1fr}.v14-card-actions{justify-content:flex-start}.v14-kpis{grid-template-columns:repeat(2,1fr)}}
@media(max-width:620px){.content{padding:18px 14px 28px}.v14-kpis{grid-template-columns:1fr 1fr}.v14-tabs{width:100%}.v14-tabs button{flex:1}.page-head{gap:12px}.page-head h2{font-size:22px}}
</style>
<script>
/* PLAN_LIFECYCLE_POLISH_V14 */
(()=>{
 if(typeof state==='undefined')return;
 const esc14=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const err14=m=>typeof errorV9==='function'?errorV9(m):alert(m);
 const ok14=m=>typeof successV9==='function'?successV9(m):alert(m);
 const icon14=(name,size=18)=>{const p={
  lock:'<rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>',
  trash:'<path d="M4 7h16M9 7V4h6v3M7 7l1 13h8l1-13M10 11v5M14 11v5"/>',
  check:'<path d="m5 12 4 4L19 6"/>',
  eye:'<path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="2.5"/>',
  calendar:'<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4M16 3v4M4 9h16"/>'
 }[name]||'<circle cx="12" cy="12" r="9"/>';return `<svg class="v13-icon" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`};
 const isCompleted14=p=>p?.status==='closed';
 const isArchived14=p=>!!p?.archived&&!isCompleted14(p);
 const isCurrent14=p=>!!p&&!p.archived&&!isCompleted14(p);

 // A completed cycle is immutable and never belongs to the archive.
 state.plans.forEach(p=>{if(isCompleted14(p)&&p.archived){p.archived=false;p.archivedAt=null;p.completedLockedAt=p.completedLockedAt||new Date().toISOString()}});
 if(!['current','completed','archived'].includes(state.planListFilter))state.planListFilter='current';

 window.setPlanListFilterV13=function(v){state.planListFilter=['current','completed','archived'].includes(v)?v:'current';save();render()};
 window.renamePlanV13=function(ev,pid){ev.preventDefault();const p=state.plans.find(x=>x.id===pid);if(!p)return;if(isCompleted14(p)){err14('الدورة المكتملة محفوظة للعرض فقط ولا يمكن تعديل اسمها.');return}if(isArchived14(p)){err14('استعد الخطة أولًا إذا كنت تريد تعديل اسمها.');return}const name=new FormData(ev.target).get('name')?.trim();if(!name||name.length<2){err14('اكتب اسمًا واضحًا للخطة.');return}p.name=name;p.updatedAt=new Date().toISOString();save();closeModal();render();ok14('تم تحديث اسم الخطة.')};
 window.archivePlanV13=function(pid){const p=state.plans.find(x=>x.id===pid);if(!p)return;if(isCompleted14(p)){err14('لا يمكن أرشفة دورة مكتملة. تبقى محفوظة تلقائيًا ضمن «المكتملة».');return}if(p.archived)return;p.archived=true;p.archivedAt=new Date().toISOString();save();closeModal();state.currentPage='plans';state.planListFilter='current';render();ok14('تمت أرشفة الخطة بدون حذف بياناتها.')};
 window.restorePlanV13=function(pid){const p=state.plans.find(x=>x.id===pid);if(!p)return;if(isCompleted14(p)){err14('الدورة المكتملة لا تحتاج استعادة؛ هي محفوظة ضمن «المكتملة».');return}p.archived=false;p.restoredAt=new Date().toISOString();save();render();ok14('تمت استعادة الخطة إلى الخطط الجارية.')};

 window.openDeletePlanV14=function(pid){const p=state.plans.find(x=>x.id===pid);if(!p)return;if(isCompleted14(p)){err14('لا يمكن حذف دورة مكتملة.');return}if(!isArchived14(p)){err14('الحذف النهائي متاح من «المؤرشفة» فقط.');return}const animalCount=(state.animals||[]).filter(a=>a.planId===pid).length;modal(`<div class="modal-head"><div><h3>حذف الخطة نهائيًا</h3><div class="small muted">${esc14(p.name)}</div></div><button class="close" onclick="closeModal()">×</button></div><div class="v14-delete-box"><strong>هذا الإجراء لا يمكن التراجع عنه</strong><div class="small muted">سيتم حذف الخطة وكل ما يرتبط بها من سجلات وتشغيل. عدد الحيوانات المرتبطة: ${animalCount}.</div></div><form onsubmit="deletePlanV14(event,'${pid}')"><label class="v14-delete-confirm"><input type="checkbox" name="confirm" required><span>أفهم أن الحذف نهائي وأريد حذف هذه الخطة.</span></label><div class="modal-actions"><button class="btn" type="button" onclick="closeModal()">إلغاء</button><button class="btn danger"><span class="icon-button-label">${icon14('trash',16)} حذف نهائي</span></button></div></form>`)};
 window.deletePlanV14=function(ev,pid){ev.preventDefault();const p=state.plans.find(x=>x.id===pid),f=new FormData(ev.target);if(!p||!f.get('confirm'))return;if(isCompleted14(p)){err14('لا يمكن حذف دورة مكتملة.');return}if(!isArchived14(p)){err14('يجب أرشفة الخطة قبل حذفها نهائيًا.');return}const aids=new Set((state.animals||[]).filter(a=>a.planId===pid).map(a=>a.id));for(const key of Object.keys(state)){const v=state[key];if(!Array.isArray(v))continue;if(key==='plans'){state.plans=v.filter(x=>x.id!==pid);continue}state[key]=v.filter(x=>{if(!x||typeof x!=='object')return true;if(x.planId===pid)return false;if(x.animalId&&aids.has(x.animalId))return false;if(Array.isArray(x.animalIds)&&x.animalIds.some(id=>aids.has(id)))return false;return true})}if(state.healthSettings&&typeof state.healthSettings==='object')delete state.healthSettings[pid];if(state.currentPlanId===pid)state.currentPlanId=state.plans.find(isCurrent14)?.id||state.plans[0]?.id||null;state.currentPage='plans';state.planListFilter='archived';save();closeModal();render();ok14('تم حذف الخطة المؤرشفة نهائيًا.')};

 window.openPlanManageV13=function(pid){const p=state.plans.find(x=>x.id===pid);if(!p)return;if(isCompleted14(p)){err14('الدورة المكتملة للعرض فقط ولا تقبل أي تعديل أو أرشفة أو حذف.');return}if(isArchived14(p)){modal(`<div class="modal-head"><div><h3>الخطة المؤرشفة</h3><div class="small muted">${esc14(p.name)}</div></div><button class="close" onclick="closeModal()">×</button></div><div class="v14-readonly-banner"><div class="v14-readonly-icon">${uiIcon13?uiIcon13('archive',18):''}</div><div><h3>خارج العمل اليومي</h3><p>يمكنك استعادتها للمتابعة أو حذفها نهائيًا إذا لم تعد تحتاج بياناتها.</p></div></div><div class="modal-actions"><button class="btn primary" onclick="restorePlanV13('${pid}');closeModal()">${uiIcon13?uiIcon13('restore',16):''} استعادة</button><button class="btn danger" onclick="closeModal();openDeletePlanV14('${pid}')">${icon14('trash',16)} حذف</button></div>`);return}modal(`<div class="modal-head"><div><h3>إدارة الخطة</h3><div class="small muted">إجراءات قليلة وواضحة للخطة الجارية.</div></div><button class="close" onclick="closeModal()">×</button></div><form onsubmit="renamePlanV13(event,'${pid}')"><div class="field"><label>اسم الخطة</label><input name="name" value="${esc14(p.name)}" required></div><div class="modal-actions"><button class="btn" type="button" onclick="closeModal()">إلغاء</button><button class="btn primary">${uiIcon13?uiIcon13('edit',16):''} حفظ الاسم</button></div></form><div class="v13-danger-zone"><strong>لا تستخدم هذه الخطة الآن؟</strong><p class="small muted">أرشفها لإخفائها من العمل اليومي مع الاحتفاظ بكل البيانات.</p><button class="btn" onclick="archivePlanV13('${pid}')">${uiIcon13?uiIcon13('archive',16):''} أرشفة الخطة</button></div>`)};

 const planCard14=(p,kind)=>{const n=typeof ezNext==='function'?ezNext(p):null;const start=p.start?`البداية ${esc14(p.start)}`:'';if(kind==='completed')return `<div class="v14-plan-card completed"><div><div class="v14-plan-title"><h3>${esc14(p.name)}</h3>${statusBadge(p.status)}</div><div class="v14-meta"><span>${start}</span><span>محفوظة للرجوع فقط</span></div></div><div class="v14-next"><span>الحالة</span><strong>الدورة مكتملة ومقفلة</strong></div><div class="v14-card-actions"><button class="btn small" onclick="openPlan('${p.id}')">${icon14('eye',15)} عرض</button></div></div>`;if(kind==='archived')return `<div class="v14-plan-card archived"><div><div class="v14-plan-title"><h3>${esc14(p.name)}</h3><span class="badge">مؤرشفة</span></div><div class="v14-meta"><span>${start}</span><span>خارج العمل اليومي</span></div></div><div class="v14-next"><span>الخيارات</span><strong>استعادة أو حذف نهائي</strong></div><div class="v14-card-actions"><button class="btn small" onclick="restorePlanV13('${p.id}')">${uiIcon13?uiIcon13('restore',15):''} استعادة</button><button class="btn danger small" onclick="openDeletePlanV14('${p.id}')">${icon14('trash',15)} حذف</button></div></div>`;return `<div class="v14-plan-card"><div><div class="v14-plan-title"><h3>${esc14(p.name)}</h3>${statusBadge(p.status)}</div><div class="v14-meta"><span>${start}</span>${typeof ezDay==='function'?`<span>اليوم ${ezDay(p)}</span>`:''}</div></div><div class="v14-next"><span>الخطوة التالية</span><strong>${esc14(n?.title||'فتح الخطة')}</strong></div><div class="v14-card-actions"><button class="btn primary small" onclick="openPlan('${p.id}')">فتح</button><button class="v13-muted-action" onclick="openPlanManageV13('${p.id}')" aria-label="إدارة الخطة">${uiIcon13?uiIcon13('settings',17):''} إدارة</button></div></div>`};

 const oldPlans14=window.plansPage;
 window.plansPage=function(){if(state.role==='admin')return oldPlans14();const all=state.plans.filter(p=>p.clientId===state.currentClientId),current=all.filter(isCurrent14),completed=all.filter(isCompleted14),archived=all.filter(isArchived14);const filter=state.planListFilter||'current',show=filter==='completed'?completed:filter==='archived'?archived:current,kind=filter==='completed'?'completed':filter==='archived'?'archived':'current';return layout(`<div class="page-head"><div><h2>خططي</h2><p>الخطط الجارية للعمل، المكتملة للرجوع فقط، والمؤرشفة للتخزين أو الحذف.</p></div><button class="btn primary" onclick="openPlanModal()">${uiIcon13?uiIcon13('plus',16):''} خطة جديدة</button></div><div class="v14-tabs"><button class="${filter==='current'?'active':''}" onclick="setPlanListFilterV13('current')">الجارية ${current.length}</button><button class="${filter==='completed'?'active':''}" onclick="setPlanListFilterV13('completed')">المكتملة ${completed.length}</button><button class="${filter==='archived'?'active':''}" onclick="setPlanListFilterV13('archived')">المؤرشفة ${archived.length}</button></div><div class="v14-plan-list">${show.map(p=>planCard14(p,kind)).join('')||`<div class="v14-empty">${kind==='completed'?'لا توجد دورات مكتملة بعد.':kind==='archived'?'لا توجد خطط مؤرشفة.':'لا توجد خطط جارية.'}</div>`}</div>`,'خططي','كل حالة في مكانها بدون ازدحام')};

 const oldDash14=window.dashboard;
 window.dashboard=function(){if(state.role==='admin')return oldDash14();const active=state.plans.filter(p=>p.clientId===state.currentClientId&&isCurrent14(p)&&(p.status==='active'||p.status==='selling'));const body=`<div class="page-head"><div><h2>ماذا تريد أن تفعل اليوم؟</h2><p>هنا تظهر الخطط الجارية فقط؛ المكتملة والمؤرشفة موجودة في «خططي».</p></div><button class="btn primary" onclick="openPlanModal()">${uiIcon13?uiIcon13('plus',16):''} إنشاء خطة</button></div>${active.length?`<div class="v14-plan-list">${active.map(p=>planCard14(p,'current')).join('')}</div>`:`<div class="v14-empty"><strong style="display:block;color:var(--text);margin-bottom:5px">لا توجد خطة جارية</strong>أنشئ خطة جديدة أو استعد واحدة من المؤرشفة.</div>`}`;return layout(body,'الرئيسية','العمل الحالي فقط')};

 const completedView14=p=>{const s=stats(p),animals=planAnimals(p.id),sales=(state.sales||[]).filter(x=>x.planId===p.id),netSales=sales.reduce((z,x)=>z+(Number(x.amount)||0)-(Number(x.fees)||0),0),other=(state.otherRevenues||[]).filter(x=>x.planId===p.id).reduce((z,x)=>z+(Number(x.amount)||0),0),revenue=netSales+other,result=revenue-(Number(s.total)||0);const animalRows=animals.map(a=>{const last=a.weights?.at(-1)?.value??a.buyWeight;return `<tr><td><strong>#${esc14(a.tag)}</strong></td><td>${esc14(a.animalType==='sheep'?'ضأن':'عجل')}</td><td>${a.buyWeight||'-'} كجم</td><td>${last||'-'} كجم</td><td>${animalStatus(a.status)}</td><td><button class="btn small" onclick="openAnimal('${a.id}')">${icon14('eye',14)} عرض السجل</button></td></tr>`}).join('');return layout(`<div class="v14-completed-head"><div><span class="v14-locked-chip">${icon14('lock',14)} مكتملة — للعرض فقط</span><h2>${esc14(p.name)}</h2><p>اكتملت الدورة وأصبحت مقفلة. لا يمكن تعديلها أو أرشفتها أو حذفها أو إضافة أي سجل جديد إليها.</p></div><div class="v14-kpis"><div class="v14-kpi"><span>الحيوانات</span><strong>${animals.length}</strong></div><div class="v14-kpi"><span>إجمالي التكلفة</span><strong>${fmt(s.total)}</strong></div><div class="v14-kpi"><span>صافي المبيعات المسجلة</span><strong>${fmt(netSales)}</strong></div><div class="v14-kpi"><span>نتيجة الدورة المسجلة</span><strong class="${result>=0?'money-positive':'money-negative'}">${fmt(result)}</strong></div></div></div><div class="v14-readonly-banner"><div class="v14-readonly-icon">${icon14('lock',18)}</div><div><h3>الدورة مقفلة</h3><p>يمكنك مراجعة السجل والحيوانات والنتائج فقط. جميع إجراءات الإدخال والتعديل متوقفة لهذه الدورة.</p></div></div><div class="card v14-section"><div class="v14-section-head"><h3>الحيوانات</h3><span class="small muted">عرض السجل فقط</span></div><div class="table-wrap v14-readonly-table"><table><thead><tr><th>الحيوان</th><th>النوع</th><th>وزن الشراء</th><th>آخر وزن</th><th>الحالة</th><th></th></tr></thead><tbody>${animalRows||'<tr><td colspan="6">لا توجد حيوانات مسجلة.</td></tr>'}</tbody></table></div></div><div class="card v14-section"><div class="v14-section-head"><div><h3>سجل القطيع</h3><div class="small muted">السجل التاريخي كما تم حفظه أثناء الدورة.</div></div></div>${typeof timelineHtmlV4==='function'?timelineHtmlV4(p):''}</div>`,'دورة مكتملة','عرض تاريخ الدورة بدون أي تعديل')};

 const oldPlanPage14=window.planPage;
 window.planPage=function(){const p=plan();if(!p)return plansPage();if(isCompleted14(p))return completedView14(p);return oldPlanPage14()};

 // One status action only in the animal file. Completed cycles have no status action at all.
 const oldOpenAnimal14=window.openAnimal;
 window.openAnimal=function(id){oldOpenAnimal14(id);const a=state.animals.find(x=>x.id===id),m=document.querySelector('#modal');if(!a||!m)return;m.querySelectorAll('.v11-status-button').forEach(x=>x.remove());const p=state.plans.find(x=>x.id===a.planId),strip=m.querySelector('.v11-status-strip');if(strip){const buttons=strip.querySelectorAll('button');if(isCompleted14(p)){buttons.forEach(x=>x.remove());const small=strip.querySelector('small');if(small)small.textContent='الدورة مكتملة — سجل الحيوان للعرض فقط.'}else if(buttons.length>1){[...buttons].slice(1).forEach(x=>x.remove())}}};

 // Block direct mutation entry points for completed cycles as a second safety layer.
 const pidOpeners=['openDailyModal','openFeedingLogModal','openHealthDailyModal','openTreatmentModal','openPreventiveEventModal','openExpenseModal','openEmergencyModal','openNoteV7','openEasyWeightModal','openFeedModal','openMixBuilderV10','openAnimalModal','openEasyActions'];
 pidOpeners.forEach(name=>{const fn=window[name];if(typeof fn!=='function')return;window[name]=function(pid,...rest){const p=state.plans.find(x=>x.id===pid);if(isCompleted14(p)){err14('الدورة مكتملة ومقفلة للعرض فقط. لا يمكن إضافة أو تعديل أي سجل فيها.');return}return fn.call(this,pid,...rest)}});
 const oldAnimalStatus14=window.openAnimalStatusV11;if(typeof oldAnimalStatus14==='function')window.openAnimalStatusV11=function(aid){const a=state.animals.find(x=>x.id===aid),p=state.plans.find(x=>x.id===a?.planId);if(isCompleted14(p)){err14('لا يمكن تغيير حالة حيوان في دورة مكتملة.');return}return oldAnimalStatus14(aid)};

 save();render();
})();
</script>
