name: Deploy full fattening site

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-full-site:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current site
        uses: actions/checkout@v4

      - name: Apply JavaScript runtime stability fix
        run: python .deploy/fix-js-runtime.py index.html

      - name: Verify core features and JavaScript syntax
        run: |
          grep -q "purchaseCheckNames" index.html
          grep -q "shelterCheckNames" index.html
          grep -q "function feedingTab" index.html
          grep -q "function healthTab" index.html
          grep -q "function cycleTab" index.html
          grep -q "LECTURE6_EMERGENCY_MODULE" index.html
          grep -q "LECTURE7_MARKETING_FEASIBILITY_MODULE" index.html
          grep -q "BEGINNER_FLOW_V2" index.html
          grep -q "FEED_CURRENCY_CARDS_V3" index.html
          grep -q "createFeedChecklistV3" index.html
          grep -q "window.ezNext=function ezNext" index.html
          grep -q "window.ezDay=function ezDay" index.html
          grep -q "window.ezPhase=function ezPhase" index.html
          ! grep -q "includes(state.planTab)?'overview'" index.html
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script[^>]*>(.*?)</script>',s,re.S)
          assert blocks, 'script blocks not found'
          Path('/tmp/fattening-site.js').write_text('\n'.join(blocks),encoding='utf-8')
          PY
          node --check /tmp/fattening-site.js

      - name: Runtime UI smoke test
        run: |
          npm install jsdom@24 --no-save --silent
          node - <<'JS'
          const fs=require('fs');
          const {JSDOM,VirtualConsole}=require('jsdom');
          const html=fs.readFileSync('index.html','utf8');
          const errors=[];
          const vc=new VirtualConsole();
          vc.on('jsdomError',e=>errors.push('JSDOM: '+e.message));
          vc.on('error',e=>errors.push('console.error: '+e));
          const dom=new JSDOM(html,{runScripts:'dangerously',url:'https://fattening.test/',pretendToBeVisual:true,virtualConsole:vc,beforeParse(w){w.alert=()=>{};w.confirm=()=>true;}});
          const w=dom.window;
          w.addEventListener('error',e=>errors.push('window error: '+(e.error?.stack||e.message)));
          const ev=code=>w.eval(code);
          const assert=(ok,msg)=>{if(!ok)throw new Error(msg)};
          setTimeout(()=>{
            try{
              ev('state.currentPage="dashboard"; render()');
              assert(w.document.body.textContent.includes('الرئيسية'),'dashboard failed');
              ev('state.currentPage="plans"; render()');
              assert(w.document.body.textContent.includes('خططي'),'plans failed');
              const p=ev('state.currentPage="plans"; state.currentPlanId=state.plans[0].id; plan()');
              assert(p,'no current plan');
              const tabs=['overview','animals','feeding','health','sales','feeds','cycle','reports','shelter','expenses','treatments'];
              for(const t of tabs){
                ev(`state.planTab=${JSON.stringify(t)}; state.currentPage='plan'; render()`);
                assert(w.document.querySelector('.content'),'render failed for '+t);
              }
              ev('state.planTab="overview"; render(); openEasyManage(plan().id)');
              assert(w.document.querySelector('.modal-backdrop'),'manage modal failed');
              ev('closeModal(); openEasyActions(plan().id)');
              assert(w.document.querySelector('.modal-backdrop'),'actions modal failed');
              ev('closeModal(); openFeedModal(plan().id)');
              assert(w.document.getElementById('feedPurchaseV3'),'feed modal failed');
              const cb=w.document.querySelector('input[name="feedCode"]');
              assert(cb,'feed checklist missing'); cb.click();
              assert(w.document.querySelector('.feed-entry'),'feed card did not expand');
              console.log('Runtime UI smoke test passed');
            }catch(e){errors.push(e.stack||String(e));}
            if(errors.length){console.error(errors.join('\n---\n'));process.exit(1)}
          },100);
          JS

      - name: Commit stable site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix JavaScript runtime and navigation state"
          git push
