name: Deploy full fattening site

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  deploy-full-site:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore lecture 1 compliant site
        shell: bash
        run: |
          base64 -d .deploy/lecture1-site.b64 | gunzip > index.html

      - name: Commit full site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No site changes"
            exit 0
          fi
          git commit -m "Apply lecture 1 animal selection checklist"
          git push
