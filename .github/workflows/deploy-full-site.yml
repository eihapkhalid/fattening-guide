name: Deploy full fattening site

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-full-site:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble site
        run: cat .deploy/lecture2-part*.b64 | tr -d '\n' | base64 -d | gunzip > index.html

      - name: Verify site
        run: |
          grep -q "purchaseCheckNames" index.html
          grep -q "shelterCheckNames" index.html
          grep -q "تجهيز وفحص الزريبة" index.html
          grep -q "shelterCleaned" index.html
          test "$(wc -c < index.html)" -gt 85000

      - name: Commit site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Apply lecture 2 shelter workflow"
          git push
