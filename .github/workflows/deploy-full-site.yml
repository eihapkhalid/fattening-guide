name: Deploy full fattening site

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-full-site:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble lecture 5 site
        run: cat .deploy/lecture5-01.b64 .deploy/lecture5-02.b64 .deploy/lecture5-03.b64 .deploy/lecture5-04.b64 .deploy/lecture5-05.b64 .deploy/lecture5-06.b64 .deploy/lecture5-07.b64 .deploy/lecture5-08.b64 | tr -d '\n' | base64 -d | gunzip > index.html

      - name: Verify lecture 1 to 5 features
        run: |
          grep -q "purchaseCheckNames" index.html
          grep -q "shelterCheckNames" index.html
          grep -q "function feedingTab" index.html
          grep -q "function healthTab" index.html
          grep -q "function cycleTab" index.html
          grep -q "خطة 90–120 يوم" index.html
          grep -q 'min="90" max="120"' index.html
          grep -q "تمديد مراقَب" index.html
          grep -q "مرحلة التشطيب — الأيام 67–90" index.html
          grep -q "function openMarketPlanModal" index.html
          grep -q "activeWithdrawal" index.html
          grep -q "withdrawalUntil" index.html
          test "$(wc -c < index.html)" -eq 155414
          echo "e43bf04a3e99e3ea35b559a13178abbc9a64b292dda0ac5e76b882a69a6c5277  index.html" | sha256sum -c -

      - name: Commit lecture 5 site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Apply lecture 5 cycle and marketing workflow"
          git push
