name: Deploy full fattening site

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-full-site:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current site
        uses: actions/checkout@v4

      - name: Apply current site patches
        run: |
          python .deploy/fix-js-runtime.py index.html
          python .deploy/apply-usability-v4.py index.html
          python .deploy/apply-animal-journey-v5.py index.html
          python .deploy/apply-professional-copy-v6.py index.html
          python .deploy/apply-action-scope-v7.py index.html
          python .deploy/apply-calf-space-v8.py index.html
          python .deploy/apply-notifications-v9.py index.html
          python .deploy/apply-guided-flow-v10.py index.html
          python .deploy/fix-guided-flow-v10b.py index.html
          python .deploy/fix-guided-flow-v10c.py index.html
          python .deploy/apply-flexible-mix-status-v11.py index.html
          python .deploy/apply-animal-status-recovery-v12.py index.html

      - name: Verify current features and JavaScript syntax
        run: |
          grep -q "GUIDED_FLOW_V10" index.html
          grep -q "FLEXIBLE_MIX_STATUS_V11" index.html
          grep -q "ANIMAL_STATUS_RECOVERY_V12" index.html
          grep -q "تحديد الكل" index.html
          grep -q "كامل القطيع ما عدا" index.html
          grep -q "إنشاء خلطة مرنة" index.html
          grep -q "مادة جديدة غير موجودة بالقائمة" index.html
          grep -q "تحت المراقبة" index.html
          grep -q "أؤكد أن الحيوان تعافى" index.html
          grep -q "سعر الصرف مؤكد اليوم" index.html
          grep -q "رحلة الحيوان" index.html
          ! grep -q "المحاضرة" index.html
          ! grep -q "الدكتورة" index.html
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script[^>]*>(.*?)</script>',s,re.S)
          assert blocks
          Path('/tmp/fattening-site.js').write_text('\n'.join(blocks),encoding='utf-8')
          PY
          node --check /tmp/fattening-site.js

      - name: Runtime current-flow smoke test
        run: |
          npm install jsdom@24 --no-save --silent
          node - <<'JS'
          const fs=require('fs');
          const {JSDOM,VirtualConsole}=require('jsdom');
          const html=fs.readFileSync('index.html','utf8');
          const errors=[];
          const vc=new VirtualConsole();
          vc.on('jsdomError',e=>errors.push('JSDOM: '+e.message));
          vc.on('error',e=>errors.push('console.error: '+e));
          const dom=new JSDOM(html,{runScripts:'dangerously',url:'https://fattening.test/',pretendToBeVisual:true,virtualConsole:vc,beforeParse(w){w.confirm=()=>true;w.alert=()=>{};w.HTMLElement.prototype.scrollIntoView=function(){}}});
          const w=dom.window;
          w.addEventListener('error',e=>errors.push('window error: '+(e.error?.stack||e.message)));
          const ev=code=>w.eval(code);
          const assert=(ok,msg)=>{if(!ok)throw new Error(msg)};
          setTimeout(()=>{
            try{
              const p=ev('state.currentPlanId=state.plans[0].id; state.currentPage="plan"; plan()');
              assert(p,'no plan');
              for(const tab of ['overview','timeline','animals','feeding','health','sales','feeds']){
                ev(`state.planTab=${JSON.stringify(tab)}; render()`);
                assert(w.document.querySelector('.content'),'render failed: '+tab);
              }

              // Flexible mix accepts arbitrary total and an inline new material.
              w.openMixBuilderV10(p.id);
              const mf=w.document.getElementById('mixBuilderV11');assert(mf,'flexible mix builder missing');
              mf.elements.name.value='اختبار خلطة مرنة';
              const rows=[...mf.querySelectorAll('.v11-mix-row')];
              const first=rows[0].querySelector('select[name="material"]');
              const firstCode=[...first.options].map(o=>o.value).find(v=>v&&v!=='__new__');
              first.value=firstCode;w.mixMaterialChangedV11(first);rows[0].querySelector('input[name="kg"]').value='30';
              const second=rows[1].querySelector('select[name="material"]');second.value='__new__';w.mixMaterialChangedV11(second);rows[1].querySelector('input[name="newName"]').value='مادة اختبار حالية';rows[1].querySelector('input[name="kg"]').value='55';mf.elements.confirm.checked=true;w.updateMixTotalV11();
              assert(w.document.getElementById('mixTotalV11').dataset.total==='85','flexible mix total failed');
              const beforeMix=ev('state.feedMixes.length');w.saveMixV11({preventDefault(){},target:mf},p.id);assert(ev('state.feedMixes.length')===beforeMix+1,'flexible mix save failed');

              // Recovery: active emergency + treatment can be closed from the normal-status action after explicit confirmation.
              const aid='current_'+Date.now();
              ev(`state.animals.push({id:${JSON.stringify('PLACEHOLDER')},planId:plan().id,groupId:plan().groups?.[0]?.id||'',animalType:'calf',tag:'CURRENT-TEST',buyDate:today(),buyPlace:'اختبار',buyWeight:200,buyPrice:0,breed:'',sex:'ذكر',status:'treatment',selection:{result:'suitable'},health:{arrivalCompleted:true},weights:[{date:today(),value:200}],notes:[]})`.replace('PLACEHOLDER',aid));
              ev(`state.emergencies.push({id:'em_current',planId:plan().id,animalId:${JSON.stringify(aid)},date:today(),type:'bloat',status:'open'});state.treatments.push({id:'tx_current',planId:plan().id,animalIds:[${JSON.stringify(aid)}],name:'علاج اختبار',status:'active',start:today(),days:1})`);
              w.openAnimalStatusV11(aid);
              let sf=w.document.querySelector('#modal form');sf.querySelector('input[value="normal"]').checked=true;w.statusChoiceChangedV12(sf,aid);
              assert(sf.querySelector('[data-recovery-v12]').classList.contains('show'),'recovery confirmation missing');
              sf.elements.closeCareConfirm.checked=true;sf.elements.reason.value='تعافى الحيوان وعاد طبيعيًا';
              w.saveAnimalStatusV12({preventDefault(){},target:sf},aid);
              assert(ev(`state.animals.find(a=>a.id===${JSON.stringify(aid)}).status`)==='normal','animal did not return normal');
              assert(ev(`state.emergencies.find(e=>e.id==='em_current').status`)==='resolved','emergency not resolved');
              assert(ev(`state.treatments.find(t=>t.id==='tx_current').status`)==='completed','treatment not completed');
              assert(ev(`state.animalStatusEvents.some(e=>e.animalId===${JSON.stringify(aid)}&&e.to==='normal')`),'recovery not logged');

              if(errors.length)throw new Error(errors.join('\n---\n'));
              console.log('Current flow smoke test passed');
            }catch(e){errors.push(e.stack||String(e));}
            if(errors.length){console.error(errors.join('\n---\n'));process.exit(1)}
          },250);
          JS

      - name: Commit current site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Unify current workflow and simplify animal recovery"
          git push
