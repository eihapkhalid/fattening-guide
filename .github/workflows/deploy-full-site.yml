name: Deploy full fattening site

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-full-site:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current site
        uses: actions/checkout@v4

      - name: Apply JavaScript runtime stability fix
        run: python .deploy/fix-js-runtime.py index.html

      - name: Apply zero-training herd workflow
        run: python .deploy/apply-usability-v4.py index.html

      - name: Apply per-animal journey timeline
        run: python .deploy/apply-animal-journey-v5.py index.html

      - name: Apply professional Arabic copy
        run: python .deploy/apply-professional-copy-v6.py index.html

      - name: Apply unified action scope
        run: python .deploy/apply-action-scope-v7.py index.html

      - name: Apply configurable calf shelter space
        run: python .deploy/apply-calf-space-v8.py index.html

      - name: Apply clear notification system
        run: python .deploy/apply-notifications-v9.py index.html

      - name: Apply guided sequential workflow
        run: |
          python .deploy/apply-guided-flow-v10.py index.html
          python .deploy/fix-guided-flow-v10b.py index.html
          python .deploy/fix-guided-flow-v10c.py index.html

      - name: Verify core features and JavaScript syntax
        run: |
          grep -q "GUIDED_FLOW_V10" index.html
          grep -q "تحديد الكل" index.html
          grep -q "كامل القطيع ما عدا" index.html
          grep -q "إضافة اسم علف جديد" index.html
          grep -q "الخلطة القياسية — تعبئة سريعة" index.html
          grep -q "إنشاء خلطة خاصة" index.html
          grep -q "سعر الصرف مؤكد اليوم" index.html
          grep -q "السعر ما زال صحيحًا" index.html
          grep -q "createFeedChecklistV10" index.html
          grep -q "standardMixConfirm" index.html
          grep -q "customFeedCatalog" index.html
          grep -q "feedMixes" index.html
          grep -q "excludedAnimalIds" index.html
          grep -q "NOTIFICATIONS_V9" index.html
          grep -q "CALF_SPACE_V8" index.html
          grep -q "ANIMAL_JOURNEY_V5" index.html
          grep -q "سجل القطيع" index.html
          grep -q "رحلة الحيوان" index.html
          ! grep -q "CSS.escape(code)" index.html
          ! grep -q "المحاضرة" index.html
          ! grep -q "الدكتورة" index.html
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script[^>]*>(.*?)</script>',s,re.S)
          assert blocks, 'script blocks not found'
          Path('/tmp/fattening-site.js').write_text('\n'.join(blocks),encoding='utf-8')
          PY
          node --check /tmp/fattening-site.js

      - name: Runtime guided-flow smoke test
        run: |
          npm install jsdom@24 --no-save --silent
          node - <<'JS'
          const fs=require('fs');
          const {JSDOM,VirtualConsole}=require('jsdom');
          const html=fs.readFileSync('index.html','utf8');
          const errors=[];
          const vc=new VirtualConsole();
          vc.on('jsdomError',e=>errors.push('JSDOM: '+e.message));
          vc.on('error',e=>errors.push('console.error: '+e));
          const dom=new JSDOM(html,{runScripts:'dangerously',url:'https://fattening.test/',pretendToBeVisual:true,virtualConsole:vc,beforeParse(w){w.confirm=()=>true;w.HTMLElement.prototype.scrollIntoView=function(){}}});
          const w=dom.window;
          w.addEventListener('error',e=>errors.push('window error: '+(e.error?.stack||e.message)));
          const ev=code=>w.eval(code);
          const assert=(ok,msg)=>{if(!ok)throw new Error(msg)};
          const wait=ms=>new Promise(r=>setTimeout(r,ms));
          setTimeout(async()=>{
            try{
              const p=ev('state.currentPlanId=state.plans[0].id; state.currentPage="plan"; plan()');
              assert(p,'no plan');

              // 1) Positive checklists get a safe "select all" control.
              ev('state.planTab="shelter"; render()');await wait(30);
              let sf=w.document.getElementById('shelterForm');
              assert(sf,'shelter form missing');
              assert(sf.querySelector('.select-all-v10'),'shelter select-all missing');
              sf.querySelector('.select-all-v10').click();
              assert([...sf.querySelectorAll('.selection-box:first-of-type input[type="checkbox"]')].every(x=>x.checked),'shelter select-all failed');

              // 2) Saving a ready shelter immediately opens Add Animal.
              const activeBefore=ev('planAnimals(plan().id).filter(a=>a.status!=="sold").length');
              sf.elements.projectType.value='fattening';
              sf.elements.animalType.value=ev('planAnimals(plan().id).find(a=>a.status!=="sold")?.animalType||"calf"');
              sf.elements.headCount.value=String(activeBefore+3);
              if(sf.elements.calfSpacePerHead)sf.elements.calfSpacePerHead.value='3';
              sf.elements.roofMaterial.value='straw';
              sf.querySelectorAll('.selection-box input[type="checkbox"]').forEach(x=>x.checked=true);
              ev('plan().shelter.ready=false');
              w.saveShelter({preventDefault(){},target:sf},p.id);await wait(130);
              let af=w.document.getElementById('animalSelectionForm');
              assert(af,'animal form did not open after shelter save');
              await wait(20);w.enhancePositiveChecksV10();
              assert(af.querySelectorAll('.select-all-v10').length>=4,'animal select-all controls missing');
              af.querySelectorAll('.select-all-v10').forEach(b=>b.click());
              const requiredChecks=[...af.querySelectorAll('.selection-box input[type="checkbox"]')].filter(x=>x.name!=='expert');
              assert(requiredChecks.length>=23&&requiredChecks.every(x=>x.checked),'animal select-all failed');

              // 3) Adding an animal immediately opens arrival/isolation for that new animal.
              const tag='V10-'+Date.now();
              af.elements.sex.value='ذكر';af.elements.tag.value=tag;af.elements.buyDate.value=ev('today()');af.elements.buyPlace.value='اختبار';af.elements.weight.value='200';af.elements.price.value='1000';
              w.createAnimal({preventDefault(){},target:af},p.id,p.groups[0].id);await wait(150);
              const added=ev(`state.animals.find(a=>a.tag===${JSON.stringify(tag)})`);
              assert(added,'test animal not created');
              assert(w.document.body.textContent.includes('استقبال وعزل الحيوان'),'arrival/isolation did not open');
              assert(w.document.querySelector('#modal select[name="animal"]')?.value===added.id,'new animal not preselected for arrival');
              ev('closeModal()');

              // 4) FX reminder is explicit and can be confirmed without changing a still-valid rate.
              ev('state.fxRates={SARtoSDG:1500,USDtoSDG:3000,updatedAt:"2000-01-01"}; state.planTab="feeds"; save(); render()');
              assert(w.document.body.textContent.includes('راجع سعر الصرف قبل أي شراء بعملة أجنبية'),'stale FX reminder missing');
              w.confirmFxTodayV10();
              assert(ev('state.fxRates.updatedAt===today()'),'FX confirmation date not updated');

              // 5) Feed modal supports custom names and the one-click standard recipe preset.
              w.openFeedModal(p.id);
              assert(w.document.getElementById('feedPurchaseV10'),'feed v10 modal missing');
              assert(w.document.body.textContent.includes('إضافة اسم علف جديد'),'custom feed UI missing');
              assert(w.document.body.textContent.includes('الخلطة القياسية — تعبئة سريعة'),'standard recipe preset missing');
              w.document.getElementById('customFeedNameV10').value='علف اختبار مخصص';
              w.document.getElementById('customFeedCategoryV10').value='concentrate';
              w.addCustomFeedV10();
              const custom=ev('state.customFeedCatalog.find(x=>x.name==="علف اختبار مخصص")');
              assert(custom,'custom feed name not saved');
              const customCb=[...w.document.querySelectorAll('#feedPurchaseV10 input[name="feedCode"]')].find(x=>x.value===custom.code);
              assert(customCb,'custom feed not added to picker');customCb.checked=true;w.toggleFeedPurchaseV10(custom.code,true);
              w.applyStandardPurchaseV10(p.id);
              const form=w.document.getElementById('feedPurchaseV10');
              assert(form.elements.standardPresetUsed.value==='1','standard preset flag missing');
              const recipeCodes=['sorghum','wheat_bran','minerals','limestone'];
              assert(recipeCodes.every(code=>[...form.querySelectorAll('input[name="feedCode"]')].find(x=>x.value===code)?.checked),'standard recipe components not selected');
              const stdQty=recipeCodes.reduce((z,code)=>z+(Number(form.elements['qty_'+code]?.value)||0),0);
              assert(stdQty>0,'standard recipe quantities were not filled');

              // Add one roughage so the guided transition can open feeding.
              const rough=[...form.querySelectorAll('input[name="feedCode"]')].find(x=>['sesame_straw','peanut_residue','alfalfa_dry','rhodes','rice_straw','lentil_straw','sorghum_residue','bagasse'].includes(x.value));
              assert(rough,'roughage catalog item missing');rough.checked=true;w.toggleFeedPurchaseV10(rough.value,true);
              form.elements['qty_'+rough.value].value='100';
              form.elements['cost_'+rough.value].value='1';
              form.elements['qty_'+custom.code].value='20';form.elements['cost_'+custom.code].value='1';
              form.querySelectorAll('input[name^="cost_"]').forEach(x=>x.value=x.value||'1');
              form.querySelectorAll('select[name^="currency_"]').forEach(x=>x.value='SDG');
              form.elements.standardMixConfirm.checked=true;form.elements.cleanDry.checked=true;form.elements.noMold.checked=true;
              const beforeFeeds=ev('state.feeds.length');
              w.createFeedChecklistV10({preventDefault(){},target:form},p.id);await wait(180);
              assert(ev('state.feeds.length')>beforeFeeds,'feeds were not saved');
              assert(ev('state.planTab')==='feeding','did not transition to feeding tab');
              assert(w.document.getElementById('feedingScopeV7'),'feeding form did not open after feed save');

              // 6) Feeding supports "whole herd except" without losing per-animal rows.
              const feedForm=w.document.getElementById('feedingScopeV7');
              const exceptRadio=[...feedForm.elements.scope].find(x=>x.value==='herd_except');
              assert(exceptRadio,'herd-except option missing');
              const activeCount=ev('planAnimals(plan().id).filter(a=>a.status!=="sold").length');
              if(activeCount>1){exceptRadio.checked=true;w.scopeChangedV7(feedForm);const ex=feedForm.querySelector('input[name="excludeAnimal"]');ex.checked=true;w.scopeFeedRowsV7(p.id);w.scopeChangedV7(feedForm);assert(w.document.querySelectorAll('#scopeFeedRowsV7 .v4-animal-feed').length===activeCount-1,'excluded animal still appears in feeding rows')}
              ev('closeModal()');

              // 7) The newly added feed can participate in a user-defined mix.
              w.openMixBuilderV10(p.id);
              const mixForm=w.document.getElementById('mixBuilderV10');assert(mixForm,'mix builder missing');
              const customMixCb=[...mixForm.querySelectorAll('input[name="mixCode"]')].find(x=>x.value===custom.code);assert(customMixCb,'custom feed is not available to mix builder');
              const other=[...mixForm.querySelectorAll('input[name="mixCode"]')].find(x=>x.value!==custom.code);assert(other,'second mix component missing');
              customMixCb.checked=true;w.toggleMixRatioV10(customMixCb);other.checked=true;w.toggleMixRatioV10(other);
              mixForm.elements['ratio_'+custom.code].value='50';mixForm.elements['ratio_'+other.value].value='50';mixForm.elements.name.value='خلطة اختبار';mixForm.elements.confirm.checked=true;w.updateMixTotalV10();
              const beforeMix=ev('state.feedMixes.length');w.saveMixV10({preventDefault(){},target:mixForm},p.id);assert(ev('state.feedMixes.length')===beforeMix+1,'custom mix not saved');

              // 8) Foreign-currency purchase is blocked if the exchange rate was not confirmed today.
              ev('state.fxRates.updatedAt="2000-01-01";save()');w.openFeedModal(p.id);const fxForm=w.document.getElementById('feedPurchaseV10');const one=fxForm.querySelector('input[name="feedCode"]');one.checked=true;w.toggleFeedPurchaseV10(one.value,true);fxForm.elements['qty_'+one.value].value='1';fxForm.elements['cost_'+one.value].value='1';fxForm.elements['currency_'+one.value].value='SAR';fxForm.elements.cleanDry.checked=true;fxForm.elements.noMold.checked=true;const countBeforeFx=ev('state.feeds.length');w.createFeedChecklistV10({preventDefault(){},target:fxForm},p.id);assert(ev('state.feeds.length')===countBeforeFx,'stale FX purchase should have been blocked');assert(w.document.querySelector('.notify-v9.warning'),'stale FX warning missing');

              assert(!errors.length,'runtime errors detected');
              console.log('Guided flow v10 smoke test passed');
            }catch(e){errors.push(e.stack||String(e));}
            if(errors.length){console.error(errors.join('\n---\n'));process.exit(1)}
          },220);
          JS

      - name: Commit current site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Guide setup from shelter through feeding"
          git push
