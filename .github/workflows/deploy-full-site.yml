name: Deploy full fattening site

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-full-site:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble site
        run: cat .deploy/lecture2-part*.b64 | tr -d '\n' | base64 -d | gunzip > index.html
