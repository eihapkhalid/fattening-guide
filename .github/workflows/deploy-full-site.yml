name: Deploy full fattening site

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-full-site:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble lecture 5 base
        run: cat .deploy/lecture5-01.b64 .deploy/lecture5-02.b64 .deploy/lecture5-03.b64 .deploy/lecture5-04.b64 .deploy/lecture5-05.b64 .deploy/lecture5-06.b64 .deploy/lecture5-07.b64 .deploy/lecture5-08.b64 | tr -d '\n' | base64 -d | gunzip > index.html

      - name: Apply lecture 6 emergency workflow
        run: python .deploy/apply-lecture6.py index.html

      - name: Verify lecture 1 to 6 features
        run: |
          grep -q "purchaseCheckNames" index.html
          grep -q "shelterCheckNames" index.html
          grep -q "function feedingTab" index.html
          grep -q "function healthTab" index.html
          grep -q "function cycleTab" index.html
          grep -q "خطة 90–120 يوم" index.html
          grep -q 'min="90" max="120"' index.html
          grep -q "تمديد مراقَب" index.html
          grep -q "مرحلة التشطيب — الأيام 67–90" index.html
          grep -q "LECTURE6_EMERGENCY_MODULE" index.html
          grep -q "function emergencyCard" index.html
          grep -q "قاعدة الدقائق الثلاث" index.html
          grep -q "لترًا واحدًا من زيت البرافين" index.html
          grep -q "4 ملاعق بيكربونات صوديوم في 5 لترات ماء" index.html
          grep -q "لم تحفظ مقادير الملح والسكر" index.html
          grep -q "14 يومًا" index.html
          grep -q 'name="sourBreath"' index.html
          grep -q 'name="ticks"' index.html
          grep -q "externalParasiteProduct" index.html
          grep -q "activeWithdrawal" index.html
          test "$(wc -c < index.html)" -gt 170000
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          m=re.search(r'<script>(.*)</script>',s,re.S)
          assert m, 'script block not found'
          Path('/tmp/fattening-site.js').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/fattening-site.js

      - name: Commit lecture 6 site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Apply lecture 6 emergency response workflow"
          git push
