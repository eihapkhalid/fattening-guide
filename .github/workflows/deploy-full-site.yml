name: Deploy full fattening site

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-full-site:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current site
        uses: actions/checkout@v4

      - name: Apply current site patches
        run: |
          python .deploy/fix-js-runtime.py index.html
          python .deploy/apply-usability-v4.py index.html
          python .deploy/apply-animal-journey-v5.py index.html
          python .deploy/apply-professional-copy-v6.py index.html
          python .deploy/apply-action-scope-v7.py index.html
          python .deploy/apply-calf-space-v8.py index.html
          python .deploy/apply-notifications-v9.py index.html
          python .deploy/apply-guided-flow-v10.py index.html
          python .deploy/fix-guided-flow-v10b.py index.html
          python .deploy/fix-guided-flow-v10c.py index.html
          python .deploy/apply-flexible-mix-status-v11.py index.html
          python .deploy/apply-animal-status-recovery-v12.py index.html
          python .deploy/apply-plan-archive-icons-v13.py index.html
          python .deploy/apply-plan-lifecycle-polish-v14.py index.html

      - name: Verify current features and JavaScript syntax
        run: |
          grep -q "GUIDED_FLOW_V10" index.html
          grep -q "FLEXIBLE_MIX_STATUS_V11" index.html
          grep -q "ANIMAL_STATUS_RECOVERY_V12" index.html
          grep -q "PLAN_ARCHIVE_ICONS_V13" index.html
          grep -q "PLAN_LIFECYCLE_POLISH_V14" index.html
          grep -q "المكتملة" index.html
          grep -q "حذف الخطة نهائيًا" index.html
          grep -q "deletePlanV14" index.html
          grep -q "رحلة الحيوان" index.html
          ! grep -q "المحاضرة" index.html
          ! grep -q "الدكتورة" index.html
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script[^>]*>(.*?)</script>',s,re.S)
          assert blocks
          Path('/tmp/fattening-site.js').write_text('\n'.join(blocks),encoding='utf-8')
          PY
          node --check /tmp/fattening-site.js

      - name: Install runtime test dependency
        run: npm install jsdom@24 --no-save --silent

      - name: Runtime visual cleanup check
        run: |
          node - <<'JS'
          const fs=require('fs');const {JSDOM,VirtualConsole}=require('jsdom');
          const errors=[],vc=new VirtualConsole();vc.on('jsdomError',e=>errors.push(e.message));vc.on('error',e=>errors.push(String(e)));
          const dom=new JSDOM(fs.readFileSync('index.html','utf8'),{runScripts:'dangerously',url:'https://fattening.test/',pretendToBeVisual:true,virtualConsole:vc,beforeParse(w){w.alert=()=>{};w.confirm=()=>true;w.HTMLElement.prototype.scrollIntoView=function(){}}});
          const w=dom.window,ev=x=>w.eval(x),assert=(x,m)=>{if(!x)throw new Error(m)};
          setTimeout(()=>{try{const p=ev('state.plans.find(p=>p.status!=="closed"&&!p.archived)');assert(p,'active plan missing');ev(`state.currentPlanId=${JSON.stringify(p.id)};state.currentPage="plan";state.planTab="timeline";render()`);const icons=[...w.document.querySelectorAll('.v4-evicon')];if(icons.length)assert(icons.every(x=>x.querySelector('svg.v13-icon')),'timeline icons not normalized');const aid=ev(`planAnimals(${JSON.stringify(p.id)}).find(a=>a.status!=="sold")?.id`);if(aid){w.openAnimal(aid);assert(!w.document.querySelector('.v11-status-button'),'duplicate top status button remains');const strip=w.document.querySelector('.v11-status-strip');if(strip)assert(strip.querySelectorAll('button').length<=1,'status strip has duplicate controls')}if(errors.length)throw new Error(errors.join('\n'));console.log('visual cleanup passed')}catch(e){console.error(e.stack||e);process.exit(1)}},250);
          JS

      - name: Runtime completed-cycle lock check
        run: |
          node - <<'JS'
          const fs=require('fs');const {JSDOM,VirtualConsole}=require('jsdom');const errors=[],vc=new VirtualConsole();vc.on('jsdomError',e=>errors.push(e.message));vc.on('error',e=>errors.push(String(e)));
          const dom=new JSDOM(fs.readFileSync('index.html','utf8'),{runScripts:'dangerously',url:'https://fattening.test/',pretendToBeVisual:true,virtualConsole:vc,beforeParse(w){w.alert=()=>{};w.confirm=()=>true;w.HTMLElement.prototype.scrollIntoView=function(){}}});
          const w=dom.window,ev=x=>w.eval(x),assert=(x,m)=>{if(!x)throw new Error(m)};
          setTimeout(()=>{try{const p=ev('state.plans.find(p=>p.status==="closed")');assert(p,'completed plan missing');ev('state.currentPage="plans";state.planListFilter="completed";render()');assert(w.document.body.textContent.includes(p.name),'completed plan not in completed tab');ev(`state.currentPlanId=${JSON.stringify(p.id)};state.currentPage="plan";render()`);assert(w.document.body.textContent.includes('مكتملة — للعرض فقط'),'read-only completed screen missing');assert(!w.document.body.textContent.includes('إدارة الخطة'),'completed plan exposes management');assert(!w.document.body.textContent.includes('أرشفة الخطة'),'completed plan exposes archive');const before=!!w.document.getElementById('modal');w.openExpenseModal(p.id);assert(!!w.document.getElementById('modal')===before,'completed plan opened expense modal');w.archivePlanV13(p.id);assert(ev(`state.plans.find(x=>x.id===${JSON.stringify(p.id)}).archived`)!==true,'completed plan archived');if(errors.length)throw new Error(errors.join('\n'));console.log('completed lock passed')}catch(e){console.error(e.stack||e);process.exit(1)}},250);
          JS

      - name: Runtime archive delete check
        run: |
          node - <<'JS'
          const fs=require('fs');const {JSDOM,VirtualConsole}=require('jsdom');const errors=[],vc=new VirtualConsole();vc.on('jsdomError',e=>errors.push(e.message));vc.on('error',e=>errors.push(String(e)));
          const dom=new JSDOM(fs.readFileSync('index.html','utf8'),{runScripts:'dangerously',url:'https://fattening.test/',pretendToBeVisual:true,virtualConsole:vc,beforeParse(w){w.alert=()=>{};w.confirm=()=>true;w.HTMLElement.prototype.scrollIntoView=function(){}}});
          const w=dom.window,ev=x=>w.eval(x),assert=(x,m)=>{if(!x)throw new Error(m)};
          setTimeout(()=>{try{const p=ev('state.plans.find(p=>p.status!=="closed"&&!p.archived)');assert(p,'active plan missing');w.archivePlanV13(p.id);assert(ev(`state.plans.find(x=>x.id===${JSON.stringify(p.id)}).archived`)===true,'archive failed');ev('state.currentPage="plans";state.planListFilter="archived";render()');assert(w.document.body.textContent.includes(p.name),'archived plan missing');assert(w.document.body.textContent.includes('حذف'),'archive delete action missing');w.restorePlanV13(p.id);assert(ev(`state.plans.find(x=>x.id===${JSON.stringify(p.id)}).archived`)===false,'restore failed');const pid='tmp_'+Date.now(),aid='ta_'+Date.now();ev(`state.plans.push({id:${JSON.stringify(pid)},clientId:state.currentClientId,name:'خطة حذف اختبار',start:today(),duration:90,sellPlace:'اختبار',profitTarget:0,status:'active',archived:true,groups:[{id:'tg',name:'اختبار'}]});state.animals.push({id:${JSON.stringify(aid)},planId:${JSON.stringify(pid)},groupId:'tg',tag:'TMP',buyDate:today(),buyWeight:100,buyPrice:0,weights:[{date:today(),value:100}],notes:[],status:'normal'});save()`);const f=w.document.createElement('form');f.innerHTML='<input type="checkbox" name="confirm" checked>';w.deletePlanV14({preventDefault(){},target:f},pid);assert(!ev(`state.plans.some(x=>x.id===${JSON.stringify(pid)})`),'archived plan not deleted');assert(!ev(`state.animals.some(x=>x.id===${JSON.stringify(aid)})`),'related animal not deleted');if(errors.length)throw new Error(errors.join('\n'));console.log('archive delete passed')}catch(e){console.error(e.stack||e);process.exit(1)}},250);
          JS

      - name: Commit current site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Separate completed cycles and polish plan management"
          git push
