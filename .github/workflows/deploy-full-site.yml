name: Deploy full fattening site

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-full-site:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current site
        uses: actions/checkout@v4

      - name: Apply JavaScript runtime stability fix
        run: python .deploy/fix-js-runtime.py index.html

      - name: Apply zero-training herd workflow
        run: python .deploy/apply-usability-v4.py index.html

      - name: Apply per-animal journey timeline
        run: python .deploy/apply-animal-journey-v5.py index.html

      - name: Apply professional Arabic copy
        run: python .deploy/apply-professional-copy-v6.py index.html

      - name: Apply unified action scope
        run: python .deploy/apply-action-scope-v7.py index.html

      - name: Apply configurable calf shelter space
        run: python .deploy/apply-calf-space-v8.py index.html

      - name: Apply clear notification system
        run: python .deploy/apply-notifications-v9.py index.html

      - name: Verify core features and JavaScript syntax
        run: |
          grep -q "purchaseCheckNames" index.html
          grep -q "shelterCheckNames" index.html
          grep -q "LECTURE6_EMERGENCY_MODULE" index.html
          grep -q "LECTURE7_MARKETING_FEASIBILITY_MODULE" index.html
          grep -q "BEGINNER_FLOW_V2" index.html
          grep -q "FEED_CURRENCY_CARDS_V3" index.html
          grep -q "USABILITY_V4_HERD_TIMELINE_FEEDING" index.html
          grep -q "ANIMAL_JOURNEY_V5" index.html
          grep -q "PROFESSIONAL_COPY_V6" index.html
          grep -q "ACTION_SCOPE_V7" index.html
          grep -q "CALF_SPACE_V8" index.html
          grep -q "NOTIFICATIONS_V9" index.html
          grep -q "notifyV9" index.html
          grep -q "تم بنجاح" index.html
          grep -q "تعذر إكمال الإجراء" index.html
          grep -q "العجول: 3 م² لكل رأس" index.html
          grep -q "calfSpacePerHead" index.html
          grep -q "على من سيُطبق هذا الإجراء؟" index.html
          grep -q "سجل القطيع" index.html
          grep -q "رحلة الحيوان" index.html
          grep -q "الخلطة القياسية — خصم المكونات تلقائيًا" index.html
          ! grep -q "لا يعرض النظام رقم مساحة للعجل" index.html
          ! grep -q "المحاضرة" index.html
          ! grep -q "الدكتورة" index.html
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script[^>]*>(.*?)</script>',s,re.S)
          assert blocks, 'script blocks not found'
          Path('/tmp/fattening-site.js').write_text('\n'.join(blocks),encoding='utf-8')
          PY
          node --check /tmp/fattening-site.js

      - name: Runtime UI and notification smoke test
        run: |
          npm install jsdom@24 --no-save --silent
          node - <<'JS'
          const fs=require('fs');
          const {JSDOM,VirtualConsole}=require('jsdom');
          const html=fs.readFileSync('index.html','utf8');
          const errors=[];
          const vc=new VirtualConsole();
          vc.on('jsdomError',e=>errors.push('JSDOM: '+e.message));
          vc.on('error',e=>errors.push('console.error: '+e));
          const dom=new JSDOM(html,{runScripts:'dangerously',url:'https://fattening.test/',pretendToBeVisual:true,virtualConsole:vc,beforeParse(w){w.confirm=()=>true;}});
          const w=dom.window;
          w.addEventListener('error',e=>errors.push('window error: '+(e.error?.stack||e.message)));
          const ev=code=>w.eval(code);
          const assert=(ok,msg)=>{if(!ok)throw new Error(msg)};
          setTimeout(()=>{
            try{
              ev('state.currentPage="dashboard"; render()');
              assert(w.document.body.textContent.includes('الرئيسية'),'dashboard failed');
              const p=ev('state.currentPlanId=state.plans[0].id; state.currentPage="plan"; plan()');
              assert(p,'no current plan');

              // Shelter still uses a configurable 3 m² default for calves.
              ev('state.planTab="shelter"; render()');
              const sf=w.document.getElementById('shelterForm');
              assert(sf,'shelter form missing');
              sf.elements.animalType.value='calf';sf.elements.headCount.value='4';sf.elements.calfSpacePerHead.value='3';w.updateShelterAssessment();
              assert(w.document.getElementById('shelterSpaceNote').textContent.includes('12 م²'),'calf space calculation failed');

              // Unified action scope remains operational.
              ev('state.planTab="feeding"; render(); openFeedingLogModal(plan().id)');
              const ff=w.document.getElementById('feedingScopeV7')||w.document.getElementById('feedingV4Form');
              assert(ff?.elements.scope?.value==='herd','feeding scope failed');
              ev('closeModal()');
              ev('openTreatmentModal(plan().id)');
              assert(w.document.querySelector('#modal form')?.elements.scope?.value==='animal','treatment scope failed');
              ev('closeModal()');

              // Notifications: success and error must be visually and semantically distinct.
              w.alert('تم حفظ البيانات بنجاح.');
              w.alert('لا يمكن إكمال العملية قبل اختيار الحيوان.');
              const success=w.document.querySelector('.notify-v9.success');
              const error=w.document.querySelector('.notify-v9.error');
              assert(success,'success notification missing');
              assert(error,'error notification missing');
              assert(success.textContent.includes('تم بنجاح'),'success title missing');
              assert(error.textContent.includes('تعذر إكمال الإجراء'),'error title missing');
              assert(error.getAttribute('role')==='alert','error notification must use alert role');
              assert(success.getAttribute('role')==='status','success notification must use status role');
              assert(w.document.getElementById('notifyV9Wrap')?.getAttribute('aria-live')==='polite','notification live region missing');
              w.warningV9('راجع البيانات قبل المتابعة.');
              assert(w.document.querySelector('.notify-v9.warning'),'warning notification missing');

              assert(!errors.length,'runtime errors detected');
              console.log('Runtime and notification smoke test passed');
            }catch(e){errors.push(e.stack||String(e));}
            if(errors.length){console.error(errors.join('\n---\n'));process.exit(1)}
          },180);
          JS

      - name: Commit current site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add clear success and error notifications"
          git push
