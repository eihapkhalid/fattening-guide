name: Deploy full fattening site

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-full-site:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble lecture 3 site
        run: cat .deploy/lecture3-large*.b64 | tr -d '\n' | base64 -d | gunzip > index.html

      - name: Verify lecture 1 to 3 features
        run: |
          grep -q "purchaseCheckNames" index.html
          grep -q "shelterCheckNames" index.html
          grep -q "function feedingTab" index.html
          grep -q "concentrateTarget" index.html
          grep -q "mix100" index.html
          grep -q "openFeedingLogModal" index.html
          grep -q "feedingStorageNames" index.html
          grep -q "المالئ: طريقتان محفوظتان" index.html
          grep -q "برنامج التغذية" index.html
          test "$(wc -c < index.html)" -gt 108000

      - name: Commit lecture 3 site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Apply lecture 3 feeding workflow"
          git push
