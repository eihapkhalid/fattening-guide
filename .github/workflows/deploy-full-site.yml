name: Deploy full fattening site

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-full-site:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current site
        uses: actions/checkout@v4

      - name: Apply current site patches
        run: |
          python .deploy/fix-js-runtime.py index.html
          python .deploy/apply-usability-v4.py index.html
          python .deploy/apply-animal-journey-v5.py index.html
          python .deploy/apply-professional-copy-v6.py index.html
          python .deploy/apply-action-scope-v7.py index.html
          python .deploy/apply-calf-space-v8.py index.html
          python .deploy/apply-notifications-v9.py index.html
          python .deploy/apply-guided-flow-v10.py index.html
          python .deploy/fix-guided-flow-v10b.py index.html
          python .deploy/fix-guided-flow-v10c.py index.html
          python .deploy/apply-flexible-mix-status-v11.py index.html
          python .deploy/apply-animal-status-recovery-v12.py index.html
          python .deploy/apply-plan-archive-icons-v13.py index.html
          python .deploy/apply-plan-lifecycle-polish-v14.py index.html

      - name: Verify current features and JavaScript syntax
        run: |
          grep -q "GUIDED_FLOW_V10" index.html
          grep -q "FLEXIBLE_MIX_STATUS_V11" index.html
          grep -q "ANIMAL_STATUS_RECOVERY_V12" index.html
          grep -q "PLAN_ARCHIVE_ICONS_V13" index.html
          grep -q "PLAN_LIFECYCLE_POLISH_V14" index.html
          grep -q "تحديد الكل" index.html
          grep -q "كامل القطيع ما عدا" index.html
          grep -q "إنشاء خلطة مرنة" index.html
          grep -q "مادة جديدة غير موجودة بالقائمة" index.html
          grep -q "أؤكد أن الحيوان تعافى" index.html
          grep -q "سعر الصرف مؤكد اليوم" index.html
          grep -q "رحلة الحيوان" index.html
          grep -q "المكتملة" index.html
          grep -q "حذف الخطة نهائيًا" index.html
          grep -q "deletePlanV14" index.html
          ! grep -q "المحاضرة" index.html
          ! grep -q "الدكتورة" index.html
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script[^>]*>(.*?)</script>',s,re.S)
          assert blocks
          Path('/tmp/fattening-site.js').write_text('\n'.join(blocks),encoding='utf-8')
          PY
          node --check /tmp/fattening-site.js

      - name: Runtime lifecycle and UI smoke test
        run: |
          npm install jsdom@24 --no-save --silent
          node - <<'JS'
          const fs=require('fs');
          const {JSDOM,VirtualConsole}=require('jsdom');
          const html=fs.readFileSync('index.html','utf8');
          const errors=[];
          const vc=new VirtualConsole();
          vc.on('jsdomError',e=>errors.push('JSDOM: '+e.message));
          vc.on('error',e=>errors.push('console.error: '+e));
          const dom=new JSDOM(html,{runScripts:'dangerously',url:'https://fattening.test/',pretendToBeVisual:true,virtualConsole:vc,beforeParse(w){w.confirm=()=>true;w.alert=()=>{};w.HTMLElement.prototype.scrollIntoView=function(){}}});
          const w=dom.window;
          w.addEventListener('error',e=>errors.push('window error: '+(e.error?.stack||e.message)));
          const ev=code=>w.eval(code);
          const assert=(ok,msg)=>{if(!ok)throw new Error(msg)};
          setTimeout(()=>{
            try{
              const active=ev('state.plans.find(p=>p.status!=="closed"&&!p.archived)');
              assert(active,'no active plan');
              ev(`state.currentPlanId=${JSON.stringify(active.id)};state.currentPage="plan";state.planTab="timeline";render()`);
              assert(w.document.querySelector('.content'),'active plan render failed');

              // Event icons remain professional SVG.
              const eventIcons=[...w.document.querySelectorAll('.v4-evicon')];
              if(eventIcons.length)assert(eventIcons.every(x=>x.querySelector('svg.v13-icon')),'timeline contains non-standard icons');

              // Animal file has exactly one status control, not duplicate buttons.
              const aid=ev(`planAnimals(${JSON.stringify(active.id)}).find(a=>a.status!=="sold")?.id`);
              if(aid){
                w.openAnimal(aid);
                assert(!w.document.querySelector('.v11-status-button'),'duplicate header status button still exists');
                const strip=w.document.querySelector('.v11-status-strip');
                if(strip)assert(strip.querySelectorAll('button').length<=1,'animal status controls are duplicated');
                w.closeModal();
              }

              // Completed plans are separated and immutable.
              const completed=ev('state.plans.find(p=>p.status==="closed")');
              assert(completed,'no completed seed plan');
              ev(`state.currentPage="plans";state.planListFilter="completed";render()`);
              assert(w.document.body.textContent.includes(completed.name),'completed plan missing from completed tab');
              assert(w.document.body.textContent.includes('المكتملة'),'completed tab missing');
              ev(`state.currentPlanId=${JSON.stringify(completed.id)};state.currentPage="plan";render()`);
              assert(w.document.body.textContent.includes('مكتملة — للعرض فقط'),'completed plan is not read-only');
              assert(!w.document.body.textContent.includes('إدارة الخطة'),'completed plan still exposes management');
              assert(!w.document.body.textContent.includes('أرشفة الخطة'),'completed plan still exposes archive action');
              const modalBefore=!!w.document.getElementById('modal');
              w.openExpenseModal(completed.id);
              assert(!!w.document.getElementById('modal')===modalBefore,'completed plan opened a mutation modal');

              // Current plan can be archived and then offers restore + delete.
              ev(`state.currentPlanId=${JSON.stringify(active.id)};state.currentPage="plans";state.planListFilter="current";save();render()`);
              const originalName=active.name;
              w.archivePlanV13(active.id);
              assert(ev(`state.plans.find(p=>p.id===${JSON.stringify(active.id)}).archived`)===true,'archive failed');
              ev('state.currentPage="plans";state.planListFilter="archived";render()');
              assert(w.document.body.textContent.includes(originalName),'archived plan missing');
              assert(w.document.body.textContent.includes('حذف'),'delete action missing from archive');
              w.restorePlanV13(active.id);
              assert(ev(`state.plans.find(p=>p.id===${JSON.stringify(active.id)}).archived`)===false,'restore failed');

              // Final deletion is allowed only for an archived, non-completed plan and cascades related animal data.
              const tmp='tmp_plan_'+Date.now(),tmpAnimal='tmp_animal_'+Date.now();
              ev(`state.plans.push({id:${JSON.stringify(tmp)},clientId:state.currentClientId,name:'خطة حذف اختبار',start:today(),duration:90,sellPlace:'اختبار',profitTarget:0,status:'active',archived:true,groups:[{id:'tmp_g',name:'اختبار'}]});state.animals.push({id:${JSON.stringify(tmpAnimal)},planId:${JSON.stringify(tmp)},groupId:'tmp_g',tag:'TMP',buyDate:today(),buyWeight:100,buyPrice:0,weights:[{date:today(),value:100}],notes:[],status:'normal'});save()`);
              const f=w.document.createElement('form');f.innerHTML='<input type="checkbox" name="confirm" checked>';
              w.deletePlanV14({preventDefault(){},target:f},tmp);
              assert(!ev(`state.plans.some(p=>p.id===${JSON.stringify(tmp)})`),'archived plan was not deleted');
              assert(!ev(`state.animals.some(a=>a.id===${JSON.stringify(tmpAnimal)})`),'related animal was not deleted');

              // A completed plan can never be archived or deleted.
              w.archivePlanV13(completed.id);
              assert(ev(`state.plans.find(p=>p.id===${JSON.stringify(completed.id)}).archived`)!==true,'completed plan was archived');
              const f2=w.document.createElement('form');f2.innerHTML='<input type="checkbox" name="confirm" checked>';
              w.deletePlanV14({preventDefault(){},target:f2},completed.id);
              assert(ev(`state.plans.some(p=>p.id===${JSON.stringify(completed.id)})`),'completed plan was deleted');

              if(errors.length)throw new Error(errors.join('\n---\n'));
              console.log('Lifecycle v14 smoke test passed');
            }catch(e){errors.push(e.stack||String(e));}
            if(errors.length){console.error(errors.join('\n---\n'));process.exit(1)}
          },300);
          JS

      - name: Commit current site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Separate completed cycles and polish plan management"
          git push
