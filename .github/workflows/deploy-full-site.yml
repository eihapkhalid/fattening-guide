name: Deploy full fattening site

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-full-site:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current site
        uses: actions/checkout@v4

      - name: Apply JavaScript runtime stability fix
        run: python .deploy/fix-js-runtime.py index.html

      - name: Apply zero-training herd workflow
        run: python .deploy/apply-usability-v4.py index.html

      - name: Apply per-animal journey timeline
        run: python .deploy/apply-animal-journey-v5.py index.html

      - name: Verify core features and JavaScript syntax
        run: |
          grep -q "purchaseCheckNames" index.html
          grep -q "shelterCheckNames" index.html
          grep -q "LECTURE6_EMERGENCY_MODULE" index.html
          grep -q "LECTURE7_MARKETING_FEASIBILITY_MODULE" index.html
          grep -q "BEGINNER_FLOW_V2" index.html
          grep -q "FEED_CURRENCY_CARDS_V3" index.html
          grep -q "USABILITY_V4_HERD_TIMELINE_FEEDING" index.html
          grep -q "ANIMAL_JOURNEY_V5" index.html
          grep -q "سجل القطيع" index.html
          grep -q "رحلة الحيوان" index.html
          grep -q "animalEventsV5" index.html
          grep -q "animalJourneyHtmlV5" index.html
          grep -q "quickCleanShelter" index.html
          grep -q "createFeedingLogV4" index.html
          grep -q "animalEntries" index.html
          grep -q "خلطة المحاضرة — يخصم المكونات تلقائيًا" index.html
          grep -q "لا يوجد رقم تدرج موثق لهذا الوزن" index.html
          grep -q "وقت غير مسجل" index.html
          grep -q "window.ezNext=function ezNext" index.html
          grep -q "window.ezDay=function ezDay" index.html
          grep -q "window.ezPhase=function ezPhase" index.html
          ! grep -q "includes(state.planTab)?'overview'" index.html
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script[^>]*>(.*?)</script>',s,re.S)
          assert blocks, 'script blocks not found'
          Path('/tmp/fattening-site.js').write_text('\n'.join(blocks),encoding='utf-8')
          PY
          node --check /tmp/fattening-site.js

      - name: Runtime UI herd and animal journey smoke test
        run: |
          npm install jsdom@24 --no-save --silent
          node - <<'JS'
          const fs=require('fs');
          const {JSDOM,VirtualConsole}=require('jsdom');
          const html=fs.readFileSync('index.html','utf8');
          const errors=[];
          const vc=new VirtualConsole();
          vc.on('jsdomError',e=>errors.push('JSDOM: '+e.message));
          vc.on('error',e=>errors.push('console.error: '+e));
          const dom=new JSDOM(html,{runScripts:'dangerously',url:'https://fattening.test/',pretendToBeVisual:true,virtualConsole:vc,beforeParse(w){w.alert=()=>{};w.confirm=()=>true;}});
          const w=dom.window;
          w.addEventListener('error',e=>errors.push('window error: '+(e.error?.stack||e.message)));
          const ev=code=>w.eval(code);
          const assert=(ok,msg)=>{if(!ok)throw new Error(msg)};
          setTimeout(()=>{
            try{
              ev('state.currentPage="dashboard"; render()');
              assert(w.document.body.textContent.includes('الرئيسية'),'dashboard failed');
              ev('state.currentPage="plans"; render()');
              assert(w.document.body.textContent.includes('خططي'),'plans failed');
              const p=ev('state.currentPlanId=state.plans[0].id; state.currentPage="plan"; plan()');
              assert(p,'no current plan');

              const tabs=['overview','timeline','animals','feeding','health','sales','feeds','cycle','reports','shelter','expenses','treatments'];
              for(const t of tabs){
                ev(`state.planTab=${JSON.stringify(t)}; render()`);
                assert(w.document.querySelector('.content'),'render failed for '+t);
              }

              ev('state.planTab="timeline"; render()');
              assert(w.document.body.textContent.includes('سجل القطيع'),'timeline screen missing');
              assert(ev('herdEventsV4(plan()).length')>0,'timeline did not aggregate existing events');
              assert(w.document.querySelector('.v4-day'),'timeline date grouping missing');

              ev('state.planTab="overview"; render()');
              assert(w.document.body.textContent.includes('افعل هذا الآن'),'single next-step block missing');
              const beforeDaily=ev('state.daily.length');
              ev('quickCleanShelter(plan().id)');
              assert(ev('state.daily.length')>=beforeDaily,'quick clean failed');
              assert(ev('state.daily.filter(x=>x.createdAt).length')>0,'new event timestamp missing');

              ev('state.planTab="feeding"; render(); openFeedingLogModal(plan().id)');
              assert(w.document.getElementById('feedingV4Form'),'feeding v4 modal failed');
              const form=w.document.getElementById('feedingV4Form');
              form.querySelectorAll('input[name^="conc_"]').forEach(x=>x.value='0.1');
              form.querySelectorAll('input[name^="rough_"]').forEach(x=>x.value='0.15');
              const mode=form.elements.mixMode;
              if([...mode.options].some(o=>o.value==='ready')){mode.value='ready';w.feedV4Mode(mode)}
              const beforeLogs=ev('state.feedingLogs.length');
              w.createFeedingLogV4({preventDefault(){},target:form},p.id);
              assert(ev('state.feedingLogs.length')===beforeLogs+1,'feeding log not created');
              const last=ev('state.feedingLogs.at(-1)');
              assert(last.createdAt,'feeding timestamp missing');
              assert(last.animalEntries?.length===ev('planAnimals(plan().id).filter(a=>a.status!=="sold").length'),'per-animal feed rows missing');
              assert(last.feedConsumption?.length>=2,'feed inventory consumption not recorded');

              const aid=ev('planAnimals(plan().id).find(a=>a.status!=="sold").id');
              ev(`openAnimal(${JSON.stringify(aid)})`);
              assert(w.document.body.textContent.includes('رحلة الحيوان'),'animal journey heading missing');
              assert(w.document.querySelector('.v5-animal-day'),'animal date grouping missing');
              const animalEvents=ev(`animalEventsV5(state.animals.find(a=>a.id===${JSON.stringify(aid)}))`);
              assert(animalEvents.some(x=>x.type==='animal'),'animal admission event missing');
              assert(animalEvents.some(x=>x.type==='feed'),'animal feeding event missing');
              assert(animalEvents.some(x=>x.type==='clean'&&x.shared),'shared shelter cleaning missing from animal journey');
              const feedEvent=animalEvents.find(x=>x.type==='feed');
              assert(feedEvent.summary.includes('كجم مركز'),'animal feed quantity missing');
              ev('closeModal()');

              const sold=ev('state.animals.find(a=>a.status==="sold")');
              if(sold){
                const soldEvents=ev(`animalEventsV5(state.animals.find(a=>a.id===${JSON.stringify(sold.id)}))`);
                assert(soldEvents.some(x=>x.type==='sale'),'sold animal sale event missing');
                const saleDate=ev(`state.sales.find(s=>(s.animalIds||[]).includes(${JSON.stringify(sold.id)})).date`);
                assert(soldEvents.every(x=>x.date<=saleDate),'animal journey contains event after sale');
              }

              assert(!errors.length,'runtime errors detected');
              console.log('Runtime herd and animal journey smoke test passed');
            }catch(e){errors.push(e.stack||String(e));}
            if(errors.length){console.error(errors.join('\n---\n'));process.exit(1)}
          },120);
          JS

      - name: Commit simplified site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add complete per-animal journey timeline"
          git push
