<script>
/* ANIMAL_JOURNEY_V5 */
(()=>{
  if(typeof state==='undefined')return;
  const esc5=x=>String(x??'').replace(/[&<>\"]/g,c=>c==='&'?'&amp;':c==='<'?'&lt;':c==='>'?'&gt;':'&quot;');
  const time5=iso=>{if(!iso)return'وقت غير مسجل';try{return new Date(iso).toLocaleTimeString('ar-SA',{hour:'2-digit',minute:'2-digit'})}catch(_){return'وقت غير مسجل'}};
  const dateLabel5=d=>{if(d===today())return'اليوم';try{return new Date(d+'T00:00:00').toLocaleDateString('ar-SA',{weekday:'long',day:'numeric',month:'short',year:'numeric'})}catch(_){return d}};
  const animalSale5=a=>(state.sales||[]).filter(s=>(s.animalIds||[]).includes(a.id)).sort((x,y)=>(x.date||'').localeCompare(y.date||''))[0]||null;
  const insideLife5=(a,date)=>{if(!date)return false;const sale=animalSale5(a);return date>=a.buyDate&&(!sale?.date||date<=sale.date)};
  const push5=(out,a,e)=>{if(e.date&&insideLife5(a,e.date))out.push(e)};
  const hLabel5=k=>typeof healthEventLabel==='function'?healthEventLabel(k):'إجراء وقائي';
  const eLabel5=t=>typeof emergencyTypeLabel==='function'?emergencyTypeLabel(t):'حالة طارئة';
  const status5=s=>s==='treatment'?'تحت علاج':s==='quarantine'?'عزل استقبال':s==='sold'?'مباع':s==='normal'?'طبيعي':(s||'غير مسجل');

  window.animalEventsV5=function(a){
    const p=plan(a.planId),out=[];
    push5(out,a,{date:a.buyDate,createdAt:a.createdAt,type:'animal',icon:a.animalType==='sheep'?'🐑':'🐄',title:'إدخال الحيوان إلى الخطة',summary:`وزن الشراء ${Number(a.buyWeight||0).toFixed(1)} كجم${a.buyPlace?' • '+esc5(a.buyPlace):''}`,details:[a.buyPrice?`سعر الشراء: ${fmt(Number(a.buyPrice)||0)}`:'',a.selection?.result==='suitable'?'تم اعتماده بعد فحص الشراء المسجل':'سجل قديم — فحص الشراء الكامل غير موثق'].filter(Boolean).join('<br>')});

    planFeedingLogs(p.id).forEach(l=>{
      const row=(l.animalEntries||[]).find(x=>x.animalId===a.id);
      if(row){push5(out,a,{date:l.date,createdAt:l.createdAt,type:'feed',icon:'🌾',title:'تغذية',summary:`${Number(row.concentrateKg||0).toFixed(2)} كجم مركز + ${Number(row.roughageKg||0).toFixed(2)} كجم مالئ`,details:l.mixMode==='course'?'المركزات من الخلطة القياسية المسجلة لهذا اليوم':l.mixMode==='ready'?'علف مركز جاهز/مخلوط كما تم تسجيله':''});}
      else if(insideLife5(a,l.date)){push5(out,a,{date:l.date,createdAt:l.createdAt,type:'feed',icon:'🌾',title:'تغذية القطيع',shared:true,summary:'تم تسجيل تغذية للقطيع، لكن حصة هذا الحيوان لم تكن محفوظة منفصلة',details:`إجمالي القطيع المسجل: ${Number((l.totalConcentrateKg??l.concentrateKg)||0).toFixed(2)} كجم مركز • ${Number((l.totalRoughageKg??l.roughageKg)||0).toFixed(2)} كجم مالئ`});}
    });

    const dailyWeightKeys=new Set(),dailyNoteKeys=new Set();
    (state.daily||[]).filter(d=>d.planId===p.id&&insideLife5(a,d.date)).forEach(d=>{
      if(d.shelterCleaned)push5(out,a,{date:d.date,createdAt:d.createdAt,type:'clean',icon:'🧹',title:'نظافة الزريبة',shared:true,summary:'تم تنظيف الزريبة في هذا اليوم',details:d.note&&d.note!=='نظافة الزريبة'?esc5(d.note):''});
      if(d.note&&d.note!=='نظافة الزريبة')push5(out,a,{date:d.date,createdAt:d.createdAt,type:'herdnote',icon:'✎',title:'ملاحظة على القطيع',shared:true,summary:esc5(d.note),details:''});
      const en=(d.entries||[]).find(x=>x.animalId===a.id);
      if(en){
        const bits=[];if(en.weight){bits.push(`الوزن ${en.weight} كجم`);dailyWeightKeys.add(`${d.date}|${Number(en.weight)}`)}if(en.status)bits.push(`الحالة: ${status5(en.status)}`);if(en.note){bits.push(esc5(en.note));dailyNoteKeys.add(`${d.date}|${en.note}`)}
        if(bits.length)push5(out,a,{date:d.date,createdAt:d.createdAt,type:'daily',icon:'☑',title:'متابعة يومية',summary:bits.join(' • '),details:''});
      }
    });

    (a.weights||[]).forEach(w=>{if(w.date===a.buyDate&&Number(w.value)===Number(a.buyWeight))return;if(dailyWeightKeys.has(`${w.date}|${Number(w.value)}`))return;push5(out,a,{date:w.date,createdAt:w.createdAt,type:'weight',icon:'⚖️',title:'تسجيل وزن',summary:`${Number(w.value||0).toFixed(1)} كجم`,details:''})});
    (a.notes||[]).forEach(n=>{if(dailyNoteKeys.has(`${n.date}|${n.text}`))return;push5(out,a,{date:n.date,createdAt:n.createdAt,type:'note',icon:'✎',title:'ملاحظة على الحيوان',summary:esc5(n.text||''),details:''})});

    planHealthLogs(p.id).filter(l=>l.animalId===a.id).forEach(l=>{const danger=typeof healthDanger==='function'?healthDanger(l):[];push5(out,a,{date:l.date,createdAt:l.createdAt,type:'health',icon:'♡',title:danger.length?'متابعة صحية — توجد ملاحظة':'فحص صحي',summary:danger.length?danger.map(esc5).join('، '):(l.note?esc5(l.note):'تم تسجيل الفحص الصحي'),details:[l.appetiteOk===false?'الشهية تحتاج متابعة':'',l.drinkingOk===false?'الشرب غير طبيعي':'',l.isolated?'تم العزل':''].filter(Boolean).join('<br>')})});
    planHealthEvents(p.id).filter(e=>!e.animalId||e.animalId===a.id).forEach(e=>push5(out,a,{date:e.date,createdAt:e.createdAt,type:'preventive',icon:'💉',title:hLabel5(e.kind),shared:!e.animalId,summary:e.guidance||'إجراء وقائي مسجل',details:e.note||''}));
    planTreatments(p.id).filter(t=>(t.animalIds||[]).includes(a.id)).forEach(t=>push5(out,a,{date:t.start,createdAt:t.createdAt,type:'treatment',icon:'💊',title:`علاج: ${esc5(t.name)}`,summary:t.dose?`الجرعة المسجلة: ${esc5(t.dose)}`:(t.reason||'علاج مسجل'),details:[t.reason,t.route?`الطريقة: ${esc5(t.route)}`:'',t.withdrawalUntil?`فترة السحب حتى ${esc5(t.withdrawalUntil)}`:''].filter(Boolean).map(esc5).join('<br>')}));
    (state.emergencies||[]).filter(e=>e.planId===p.id&&(!e.animalId||e.animalId===a.id)).forEach(e=>push5(out,a,{date:e.date||e.createdAt?.slice(0,10),createdAt:e.createdAt,type:'emergency',icon:'🚨',title:eLabel5(e.type),shared:!e.animalId,summary:e.status==='resolved'?'تم إغلاق الحالة':'حالة مفتوحة',details:e.note||''}));

    const sale=animalSale5(a);if(sale)push5(out,a,{date:sale.date,createdAt:sale.createdAt,type:'sale',icon:'↗',title:'بيع الحيوان',summary:`${fmt(Number(sale.amount)||0)}${sale.buyer?' • '+esc5(sale.buyer):''}`,details:[sale.weight?`وزن البيع: ${sale.weight} كجم`:'',sale.place?`مكان البيع: ${esc5(sale.place)}`:'',sale.fees?`مصروفات البيع: ${fmt(Number(sale.fees)||0)}`:''].filter(Boolean).join('<br>')});

    const priority={animal:0,feed:20,clean:30,herdnote:35,daily:40,weight:45,note:50,health:60,preventive:70,treatment:80,emergency:90,sale:999};
    return out.sort((x,y)=>{const d=(x.date||'').localeCompare(y.date||'');if(d)return d;if(x.createdAt&&y.createdAt){const t=x.createdAt.localeCompare(y.createdAt);if(t)return t}return (priority[x.type]??100)-(priority[y.type]??100)});
  };

  function eventHtml5(e){const more=e.details&&String(e.details).trim();return `<div class="v5-animal-event"><div class="time">${time5(e.createdAt)}</div><div class="icon">${e.icon}</div><div><h4>${e.title}${e.shared?'<span class="shared">حدث مشترك</span>':''}</h4><p>${e.summary||''}</p>${more?`<details><summary>تفاصيل</summary><div class="details">${e.details}</div></details>`:''}</div></div>`}
  window.animalJourneyHtmlV5=function(a){const es=animalEventsV5(a),groups={};es.forEach(e=>(groups[e.date]||(groups[e.date]=[])).push(e));const dates=Object.keys(groups).sort();if(!dates.length)return'<div class="v5-empty">لا توجد أحداث مسجلة لهذا الحيوان بعد.</div>';return `<div class="v5-animal-journey">${dates.map((d,i)=>`<details class="v5-animal-day" ${i===dates.length-1?'open':''}><summary><span>${dateLabel5(d)}</span><span class="count">${groups[d].length} حدث</span></summary><div class="v5-animal-events">${groups[d].map(eventHtml5).join('')}</div></details>`).join('')}</div>`};

  window.openAnimal=function(id){const a=state.animals.find(x=>x.id===id);if(!a)return;const p=plan(a.planId),last=a.weights.at(-1)?.value||a.buyWeight,type=a.animalType==='sheep'?'ضأن':a.animalType==='calf'?'عجل':'غير محدد',sale=animalSale5(a),selection=a.selection?.result==='suitable'?'<span class="badge active">اجتاز فحص الاختيار</span>':'<span class="badge">سجل قديم — فحص الاختيار الكامل غير موثق</span>',events=animalEventsV5(a);modal(`<div class="modal-head"><div class="animal-head"><div class="animal-icon">${a.animalType==='sheep'?'🐑':'🐂'}</div><div><h3 style="margin:0">الحيوان #${esc5(a.tag)}</h3><div class="small muted">${esc5(p.name)} • ${type} • ${animalStatus(a.status)}</div></div></div><button class="close" onclick="closeModal()">×</button></div>${a.pinnedNote?`<div class="note-pin">📌 <strong>ملاحظة مهمة:</strong> ${esc5(a.pinnedNote)}</div>`:''}<div style="margin-top:12px">${selection} ${a.health?.arrivalCompleted?'<span class="badge active">استقبال صحي موثق</span>':a.health?.arrivalCompleted===false?'<span class="badge sell">بانتظار توثيق الاستقبال والعزل</span>':'<span class="badge">الاستقبال الصحي غير موثق</span>'} ${activeWithdrawal(a.id)?`<span class="badge treat">فترة سحب حتى ${activeWithdrawal(a.id)}</span>`:''}</div><div class="grid metrics" style="margin-top:15px"><div class="metric"><div class="label">وزن الشراء</div><div class="value">${a.buyWeight}</div><div class="note">كجم</div></div><div class="metric"><div class="label">آخر وزن</div><div class="value">${last}</div><div class="note">كجم</div></div><div class="metric good"><div class="label">إجمالي الزيادة</div><div class="value">+${last-a.buyWeight}</div><div class="note">كجم</div></div></div><div class="card v5-journey-card"><div class="v5-journey-head"><div><h3>رحلة الحيوان</h3><p>كل ما حدث لهذا الحيوان من دخوله إلى ${sale?'بيعه':'اليوم'}؛ الأحداث المشتركة مع القطيع تظهر هنا أيضًا.</p></div><span class="badge">${events.length} حدث</span></div><div class="v5-life-range"><span class="v5-life-chip strong">الدخول: ${a.buyDate}</span>${sale?`<span class="v5-life-chip strong">البيع: ${sale.date}</span>`:'<span class="v5-life-chip">ما زال ضمن القطيع</span>'}</div>${animalJourneyHtmlV5(a)}</div><details class="v5-advanced"><summary class="small muted" style="cursor:pointer;margin-top:12px">البيانات الأولية الثابتة</summary><div class="card" style="box-shadow:none;margin-top:8px"><div class="form-grid"><div><div class="small muted">نوع الحيوان</div><strong>${type}</strong></div><div><div class="small muted">تاريخ الشراء</div><strong>${a.buyDate}</strong></div><div><div class="small muted">مكان الشراء</div><strong>${esc5(a.buyPlace||'-')}</strong></div><div><div class="small muted">سعر الشراء</div><strong>${fmt(a.buyPrice)}</strong></div><div><div class="small muted">السلالة / الجنس</div><strong>${esc5(a.breed||'-')} / ${esc5(a.sex)}</strong></div><div><div class="small muted">فحص خبير/بيطري</div><strong>${a.selection?.expertChecked?'تم':'غير مسجل'}</strong></div></div></div></details>`) };
})();
</script>


<style>

.scope-v7{border:1px solid var(--border);background:#f8faf8;border-radius:13px;padding:12px;margin:0 0 14px}.scope-v7-title{font-size:12px;font-weight:700;margin-bottom:8px}.scope-v7-switch{display:grid;grid-template-columns:1fr 1fr;gap:8px}.scope-v7-option{position:relative;border:1px solid var(--border);background:#fff;border-radius:10px;padding:10px 12px;cursor:pointer;display:flex;align-items:center;gap:9px;min-height:48px}.scope-v7-option:has(input:checked){border-color:#83ae9e;background:var(--primary-soft);color:var(--primary)}.scope-v7-option input{accent-color:var(--primary);width:17px;height:17px}.scope-v7-option strong{font-size:12px}.scope-v7-summary{font-size:11px;color:var(--muted);margin-top:8px;line-height:1.6}.scope-v7-animal{margin-top:10px}.scope-v7-herd-note{margin-top:10px;border-radius:9px;background:#eef5f1;padding:9px 10px;font-size:11px;color:#355e50}.scope-v7-danger{margin-top:10px;border:1px solid #efcccc;background:#fff6f6;border-radius:9px;padding:9px 10px;font-size:11px;color:#8e3636}.scope-v7-chip{display:inline-flex;align-items:center;border:1px solid var(--border);border-radius:999px;padding:3px 8px;font-size:10px;color:var(--muted);background:#fff}.scope-v7-feedrows{margin-top:12px}

<script>
/* ACTION_SCOPE_V7 */
(()=>{
  if(typeof state==='undefined')return;
  const escV7=x=>String(x??'').replace(/[&<>\"]/g,c=>c==='&'?'&amp;':c==='<'?'&lt;':c==='>'?'&gt;':'&quot;');
  const nowV7=()=>new Date().toISOString();
  const batchV7=()=>uid('evb');
  const activeV7=pid=>planAnimals(pid).filter(a=>a.status!=='sold');
  const tagV7=id=>state.animals.find(a=>a.id===id)?.tag||id||'-';
  const remV7=f=>(Number(f?.qtyKg)||0)-(Number(f?.usedKg)||0);

  window.scopePickerV7=function(pid,def='herd',allowHerd=true){
    const n=activeV7(pid).length;
    return `<div class="scope-v7"><div class="scope-v7-title">على من سيُطبق هذا الإجراء؟</div><div class="scope-v7-switch">${allowHerd?`<label class="scope-v7-option"><input type="radio" name="scope" value="herd" ${def==='herd'?'checked':''} onchange="scopeChangedV7(this.form)"><span><strong>كامل القطيع</strong><span class="small muted" style="display:block">${n} حيوان نشط</span></span></label>`:''}<label class="scope-v7-option"><input type="radio" name="scope" value="animal" ${def==='animal'||!allowHerd?'checked':''} onchange="scopeChangedV7(this.form)"><span><strong>حيوان واحد</strong><span class="small muted" style="display:block">اختر الحيوان المطلوب</span></span></label></div><div class="scope-v7-summary" data-scope-summary></div></div>`;
  };
  window.scopeAnimalSelectV7=function(pid,name='animal'){return `<div class="field scope-v7-animal" data-scope-animal><label>اختر الحيوان</label><select name="${name}">${activeV7(pid).map(a=>`<option value="${a.id}">#${escV7(a.tag)} — ${Number(a.weights?.at(-1)?.value||a.buyWeight||0)} كجم</option>`).join('')}</select></div>`};
  window.scopeChangedV7=function(form){
    if(!form)return;const scope=form.elements.scope?.value||'animal',n=form.dataset.pid?activeV7(form.dataset.pid).length:0;
    form.querySelectorAll('[data-scope-animal]').forEach(x=>x.style.display=scope==='animal'?'grid':'none');
    form.querySelectorAll('[data-scope-herd]').forEach(x=>x.style.display=scope==='herd'?'block':'none');
    const sum=form.querySelector('[data-scope-summary]');if(sum)sum.textContent=scope==='herd'?`سيُسجل الإجراء على كامل القطيع الحالي (${n} حيوان).`:'سيُسجل الإجراء على الحيوان الذي تختاره فقط.';
  };
  window.scopeInitV7=function(form){scopeChangedV7(form);return form};
  function targetIdsV7(form,pid){const scope=form.elements.scope?.value||'animal';return scope==='herd'?activeV7(pid).map(a=>a.id):[form.elements.animal?.value||form.elements.targetAnimal?.value].filter(Boolean)}

  /* Simple note: herd or one animal */
  window.openNoteV7=function(pid){modal(`<div class="modal-head"><div><h3>إضافة ملاحظة</h3><div class="small muted">اختر نطاق الملاحظة ثم اكتبها.</div></div><button class="close" onclick="closeModal()">×</button></div><form data-pid="${pid}" onsubmit="saveNoteV7(event,'${pid}')">${scopePickerV7(pid,'herd')}${scopeAnimalSelectV7(pid)}<div class="field"><label>التاريخ</label><input name="date" type="date" value="${today()}" required></div><div class="field" style="margin-top:10px"><label>الملاحظة</label><textarea name="note" required placeholder="اكتب ما حدث باختصار"></textarea></div><div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">إلغاء</button><button class="btn primary">حفظ الملاحظة</button></div></form>`);scopeInitV7(document.querySelector('#modal form'))};
  window.saveNoteV7=function(ev,pid){ev.preventDefault();const f=new FormData(ev.target),scope=f.get('scope'),date=f.get('date'),note=f.get('note'),at=nowV7(),b=batchV7();if(scope==='herd'){state.daily.push({id:uid('d'),planId:pid,date,note,shelterCleaned:null,entries:[],scope:'herd',createdAt:at,eventBatchId:b})}else{const a=state.animals.find(x=>x.id===f.get('animal'));if(!a)return;a.notes=a.notes||[];a.notes.push({date,text:note,createdAt:at,eventBatchId:b})}save();closeModal();render()};

  /* Health: choose herd or one animal before showing details */

<script>
/* NOTIFICATIONS_V9 */
(()=>{
  const icons={
    success:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>',
    error:'<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m9 9 6 6m0-6-6 6"/></svg>',
    warning:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 2.8 19h18.4L12 3Z"/><path d="M12 9v4m0 3h.01"/></svg>',
    info:'<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5m0-8h.01"/></svg>'
  };
  const titles={success:'تم بنجاح',error:'تعذر إكمال الإجراء',warning:'تنبيه',info:'معلومة'};
  function wrap(){let el=document.getElementById('notifyV9Wrap');if(!el){el=document.createElement('div');el.id='notifyV9Wrap';el.className='notify-v9-wrap';el.setAttribute('aria-live','polite');el.setAttribute('aria-relevant','additions');document.body.appendChild(el)}return el}
  function close(el){if(!el||!el.parentNode)return;el.classList.add('out');setTimeout(()=>el.remove(),180)}
  window.notifyV9=function(type,message,opts={}){
    type=['success','error','warning','info'].includes(type)?type:'info';
    const host=wrap(),el=document.createElement('div');el.className=`notify-v9 ${type}`;el.setAttribute('role',type==='error'?'alert':'status');
    const icon=document.createElement('div');icon.className='notify-v9-icon';icon.innerHTML=icons[type];
    const body=document.createElement('div'),title=document.createElement('div'),msg=document.createElement('div');title.className='notify-v9-title';title.textContent=opts.title||titles[type];msg.className='notify-v9-msg';msg.textContent=String(message??'');body.append(title,msg);
    const x=document.createElement('button');x.type='button';x.className='notify-v9-close';x.setAttribute('aria-label','إغلاق الرسالة');x.textContent='×';x.onclick=()=>close(el);
    el.append(icon,body,x);host.prepend(el);

  window.errorV9=(m,o)=>notifyV9('error',m,o);
  window.warningV9=(m,o)=>notifyV9('warning',m,o);
  window.infoV9=(m,o)=>notifyV9('info',m,o);
  window.notificationTypeV9=function(message){

    if(/تنبيه|تحذير|انتبه|تأكد|راجع|فترة سحب|طوارئ|مشكلة/.test(m))return 'warning';

<script>

(()=>{

  window.addMixRowV11=function(prefill={}){const box=document.getElementById('mixRowsV11');if(!box)return;const id='mr_'+uid('r');box.insertAdjacentHTML('beforeend',`<div class="v11-mix-row" data-row="${id}"><div class="field"><label>المادة</label><select name="material" onchange="mixMaterialChangedV11(this)"><option value="">اختر مادة</option>${mixOptions11()}<option value="__new__">+ مادة جديدة غير موجودة بالقائمة</option></select></div><div class="field"><label>الوزن — كجم</label><input name="kg" type="number" min="0.001" step=".001" value="${prefill.kg||''}" oninput="updateMixTotalV11()" required></div><button type="button" class="btn small v11-remove" onclick="removeMixRowV11(this)" title="حذف المكون">×</button><div class="v11-new-material"><div class="field"><label>اسم المادة الجديدة</label><input name="newName" placeholder="مثال: مادة أو علف جديد"></div><div class="field"><label>التصنيف</label><select name="newCategory"><option value="concentrate">مركز</option><option value="roughage">مالئ / ألياف</option><option value="other">إضافة / أخرى</option></select></div></div></div>`);const row=box.lastElementChild;if(prefill.code){row.querySelector('select[name="material"]').value=prefill.code}else if(prefill.newName){row.querySelector('select[name="material"]').value='__new__';row.querySelector('input[name="newName"]').value=prefill.newName;row.classList.add('is-new')}updateMixTotalV11()};

  window.openMixBuilderV10=function(pid){modal(`<div class="modal-head"><div><h3>إنشاء خلطة مرنة</h3><div class="small muted">أضف أي عدد من المواد وبأي أوزان فعلية تريدها. لا يشترط أن يكون الإجمالي 100 كجم.</div></div><button class="close" onclick="closeModal()">×</button></div><form id="mixBuilderV11" onsubmit="saveMixV11(event,'${pid}')"><div class="field"><label>اسم الخلطة</label><input name="name" required placeholder="مثال: خلطة التسمين الخاصة بي"></div><div class="v11-mix-help">يمكن اختيار مادة موجودة أو إضافة مادة جديدة داخل الخلطة مباشرة. إذا كانت المادة الجديدة غير موجودة في المخزون فستُحفظ ضمن قائمة المواد، لكن تسجيل التغذية بهذه الخلطة سيبقى متوقفًا حتى تضيف مخزونًا فعليًا منها.</div><div id="mixRowsV11" class="v11-mix-rows"></div><button type="button" class="btn small" style="margin-top:9px" onclick="addMixRowV11()">+ إضافة مكوّن آخر</button><div id="mixTotalV11" class="v11-mix-total" data-total="0"><span>إجمالي وزن الخلطة</span><strong>0 كجم</strong></div><div class="v10-confirm"><label><input type="checkbox" name="confirm" required>راجعت المواد والأوزان وأؤكد أن هذه هي الخلطة التي أريد استخدامها.</label></div><div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">إلغاء</button><button class="btn primary">حفظ الخلطة</button></div></form>`);addMixRowV11();addMixRowV11()};
  window.openMixBuilderV11=window.openMixBuilderV10;
  window.saveMixV11=function(ev,pid){ev.preventDefault();const form=ev.target,rows=[...form.querySelectorAll('.v11-mix-row')],raw=[];for(const row of rows){const kind=row.querySelector('select[name="material"]')?.value||'',kg=Number(row.querySelector('input[name="kg"]')?.value)||0;if(!kind||kg<=0){errorV9('اختر المادة وأدخل وزنًا أكبر من صفر لكل مكوّن.');return}if(kind==='__new__'){const name=row.querySelector('input[name="newName"]')?.value.trim(),category=row.querySelector('select[name="newCategory"]')?.value||'other';if(!name){errorV9('اكتب اسم المادة الجديدة.');return}let item=allCatalog11().find(x=>x.name.trim()===name);if(!item){item={code:'custom_'+uid('fc'),name,category,group:'أعلاف مضافة بواسطة المستخدم',custom:true};state.customFeedCatalog.push(item)}raw.push({code:item.code,kg,name:item.name})}else{const item=cat11(kind);if(!item){errorV9('أحد مكونات الخلطة لم يعد موجودًا في القائمة.');return}raw.push({code:item.code,kg,name:item.name})}}

  const oldAnimalStatus11=window.animalStatus;
  window.animalStatus=function(s){return s==='quarantine'?'<span class="badge sell">عزل / فصل</span>':s==='treatment'?'<span class="badge treat">تحت العلاج</span>':s==='observation'?'<span class="badge sell">تحت المراقبة</span>':s==='sold'?'<span class="badge closed">مباع</span>':'<span class="badge active">طبيعي</span>'};
  window.openAnimalStatusV11=function(aid){const a=state.animals.find(x=>x.id===aid);if(!a)return;if(a.status==='sold'){warningV9('الحيوان مباع؛ حالته تُدار من سجل البيع.');return}const activeT=activeTreatments11(aid).length,openE=openEmergencies11(aid).length;modal(`<div class="modal-head"><div><h3>تحديث حالة الحيوان #${esc11(a.tag)}</h3><div class="small muted">غيّر الحالة الحالية فقط؛ الطوارئ والعلاجات السابقة تظل محفوظة في السجل.</div></div><button class="close" onclick="closeModal()">×</button></div>${activeT||openE?`<div class="alert danger"><span class="dot"></span><div><strong>توجد متابعة صحية مفتوحة</strong><small>${activeT?`${activeT} علاج نشط`:''}${activeT&&openE?' • ':''}${openE?`${openE} طارئ مفتوح`:''}. لن يسمح النظام باختيار «طبيعي» قبل إغلاقها.</small></div></div>`:''}<form onsubmit="saveAnimalStatusV11(event,'${aid}')"><div class="v11-status-options"><label class="v11-status-option"><input type="radio" name="status" value="normal" ${a.status==='normal'?'checked':''}><span><strong>طبيعي</strong><small>عاد لسلوكه وحالته المعتادة</small></span></label><label class="v11-status-option"><input type="radio" name="status" value="observation" ${a.status==='observation'?'checked':''}><span><strong>تحت المراقبة</strong><small>انتهى التدخل لكن ما زلت تتابعه</small></span></label><label class="v11-status-option"><input type="radio" name="status" value="treatment" ${a.status==='treatment'?'checked':''}><span><strong>تحت العلاج</strong><small>لديه علاج أو تدخل صحي جارٍ</small></span></label><label class="v11-status-option"><input type="radio" name="status" value="quarantine" ${a.status==='quarantine'?'checked':''}><span><strong>عزل / فصل</strong><small>مفصول عن بقية القطيع للمتابعة</small></span></label></div><div class="field"><label>ملاحظة مختصرة عن سبب التغيير — اختيارية</label><input name="reason" placeholder="مثال: انتهى العلاج والحيوان يأكل طبيعيًا"></div><div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">إلغاء</button><button class="btn primary">حفظ الحالة</button></div></form>`)};
  window.saveAnimalStatusV11=function(ev,aid){ev.preventDefault();const a=state.animals.find(x=>x.id===aid),f=new FormData(ev.target),to=f.get('status');if(!a||!to)return;if(a.status===to){closeModal();return}if(!setStatus11(a,to,f.get('reason'),'manual'))return;save();closeModal();render();successV9(`تم تحديث حالة الحيوان #${a.tag} إلى «${statusText11(to)}».`)};

  const oldSaveEmergency11=window.saveEmergency;
  window.saveEmergency=function(ev,pid){const before=new Map(state.animals.map(a=>[a.id,a.status]));oldSaveEmergency11(ev,pid);state.animals.filter(a=>a.planId===pid).forEach(a=>{const from=before.get(a.id);if(from&&from!==a.status)recordStatus11(a,from,a.status,'تم فتح حالة طارئة','emergency')});save()};
  const oldCreateTreatment11=window.createTreatment;
  window.createTreatment=function(ev,pid){const before=new Map(state.animals.map(a=>[a.id,a.status]));oldCreateTreatment11(ev,pid);state.animals.filter(a=>a.planId===pid).forEach(a=>{const from=before.get(a.id);if(from&&from!==a.status)recordStatus11(a,from,a.status,'تم تسجيل علاج نشط','treatment')});save()};
  const oldArrival11=window.saveArrivalHealth;
  window.saveArrivalHealth=function(ev,pid){const aid=new FormData(ev.target).get('animal'),a=state.animals.find(x=>x.id===aid),from=a?.status;oldArrival11(ev,pid);const after=state.animals.find(x=>x.id===aid);if(after&&from&&from!==after.status){recordStatus11(after,from,after.status,'اكتمل توثيق الاستقبال والعزل','arrival');save()}};
  const oldResolved11=window.markEmergencyResolved;
  window.markEmergencyResolved=function(id){const e=(state.emergencies||[]).find(x=>x.id===id),aid=e?.animalId;oldResolved11(id);if(aid){reconcile11(aid,'تم إغلاق الحالة الطارئة');save();render();const a=state.animals.find(x=>x.id===aid);if(a?.status==='observation')successV9(`تم إغلاق الطارئ. الحيوان #${a.tag} أصبح «تحت المراقبة»؛ حوّله إلى طبيعي بعد التأكد من استقرار حالته.`)}};

  window.finishTreatmentV11=function(id){const t=(state.treatments||[]).find(x=>x.id===id);if(!t||t.status!=='active')return;t.status='completed';t.completedAt=today();t.completedAtIso=now11();for(const aid of (t.animalIds||[]))reconcile11(aid,`اكتمل العلاج: ${t.name||'علاج مسجل'}`);save();render();successV9('تم إنهاء العلاج وتحديث حالة الحيوان تلقائيًا حسب المتابعات المفتوحة.')};
  const oldTreatmentsTab11=window.treatmentsTab;
  window.treatmentsTab=function(p){const active=(state.treatments||[]).filter(t=>t.planId===p.id&&t.status==='active'),panel=active.length?`<div class="v11-active-care"><h4>علاجات تحتاج إغلاقًا بعد انتهائها</h4>${active.map(t=>`<div class="v11-care-row"><div><strong>${esc11(t.name)}</strong><div class="small muted">${(t.animalIds||[]).map(id=>'#'+(state.animals.find(a=>a.id===id)?.tag||'-')).join('، ')} • بدأ ${t.start}</div></div><button class="btn small" onclick="finishTreatmentV11('${t.id}')">إنهاء العلاج</button></div>`).join('')}</div>`:'';return panel+oldTreatmentsTab11(p)};

  const oldOpenAnimal11=window.openAnimal;
  window.openAnimal=function(id){oldOpenAnimal11(id);const a=state.animals.find(x=>x.id===id),m=document.querySelector('#modal');if(!a||!m)return;const head=m.querySelector('.modal-head'),close=head?.querySelector('.close');if(head&&!head.querySelector('.v11-status-button')){const b=document.createElement('button');b.type='button';b.className='btn small v11-status-button';b.textContent='تحديث الحالة';b.onclick=()=>openAnimalStatusV11(id);head.insertBefore(b,close||null)}const firstCard=m.querySelector('.v5-journey-card');if(firstCard&&!m.querySelector('.v11-status-strip')){const evs=(state.animalStatusEvents||[]).filter(e=>e.animalId===id).slice().sort((x,y)=>(y.createdAt||'').localeCompare(x.createdAt||''));const strip=document.createElement('div');strip.className='v11-status-strip';strip.innerHTML=`<div class="text"><strong>الحالة الحالية: ${statusText11(a.status)}</strong><small>${hasActiveCare11(id)?'توجد متابعة علاجية مفتوحة.':'لا توجد متابعة علاجية مفتوحة.'}</small></div><button class="btn small" onclick="openAnimalStatusV11('${id}')">تغيير الحالة</button>`;firstCard.before(strip);if(evs.length){const hist=document.createElement('details');hist.className='v5-advanced';hist.innerHTML=`<summary class="small muted" style="cursor:pointer">سجل تغير الحالة (${evs.length})</summary><div class="v11-status-history">${evs.slice(0,12).map(e=>`<div class="v11-status-event"><strong>${statusText11(e.from)} ← ${statusText11(e.to)}</strong><span>${e.date}${e.reason?' • '+esc11(e.reason):''}</span></div>`).join('')}</div>`;strip.after(hist)}}};

  /* Add status events to the existing animal journey without erasing older medical events. */
  if(typeof window.animalEventsV5==='function'){
    const oldEvents11=window.animalEventsV5;
    window.animalEventsV5=function(a){const base=oldEvents11(a),extra=(state.animalStatusEvents||[]).filter(x=>x.animalId===a.id).map(x=>({date:x.date,createdAt:x.createdAt,type:'status',icon:'↻',title:'تغير حالة الحيوان',summary:`${statusText11(x.from)} ← ${statusText11(x.to)}`,details:x.reason||''}));return base.concat(extra).sort((x,y)=>{const d=(x.date||'').localeCompare(y.date||'');if(d)return d;return (x.createdAt||'').localeCompare(y.createdAt||'')})}
  }
})();
</script>
</body></html>
