</style></head><body><div id="app"></div><script>const fmt = n => new Intl.NumberFormat('ar-SD').format(Math.round(Number(n)||0));
const pct = n => `${Number(n||0).toFixed(1)}%`;
const today = () => new Date().toISOString().slice(0,10);

let state = JSON.parse(localStorage.getItem('fatteningGuideState')||'null') || seed;
function save(){ localStorage.setItem('fatteningGuideState',JSON.stringify(state)); }
function client(){ return state.clients.find(c=>c.id===state.currentClientId)||state.clients[0]; }
function plan(id=state.currentPlanId){ return state.plans.find(p=>p.id===id); }
function planAnimals(pid){ return state.animals.filter(a=>a.planId===pid); }
function planFeeds(pid){ return state.feeds.filter(x=>x.planId===pid); }
function planTreatments(pid){ return state.treatments.filter(x=>x.planId===pid); }
function planExpenses(pid){ return state.expenses.filter(x=>x.planId===pid); }
function planSales(pid){ return state.sales.filter(x=>x.planId===pid); }
function stats(p){
  const animals=planAnimals(p.id), buy=animals.reduce((s,a)=>s+a.buyPrice,0);
  const feedUsed=planFeeds(p.id).reduce((s,f)=>s+f.usedKg*f.unitCost,0);
  const treatment=planTreatments(p.id).reduce((s,t)=>s+t.usedCost,0);
  const other=planExpenses(p.id).filter(e=>e.type!=='علاج').reduce((s,e)=>s+e.amount,0);
  const total=buy+feedUsed+treatment+other;
  const required=total*(1+p.profitTarget/100);
  const actualSales=planSales(p.id).reduce((s,x)=>s+x.amount-x.fees,0);
  const expected=p.expectedSale||0;
  const profit=expected-total;
  const soldIds=new Set(planSales(p.id).flatMap(s=>s.animalIds));
  return {animals,buy,feedUsed,treatment,other,total,required,actualSales,expected,profit,sold:soldIds.size,remaining:animals.length-soldIds.size};
}
function daysPassed(p){ return Math.max(0,Math.floor((new Date()-new Date(p.start))/(86400000))); }
function statusBadge(s){ return s==='active'?'<span class="badge active"><i class="dot-inline"></i>نشطة</span>':s==='selling'?'<span class="badge sell"><i class="dot-inline"></i>مرحلة البيع</span>':s==='closed'?'<span class="badge closed"><i class="dot-inline"></i>مكتملة</span>':'<span class="badge">مسودة</span>'; }
function animalStatus(s){ return s==='treatment'?'<span class="badge treat">تحت علاج</span>':s==='sold'?'<span class="badge closed">مباع</span>':'<span class="badge active">طبيعي</span>'; }
function route(page){ state.currentPage=page; save(); render(); closeMenu(); }
function setRole(role){ state.role=role; state.currentPage='dashboard'; save(); render(); }
function openPlan(id){ state.currentPlanId=id; state.planTab='overview'; state.currentPage='plan'; save(); render(); }
function setTab(tab){ state.planTab=tab; save(); render(); }
function closeMenu(){ document.querySelector('.sidebar')?.classList.remove('open');document.querySelector('.sidebar-backdrop')?.classList.remove('open'); }
function toggleMenu(){ document.querySelector('.sidebar')?.classList.toggle('open');document.querySelector('.sidebar-backdrop')?.classList.toggle('open'); }

function layout(body,title,sub=''){
  const navClient=[['dashboard','⌂','الرئيسية'],['plans','▣','خططي'],['daily','✎','السجل اليومي'],['feeds','◫','الأعلاف'],['treatments','✚','العلاجات'],['expenses','◒','المصروفات'],['sales','↗','البيع'],['reports','▥','التقارير']];
  const navAdmin=[['dashboard','⌂','لوحة الإدارة'],['clients','♟','العملاء'],['plans','▣','الخطط'],['daily','✎','السجل اليومي'],['expenses','◒','المصروفات'],['reports','▥','التقارير العامة']];
  const nav=state.role==='admin'?navAdmin:navClient;
  return `<div class="app"><div class="sidebar-backdrop" onclick="closeMenu()"></div><aside class="sidebar">
    <div class="brand"><div class="brand-badge">🐄</div><div><h1>إدارة التسمين</h1><p>متابعة التكلفة والنمو والربحية</p></div></div>
    <div class="nav-section">القائمة الرئيسية</div>${nav.map(n=>`<button class="nav-btn ${state.currentPage===n[0]?'active':''}" onclick="route('${n[0]}')"><span>${n[1]}</span><span>${n[2]}</span></button>`).join('')}
    ${state.role==='admin'?`<div class="nav-section">الإدارة</div><button class="nav-btn"><span>⚙</span><span>إدارة المستخدمين</span></button>`:''}
  </aside><main class="main"><header class="topbar"><div style="display:flex;align-items:center;gap:12px"><button class="mobile-toggle" onclick="toggleMenu()">☰</button><div><div class="topbar-title">${title}</div><div class="topbar-sub">${sub}</div></div></div>

function dashboard(){
  if(state.role==='admin') return adminDashboard();
  const ps=state.plans.filter(p=>p.clientId===state.currentClientId), active=ps.filter(p=>p.status==='active'||p.status==='selling');
  const agg=active.reduce((a,p)=>{const s=stats(p);a.animals+=s.remaining;a.cost+=s.total;a.expected+=s.expected;a.profit+=s.profit;return a},{animals:0,cost:0,expected:0,profit:0});
  const body=`<div class="page-head"><div><h2>مرحبًا، ${client().name}</h2><p>هذه صورة سريعة عن خطط التسمين الخاصة بك اليوم.</p></div><div class="actions"><button class="btn primary" onclick="openPlanModal()">+ إنشاء خطة تسمين</button></div></div>
  <div class="grid metrics"><div class="metric"><div class="label">الخطط النشطة</div><div class="value">${active.length}</div><div class="note">من أصل ${ps.length} خطة</div></div><div class="metric"><div class="label">الحيوانات الحالية</div><div class="value">${agg.animals}</div><div class="note">في الخطط النشطة</div></div><div class="metric"><div class="label">إجمالي التكلفة الحالية</div><div class="value">${fmt(agg.cost)}</div><div class="note">شراء + علف + علاج + مصروفات</div></div><div class="metric hero"><div class="label">البيع المتوقع</div><div class="value">${fmt(agg.expected)}</div><div class="note">حسب تقديرات الخطط الحالية</div></div><div class="metric good"><div class="label">الربح المتوقع</div><div class="value">${fmt(agg.profit)}</div><div class="note">قبل إغلاق الخطط</div></div></div>
  <div class="split"><div class="card"><div class="section-title"><h3>خططي النشطة</h3><button class="btn small" onclick="route('plans')">عرض الكل</button></div><div class="plan-grid">${active.map(planCard).join('')||empty('لا توجد خطط نشطة')}</div></div>
  <div class="card"><h3>يحتاج انتباهك</h3><div class="alerts"><div class="alert danger"><span class="dot"></span><div><strong>الحيوان 002 تحت العلاج</strong><small>لديه جرعة علاجية تحتاج متابعة اليوم.</small></div></div><div class="alert"><span class="dot"></span><div><strong>مراجعة مخزون العلف</strong><small>العلف المركز المتبقي أقل من نصف الكمية المشتراة.</small></div></div><div class="alert good"><span class="dot"></span><div><strong>الأوزان محدثة</strong><small>تم تسجيل أوزان المجموعة الرئيسية اليوم.</small></div></div></div></div></div>`;
  return layout(body,'لوحة العميل','تابع خططك وتكلفتك وربحك المتوقع');
}
function adminDashboard(){
  const active=state.plans.filter(p=>p.status==='active'||p.status==='selling'); const costs=active.reduce((s,p)=>s+stats(p).total,0);
  const body=`<div class="page-head"><div><h2>لوحة الإدارة</h2><p>متابعة العملاء والخطط والتدخل عند تعثر العميل.</p></div><div class="actions"><button class="btn" onclick="openClientModal()">+ إضافة عميل</button><button class="btn primary" onclick="openPlanModal(true)">+ إنشاء خطة لعميل</button></div></div>
  <div class="grid metrics"><div class="metric"><div class="label">العملاء</div><div class="value">${state.clients.length}</div><div class="note">${state.clients.filter(c=>c.active).length} نشط</div></div><div class="metric"><div class="label">الخطط النشطة</div><div class="value">${active.length}</div></div><div class="metric"><div class="label">الحيوانات الحالية</div><div class="value">${active.reduce((s,p)=>s+stats(p).remaining,0)}</div></div><div class="metric hero"><div class="label">تكلفة الخطط النشطة</div><div class="value">${fmt(costs)}</div></div><div class="metric"><div class="label">الخطط المكتملة</div><div class="value">${state.plans.filter(p=>p.status==='closed').length}</div></div></div>
  <div class="split"><div class="card"><div class="section-title"><h3>الخطط النشطة</h3><button class="btn small" onclick="route('plans')">كل الخطط</button></div><div class="table-wrap"><table><thead><tr><th>الخطة</th><th>العميل</th><th>الحيوانات</th><th>التكلفة</th><th>الحالة</th><th></th></tr></thead><tbody>${active.map(p=>`<tr><td><strong>${p.name}</strong></td><td>${state.clients.find(c=>c.id===p.clientId)?.name||'-'}</td><td>${stats(p).animals.length}</td><td>${fmt(stats(p).total)}</td><td>${statusBadge(p.status)}</td><td><button class="btn small" onclick="openPlan('${p.id}')">فتح</button></td></tr>`).join('')}</tbody></table></div></div><div class="card"><h3>تنبيهات الإدارة</h3><div class="alerts"><div class="alert danger"><span class="dot"></span><div><strong>حالة علاج تحتاج متابعة</strong><small>محمد أحمد — دورة أغسطس — الحيوان 002.</small></div></div><div class="alert"><span class="dot"></span><div><strong>عميل غير نشط</strong><small>يمكن للأدمن تحديث بياناته أو مساعدته في الدخول.</small></div></div></div></div></div>`;
  return layout(body,'لوحة الإدارة','نظرة شاملة على العملاء والخطط');
}
function planCard(p){const s=stats(p), progress=Math.min(100,Math.round(daysPassed(p)/p.duration*100));return `<div class="plan-card"><div class="plan-top"><div><h3>${p.name}</h3><div class="small muted">${p.sellPlace} • ${p.duration} يوم</div></div>${statusBadge(p.status)}</div><div class="progress"><i style="width:${progress}%"></i></div><div class="small muted" style="margin-top:6px">${progress}% من المدة المتوقعة</div><div class="plan-numbers"><div class="plan-number"><span>الحيوانات</span><strong>${s.remaining}</strong></div><div class="plan-number"><span>التكلفة الحالية</span><strong>${fmt(s.total)}</strong></div><div class="plan-number"><span>البيع المطلوب</span><strong>${fmt(s.required)}</strong></div><div class="plan-number"><span>الربح المتوقع</span><strong class="${s.profit>=0?'money-positive':'money-negative'}">${fmt(s.profit)}</strong></div></div><div class="plan-footer"><span class="small muted">الربح المستهدف ${p.profitTarget}%</span><button class="btn soft small" onclick="openPlan('${p.id}')">فتح الخطة ←</button></div></div>`}
function plansPage(){
 const ps=state.role==='admin'?state.plans:state.plans.filter(p=>p.clientId===state.currentClientId);
 const body=`<div class="page-head"><div><h2>${state.role==='admin'?'إدارة الخطط':'خططي'}</h2><p>${state.role==='admin'?'جميع خطط العملاء في مكان واحد.':'أنشئ أكثر من خطة وتابع ربحية كل خطة بشكل مستقل.'}</p></div><button class="btn primary" onclick="openPlanModal(${state.role==='admin'})">+ خطة جديدة</button></div><div class="pillbar" style="margin-bottom:15px"><span class="pill active">الكل ${ps.length}</span><span class="pill">نشطة ${ps.filter(p=>p.status==='active').length}</span><span class="pill">مكتملة ${ps.filter(p=>p.status==='closed').length}</span></div><div class="plan-grid">${ps.map(planCard).join('')}</div>`;
 return layout(body,state.role==='admin'?'الخطط':'خططي','كل خطة مستقلة في تكلفتها وبيعها وربحها');
}
function clientsPage(){
 const rows=state.clients.map(c=>{const ps=state.plans.filter(p=>p.clientId===c.id),a=ps.filter(p=>p.status==='active').length;return `<tr><td><strong>${c.name}</strong><div class="small muted">${c.city}</div></td><td>${c.phone}</td><td>${ps.length}</td><td>${a}</td><td>${c.active?'<span class="badge active">نشط</span>':'<span class="badge closed">غير نشط</span>'}</td><td><button class="btn small" onclick="impersonate('${c.id}')">فتح العميل</button></td></tr>`}).join('');
 const body=`<div class="page-head"><div><h2>العملاء</h2><p>الأدمن يستطيع إضافة العميل وإدارة خططه نيابة عنه عند الحاجة.</p></div><button class="btn primary" onclick="openClientModal()">+ إضافة عميل</button></div><div class="card"><div class="table-wrap"><table><thead><tr><th>العميل</th><th>الجوال</th><th>الخطط</th><th>النشطة</th><th>الحالة</th><th></th></tr></thead><tbody>${rows}</tbody></table></div></div>`;return layout(body,'العملاء','إدارة حسابات وملفات العملاء');
}
function impersonate(id){state.currentClientId=id;state.role='client';state.currentPage='dashboard';save();render();}
function planPage(){const p=plan(); if(!p)return plansPage(); const s=stats(p); const tabs=[['overview','نظرة عامة'],['animals','الحيوانات'],['daily','السجل اليومي'],['feeds','الأعلاف'],['treatments','العلاجات'],['expenses','المصروفات'],['sales','البيع'],['reports','التقارير']];
 const head=`<div class="plan-summary"><div class="row"><div><div style="margin-bottom:9px">${statusBadge(p.status)}</div><h2>${p.name}</h2><p>${state.clients.find(c=>c.id===p.clientId)?.name} • البداية ${p.start} • مكان البيع المتوقع: ${p.sellPlace}</p></div><div class="actions"><button class="btn" onclick="openExpenseModal('${p.id}')">+ مصروف</button><button class="btn" onclick="openDailyModal('${p.id}')">+ تسجيل يومي</button><button class="btn primary" onclick="openSaleModal('${p.id}')">تسجيل بيع</button></div></div><div class="kpis"><div class="kpi"><span>إجمالي التكلفة</span><strong>${fmt(s.total)}</strong></div><div class="kpi"><span>البيع المطلوب لتحقيق ${p.profitTarget}%</span><strong>${fmt(s.required)}</strong></div><div class="kpi"><span>البيع المتوقع حاليًا</span><strong>${fmt(s.expected)}</strong></div><div class="kpi"><span>الربح المتوقع</span><strong>${fmt(s.profit)}</strong></div></div></div><div class="tabs">${tabs.map(t=>`<button class="tab ${state.planTab===t[0]?'active':''}" onclick="setTab('${t[0]}')">${t[1]}</button>`).join('')}</div>`;
 return layout(head+tabContent(p,s),p.name,'مركز إدارة دورة التسمين');}
function tabContent(p,s){if(state.planTab==='animals')return animalsTab(p);if(state.planTab==='daily')return dailyTab(p);if(state.planTab==='feeds')return feedsTab(p);if(state.planTab==='treatments')return treatmentsTab(p);if(state.planTab==='expenses')return expensesTab(p);if(state.planTab==='sales')return salesTab(p);if(state.planTab==='reports')return reportsTab(p);return overviewTab(p,s)}
function overviewTab(p,s){return `<div class="grid metrics"><div class="metric"><div class="label">الحيوانات الحالية</div><div class="value">${s.remaining}</div><div class="note">${s.sold} مباع</div></div><div class="metric"><div class="label">شراء الحيوانات</div><div class="value">${fmt(s.buy)}</div></div><div class="metric"><div class="label">العلف المستهلك</div><div class="value">${fmt(s.feedUsed)}</div></div><div class="metric"><div class="label">العلاجات المستخدمة</div><div class="value">${fmt(s.treatment)}</div></div><div class="metric"><div class="label">مصروفات أخرى</div><div class="value">${fmt(s.other)}</div></div></div><div class="split"><div class="card"><div class="section-title"><h3>الحيوانات</h3><button class="btn small" onclick="setTab('animals')">عرض الكل</button></div>${animalTable(p,true)}</div><div class="card"><h3>آخر النشاطات</h3><div class="timeline"><div class="event"><div class="line"></div><div class="event-body"><strong>تم تحديث أوزان الحيوانات</strong><small>12 أغسطس 2026</small></div></div><div class="event"><div class="line"></div><div class="event-body"><strong>إضافة علاج للحيوان 002</strong><small>11 أغسطس 2026</small></div></div><div class="event"><div class="line"></div><div class="event-body"><strong>شراء علف مركز</strong><small>1 أغسطس 2026</small></div></div></div></div></div>`}
function animalTable(p,limit=false){let a=planAnimals(p.id);if(limit)a=a.slice(0,5);return `<div class="table-wrap"><table><thead><tr><th>الحيوان</th><th>وزن الشراء</th><th>آخر وزن</th><th>الزيادة</th><th>الحالة</th><th></th></tr></thead><tbody>${a.map(x=>{const last=x.weights.at(-1)?.value||x.buyWeight;return `<tr><td><strong>#${x.tag}</strong>${x.pinnedNote?'<div class="small muted">📌 لديه ملاحظة مهمة</div>':''}</td><td>${x.buyWeight} كجم</td><td>${last} كجم</td><td class="money-positive">+${last-x.buyWeight} كجم</td><td>${animalStatus(x.status)}</td><td><button class="btn small" onclick="openAnimal('${x.id}')">فتح</button></td></tr>`}).join('')}</tbody></table></div>`}
function animalsTab(p){return `<div class="card"><div class="section-title"><div><h3>حيوانات الخطة</h3><div class="small muted">السجل الأولي منفصل عن السجلات اليومية.</div></div><button class="btn primary small" onclick="openAnimalModal('${p.id}')">+ إضافة حيوان</button></div>${animalTable(p)}</div>`}
function dailyTab(p){const rows=state.daily.filter(d=>d.planId===p.id).map(d=>`<tr><td>${d.date}</td><td>${d.entries.length}</td><td>${d.note||'-'}</td><td><button class="btn small" onclick="openDailyModal('${p.id}')">إضافة سجل جديد</button></td></tr>`).join('');return `<div class="card"><div class="section-title"><div><h3>السجل اليومي للمجموعة</h3><div class="small muted">سجل الوزن والحالة والملاحظة للحيوانات دون تكرار فتح كل ملف.</div></div><button class="btn primary small" onclick="openDailyModal('${p.id}')">+ تسجيل يومي</button></div><div class="table-wrap"><table><thead><tr><th>التاريخ</th><th>الحيوانات المحدثة</th><th>ملاحظة المجموعة</th><th></th></tr></thead><tbody>${rows||'<tr><td colspan="4">لا توجد سجلات يومية بعد.</td></tr>'}</tbody></table></div></div>`}
function feedsTab(p){const fs=planFeeds(p.id),purchased=fs.reduce((s,f)=>s+f.qtyKg*f.unitCost,0),used=fs.reduce((s,f)=>s+f.usedKg*f.unitCost,0);return `<div class="grid metrics"><div class="metric"><div class="label">قيمة المشتريات</div><div class="value">${fmt(purchased)}</div></div><div class="metric"><div class="label">العلف المستهلك</div><div class="value">${fmt(used)}</div></div><div class="metric"><div class="label">قيمة المخزون المتبقي</div><div class="value">${fmt(purchased-used)}</div></div></div><div class="card"><div class="section-title"><div><h3>مخزون الأعلاف</h3><div class="small muted">نفصل بين شراء العلف واستهلاكه الفعلي.</div></div><button class="btn primary small" onclick="openFeedModal('${p.id}')">+ شراء علف</button></div><div class="table-wrap"><table><thead><tr><th>العلف</th><th>المشتَرى</th><th>المستهلك</th><th>المتبقي</th><th>تكلفة المستهلك</th></tr></thead><tbody>${fs.map(f=>`<tr><td><strong>${f.name}</strong></td><td>${f.qtyKg} كجم</td><td>${f.usedKg} كجم</td><td>${f.qtyKg-f.usedKg} كجم</td><td>${fmt(f.usedKg*f.unitCost)}</td></tr>`).join('')}</tbody></table></div></div>`}
function treatmentsTab(p){const ts=planTreatments(p.id);return `<div class="card"><div class="section-title"><div><h3>العلاجات والمتابعة</h3><div class="small muted">يمكن ربط العلاج بحيوان واحد أو مجموعة حيوانات.</div></div><button class="btn primary small" onclick="openTreatmentModal('${p.id}')">+ تسجيل علاج</button></div><div class="table-wrap"><table><thead><tr><th>العلاج</th><th>الحيوانات</th><th>البداية</th><th>المدة</th><th>الحالة</th><th>التكلفة المستخدمة</th></tr></thead><tbody>${ts.map(t=>`<tr><td><strong>${t.name}</strong><div class="small muted">${t.reason}</div></td><td>${t.animalIds.map(id=>'#'+state.animals.find(a=>a.id===id)?.tag).join('، ')}</td><td>${t.start}</td><td>${t.days} يوم</td><td>${t.status==='active'?'<span class="badge treat">مستمر</span>':'<span class="badge active">مكتمل</span>'}</td><td>${fmt(t.usedCost)}</td></tr>`).join('')}</tbody></table></div></div>`}
function expensesTab(p){const es=planExpenses(p.id);return `<div class="card"><div class="section-title"><div><h3>مصروفات الخطة</h3><div class="small muted">كل مصروف مرتبط بالخطة، ويمكن تخصيصه للمجموعة أو الحيوان.</div></div><button class="btn primary small" onclick="openExpenseModal('${p.id}')">+ إضافة مصروف</button></div><div class="table-wrap"><table><thead><tr><th>التاريخ</th><th>النوع</th><th>النطاق</th><th>الوصف</th><th>المبلغ</th></tr></thead><tbody>${es.map(e=>`<tr><td>${e.date}</td><td>${e.type}</td><td>${e.scope==='animal'?'حيوان '+(state.animals.find(a=>a.id===e.animalId)?.tag||''):'الخطة كاملة'}</td><td>${e.desc}</td><td><strong>${fmt(e.amount)}</strong></td></tr>`).join('')}</tbody></table></div></div>`}
function salesTab(p){const ss=planSales(p.id),s=stats(p);return `<div class="grid metrics"><div class="metric"><div class="label">الحيوانات المباعة</div><div class="value">${s.sold}</div></div><div class="metric"><div class="label">الإيراد المحقق</div><div class="value">${fmt(s.actualSales)}</div></div><div class="metric"><div class="label">الحيوانات المتبقية</div><div class="value">${s.remaining}</div></div></div><div class="card"><div class="section-title"><div><h3>عمليات البيع</h3><div class="small muted">البيع الجزئي لا يغلق الخطة.</div></div><button class="btn primary small" onclick="openSaleModal('${p.id}')">+ تسجيل بيع</button></div><div class="table-wrap"><table><thead><tr><th>التاريخ</th><th>الحيوانات</th><th>المكان</th><th>المشتري</th><th>صافي البيع</th></tr></thead><tbody>${ss.map(x=>`<tr><td>${x.date}</td><td>${x.animalIds.map(id=>'#'+state.animals.find(a=>a.id===id)?.tag).join('، ')}</td><td>${x.place}</td><td>${x.buyer||'-'}</td><td class="money-positive">${fmt(x.amount-x.fees)}</td></tr>`).join('')||'<tr><td colspan="5">لم يتم تسجيل مبيعات لهذه الخطة بعد.</td></tr>'}</tbody></table></div></div>`}
function reportsTab(p){const s=stats(p);return `<div class="grid metrics"><div class="metric"><div class="label">إجمالي التكلفة</div><div class="value">${fmt(s.total)}</div></div><div class="metric"><div class="label">البيع المتوقع</div><div class="value">${fmt(s.expected)}</div></div><div class="metric good"><div class="label">الربح المتوقع</div><div class="value">${fmt(s.profit)}</div></div><div class="metric"><div class="label">العلف من التكلفة</div><div class="value">${s.total?pct(s.feedUsed/s.total*100):'0%'}</div></div><div class="metric"><div class="label">العلاجات من التكلفة</div><div class="value">${s.total?pct(s.treatment/s.total*100):'0%'}</div></div></div><div class="card"><h3>مقارنة أداء الحيوانات</h3>${animalTable(p)}</div>`}

function dailyPage(){const ps=state.role==='admin'?state.plans:state.plans.filter(p=>p.clientId===state.currentClientId);return layout(`<div class="page-head"><div><h2>السجل اليومي</h2><p>اختر الخطة أولًا ثم سجل ما حدث للمجموعة أو لحيوان بعينه.</p></div></div><div class="plan-grid">${ps.filter(p=>p.status==='active').map(p=>`<div class="plan-card"><h3>${p.name}</h3><p class="muted small">${planAnimals(p.id).length} حيوان</p><button class="btn primary" onclick="openDailyModal('${p.id}')">إضافة سجل يومي</button></div>`).join('')}</div>`,'السجل اليومي','تسجيل جماعي سريع مع ملاحظات خاصة');}
function feedsPage(){const ps=state.plans.filter(p=>p.clientId===state.currentClientId);return layout(`<div class="page-head"><div><h2>الأعلاف</h2><p>اختر الخطة لمراجعة المخزون والاستهلاك.</p></div></div><div class="plan-grid">${ps.filter(p=>p.status==='active').map(p=>`<div class="plan-card"><h3>${p.name}</h3><p class="muted small">${planFeeds(p.id).length} أصناف علف</p><button class="btn primary" onclick="openPlan('${p.id}');setTab('feeds')">فتح الأعلاف</button></div>`).join('')}</div>`,'الأعلاف','المشتريات والمخزون والاستهلاك');}
function treatmentsPage(){const ps=state.plans.filter(p=>p.clientId===state.currentClientId);return layout(`<div class="page-head"><div><h2>العلاجات</h2><p>العلاجات المبدئية والطارئة والمتابعة.</p></div></div><div class="plan-grid">${ps.filter(p=>p.status==='active').map(p=>`<div class="plan-card"><h3>${p.name}</h3><p class="muted small">${planTreatments(p.id).filter(t=>t.status==='active').length} علاج مستمر</p><button class="btn primary" onclick="openPlan('${p.id}');setTab('treatments')">فتح العلاجات</button></div>`).join('')}</div>`,'العلاجات','الشراء والاستخدام والمتابعة');}
function expensesPage(){const ps=state.role==='admin'?state.plans:state.plans.filter(p=>p.clientId===state.currentClientId);return layout(`<div class="page-head"><div><h2>المصروفات</h2><p>كل مصروف يجب أن يرتبط بخطة محددة.</p></div></div><div class="plan-grid">${ps.map(p=>`<div class="plan-card"><h3>${p.name}</h3><div class="plan-numbers"><div class="plan-number"><span>المصروفات</span><strong>${fmt(planExpenses(p.id).reduce((s,e)=>s+e.amount,0))}</strong></div><div class="plan-number"><span>إجمالي التكلفة</span><strong>${fmt(stats(p).total)}</strong></div></div><button class="btn primary" onclick="openExpenseModal('${p.id}')">+ مصروف لهذه الخطة</button></div>`).join('')}</div>`,'المصروفات','مصروفات مستقلة لكل خطة');}
function salesPage(){const ps=state.plans.filter(p=>p.clientId===state.currentClientId);return layout(`<div class="page-head"><div><h2>البيع</h2><p>سجل البيع الجزئي أو الكامل دون فقد تاريخ الحيوان.</p></div></div><div class="plan-grid">${ps.filter(p=>p.status!=='closed').map(p=>`<div class="plan-card"><h3>${p.name}</h3><div class="plan-numbers"><div class="plan-number"><span>مباع</span><strong>${stats(p).sold}</strong></div><div class="plan-number"><span>متبقي</span><strong>${stats(p).remaining}</strong></div></div><button class="btn primary" onclick="openSaleModal('${p.id}')">تسجيل بيع</button></div>`).join('')}</div>`,'البيع','من المتوقع إلى الربح الفعلي');}
function reportsPage(){const ps=state.role==='admin'?state.plans:state.plans.filter(p=>p.clientId===state.currentClientId);return layout(`<div class="page-head"><div><h2>${state.role==='admin'?'التقارير العامة':'التقارير ومقارنة الخطط'}</h2><p>قارن التكلفة والبيع والربح بين الخطط.</p></div></div><div class="card"><div class="table-wrap"><table><thead><tr><th>الخطة</th>${state.role==='admin'?'<th>العميل</th>':''}<th>الحيوانات</th><th>التكلفة</th><th>البيع المتوقع</th><th>الربح المتوقع</th><th>الربح المستهدف</th></tr></thead><tbody>${ps.map(p=>{const s=stats(p);return `<tr><td><strong>${p.name}</strong></td>${state.role==='admin'?`<td>${state.clients.find(c=>c.id===p.clientId)?.name}</td>`:''}<td>${s.animals.length}</td><td>${fmt(s.total)}</td><td>${fmt(s.expected)}</td><td class="${s.profit>=0?'money-positive':'money-negative'}">${fmt(s.profit)}</td><td>${p.profitTarget}%</td></tr>`}).join('')}</tbody></table></div></div>`,'التقارير','تحليل وربحية الخطط');}
function empty(t){return `<div class="empty"><div class="emoji">📋</div>${t}</div>`}

function modal(html){document.body.insertAdjacentHTML('beforeend',`<div class="modal-backdrop" id="modal"><div class="modal">${html}</div></div>`)}function closeModal(){document.getElementById('modal')?.remove()}
function openPlanModal(admin=false){modal(`<div class="modal-head"><div><h3>إنشاء خطة تسمين جديدة</h3><div class="small muted">البيانات الأساسية فقط، وباقي التفاصيل تضاف داخل الخطة.</div></div><button class="close" onclick="closeModal()">×</button></div><form onsubmit="createPlan(event)"><div class="form-grid">${admin?`<div class="field"><label>العميل</label><select name="clientId" required>${state.clients.map(c=>`<option value="${c.id}">${c.name}</option>`).join('')}</select></div>`:''}<div class="field"><label>اسم الخطة</label><input name="name" placeholder="مثال: دورة تسمين سبتمبر" required></div><div class="field"><label>تاريخ البداية</label><input name="start" type="date" value="${today()}" required></div><div class="field"><label>مدة الدورة المتوقعة بالأيام</label><input name="duration" type="number" value="90" min="1" required></div><div class="field"><label>مكان البيع المتوقع</label><input name="sellPlace" placeholder="مثال: سوق مدني" required></div><div class="field"><label>نسبة الربح المستهدفة %</label><input name="profit" type="number" value="20" min="0" step=".1" required></div><div class="field"><label>البيع المتوقع حاليًا</label><input name="expected" type="number" min="0" placeholder="يمكن تحديثه لاحقًا"></div></div><div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">إلغاء</button><button class="btn primary">إنشاء الخطة</button></div></form>`)}
function createPlan(ev){ev.preventDefault();const f=new FormData(ev.target),p={id:uid('p'),clientId:f.get('clientId')||state.currentClientId,name:f.get('name'),start:f.get('start'),duration:+f.get('duration'),sellPlace:f.get('sellPlace'),profitTarget:+f.get('profit'),status:'active',expectedSale:+f.get('expected')||0,groups:[{id:uid('g'),name:'المجموعة الرئيسية'}]};state.plans.push(p);state.currentPlanId=p.id;save();closeModal();openPlan(p.id)}
function openClientModal(){modal(`<div class="modal-head"><h3>إضافة عميل</h3><button class="close" onclick="closeModal()">×</button></div><form onsubmit="createClient(event)"><div class="form-grid"><div class="field"><label>اسم العميل</label><input name="name" required></div><div class="field"><label>رقم الجوال</label><input name="phone" required></div><div class="field"><label>المدينة / المنطقة</label><input name="city"></div><div class="field"><label>الحالة</label><select name="active"><option value="1">نشط</option><option value="0">غير نشط</option></select></div></div><div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">إلغاء</button><button class="btn primary">حفظ العميل</button></div></form>`)}
function createClient(ev){ev.preventDefault();const f=new FormData(ev.target);state.clients.push({id:uid('c'),name:f.get('name'),phone:f.get('phone'),city:f.get('city'),active:f.get('active')==='1'});save();closeModal();render()}
function openExpenseModal(pid){const p=plan(pid),as=planAnimals(pid);modal(`<div class="modal-head"><div><h3>إضافة مصروف</h3><div class="small muted">${p.name}</div></div><button class="close" onclick="closeModal()">×</button></div><form onsubmit="createExpense(event,'${pid}')"><div class="form-grid"><div class="field"><label>نوع المصروف</label><select name="type"><option>نقل</option><option>عمالة</option><option>إيجار</option><option>عمولة</option><option>صيانة</option><option>علاج</option><option>أخرى</option></select></div><div class="field"><label>المبلغ</label><input name="amount" type="number" min="0" required></div><div class="field"><label>التاريخ</label><input name="date" type="date" value="${today()}" required></div><div class="field"><label>نطاق المصروف</label><select name="scope" onchange="this.form.animalId.disabled=this.value!=='animal'"><option value="plan">الخطة كاملة</option><option value="animal">حيوان معين</option></select></div><div class="field"><label>الحيوان</label><select name="animalId" disabled><option value="">اختر</option>${as.map(a=>`<option value="${a.id}">#${a.tag}</option>`).join('')}</select></div><div class="field full"><label>الوصف / الملاحظة</label><textarea name="desc" placeholder="سبب أو تفاصيل المصروف"></textarea></div></div><div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">إلغاء</button><button class="btn primary">حفظ المصروف وتحديث الحسابات</button></div></form>`)}
function createExpense(ev,pid){ev.preventDefault();const f=new FormData(ev.target);state.expenses.push({id:uid('e'),planId:pid,type:f.get('type'),amount:+f.get('amount'),date:f.get('date'),scope:f.get('scope'),animalId:f.get('animalId')||null,desc:f.get('desc')});save();closeModal();render()}
function openDailyModal(pid){const as=planAnimals(pid).filter(a=>a.status!=='sold');modal(`<div class="modal-head"><div><h3>السجل اليومي</h3><div class="small muted">${plan(pid).name} — املأ فقط ما حدث اليوم.</div></div><button class="close" onclick="closeModal()">×</button></div><form onsubmit="createDaily(event,'${pid}')"><div class="field" style="margin-bottom:14px"><label>التاريخ</label><input name="date" type="date" value="${today()}"></div><div class="table-wrap"><table><thead><tr><th>الحيوان</th><th>الوزن</th><th>الحالة</th><th>ملاحظة خاصة</th></tr></thead><tbody>${as.map(a=>`<tr><td><strong>#${a.tag}</strong></td><td><input style="width:90px" name="weight_${a.id}" type="number" step=".1" placeholder="كجم"></td><td><select name="status_${a.id}"><option value="">بدون تغيير</option><option value="normal">طبيعي</option><option value="treatment">يحتاج متابعة</option></select></td><td><input name="note_${a.id}" placeholder="ملاحظة خاصة بالحيوان"></td></tr>`).join('')}</tbody></table></div><div class="field" style="margin-top:14px"><label>ملاحظة عامة للمجموعة</label><textarea name="groupNote" placeholder="مثال: تم تغيير نوع العلف اليوم"></textarea></div><div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">إلغاء</button><button class="btn primary">حفظ السجل اليومي</button></div></form>`)}
function createDaily(ev,pid){ev.preventDefault();const f=new FormData(ev.target),entries=[];for(const a of planAnimals(pid)){const w=f.get('weight_'+a.id),st=f.get('status_'+a.id),n=f.get('note_'+a.id);if(w||st||n){entries.push({animalId:a.id,weight:w?+w:null,status:st||a.status,note:n||''});if(w)a.weights.push({date:f.get('date'),value:+w});if(st)a.status=st;if(n)a.notes.push({date:f.get('date'),text:n});}}state.daily.push({id:uid('d'),planId:pid,date:f.get('date'),note:f.get('groupNote'),entries});save();closeModal();render()}
function openAnimalModal(pid){const g=plan(pid).groups[0];modal(`<div class="modal-head"><div><h3>إضافة حيوان — السجل الأولي</h3><div class="small muted">هذه البيانات تسجل مرة واحدة ولا تخلط مع السجل اليومي.</div></div><button class="close" onclick="closeModal()">×</button></div><form onsubmit="createAnimal(event,'${pid}','${g.id}')"><div class="form-grid"><div class="field"><label>رقم الحيوان</label><input name="tag" required></div><div class="field"><label>تاريخ الشراء</label><input name="buyDate" type="date" value="${today()}" required></div><div class="field"><label>مكان الشراء</label><input name="buyPlace" required></div><div class="field"><label>وزن الشراء كجم</label><input name="weight" type="number" step=".1" required></div><div class="field"><label>سعر الشراء</label><input name="price" type="number" required></div><div class="field"><label>السلالة</label><input name="breed"></div><div class="field"><label>الجنس</label><select name="sex"><option>ذكر</option><option>أنثى</option></select></div><div class="field full"><label>ملاحظة مهمة مثبتة</label><textarea name="note" placeholder="اختياري — تظهر أعلى ملف الحيوان"></textarea></div></div><div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">إلغاء</button><button class="btn primary">إضافة الحيوان</button></div></form>`)}
function createAnimal(ev,pid,gid){ev.preventDefault();const f=new FormData(ev.target),w=+f.get('weight'),d=f.get('buyDate');state.animals.push({id:uid('a'),planId:pid,groupId:gid,tag:f.get('tag'),buyDate:d,buyPlace:f.get('buyPlace'),buyWeight:w,buyPrice:+f.get('price'),breed:f.get('breed'),sex:f.get('sex'),status:'normal',pinnedNote:f.get('note'),weights:[{date:d,value:w}],notes:[]});save();closeModal();render()}
function openAnimal(id){const a=state.animals.find(x=>x.id===id),p=plan(a.planId),last=a.weights.at(-1)?.value||a.buyWeight;modal(`<div class="modal-head"><div class="animal-head"><div class="animal-icon">🐂</div><div><h3 style="margin:0">الحيوان #${a.tag}</h3><div class="small muted">${p.name} • ${animalStatus(a.status)}</div></div></div><button class="close" onclick="closeModal()">×</button></div>${a.pinnedNote?`<div class="note-pin">📌 <strong>ملاحظة مهمة:</strong> ${a.pinnedNote}</div>`:''}<div class="grid metrics" style="margin-top:15px"><div class="metric"><div class="label">وزن الشراء</div><div class="value">${a.buyWeight}</div><div class="note">كجم</div></div><div class="metric"><div class="label">آخر وزن</div><div class="value">${last}</div><div class="note">كجم</div></div><div class="metric good"><div class="label">إجمالي الزيادة</div><div class="value">+${last-a.buyWeight}</div><div class="note">كجم</div></div></div><div class="card" style="box-shadow:none;margin-top:12px"><h3>السجل الأولي الثابت</h3><div class="form-grid"><div><div class="small muted">تاريخ الشراء</div><strong>${a.buyDate}</strong></div><div><div class="small muted">مكان الشراء</div><strong>${a.buyPlace}</strong></div><div><div class="small muted">سعر الشراء</div><strong>${fmt(a.buyPrice)}</strong></div><div><div class="small muted">السلالة / الجنس</div><strong>${a.breed||'-'} / ${a.sex}</strong></div></div></div><div class="card" style="box-shadow:none;margin-top:12px"><h3>الملاحظات اليومية</h3>${a.notes.length?a.notes.slice().reverse().map(n=>`<div class="alert good"><span class="dot"></span><div><strong>${n.date}</strong><small>${n.text}</small></div></div>`).join(''):empty('لا توجد ملاحظات يومية')}</div>`)}
function openFeedModal(pid){modal(`<div class="modal-head"><h3>شراء علف</h3><button class="close" onclick="closeModal()">×</button></div><form onsubmit="createFeed(event,'${pid}')"><div class="form-grid"><div class="field"><label>نوع العلف</label><input name="name" required></div><div class="field"><label>الكمية بالكيلو</label><input name="qty" type="number" required></div><div class="field"><label>تكلفة الكيلو</label><input name="cost" type="number" required></div><div class="field"><label>تاريخ الشراء</label><input name="date" type="date" value="${today()}"></div></div><div class="modal-actions"><button class="btn" type="button" onclick="closeModal()">إلغاء</button><button class="btn primary">حفظ</button></div></form>`)}
function createFeed(ev,pid){ev.preventDefault();const f=new FormData(ev.target);state.feeds.push({id:uid('f'),planId:pid,name:f.get('name'),qtyKg:+f.get('qty'),unitCost:+f.get('cost'),purchased:f.get('date'),usedKg:0});save();closeModal();render()}
function openTreatmentModal(pid){const as=planAnimals(pid).filter(a=>a.status!=='sold');modal(`<div class="modal-head"><h3>تسجيل علاج</h3><button class="close" onclick="closeModal()">×</button></div><form onsubmit="createTreatment(event,'${pid}')"><div class="form-grid"><div class="field"><label>اسم العلاج</label><input name="name" required></div><div class="field"><label>الحيوان</label><select name="animal" required>${as.map(a=>`<option value="${a.id}">#${a.tag}</option>`).join('')}</select></div><div class="field"><label>تاريخ البداية</label><input name="start" type="date" value="${today()}"></div><div class="field"><label>عدد الأيام</label><input name="days" type="number" value="1" min="1"></div><div class="field"><label>تكلفة الكمية المستخدمة</label><input name="cost" type="number" value="0"></div><div class="field"><label>السبب</label><input name="reason"></div></div><div class="modal-actions"><button class="btn" type="button" onclick="closeModal()">إلغاء</button><button class="btn primary">حفظ العلاج</button></div></form>`)}
function createTreatment(ev,pid){ev.preventDefault();const f=new FormData(ev.target),aid=f.get('animal');state.treatments.push({id:uid('t'),planId:pid,animalIds:[aid],name:f.get('name'),start:f.get('start'),days:+f.get('days'),usedCost:+f.get('cost'),status:'active',reason:f.get('reason')});state.animals.find(a=>a.id===aid).status='treatment';save();closeModal();render()}
function openSaleModal(pid){const as=planAnimals(pid).filter(a=>a.status!=='sold');modal(`<div class="modal-head"><div><h3>تسجيل بيع</h3><div class="small muted">يمكن بيع حيوان واحد الآن وبقية القطيع لاحقًا.</div></div><button class="close" onclick="closeModal()">×</button></div><form onsubmit="createSale(event,'${pid}')"><div class="form-grid"><div class="field"><label>الحيوان</label><select name="animal" required>${as.map(a=>`<option value="${a.id}">#${a.tag}</option>`).join('')}</select></div><div class="field"><label>تاريخ البيع</label><input name="date" type="date" value="${today()}"></div><div class="field"><label>مكان البيع</label><input name="place" value="${plan(pid).sellPlace}"></div><div class="field"><label>طريقة البيع</label><select name="method"><option value="head">بالرأس</option><option value="weight">بالوزن</option></select></div><div class="field"><label>سعر البيع الفعلي</label><input name="amount" type="number" required></div><div class="field"><label>مصروفات البيع</label><input name="fees" type="number" value="0"></div><div class="field"><label>المشتري</label><input name="buyer"></div><div class="field"><label>وزن البيع (اختياري)</label><input name="weight" type="number" step=".1"></div></div><div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">إلغاء</button><button class="btn primary">تسجيل البيع</button></div></form>`)}
function createSale(ev,pid){ev.preventDefault();const f=new FormData(ev.target),aid=f.get('animal'),a=state.animals.find(x=>x.id===aid);state.sales.push({id:uid('s'),planId:pid,animalIds:[aid],date:f.get('date'),place:f.get('place'),method:f.get('method'),amount:+f.get('amount'),fees:+f.get('fees'),buyer:f.get('buyer')});a.status='sold';if(f.get('weight'))a.weights.push({date:f.get('date'),value:+f.get('weight')});save();closeModal();render()}

function render(){let html;switch(state.currentPage){case'plans':html=plansPage();break;case'clients':html=clientsPage();break;case'plan':html=planPage();break;case'daily':html=dailyPage();break;case'feeds':html=feedsPage();break;case'treatments':html=treatmentsPage();break;case'expenses':html=expensesPage();break;case'sales':html=salesPage();break;case'reports':html=reportsPage();break;default:html=dashboard();}document.getElementById('app').innerHTML=html}
render();
</script></body></html>
