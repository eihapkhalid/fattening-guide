function stats(p){
  const animals=planAnimals(p.id), buy=animals.reduce((s,a)=>s+a.buyPrice,0);
  const feedUsed=planFeeds(p.id).reduce((s,f)=>s+f.usedKg*f.unitCost,0);

  const other=planExpenses(p.id).filter(e=>e.type!=='علاج').reduce((s,e)=>s+e.amount,0);
  const total=buy+feedUsed+treatment+other;
  const required=total*(1+p.profitTarget/100);
  const actualSales=planSales(p.id).reduce((s,x)=>s+x.amount-x.fees,0);
  const expected=p.expectedSale||0;
  const profit=expected-total;
  const soldIds=new Set(planSales(p.id).flatMap(s=>s.animalIds));
  return {animals,buy,feedUsed,treatment,other,total,required,actualSales,expected,profit,sold:soldIds.size,remaining:animals.length-soldIds.size};
}
function daysPassed(p){ return Math.max(0,Math.floor((new Date()-new Date(p.start))/(86400000))); }
function cycleDay(p){const now=new Date(today()+'T00:00:00'),start=new Date(p.start+'T00:00:00');if(now<start)return 0;return Math.floor((now-start)/86400000)+1}
function cyclePhase(p){const d=cycleDay(p);if(d===0)return {key:'before',name:'قبل البداية',from:0,to:0};if(d<=21)return {key:'foundation',name:'التأسيس',from:1,to:21};if(d<=66)return {key:'build',name:'بناء اللحم',from:22,to:66};if(d<=90)return {key:'finish',name:'التشطيب',from:67,to:90};if(d<=Math.max(90,p.duration||90))return {key:'extension',name:'تمديد مراقَب',from:91,to:p.duration};return {key:'ended',name:'تجاوز المدة المخططة',from:p.duration,to:p.duration}}
function cycleRemaining(p){return Math.max(0,(p.duration||90)-cycleDay(p)+1)}
function lecture5Target(a,phaseKey){const isCalf=a.animalType==='calf'&&Number(a.buyWeight)===200,isSheep=a.animalType==='sheep'&&Number(a.buyWeight)===20;if(!isCalf&&!isSheep)return null;if(isCalf){const m={foundation:{feed:'من 2 إلى 5 كجم تدريجيًا',gain:'+10 كجم',target:'210 كجم'},build:{feed:'6 كجم يوميًا',gain:'+55 كجم',target:'265 كجم'},finish:{feed:'6 كجم + 1 كجم عيش ناشف مبلول',gain:'+25 كجم',target:'290 كجم'},extension:{feed:'لا توجد وصفة إضافية في المحاضرة',gain:'لا يوجد هدف رقمي موثق',target:'الهدف المرجعي عند اليوم 90: 290 كجم'}};return {kind:'عجل 200 كجم',final:'290 كجم',totalGain:'90 كجم',...(m[phaseKey]||{})}}const m={foundation:{feed:'من 200 إلى 500 جرام تدريجيًا',gain:'+2 كجم',target:'22 كجم'},build:{feed:'600 جرام يوميًا',gain:'+8 كجم',target:'30 كجم'},finish:{feed:'600 جرام + 200 جرام عيش أو مولاس',gain:'+3 كجم',target:'32–35 كجم عند نهاية الدورة'},extension:{feed:'لا توجد وصفة إضافية في المحاضرة',gain:'لا يوجد هدف رقمي موثق',target:'الهدف المرجعي عند اليوم 90: 32–35 كجم'}};return {kind:'خروف 20 كجم',final:'32–35 كجم',totalGain:'12–15 كجم',...(m[phaseKey]||{})}}

  const rows=animals.map(a=>{const last=latestWeightRecord(a),t=lecture5Target(a,ph.key),due=ph.key==='build'&&dayDiff(last.date)>=15;return `<tr><td><strong>#${a.tag}</strong><div class="small muted">${a.animalType==='sheep'?'ضأن':'عجل'} • بداية ${a.buyWeight} كجم</div></td><td>${last.value} كجم<div class="small muted">${last.date}</div></td><td>${t?`<strong>${t.kind}</strong><div class="small">هدف نهاية الدورة: ${t.final}</div>`:'<span class="badge">لا هدف رقمي موثق لهذا الوزن</span>'}</td><td>${t?.feed||'يتبع برنامج التغذية التشغيلي دون استيفاء أرقام'}</td><td>${t?.gain||'-'}${t?.target?`<div class="small muted">هدف المرحلة: ${t.target}</div>`:''}</td><td>${due?'<span class="badge treat">مطلوب وزن الآن — مرّ 15 يومًا</span>':ph.key==='build'?`<span class="badge active">آخر وزن منذ ${dayDiff(last.date)} يوم</span>`:'<span class="badge">الوزن كل 15 يومًا مطلوب في بناء اللحم</span>'}</td></tr>`}).join('');
  const withinWeek=remaining>0&&remaining<=7,withdrawal=animals.filter(a=>activeWithdrawal(a.id));
  return `<div class="grid metrics"><div class="metric hero"><div class="label">اليوم الحالي</div><div class="value">${d||0}</div><div class="note">من ${p.duration} يومًا مخططًا</div></div><div class="metric"><div class="label">المرحلة الحالية</div><div class="value" style="font-size:19px">${ph.name}</div><div class="note">${ph.key==='before'?'لم تبدأ الدورة بعد':ph.key==='extension'?'بعد اليوم 90 — تمديد مراقَب':ph.key==='ended'?'تجاوزت الخطة المدة المحددة':`الأيام ${ph.from}–${ph.to}`}</div></div><div class="metric"><div class="label">المتبقي المخطط</div><div class="value">${remaining}</div><div class="note">يوم</div></div><div class="metric ${marketReady?'good':'warn'}"><div class="label">خطة التسويق</div><div class="value">${marketReady?'مكتملة':'ناقصة'}</div><div class="note">الصحة + التغذية + التسويق = مثلث النجاح</div></div><div class="metric ${withdrawal.length?'warn':'good'}"><div class="label">فترات سحب نشطة</div><div class="value">${withdrawal.length}</div><div class="note">البيع يبقى محظورًا حتى انتهاء الفترة المسجلة</div></div></div>
  <div class="cycle-track">${stages.map(x=>{const done=order.includes(x[0])&&order.indexOf(ph.key)>order.indexOf(x[0]);return `<div class="cycle-step ${ph.key===x[0]?'active':done?'done':x[0]==='extension'&&ph.key==='extension'?'extension':''}"><strong>${x[1]} — ${x[2]}</strong>${x[3]}</div>`}).join('')}</div>
  ${extension?`<div class="alert" style="margin-bottom:16px"><span class="dot"></span><div><strong>مدة الخطة ${p.duration} يومًا: المحاضرة المرجعية 90 يومًا + ${p.duration-90} يوم تمديد</strong><small>الأيام 91–${p.duration} قاعدة تشغيلية بطلب مالك النظام وليست مرحلة رابعة من المحاضرة. لا يختلق النظام لها كمية علف أو زيادة وزن؛ يستمر القياس الفعلي ومراجعة التكلفة والسوق والصحة.</small></div></div>`:''}
  ${ph.key==='foundation'?`<div class="alert good" style="margin-bottom:16px"><span class="dot"></span><div><strong>مرحلة التأسيس 1–21</strong><small>ارفع العلف تدريجيًا ولا تصل للكمية الكاملة فجأة. الهدف فتح الشهية وتهيئة الكرش.</small></div></div>`:''}
  ${ph.key==='build'?`<div class="alert good" style="margin-bottom:16px"><span class="dot"></span><div><strong>مرحلة بناء اللحم 22–66</strong><small>المحاضرة تطلب وزن الحيوان كل 15 يومًا في هذه المرحلة. أرقام 6 كجم للعجل و600 جم للخروف تخص مثالي 200 كجم و20 كجم؛ لا تعمم على أوزان أخرى.</small></div></div>`:''}
  ${ph.key==='finish'?`<div class="alert good" style="margin-bottom:16px"><span class="dot"></span><div><strong>مرحلة التشطيب 67–90</strong><small>استمر على العلف الأساسي، أدخل إضافة التشطيب المذكورة تدريجيًا، لا تغيّر نوع العلف ولا تجهد الحيوان بالمشي.</small></div></div>`:''}
  ${ph.key==='extension'?`<div class="alert danger" style="margin-bottom:16px"><span class="dot"></span><div><strong>أنت بعد نهاية خطة الـ90 يوم المرجعية</strong><small>التمديد مسموح في النظام حتى 120 يومًا فقط. راجع الوزن الفعلي، التكلفة، حالة السوق والصحة قبل الاستمرار؛ المحاضرة لم تعط برنامجًا رقميًا جديدًا بعد اليوم 90.</small></div></div>`:''}
  ${withinWeek?`<div class="alert danger" style="margin-bottom:16px"><span class="dot"></span><div><strong>دخلت أسبوع ما قبل موعد البيع المخطط</strong><small>راجع جميع الأدوية وفترات السحب والطبيب البيطري. عبارة «نحو أسبوع» لا تلغي فترة سحب أطول لأي دواء، ولا ينبغي إيقاف علاج ضروري دون توجيه بيطري.</small></div></div>`:''}
  <div class="card"><div class="section-title"><div><h3>متابعة الحيوانات مقابل أهداف المحاضرة</h3><div class="small muted">الأهداف الرقمية تُطبق حرفيًا فقط على عجل يبدأ 200 كجم أو خروف يبدأ 20 كجم.</div></div><button class="btn small" onclick="setTab('daily')">تسجيل وزن</button></div><div class="table-wrap"><table><thead><tr><th>الحيوان</th><th>الوزن الحالي</th><th>الهدف المرجعي</th><th>علف المرحلة بالمثال</th><th>زيادة المرحلة</th><th>متابعة الوزن</th></tr></thead><tbody>${rows||'<tr><td colspan="6">لا توجد حيوانات نشطة.</td></tr>'}</tbody></table></div><div class="source-note">للخروف: زيادات المراحل 2 + 8 + 3 = 13 كجم، بينما الدكتورة ذكرت المجموع النهائي 12–15 كجم؛ يعرض النظام الاثنين كما وردا دون تصحيح أو اختراع.</div></div>
  <div class="split" style="margin-top:16px"><div class="card"><h3>مثلث نجاح التسمين</h3><div class="alerts"><div class="alert ${animals.length&&animals.every(a=>a.health?.arrivalCompleted)?'good':''}"><span class="dot"></span><div><strong>1. الصحة والوقاية</strong><small>${animals.length&&animals.every(a=>a.health?.arrivalCompleted)?'استقبال الحيوانات الحالية موثق.':'راجع الاستقبال والبرنامج الوقائي والمتابعة الصحية.'}</small></div></div><div class="alert ${planFeedingLogs(p.id).length?'good':''}"><span class="dot"></span><div><strong>2. التغذية الصحيحة</strong><small>${planFeedingLogs(p.id).length?'يوجد سجل تغذية تشغيلي.':'لم تسجل تغذية فعلية بعد.'}</small></div></div><div class="alert ${marketReady?'good':''}"><span class="dot"></span><div><strong>3. التسويق الجيد</strong><small>${marketReady?'تم توثيق عناصر السوق الأساسية.':'أكمل موسم الطلب، حجم السوق، الأسعار، توقيت وطريقة البيع.'}</small></div></div></div></div>
  <div class="card"><div class="section-title"><div><h3>خطة السوق والبيع</h3><div class="small muted">تسجيل ملاحظات السوق يدويًا؛ النظام لا يخترع أسعارًا أو موسمًا مناسبًا.</div></div><button class="btn small" onclick="openMarketPlanModal('${p.id}')">${marketReady?'تحديث':'إعداد'}</button></div>${p.marketPlan?`<div class="market-grid"><div class="target-box"><strong>موسم/حالة الطلب</strong>${p.marketPlan.season||'-'}</div><div class="target-box"><strong>حجم السوق</strong>${p.marketPlan.marketSize||'-'}</div><div class="target-box"><strong>الأسعار السائدة</strong>${p.marketPlan.prices||'-'}</div><div class="target-box"><strong>موعد البيع المخطط</strong>${p.marketPlan.saleTiming||'-'}</div><div class="target-box"><strong>طريقة البيع</strong>${p.marketPlan.saleMethod||'-'}</div><div class="target-box"><strong>ملاحظة التمديد إن وجدت</strong>${p.marketPlan.extensionReason||'-'}</div></div>`:empty('لم يتم إعداد خطة السوق بعد.')}</div></div>`;
}
function openMarketPlanModal(pid){const p=plan(pid),m=p.marketPlan||{};modal(`<div class="modal-head"><div><h3>خطة السوق والبيع</h3><div class="small muted">المحاضرة تطلب دراسة الموسم والسوق والأسعار والتوقيت؛ أدخل معلوماتك المحلية الفعلية.</div></div><button class="close" onclick="closeModal()">×</button></div><form onsubmit="saveMarketPlan(event,'${pid}')"><div class="form-grid"><div class="field"><label>موسم / حالة الطلب</label><input name="season" value="${m.season||''}" required placeholder="مثال: طلب مرتفع / موسم محدد"></div><div class="field"><label>حجم السوق</label><input name="marketSize" value="${m.marketSize||''}" required placeholder="اكتب ملاحظتك الفعلية"></div><div class="field"><label>الأسعار السائدة</label><input name="prices" value="${m.prices||''}" required placeholder="اكتب الأسعار التي جمعتها"></div><div class="field"><label>موعد البيع المخطط</label><input name="saleTiming" value="${m.saleTiming||''}" required></div><div class="field"><label>طريقة البيع</label><select name="saleMethod" required><option value="" ${!m.saleMethod?'selected':''}>اختر</option><option ${m.saleMethod==='منفردة'?'selected':''}>منفردة</option><option ${m.saleMethod==='دفعة واحدة'?'selected':''}>دفعة واحدة</option><option ${m.saleMethod==='حسب ظروف السوق'?'selected':''}>حسب ظروف السوق</option></select></div><div class="field"><label>سبب التمديد بعد 90 يومًا — إن كانت الخطة أطول</label><input name="extensionReason" value="${m.extensionReason||''}" placeholder="اختياري حتى اليوم 90"></div></div><div class="source-note">إذا كانت الخطة 91–120 يومًا فسبب التمديد يساعد على توثيق القرار، لكنه لا يحوّل الأيام الإضافية إلى توصية علمية من المحاضرة.</div><div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">إلغاء</button><button class="btn primary">حفظ خطة السوق</button></div></form>`)}
function saveMarketPlan(ev,pid){ev.preventDefault();const f=new FormData(ev.target),p=plan(pid);p.marketPlan={season:f.get('season'),marketSize:f.get('marketSize'),prices:f.get('prices'),saleTiming:f.get('saleTiming'),saleMethod:f.get('saleMethod'),extensionReason:f.get('extensionReason')||''};save();closeModal();render()}

function overviewTab(p,s){const shelter=p.shelter?.ready?`<div class="alert good" style="margin-bottom:16px"><span class="dot"></span><div><strong>الزريبة جاهزة حسب قائمة فحص المحاضرة الثانية</strong><small>${p.shelter.animalType==='sheep'?`العدد المخطط ${p.shelter.headCount} رأس • المساحة المسقوفة المحسوبة ${p.shelter.headCount} م² تقريبًا`:'لم يُفرض رقم لمساحة العجل لأن المحاضرة لم تحفظ رقمًا واضحًا.'}</small></div><button class="btn small" onclick="setTab('shelter')">فتح الفحص</button></div>`:`<div class="alert danger" style="margin-bottom:16px"><span class="dot"></span><div><strong>تجهيز الزريبة غير مكتمل</strong><small>أكمل فحص الزريبة من المحاضرة الثانية قبل إضافة حيوانات جديدة.</small></div><button class="btn small" onclick="setTab('shelter')">تجهيز الزريبة</button></div>`;const ph=cyclePhase(p),cycleAlert=`<div class="alert ${ph.key==='extension'?'danger':'good'}" style="margin-bottom:16px"><span class="dot"></span><div><strong>اليوم ${cycleDay(p)} — ${ph.name}</strong><small>${ph.key==='extension'?'الخطة تجاوزت اليوم 90 المرجعي؛ افتح خطة 90–120 يوم لمراجعة قرار التمديد.':ph.key==='ended'?'تجاوزت المدة المخططة.':'تابع المرحلة الحالية وأهدافها من تبويب خطة 90–120 يوم.'}</small></div><button class="btn small" onclick="setTab('cycle')">فتح الدورة</button></div>`;return `${shelter}${cycleAlert}<div class="grid metrics"><div class="metric"><div class="label">الحيوانات الحالية</div><div class="value">${s.remaining}</div><div class="note">${s.sold} مباع</div></div><div class="metric"><div class="label">شراء الحيوانات</div><div class="value">${fmt(s.buy)}</div></div><div class="metric"><div class="label">العلف المستهلك</div><div class="value">${fmt(s.feedUsed)}</div></div><div class="metric"><div class="label">العلاجات المستخدمة</div><div class="value">${fmt(s.treatment)}</div></div><div class="metric"><div class="label">مصروفات أخرى</div><div class="value">${fmt(s.other)}</div></div></div><div class="split"><div class="card"><div class="section-title"><h3>الحيوانات</h3><button class="btn small" onclick="setTab('animals')">عرض الكل</button></div>${animalTable(p,true)}</div><div class="card"><h3>آخر النشاطات</h3><div class="timeline"><div class="event"><div class="line"></div><div class="event-body"><strong>تم تحديث أوزان الحيوانات</strong><small>12 أغسطس 2026</small></div></div><div class="event"><div class="line"></div><div class="event-body"><strong>إضافة علاج للحيوان 002</strong><small>11 أغسطس 2026</small></div></div><div class="event"><div class="line"></div><div class="event-body"><strong>شراء علف مركز</strong><small>1 أغسطس 2026</small></div></div></div></div></div>`}
function animalTable(p,limit=false){let a=planAnimals(p.id);if(limit)a=a.slice(0,5);return `<div class="table-wrap"><table><thead><tr><th>الحيوان</th><th>وزن الشراء</th><th>آخر وزن</th><th>الزيادة</th><th>الحالة</th><th></th></tr></thead><tbody>${a.map(x=>{const last=x.weights.at(-1)?.value||x.buyWeight;return `<tr><td><strong>#${x.tag}</strong>${x.pinnedNote?'<div class="small muted">📌 لديه ملاحظة مهمة</div>':''}</td><td>${x.buyWeight} كجم</td><td>${last} كجم</td><td class="money-positive">+${last-x.buyWeight} كجم</td><td>${animalStatus(x.status)}</td><td><button class="btn small" onclick="openAnimal('${x.id}')">فتح</button></td></tr>`}).join('')}</tbody></table></div>`}
const shelterCheckNames=['roofRain','floorRaised','floorSlope','drainage','ventilation','feeders','waterers','lickStone','lickSeparate'];
const shelterCheckLabels={roofRain:'السقف يمنع دخول المطر',floorRaised:'الأرضية مرتفعة عن مستوى المياه المحيطة',floorSlope:'الأرضية بها ميل يساعد الماء على الخروج',drainage:'لا تُترك المياه راكدة داخل الزريبة',ventilation:'توجد تهوية مناسبة',feeders:'المعالف متوفرة',waterers:'المساقي متوفرة',lickStone:'حجر اللحوس متوفر',lickSeparate:'حجر اللحوس موضوع أو معلق منفصلًا عن العلف'};
function shelterCheck(name,s){return `<label class="check-item"><input type="checkbox" name="${name}" ${s?.[name]?'checked':''}>${shelterCheckLabels[name]}</label>`}
function shelterAssessment(s){if(!s)return{cls:'review',text:'لم يتم تقييم الزريبة بعد.'};const missing=shelterCheckNames.filter(n=>!s[n]);if(s.projectType!=='fattening')return{cls:'bad',text:'هذا النظام مخصص لدورات التسمين. مشروع التربية أطول وله احتياجات مختلفة كما أوضحت المحاضرة.'};if(!s.headCount||s.headCount<1)return{cls:'review',text:'حدد عدد الحيوانات الذي ستجهز الزريبة له.'};if(s.roofMaterial==='zinc'&&!s.insulation)return{cls:'bad',text:'الزنك دون عازل حراري لا يطابق ما أوصت به الدكتورة في ظروف الحرارة.'};if(missing.length)return{cls:'review',text:`الزريبة تحتاج مراجعة — لم يتم تأكيد ${missing.length} نقطة أساسية.`};return{cls:'ok',text:'الزريبة مستوفية للنقاط الأساسية المحفوظة من المحاضرة الثانية.'}}
function shelterTab(p){const s=p.shelter||{},a=shelterAssessment(s),roof=s.roofMaterial||'straw',animalType=s.animalType||'calf',project=s.projectType||'fattening',waste=s.wasteUse||'undecided';return `<div class="split"><div class="card"><div class="section-title"><div><h3>تجهيز وفحص الزريبة</h3><div class="small muted">تطبق هذه الشاشة فقط ما ورد بوضوح في المحاضرة الثانية.</div></div></div><form id="shelterForm" onsubmit="saveShelter(event,'${p.id}')" onchange="updateShelterAssessment()"><div class="form-grid"><div class="field"><label>نوع المشروع</label><select name="projectType" required><option value="fattening" ${project==='fattening'?'selected':''}>تسمين</option><option value="breeding" ${project==='breeding'?'selected':''}>تربية</option></select><div class="form-help">الموقع مخصص لإدارة التسمين؛ التربية دورة أطول واحتياجاتها مختلفة.</div></div><div class="field"><label>نوع الحيوان</label><select name="animalType" required><option value="calf" ${animalType==='calf'?'selected':''}>عجول</option><option value="sheep" ${animalType==='sheep'?'selected':''}>ضأن</option></select></div><div class="field"><label>عدد الحيوانات المخطط</label><input name="headCount" type="number" min="1" value="${s.headCount||''}" required></div><div class="field"><label>مكان التسمين</label><select name="locationType"><option value="home" ${s.locationType==='home'?'selected':''}>حوش المنزل</option><option value="dedicated" ${s.locationType==='dedicated'?'selected':''}>زريبة مستقلة</option><option value="other" ${s.locationType==='other'?'selected':''}>مكان آخر</option></select><div class="form-help">المحاضرة أجازت حوش المنزل إذا توفرت المساحة والمواصفات المناسبة.</div></div><div class="field"><label>مادة السقف</label><select name="roofMaterial" required><option value="straw" ${roof==='straw'?'selected':''}>قش / تغطية تقليدية</option><option value="zinc" ${roof==='zinc'?'selected':''}>زنك</option><option value="other" ${roof==='other'?'selected':''}>مادة أخرى</option></select></div><div class="field" id="insulationField" style="${roof==='zinc'?'':'display:none'}"><label>عازل حراري تحت الزنك</label><label class="check-item"><input type="checkbox" name="insulation" ${s.insulation?'checked':''}>موجود</label></div></div><div id="shelterSpaceNote" class="breed-note" style="margin-top:14px"></div><div id="shelterRoofNote" class="source-note"></div><div class="selection-box"><h4>فحص الأرضية والسقف والتهوية</h4><div class="check-grid">${['roofRain','floorRaised','floorSlope','drainage','ventilation'].map(n=>shelterCheck(n,s)).join('')}</div></div><div class="selection-box"><h4>الأدوات الأساسية</h4><div class="check-grid">${['feeders','waterers','lickStone','lickSeparate'].map(n=>shelterCheck(n,s)).join('')}<label class="check-item"><input type="checkbox" name="tapeMeasure" ${s.tapeMeasure?'checked':''}>الميزان الشريطي متوفر</label></div><div class="source-note">وردت المعالف والمساقي والميزان الشريطي ضمن محاور المحاضرة، لكن أبعادها وطريقة استخدام الميزان لم تُحفظ؛ لذلك لا يضع النظام مقاسات أو طريقة من عنده.</div></div><div class="selection-box"><h4>الروث والمنتجات الثانوية</h4><div class="field"><label>طريقة التعامل مع الروث</label><select name="wasteUse"><option value="undecided" ${waste==='undecided'?'selected':''}>لم أحدد بعد</option><option value="regular" ${waste==='regular'?'selected':''}>تنظيف / التخلص المنتظم</option><option value="fertilizer" ${waste==='fertilizer'?'selected':''}>الاستفادة كسماد عضوي</option><option value="biogas" ${waste==='biogas'?'selected':''}>دراسة مشروع غاز حيوي</option></select></div><div id="wasteNote" class="source-note"></div></div><label class="check-item" style="margin-top:14px"><input type="checkbox" name="firstCycle" ${s.firstCycle?'checked':''}>هذه أول دورة تسمين لي</label><div id="beginnerNote" class="source-note"></div><div id="shelterAssessment" class="assessment ${a.cls}">${a.text}</div><div class="source-note">لم نحفظ تفاصيل أمان الزريبة، أبعاد المعالف والمساقي، مساحة العجل، تكلفة زريبة أربعة عجول أو روتين النظافة function updateShelterAssessment(){const f=document.getElementById('shelterForm');if(!f)return;const type=f.elements.animalType.value,count=+f.elements.headCount.value||0,roof=f.elements.roofMaterial.value;const space=document.getElementById('shelterSpaceNote'),roofNote=document.getElementById('shelterRoofNote'),ins=document.getElementById('insulationField'),wasteNote=document.getElementById('wasteNote'),beginner=document.getElementById('beginnerNote'),box=document.getElementById('shelterAssessment');if(ins)ins.style.display=roof==='zinc'?'':'none';if(space)space.textContent=type==='sheep'?(count?`المساحة المسقوفة المطلوبة تقريبًا: ${count} م² (${count} رأس × 1 م²).`:'للضأن: متر مربع مسقوف تقريبًا لكل رأس.'):'لم يظهر في المادة المتاحة رقم واضح لمساحة العجل الواحد؛ لذلك لا يحسب النظام رقمًا من عنده.';if(roofNote)roofNote.textContent=roof==='zinc'?'الزنك يرفع الحرارة إذا استُخدم وحده؛ يلزم عازل حراري مع تهوية مناسبة.':roof==='straw'?'مواد التغطية التقليدية مثل القش أنسب حراريًا، مع ضرورة منع دخول المطر.':'للمادة الأخرى لا تضيف المحاضرة مواصفات حرارية رقمية؛ تبقى شروط منع المطر والتهوية مطلوبة.';const waste=f.elements.wasteUse.value;if(wasteNote)wasteNote.textContent=waste==='biogas'?'الاستفادة في الغاز الحيوي تحتاج متخصصًا وحسابًا مستقلًا؛ لا يعتمد النظام أرقامًا اقتصادية غير مؤكدة.':waste==='fertilizer'?'يمكن الاستفادة من الروث كسماد طبيعي/عضوي؛ تفاصيل التصنيع تأتي لاحقًا في الدورة.':waste==='undecided'?'يمكن التفكير في الروث كمنتج جانبي، دون افتراض عائد مالي.':'';if(beginner)beginner.textContent=f.elements.firstCycle.checked&&count>5?'للمبتدئ نصحت الدكتورة بالبدء بعدد صغير نحو 4–5 رؤوس وتجربة دورة قبل التوسع.':f.elements.firstCycle.checked?'العدد يقع ضمن البداية الصغيرة التي نصحت بها الدكتورة للمبتدئ إذا كان 4–5 رؤوس.':'';const data={projectType:f.elements.projectType.value,headCount:count,roofMaterial:roof,insulation:!!f.elements.insulation?.checked};for(const n of shelterCheckNames)data[n]=!!f.elements[n]?.checked;const a=shelterAssessment(data);if(box){box.className=`assessment ${a.cls}`;box.textContent=a.text}if(type==='sheep'&&space&&count)space.textContent+=` وذكرت الدكتورة أن دورة تسمين الحملان تكون قصيرة، نحو شهرين إلى ثلاثة أشهر، بعد شراء الحمل في العمر التقريبي المذكور بالمحاضرة.`}
function saveShelter(ev,pid){ev.preventDefault();const f=new FormData(ev.target),p=plan(pid);const data={projectType:f.get('projectType'),animalType:f.get('animalType'),headCount:+f.get('headCount'),locationType:f.get('locationType'),roofMaterial:f.get('roofMaterial'),insulation:!!f.get('insulation'),tapeMeasure:!!f.get('tapeMeasure'),wasteUse:f.get('wasteUse'),firstCycle:!!f.get('firstCycle')};for(const n of shelterCheckNames)data[n]=!!f.get(n);const a=shelterAssessment(data);data.ready=a.cls==='ok';data.checkedAt=today();p.projectType=data.projectType;p.shelter=data;save();render();setTimeout(()=>alert(data.ready?'تم حفظ التقييم: الزريبة جاهزة حسب النقاط المحفوظة من المحاضرة الثانية.':'تم حفظ التقييم، لكن الزريبة ما زالت تحتاج مراجعة قبل إضافة حيوانات جديدة.'),0)}
function animalsTab(p){return `<div class="card"><div class="section-title"><div><h3>حيوانات الخطة</h3><div class="small muted">السجل الأولي منفصل عن السجلات اليومية.</div></div><button class="btn primary small" onclick="openAnimalModal('${p.id}')">+ إضافة حيوان</button></div>${animalTable(p)}</div>`}
function dailyTab(p){const rows=state.daily.filter(d=>d.planId===p.id).map(d=>`<tr><td>${d.date}</td><td>${d.entries.length}</td><td>${d.shelterCleaned===true?'تم':d.shelterCleaned===false?'لم يُسجل':'-'}</td><td>${d.note||'-'}</td><td><button class="btn small" onclick="openDailyModal('${p.id}')">إضافة سجل جديد</button></td></tr>`).join('');return `<div class="card"><div class="section-title"><div><h3>السجل اليومي للمجموعة</h3><div class="small muted">سجل الوزن والحالة والملاحظة، مع توثيق تنفيذ النظافة اليومية دون اختراع تفاصيل لم تحفظها المحاضرة.</div></div><button class="btn primary small" onclick="openDailyModal('${p.id}')">+ تسجيل يومي</button></div><div class="table-wrap"><table><thead><tr><th>التاريخ</th><th>الحيوانات المحدثة</th><th>نظافة الزريبة</th><th>ملاحظة المجموعة</th><th></th></tr></thead><tbody>${rows||'<tr><td colspan="5">لا توجد سجلات يومية بعد.</td></tr>'}</tbody></table></div></div>`}

const feedingStorageNames=['dryStorage','ventilatedStorage','groundProtected','rainProtected','noSpoiledFeed'];
const feedingStorageLabels={dryStorage:'مكان حفظ العلف جاف',ventilatedStorage:'مكان الحفظ جيد التهوية',groundProtected:'العلف محمي من رطوبة الأرض',rainProtected:'العلف محمي من مياه المطر',noSpoiledFeed:'لا يُقدّم علف ظهرت عليه علامات عفن أو فساد'};
function dayDiff(from,to=today()){if(!from)return 999;const a=new Date(from+'T00:00:00'),b=new Date(to+'T00:00:00');return Math.max(0,Math.floor((b-a)/86400000))}
function latestWeightRecord(a){return a.weights?.length?a.weights[a.weights.length-1]:{date:a.buyDate,value:a.buyWeight}}
function feedingAnimalType(p){return p.shelter?.animalType||planAnimals(p.id).find(a=>a.animalType)?.animalType||null}
function feedingTypeName(t){return t==='sheep'?'ضأن':t==='calf'?'عجول':'غير محدد'}
function concentrateTarget(weight){return +(Number(weight||0)*.03).toFixed(3)}
function roughageGeneral(concentrate){return +(Number(concentrate||0)*1.5).toFixed(3)}
function publishedGain(type,weight){const calf={200:[.8,1.2],250:[1,1.3],300:[1.1,1.5],350:[1,1.4],400:[.9,1.3]},sheep={15:[.12,.18],20:[.16,.23],25:[.19,.26],30:[.21,.28],35:[.2,.27],40:[.18,.25]};return (type==='calf'?calf:sheep)[Number(weight)]||null}
function mix100(type){return type==='sheep'?[['فتريتة مدروشة',50],['أمباز فول أو أمباز سمسم',20],['ردة قمح',25],['أملاح معدنية وفيتامينات',3],['جير مطفي مخصص للأعلاف',2]]:[['فتريتة مدروشة',50],['أمباز فول أو أمباز سمسم',30],['ردة قمح',15],['أملاح معدنية وفيتامينات',3],['جير مطفي مخصص للأعلاف',2]]}
function taperRows(type){return type==='sheep'?[['1–3','200 جرام'],['4–7','300 جرام'],['8–10','500 جرام'],['من اليوم 11','600 جرام']]:[['1–3','2 كجم'],['4–7','3 كجم'],['8–10','4 كجم'],['من اليوم 11','6 كجم']]}
function storageAssessment(st){if(!st)return{cls:'review',text:'لم يتم تقييم تخزين العلف بعد.'};const missing=feedingStorageNames.filter(n=>!st[n]);return missing.length?{cls:'review',text:`التخزين يحتاج مراجعة — لم يتم تأكيد ${missing.length} نقطة.`}:{cls:'ok',text:'تخزين العلف مستوفٍ للنقاط المحفوظة من المحاضرة الثالثة.'}}
function saveFeedingStorage(ev,pid){ev.preventDefault();const f=new FormData(ev.target),p=plan(pid),st={checkedAt:today()};for(const n of feedingStorageNames)st[n]=!!f.get(n);p.feeding=p.feeding||{};p.feeding.storage=st;save();render()}
function dangerText(log){const x=[];if(log.diarrhea)x.push('إسهال');if(log.lowAppetite)x.push('ضعف شهية');if(log.bloat)x.push('انتفاخ');if(log.lethargy)x.push('خمول');return x.join('، ')}
function feedingTab(p){
  const type=feedingAnimalType(p);

  const animals=planAnimals(p.id).filter(a=>a.status!=='sold'), rows=animals.map(a=>{const wr=latestWeightRecord(a),c=concentrateTarget(wr.value),r=roughageGeneral(c),age=dayDiff(wr.date),gain=publishedGain(type,wr.value),weigh=age>15?`<span class="badge treat">متأخر ${age} يوم</span>`:age>=10?`<span class="badge sell">موعد وزن ${age} يوم</span>`:`<span class="badge active">${age} يوم</span>`;return `<tr><td><strong>#${a.tag}</strong></td><td>${wr.value} كجم<br><span class="small muted">${wr.date}</span></td><td>${c} كجم/يوم</td><td>${r} كجم/يوم</td><td>${gain?`${gain[0]}–${gain[1]} كجم/يوم`:'لا يوجد صف مطابق في الجدول المنشور'}</td><td>${weigh}</td></tr>`}).join('');
  const totalC=animals.reduce((z,a)=>z+concentrateTarget(latestWeightRecord(a).value),0),totalR=roughageGeneral(totalC),due=animals.filter(a=>dayDiff(latestWeightRecord(a).date)>=10).length,ps=stats(p),feedShare=ps.total?ps.feedUsed/ps.total*100:0;
  const mix=mix100(type),st=p.feeding?.storage||null,sa=storageAssessment(st),logs=planFeedingLogs(p.id).slice().reverse();

  return `<div class="grid metrics"><div class="metric hero"><div class="label">هدف المركزات الحالي</div><div class="value">${totalC.toFixed(2)}</div><div class="note">كجم/يوم للمجموعة — 3% من آخر وزن لكل حيوان</div></div><div class="metric"><div class="label">المالئ حسب قاعدة 60/40</div><div class="value">${totalR.toFixed(2)}</div><div class="note">كجم/يوم = المركزات × 1.5</div></div><div class="metric ${due?'warn':'good'}"><div class="label">إعادة الوزن</div><div class="value">${due}</div><div class="note">حيوان مرّ على وزنه 10 أيام أو أكثر</div></div><div class="metric"><div class="label">الحيوانات الحالية</div><div class="value">${animals.length}</div><div class="note">${feedingTypeName(type)}</div></div><div class="metric"><div class="label">العلف من التكلفة الفعلية</div><div class="value">${feedShare.toFixed(1)}%</div><div class="note">المحاضرة ذكرت نحو 70% من تكلفة التسمين بصورة عامة</div></div></div>

  <div class="card"><div class="section-title"><div><h3>حساب العليقة من آخر وزن</h3><div class="small muted">يتغير الهدف تلقائيًا كلما سجلت وزنًا جديدًا.</div></div><button class="btn primary small" onclick="openFeedingLogModal('${p.id}')">+ تسجيل تغذية اليوم</button></div><div class="table-wrap"><table><thead><tr><th>الحيوان</th><th>آخر وزن</th><th>المركزات 3%</th><th>المالئ العام ×1.5</th><th>الزيادة المنشورة عند وزن مطابق</th><th>موعد الوزن</th></tr></thead><tbody>${rows||'<tr><td colspan="6">لا توجد حيوانات نشطة.</td></tr>'}</tbody></table></div><div class="source-note">المحاضرة أوصت بإعادة الوزن كل 10–15 يومًا وتعديل 3% على الوزن الجديد. جداول الزيادة المنشورة تُعرض فقط عند تطابق الوزن حرفيًا؛ لا يقوم النظام بالاستيفاء بين الأوزان.</div></div>

function openFeedingLogModal(pid){
  const p=plan(pid),type=feedingAnimalType(p),animals=planAnimals(pid).filter(a=>a.status!=='sold'),totalC=animals.reduce((z,a)=>z+concentrateTarget(latestWeightRecord(a).value),0),totalR=roughageGeneral(totalC),conc=planFeeds(pid).filter(f=>f.category==='concentrate'&&f.qtyKg>f.usedKg),rough=planFeeds(pid).filter(f=>f.category==='roughage'&&f.qtyKg>f.usedKg);
  modal(`<div class="modal-head"><div><h3>تسجيل تغذية اليوم</h3><div class="small muted">هدف المجموعة الحالي: ${totalC.toFixed(2)} كجم مركزات/يوم؛ المالئ العام حسب 60/40: ${totalR.toFixed(2)} كجم/يوم.</div></div><button class="close" onclick="closeModal()">×</button></div><form onsubmit="createFeedingLog(event,'${pid}')"><div class="form-grid"><div class="field"><label>التاريخ</label><input name="date" type="date" value="${today()}" required></div><div class="field"><label>الحرارة °م (اختياري)</label><input name="temperature" type="number" step=".1" placeholder="مثال 34"></div><div class="field"><label>كمية المركزات المقدمة فعليًا — كجم</label><input name="concentrateKg" type="number" min="0" step=".001" required></div><div class="field"><label>كمية المالئ المقدمة فعليًا — كجم</label><input name="roughageKg" type="number" min="0" step=".001" required></div><div class="field"><label>خصم المركزات من المخزون (اختياري)</label><select name="concFeed"><option value="">بدون خصم</option>${conc.map(f=>`<option value="${f.id}">${f.name} — متبقي ${(f.qtyKg-f.usedKg).toFixed(2)} كجم</option>`).join('')}</select></div><div class="field"><label>خصم المالئ من المخزون (اختياري)</label><select name="roughFeed"><option value="">بدون خصم</option>${rough.map(f=>`<option value="${f.id}">${f.name} — متبقي ${(f.qtyKg-f.usedKg).toFixed(2)} كجم</option>`).join('')}</select></div></div>

function createFeedingLog(ev,pid){
  ev.preventDefault();const f=new FormData(ev.target),c=+f.get('concentrateKg')||0,r=+f.get('roughageKg')||0,cf=state.feeds.find(x=>x.id===f.get('concFeed')),rf=state.feeds.find(x=>x.id===f.get('roughFeed'));
  if(cf&&c>cf.qtyKg-cf.usedKg){alert('كمية المركزات أكبر من المخزون المتبقي.');return}if(rf&&r>rf.qtyKg-rf.usedKg){alert('كمية المالئ أكبر من المخزون المتبقي.');return}
  const log={id:uid('fl'),planId:pid,date:f.get('date'),concentrateKg:c,roughageKg:r,temperature:+f.get('temperature')||null,note:f.get('note')||'',concFeedId:cf?.id||null,roughFeedId:rf?.id||null};
  for(const n of ['waterBefore','waterAvailable','troughWashed','waterCool','waterShade','changedMorning','changedAfternoon','morningMeal','afternoonMeal','concentrateFirst','roughageSeparate','diarrhea','lowAppetite','bloat','lethargy'])log[n]=!!f.get(n);
  if(cf)cf.usedKg+=c;if(rf)rf.usedKg+=r;state.feedingLogs.push(log);save();closeModal();render();
  const danger=dangerText(log);setTimeout(()=>{if(danger)alert(`تم حفظ السجل. علامات تحتاج متابعة: ${danger}. حسب المحاضرة: ارجع خطوة في التدرج وقلل الكمية حتى تخف الأعراض، والنفاخ الشديد يحتاج طبيبًا بيطريًا.`);else if(log.temperature>35)alert('تم حفظ السجل. تنبيه من الجدول المنشور: الحرارة فوق 35° تقلل التحويل الغذائي 30%.');},0)
}

 <div class="card" style="margin-top:16px"><div class="section-title"><div><h3>المتابعة الصحية اليومية</h3><div class="small muted">شهية، شرب، روث، نفاخ، جروح/إفرازات، وسلوك.</div></div><button class="btn primary small" onclick="openHealthDailyModal('${p.id}')">+ متابعة صحية</button></div>${logs.length?`<div class="table-wrap"><table><thead><tr><th>التاريخ</th><th>الحيوان</th><th>الشهية/الشرب</th><th>الملاحظات</th><th>العزل</th><th>التقييم</th></tr></thead><tbody>${logs.map(l=>{const a=state.animals.find(x=>x.id===l.animalId),dg=healthDanger(l);return `<tr><td>${l.date}</td><td>#${a?.tag||'-'}</td><td>${l.missedBothMeals?'لم يأكل طوال اليوم':l.appetiteOk?'طبيعية':'تحتاج متابعة'} / ${l.drinkingOk?'طبيعي':'غير طبيعي'}</td><td>${[l.diarrhea?'إسهال':'',l.bloodyDiarrhea?'دم في الروث':'',l.leftBloat?'نفاخ يسار':'',l.woundOrDischarge?'جرح/إفرازات':'',l.sourBreath?'رائحة فم حامضة':'',l.ticks?'قراد/طفيليات خارجية':'',l.lethargy?'خمول':''].filter(Boolean).join('، ')||'لا علامات مسجلة'}</td><td>${l.isolated?'تم':dg.length?'لم يسجل':'-'}</td><td>${dg.length?`<span class="badge treat">طبيب فورًا: ${dg.join('، ')}</span>`:'<span class="badge active">لا علامة خطر فورية مسجلة</span>'}</td></tr>`}).join('')}</tbody></table></div>`:empty('لا توجد متابعات صحية يومية بعد')}</div>
 <div class="card" style="margin-top:16px"><div class="section-title"><div><h3>البرنامج الوقائي والتحصينات</h3><div class="small muted">يسجل ما تم فعليًا وفق العبوة/الطبيب/الخدمات البيطرية؛ لا يحسب جرعات دوائية تلقائيًا.</div></div><button class="btn primary small" onclick="openPreventiveEventModal('${p.id}')">+ تسجيل إجراء وقائي</button></div><div class="source-note" style="margin-bottom:12px">التكرار المنشور: الإيفرمكتين كل شهرين، الألبندازول كل 3 أشهر، لقاح التسمم المعوي كل 6 أشهر. الأنثراكس مرتبط ببرنامج الولاية ولا يحدد له النظام تكرارًا من عنده.</div>${events.length?`<div class="table-wrap"><table><thead><tr><th>الإجراء</th><th>الحيوان/القطيع</th><th>التاريخ</th><th>المصدر</th><th>الموعد الدوري التالي</th></tr></thead><tbody>${events.map(e=>`<tr><td><strong>${healthEventLabel(e.kind)}</strong></td><td>${e.animalId?'#'+state.animals.find(a=>a.id===e.animalId)?.tag:'القطيع/الخطة'}</td><td>${e.date}</td><td>${e.guidance||'-'}</td><td>${nextPreventiveDue(e)||'حسب الجهة البيطرية/لا يوجد تكرار ثابت'}</td></tr>`).join('')}</tbody></table></div>`:empty('لم تسجل إجراءات وقائية بعد')}</div>
 <div class="card" style="margin-top:16px"><h3>أمثلة الجرعات الواردة في المحاضرة — للمرجع فقط</h3><div class="alert danger"><span class="dot"></span><div><strong>لا يستخدم النظام هذه الأرقام لحساب الجرعة</strong><small>يجب وزن الحيوان وقراءة ملصق المنتج وتركيزه والرجوع للطبيب، خاصة الحقن والحالات المرضية.</small></div></div><div class="table-wrap" style="margin-top:12px"><table><thead><tr><th>المستحضر</th><th>المثال الصوتي</th><th>عجل 200 كجم</th><th>خروف 20 كجم</th></tr></thead><tbody><tr><td>ألبندازول شراب</td><td>1 سم³ لكل 10 كجم — مثال محاضرة فقط</td><td>20 سم³</td><td>2 سم³</td></tr><tr><td>إيفرمكتين تحت الجلد</td><td>1 سم³ لكل 50 كجم — مثال محاضرة فقط</td><td>4 سم³</td><td>0.4 سم³</td></tr></tbody></table></div></div>`
}

function addDaysDate(d,n){const x=dateObj(d);if(!x)return'';x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)}
function emergencyTypeLabel(t){return t==='bloat'?'نفاخ':t==='acidosis'?'حموضة':t==='diarrhea'?'إسهال':t==='ticks'?'قراد / طفيليات خارجية':t}
function planEmergencies(pid){state.emergencies=state.emergencies||[];return state.emergencies.filter(e=>e.planId===pid)}
function emergencyGuideHtml(type,pid){
 const st=state.healthSettings[pid]||{},phone=st.vetPhone||'',call=phone?`<a class="btn danger small" href="tel:${phone}">📞 اتصل بالطبيب: ${phone}</a>`:`<span class="badge treat">رقم الطبيب غير مسجل — أضفه من صيدلية الزريبة</span>`;
 if(type==='bloat')return `<div class="emergency-guide danger"><h4>النفاخ — انتفاخ الجهة اليسرى</h4><ol><li>اجعل الحيوان يقف ويتحرك.</li><li>ذكرت الدكتورة <strong>لترًا واحدًا من زيت البرافين بالفم</strong> كإسعاف أولي في هذه المحاضرة.</li><li>يمكن استخدام مستحضر مضاد للنفاخ، لكن لا يحدد النظام اسمًا أو جرعة لأي منتج.</li><li><strong>اتصل بالطبيب البيطري ولا تنتظر.</strong></li><li>لا تنفذ ثقبًا أو تدخلًا مباشرًا في الكرش بنفسك؛ هذه الإجراءات للطبيب.</li></ol><div class="emergency-call">${call}</div><div class="source-note">إسعاف أولي كما ورد في المحاضرة السادسة، وليس تشخيصًا أو بديلًا عن الطبيب.</div></div>`;
 if(type==='acidosis')return `<div class="emergency-guide"><h4>الحموضة — اشتباه فقط</h4><ol><li>راجع العلامات: توقف الأكل، خمول، رائحة حامضة من الفم شبيهة بالخل، وقد يوجد إسهال.</li><li>ذكرت الدكتورة إيقاف العلف لمدة <strong>24 ساعة</strong>.</li><li>المثال الوارد: <strong>4 ملاعق بيكربونات صوديوم في 5 لترات ماء</strong>.</li><li>تأكد مع الطبيب أن المشكلة حموضة؛ توقف الأكل قد يكون له أسباب أخرى.</li></ol><div class="emergency-call">${call}</div><div class="source-note">لا يحول النظام هذا المثال إلى جرعة عامة لحالات أخرى.</div></div>`;
 if(type==='diarrhea')return `<div class="emergency-guide"><h4>الإسهال</h4><ol><li>أوقف العلف المركز.</li><li>ذكرت الدكتورة ماءً دافئًا مع الملح والسكر لتعويض السوائل.</li><li><strong>لم تحفظ مقادير الملح والسكر بوضوح؛ لذلك لا يعرض النظام نسبة من عنده.</strong></li><li>إذا ظهر دم في الإسهال: <strong>اتصل بالطبيب فورًا.</strong></li></ol><div class="emergency-call">${call}</div></div>`;
 if(type==='ticks')return `<div class="emergency-guide"><h4>القراد والطفيليات الخارجية</h4><ol><li>سجل وجود القراد/الطفيليات على الجلد.</li><li>ورد في التسجيل رش مستحضر سُمّي صوتيًا «السايبر» كل <strong>14 يومًا</strong> عند الحديث عن ملاحظة القراد.</li><li>لم يذكر التسجيل تركيزًا أو نسبة تخفيف؛ راجع العبوة والطبيب قبل الاستعمال.</li><li>للعدد الكبير: يمكن استخدام المغاطس. للعدد القليل: الرش والتعامل مع الحيوانات واحدةً واحدة.</li><li>الإيفرمكتين كل شهرين موجود أصلًا في البرنامج الوقائي؛ لا يعطيه هذا النموذج تلقائيًا.</li></ol><div class="emergency-call">${call}</div></div>`;
 return '<div class="emergency-guide">اختر الحالة لعرض الإسعاف الأولي الموثق.</div>';
}
function emergencyFieldsHtml(type){
 if(type==='bloat')return `<div class="check-grid"><label class="check-item"><input type="checkbox" name="leftBloat">انتفاخ واضح في الجهة اليسرى</label><label class="check-item"><input type="checkbox" name="moved">تم جعل الحيوان يقف ويتحرك</label><label class="check-item"><input type="checkbox" name="paraffin">تم إعطاء زيت البرافين وفق توجيه المحاضرة/الطبيب</label><label class="check-item"><input type="checkbox" name="vetContacted">تم التواصل مع الطبيب/جارٍ التواصل</label><label class="check-item"><input type="checkbox" name="noRumenIntervention">لم أنفذ تدخلًا مباشرًا في الكرش بنفسي</label></div>`;
 if(type==='acidosis')return `<div class="check-grid"><label class="check-item"><input type="checkbox" name="stoppedEating">توقف عن الأكل</label><label class="check-item"><input type="checkbox" name="lethargy">خمول</label><label class="check-item"><input type="checkbox" name="sourBreath">رائحة فم حامضة</label><label class="check-item"><input type="checkbox" name="diarrhea">يوجد إسهال</label><label class="check-item"><input type="checkbox" name="feedStopped24">تم إيقاف العلف حسب الإرشاد المذكور</label><label class="check-item"><input type="checkbox" name="bicarbonateSolution">تم استخدام مثال البيكربونات المذكور بعد التحقق</label><label class="check-item"><input type="checkbox" name="vetContacted">تم التواصل مع الطبيب للتأكد من التشخيص</label></div>`;
 if(type==='diarrhea')return `<div class="check-grid"><label class="check-item"><input type="checkbox" name="looseStool">فضلات لينة</label><label class="check-item"><input type="checkbox" name="blood">يوجد دم في الإسهال</label><label class="check-item"><input type="checkbox" name="concentrateStopped">تم إيقاف العلف المركز</label><label class="check-item"><input type="checkbox" name="warmSaltSugar">تم تقديم ماء دافئ مع ملح وسكر دون اختراع نسبة</label><label class="check-item"><input type="checkbox" name="vetContacted">تم التواصل مع الطبيب</label></div>`;
 if(type==='ticks')return `<div class="field"><label>عدد الحيوانات المتأثرة</label><select name="caseScale"><option value="few">عدد قليل</option><option value="many">عدد كبير</option></select></div><div class="check-grid" style="margin-top:10px"><label class="check-item"><input type="checkbox" name="ticksSeen">لوحظ قراد/طفيليات خارجية</label><label class="check-item"><input type="checkbox" name="spray">تم الرش</label><label class="check-item"><input type="checkbox" name="dip">تم استخدام مغطس للمجموعة</label><label class="check-item"><input type="checkbox" name="labelChecked">تمت مراجعة تعليمات العبوة/الطبيب للتركيز والتخفيف</label><label class="check-item"><input type="checkbox" name="vetContacted">تم التواصل مع الطبيب/الجهة البيطرية عند الحاجة</label></div>`;
 return '';
}
function updateEmergencyCase(pid){const s=document.getElementById('emergencyType'),t=s?.value||'bloat',g=document.getElementById('emergencyGuide'),f=document.getElementById('emergencyCaseFields');if(g)g.innerHTML=emergencyGuideHtml(t,pid);if(f)f.innerHTML=emergencyFieldsHtml(t)}
function emergencyCard(p){
 const es=planEmergencies(p.id).slice().reverse(),open=es.filter(e=>e.status!=='resolved'),st=state.healthSettings[p.id]||{};
 return `<div class="card emergency-card" style="margin-bottom:16px"><div class="section-title"><div><h3>🚨 التدخل السريع — قاعدة الدقائق الثلاث</h3><div class="small muted">لاحظ العلامة → نفّذ الإسعاف البسيط الموثق → اتصل بالطبيب → لا تنفذ إجراءً خطيرًا بنفسك.</div></div><button class="btn danger" onclick="openEmergencyModal('${p.id}')">تسجيل حالة طارئة</button></div><div class="emergency-rule"><span><strong>1</strong><br>لاحظ بسرعة</span><span><strong>2</strong><br>إسعاف بسيط فقط</span><span><strong>3</strong><br>اتصل بالطبيب</span><span><strong>4</strong><br>لا تدخل خطير</span></div><div class="emergency-grid"><div class="emergency-case"><strong>نفاخ</strong>انتفاخ الجهة اليسرى</div><div class="emergency-case"><strong>حموضة</strong>توقف أكل + خمول + رائحة حامضة</div><div class="emergency-case"><strong>إسهال</strong>والدم يعني طبيبًا فورًا</div><div class="emergency-case"><strong>قراد</strong>رش/مغطس حسب العدد مع تعليمات العبوة</div></div>${st.vetPhone?`<div class="emergency-call"><a class="btn danger small" href="tel:${st.vetPhone}">📞 ${st.vetName||'الطبيب البيطري'} — ${st.vetPhone}</a></div>`:`<div class="alert danger"><span class="dot"></span><div><strong>رقم الطبيب غير مسجل</strong><small>أضفه من «الطبيب وصيدلية الزريبة» قبل الطوارئ.</small></div></div>`}${open.length?`<div class="table-wrap" style="margin-top:12px"><table><thead><tr><th>التاريخ</th><th>الحيوان</th><th>الحالة</th><th>الطبيب</th><th>المتابعة</th><th></th></tr></thead><tbody>${open.slice(0,6).map(e=>`<tr><td>${e.date}</td><td>#${state.animals.find(a=>a.id===e.animalId)?.tag||'-'}</td><td><span class="badge treat">${emergencyTypeLabel(e.type)}</span></td><td>${e.vetContacted?'تم التواصل':'لم يوثق'}</td><td>${e.nextReview||'-'}</td><td><button class="btn small" onclick="markEmergencyResolved('${e.id}')">إغلاق الحالة</button></td></tr>`).join('')}</tbody></table></div>`:''}<div class="source-note">الوحدة تعرض فقط الإسعافات والمقادير التي وردت صراحةً في المحاضرة السادسة، ولا تستبدل التشخيص والعلاج البيطري.</div></div>`;
}
function openEmergencyModal(pid){const as=planAnimals(pid).filter(a=>a.status!=='sold');modal(`<div class="modal-head"><div><h3>🚨 تسجيل تدخل سريع</h3><div class="small muted">الإسعاف الأولي إلى أن يصل الطبيب — لا تستخدم هذه الشاشة بدل التشخيص.</div></div><button class="close" onclick="closeModal()">×</button></div><form onsubmit="saveEmergency(event,'${pid}')"><div class="form-grid"><div class="field"><label>الحيوان</label><select name="animal" required>${as.map(a=>`<option value="${a.id}">#${a.tag}</option>`).join('')}</select></div><div class="field"><label>التاريخ</label><input name="date" type="date" value="${today()}" required></div><div class="field"><label>الحالة</label><select id="emergencyType" name="type" onchange="updateEmergencyCase('${pid}')" required><option value="bloat">نفاخ</option><option value="acidosis">حموضة</option><option value="diarrhea">إسهال</option><option value="ticks">قراد / طفيليات خارجية</option></select></div></div><div id="emergencyGuide">${emergencyGuideHtml('bloat',pid)}</div><div class="selection-box"><h4>ما الذي لاحظته أو نفذته؟</h4><div id="emergencyCaseFields">${emergencyFieldsHtml('bloat')}</div></div><div class="field full" style="margin-top:12px"><label>ملاحظة الحالة / توجيه الطبيب</label><textarea name="note"></textarea></div><div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">إلغاء</button><button class="btn danger">حفظ الحالة</button></div></form>`)}
function saveEmergency(ev,pid){ev.preventDefault();const f=new FormData(ev.target),type=f.get('type'),aid=f.get('animal'),date=f.get('date'),boolNames=['leftBloat','moved','paraffin','vetContacted','noRumenIntervention','stoppedEating','lethargy','sourBreath','diarrhea','feedStopped24','bicarbonateSolution','looseStool','blood','concentrateStopped','warmSaltSugar','ticksSeen','spray','dip','labelChecked'];const actions=Object.fromEntries(boolNames.map(n=>[n,!!f.get(n)]));if(type==='ticks'&&(actions.spray||actions.dip)&&!actions.labelChecked){alert('لا تسجل رشًا أو مغطسًا قبل توثيق مراجعة تعليمات العبوة/الطبيب للتركيز والتخفيف.');return;}const urgent=type==='bloat'||(type==='diarrhea'&&actions.blood),nextReview=type==='ticks'&&(actions.spray||actions.dip)?addDaysDate(date,14):'';state.emergencies=state.emergencies||[];state.emergencies.push({id:uid('em'),planId:pid,animalId:aid,date,type,status:'open',urgent,vetContacted:actions.vetContacted,actions,caseScale:f.get('caseScale')||'',nextReview,note:f.get('note')});const a=state.animals.find(x=>x.id===aid);if(a&&type!=='ticks'&&a.status!=='sold')a.status='treatment';save();closeModal();render();setTimeout(()=>{if(urgent&&!actions.vetContacted)alert('تم حفظ الحالة، لكن المحاضرة تنص على الاتصال بالطبيب فورًا في هذه الحالة.');else if(type==='ticks'&&nextReview)alert(`تم حفظ الإجراء. موعد المراجعة التالي حسب تكرار 14 يومًا الوارد في التسجيل: ${nextReview}. راجع العبوة والطبيب ولا تعتبر هذا التذكير جرعة تلقائية.`);else alert('تم حفظ التدخل السريع في سجل الحيوان.');},0)}
function markEmergencyResolved(id){state.emergencies=state.emergencies||[];const e=state.emergencies.find(x=>x.id===id);if(!e)return;e.status='resolved';e.resolvedAt=today();save();render()}

utton class="btn primary">حفظ الاستقبال</button></div></form>`)}
function saveArrivalHealth(ev,pid){ev.preventDefault();const f=new FormData(ev.target),a=state.animals.find(x=>x.id===f.get('animal'));a.health={arrivalCompleted:true,date:f.get('date'),isolation:true,separateTools:true,observed:true,labelChecked:true,albendazole:!!f.get('albendazole'),ivermectin:!!f.get('ivermectin'),vitamins:!!f.get('vitamins'),note:f.get('note')};if(a.status==='quarantine')a.status='normal';for(const k of ['albendazole','ivermectin'])if(f.get(k))state.healthEvents.push({id:uid('h'),planId:pid,animalId:a.id,kind:k,date:f.get('date'),guidance:'حسب ملصق المنتج/الطبيب'});if(f.get('vitamins'))state.healthEvents.push({id:uid('h'),planId:pid,animalId:a.id,kind:'vitamin',date:f.get('date'),guidance:'حسب العبوة/التوجيه'});save();closeModal();render()}
function openHealthDailyModal(pid){const as=planAnimals(pid).filter(a=>a.status!=='sold');modal(`<div class="modal-head"><div><h3>متابعة صحية يومية</h3><div class="small muted">أي علامة خطر فورية ستظهر بتنبيه واضح للطبيب.</div></div><button class="close" onclick="closeModal()">×</button></div><form onsubmit="saveHealthDaily(event,'${pid}')"><div class="form-grid"><div class="field"><label>الحيوان</label><select name="animal" required>${as.map(a=>`<option value="${a.id}">#${a.tag}</option>`).join('')}</select></div><div class="field"><label>التاريخ</label><input name="date" type="date" value="${today()}" required></div></div><div class="selection-box"><h4>المتابعة بالنظر والملاحظة</h4><div class="check-grid"><label class="check-item"><input type="checkbox" name="appetiteOk">أكل بصورة طبيعية</label><label class="check-item"><input type="checkbox" name="drinkingOk">يشرب بصورة طبيعية</label><label class="check-item"><input type="checkbox" name="missedBothMeals">ترك وجبتي الصباح والعصر ولم يأكل طوال اليوم</label><label class="check-item"><input type="checkbox" name="diarrhea">يوجد إسهال</label><label class="check-item"><input type="checkbox" name="bloodyDiarrhea">يوجد دم في الروث</label><label class="check-item"><input type="checkbox" name="leftBloat">انتفاخ واضح في الجهة اليسرى</label><label class="check-item"><input type="checkbox" name="woundOrDischarge">جروح أو إفرازات</label><label class="check-item"><input type="checkbox" name="severeWound">جرح شديد/عميق/ملتهب أو به ديدان</label><label class="check-item"><input type="checkbox" name="sourBreath">رائحة غير معتادة/حامضة من الفم</label><label class="check-item"><input type="checkbox" name="ticks">وجود قراد أو طفيليات خارجية على الجلد</label><label class="check-item"><input type="checkbox" name="lethargy">خمول أو تغير مفاجئ في السلوك</label><label class="check-item"><input type="checkbox" name="suddenStopFoodWater">توقف مفاجئ عن الأكل والشرب</label></div></div><div class="selection-box"><h4>عند الاشتباه بالمرض</h4><div function saveHealthDaily(ev,pid){ev.preventDefault();const f=new FormData(ev.target),l={id:uid('hl'),planId:pid,animalId:f.get('animal'),date:f.get('date'),appetiteOk:!!f.get('appetiteOk'),drinkingOk:!!f.get('drinkingOk'),missedBothMeals:!!f.get('missedBothMeals'),diarrhea:!!f.get('diarrhea'),bloodyDiarrhea:!!f.get('bloodyDiarrhea'),leftBloat:!!f.get('leftBloat'),woundOrDischarge:!!f.get('woundOrDischarge'),severeWound:!!f.get('severeWound'),sourBreath:!!f.get('sourBreath'),ticks:!!f.get('ticks'),lethargy:!!f.get('lethargy'),suddenStopFoodWater:!!f.get('suddenStopFoodWater'),isolated:!!f.get('isolated'),separateTools:!!f.get('separateTools'),note:f.get('note')};state.healthLogs.push(l);const a=state.animals.find(x=>x.id===l.animalId),dg=healthDanger(l);if((l.diarrhea||l.bloodyDiarrhea||l.leftBloat||l.woundOrDischarge||l.sourBreath||l.ticks||l.lethargy||l.suddenStopFoodWater)&&a.status!=='sold')a.status='treatment';save();closeModal();render();if(dg.length)setTimeout(()=>alert('علامة خطر تستدعي التواصل مع الطبيب فورًا حسب المحاضرة: '+dg.join('، ')+(l.isolated?'':'\nكما لم يتم توثيق عزل الحيوان.')+'\nافتح «التدخل السريع» من تبويب الصحة الوقائية لتسجيل الإسعاف الأولي.'),0)}
function openPreventiveEventModal(pid){const as=planAnimals(pid).filter(a=>a.status!=='sold');modal(`<div class="modal-head"><div><h3>تسجيل إجراء وقائي/تحصين</h3><div class="small muted">التسجيل يوثق ما تم حسب العبوة أو الطبيب أو الجهة البيطرية.</div></div><button class="close" onclick="closeModal()">×</button></div><form onsubmit="savePreventiveEvent(event,'${pid}')"><div class="form-grid"><div class="field"><label>الإجراء</label><select name="kind" required><option value="ivermectin">إيفرمكتين</option><option value="albendazole">ألبندازول</option><option value="enterotoxemia">لقاح التسمم المعوي</option><option value="anthrax">لقاح الأنثراكس / الجمرة الخبيثة</option><option value="vitamin">فيتامينات</option></select></div><div class="field"><label>النطاق</label><select name="animal"><option value="">القطيع / الخطة</option>${as.map(a=>`<option value="${a.id}">#${a.tag}</option>`).join('')}</select></div><div class="field"><label>التاريخ</label><input name="date" type="date" value="${today()}" required></div><div class="field"><label>مصدر التوجيه</label><select name="guidance" required><option>ملصق المنتج</option><option>طبيب بيطري</option><option>الخدمات البيطرية / وزارة الزراعة</option></select></div></div><div class="source-note">لا يضع النظام جرعة رقمية للقاحات، ولا يضع تكرارًا ثابتًا للأنثراكس لأن المحاضرة ربطته ببرنامج المنطقة.</div><div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">إلغاء</button><button class="btn primary">حفظ</button></div></form>`)}

function treatmentsTab(p){const ts=planTreatments(p.id);return `<div class="alert good" style="margin-bottom:16px"><span class="dot"></span><div><strong>قاعدة أمان الدواء</strong><small>لا تُحسب الجرعة تلقائيًا. سجّل الوزن، جرعة/تركيز العبوة، مصدر التوجيه وفترة السحب. الحقن والمضادات الحيوية تتطلب توثيق الرجوع للطبيب/المتمرس.</small></div></div><div class="card"><div class="section-title"><div><h3>العلاجات والمتابعة</h3><div class="small muted">العلاج منفصل عن برنامج الوقاية، لكنه يشارك معه فترة السحب وحالة الحيوان.</div></div><button class="btn primary small" onclick="openTreatmentModal('${p.id}')">+ تسجيل علاج</button></div><div class="table-wrap"><table><thead><tr><th>العلاج</th><th>الحيوانات</th><th>البداية</th><th>الجرعة/المصدر</th><th>فترة السحب</th><th>الحالة</th><th>التكلفة</th></tr></thead><tbody>${ts.map(t=>`<tr><td><strong>${t.name}</strong><div class="small muted">${t.reason||'-'} • ${t.category==='antibiotic'?'مضاد حيوي':t.category==='preventive'?'وقائي':'علاج/مستحضر آخر'}</div></td><td>${t.animalIds.map(id=>'#'+state.animals.find(a=>a.id===id)?.tag).join('، ')}</td><td>${t.start}</td><td>${t.dose||'-'}${t.concentration?' • '+t.concentration:''}<div class="small muted">${t.doseSource||'-'}</div></td><td>${t.withdrawalUntil?`<span class="badge ${today()<=t.withdrawalUntil?'treat':'active'}">حتى ${t.withdrawalUntil}</span>`:'غير مسجلة/غير مطلوبة'}</td><td>${t.status==='active'?'<span class="badge treat">مستمر</span>':'<span class="badge active">مكتمل</span>'}</td><td>${fmt(t.usedCost)}</td></tr>`).join('')}</tbody></table></div></div>`}

function salesTab(p){const ss=planSales(p.id),s=stats(p),blocked=planAnimals(p.id).filter(a=>a.status!=='sold'&&activeWithdrawal(a.id)),preSale=cycleRemaining(p)>0&&cycleRemaining(p)<=7;return `${preSale?`<div class="alert danger" style="margin-bottom:16px"><span class="dot"></span><div><strong>أسبوع ما قبل موعد البيع المخطط</strong><small>راجع الأدوية وفترات السحب والطبيب. لا تفترض أن 7 أيام تكفي لكل دواء، ولا توقف علاجًا ضروريًا دون توجيه بيطري.</small></div></div>`:''}${blocked.length?`<div class="alert danger" style="margin-bottom:16px"><span class="dot"></span><div><strong>بيع محظور مؤقتًا لـ ${blocked.length} حيوان بسبب فترة السحب</strong><small>${blocked.map(a=>`#${a.tag}: حتى ${activeWithdrawal(a.id)}`).join(' • ')}</small></div></div>`:''}<div class="grid metrics"><div class="metric"><div class="label">الحيوانات المباعة</div><div class="value">${s.sold}</div></div><div class="metric"><div class="label">الإيراد المحقق</div><div class="value">${fmt(s.actualSales)}</div></div><div class="metric"><div class="label">الحيوانات المتبقية</div><div class="value">${s.remaining}</div></div></div><div class="card"><div class="section-title"><div><h3>عمليات البيع</h3><div class="small muted">البيع الجزئي لا يغلق الخطة، وفترة السحب الدوائي تُفحص قبل الحفظ.</div></div><button class="btn primary small" onclick="openSaleModal('${p.id}')">+ تسجيل بيع</button></div><div class="table-wrap"><table><thead><tr><th>التاريخ</th><th>الحيوانات</th><th>المكان</th><th>المشتري</th><th>صافي البيع</th></tr></thead><tbody>${ss.map(x=>`<tr><td>${x.date}</td><td>${x.animalIds.map(id=>'#'+state.animals.find(a=>a.id===id)?.tag).join('، ')}</td><td>${x.place}</td><td>${x.buyer||'-'}</td><td class="money-positive">${fmt(x.amount-x.fees)}</td></tr>`).join('')||'<tr><td colspan="5">لم يتم تسجيل مبيعات لهذه الخطة بعد.</td></tr>'}</tbody></table></div></div>`}
