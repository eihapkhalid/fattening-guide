function updateLecture7SaleCalc(){const f=document.getElementById('lecture7SaleForm'),box=document.getElementById('lecture7SaleCalc');if(!f||!box)return;const method=f.elements.method.value,min=+f.elements.minPrice.value||0,display=+f.elements.displayPrice.value||0;let amount=0;if(method==='weight')amount=(+f.elements.weight.value||0)*(+f.elements.pricePerKg.value||0);else amount=+f.elements.amount.value||0;if(display&&min&&display<min){box.className='assessment bad';box.textContent='سعر العرض أقل من الحد الأدنى؛ راجع الأرقام قبل التفاوض.';return}if(amount&&min&&amount<min){box.className='assessment bad';box.textContent=`القيمة المحسوبة/المدخلة ${fmt(amount)} أقل من حدك الأدنى ${fmt(min)}.`;return}box.className='assessment '+(amount?'ok':'review');box.textContent=amount?`قيمة البيع الحالية: ${fmt(amount)} — الحد الأدنى: ${fmt(min)}`:'أدخل الوزن وسعر الكيلو أو سعر البيع بالرأس.'}

<div class="split"><div class="card"><div class="section-title"><div><h3>خطة السوق</h3><div class="small muted">السعر والطلب يتغيران حسب المكان والوقت؛ أدخل معلوماتك الفعلية.</div></div><button class="btn small" onclick="openMarketPlanModal('${p.id}')">${marketPlanReady(p)?'تحديث':'إعداد'}</button></div>${p.marketPlan?`<div class="sale-guide-grid"><div class="sale-guide"><strong>التوقيت</strong>${demandLabel(m.demandPeriod)}<div class="source-note">${lecture7DemandWarning(m.demandPeriod)}</div></div><div class="sale-guide"><strong>القناة</strong>${channelLabel(m.sellingChannel)}</div><div class="sale-guide"><strong>موعد البيع</strong>${m.saleDate||'-'}</div><div class="sale-guide"><strong>سعر السوق</strong>${m.prices||'-'}</div><div class="sale-guide"><strong>سعر الكيلو القائم</strong>${m.kgMarketPrice?fmt(m.kgMarketPrice):'غير مسجل'}</div><div class="sale-guide"><strong>التسويق المسبق</strong>${salePrepSummary(m)}</div></div>${m.saleDate?`<div class="source-note" style="margin-top:10px">المرجع التشغيلي: بداية دورة 90 يومًا = ${refStart}. بداية خطتك حسب مدة ${p.duration} يومًا = ${actualStart}.</div>`:''}`:empty('لم تُجهز خطة التسويق بعد.')}</div>
<div class="card"><h3>قنوات البيع الثلاث</h3><div class="alerts"><div class="alert"><span class="dot"></span><div><strong>سوق المواشي</strong><small>مشترون أكثر، لكن المساومة قوية وقد يحاول بعض التجار الشراء بسعر منخفض.</small></div></div><div class="alert"><span class="dot"></span><div><strong>من المزرعة/البيت</strong><small>راحة للحيوان وقد يكون السعر أفضل، ويحتاج شبكة زبائن وتسويقًا مسبقًا.</small></div></div><div class="alert"><span class="dot"></span><div><strong>جزار/تاجر</strong><small>مناسب لبيع كمية، لكن السعر عادة أقل من البيع المباشر للمستهلك.</small></div></div></div></div></div>
<div class="card" style="margin-top:16px"><div class="section-title"><div><h3>عمليات البيع والتفاوض</h3><div class="small muted">سعر عرض + حد أدنى + بيع بالوزن أو بالرأس + تجهيز الحيوان.</div></div><button class="btn primary small" onclick="openSaleModal('${p.id}')">+ تسجيل بيع</button></div><div class="table-wrap"><table><thead><tr><th>التاريخ</th><th>الحيوان</th><th>القناة</th><th>التسعير</th><th>سعر العرض</th><th>الحد الأدنى</th><th>المشتري</th><th>صافي البيع</th></tr></thead><tbody>${ss.length?ss.map(x=>{const aid=x.animalIds?.[0],a=state.animals.find(z=>z.id===aid);return `<tr><td>${x.date}</td><td>#${a?.tag||'-'}</td><td>${channelLabel(x.channel)||x.place||'-'}</td><td>${x.method==='weight'?(x.weight?`${x.weight} كجم × ${fmt(x.pricePerKg||0)}`:'بالوزن'):'بالرأس'}</td><td>${x.displayPrice?fmt(x.displayPrice):'-'}</td><td>${x.minPrice?fmt(x.minPrice):'-'}</td><td>${x.buyer||'-'}</td><td class="money-positive">${fmt((x.amount||0)-(x.fees||0))}</td></tr>`}).join(''):'<tr><td colspan="8">لا توجد مبيعات مسجلة.</td></tr>'}</tbody></table></div></div>
<div class="split" style="margin-top:16px"><div class="card"><div class="section-title"><div><h3>الأصول متعددة الدورات</h3><div class="small muted">نحمّل الدورة بنصيبها فقط، لا كامل تكلفة الأصل.</div></div><button class="btn small" onclick="openAssetModal('${p.id}')">+ أصل</button></div><div class="table-wrap"><table><thead><tr><th>الأصل</th><th>التكلفة</th><th>الدورات</th><th>نصيب الدورة</th></tr></thead><tbody>${assets.length?assets.map(a=>`<tr><td>${a.name}</td><td>${fmt(a.totalCost)}</td><td>${a.expectedCycles}</td><td>${fmt(a.totalCost/a.expectedCycles)}</td></tr>`).join(''):'<tr><td colspan="4">لا توجد أصول موزعة على دورات.</td></tr>'}</tbody></table></div></div>
<div class="card"><div class="section-title"><div><h3>الماروق والسماد</h3><div class="small muted">الإيراد الفعلي يدخل في دراسة الجدوى؛ الاستخدام الداخلي يسجل دون قيمة تقديرية غير موثقة.</div></div><button class="btn small" onclick="openOtherRevenueModal('${p.id}')">+ تسجيل</button></div>${ors.length?ors.slice().reverse().map(x=>`<div class="alert good"><span class="dot"></span><div><strong>${x.mode==='sale'?'بيع سماد':x.mode==='use'?'استخدام داخل المزرعة':'إيراد آخر'} — ${x.date}</strong><small>${x.mode==='use'?'دون إيراد نقدي مسجل':fmt(x.amount)} ${x.note?'• '+x.note:''}</small></div></div>`).join(''):empty('لم تسجل استفادة أو إيراد من السماد بعد.')}</div></div>
<div class="card" style="margin-top:16px"><h3>شبكة الزبائن</h3><div class="small muted" style="margin-bottom:12px">الجودة والأمانة ورضا الزبون أساس بناء زبائن يعودون في الدورات التالية.</div><div class="table-wrap"><table><thead><tr><th>الزبون</th><th>الهاتف</th><th>مرات الشراء</th><th>آخر شراء</th></tr></thead><tbody>${customerRows(p)}</tbody></table></div></div>`}

reportsTab = function(p){const e=lecture7Economics(p),all=planAnimals(p.id),fiveCalves=all.length===5&&all.every(a=>a.animalType==='calf'&&Number(a.buyWeight)===200),tenSheep=all.length===10&&all.every(a=>a.animalType==='sheep');return `<div class="grid metrics"><div class="metric"><div class="label">إجمالي التكاليف</div><div class="value">${fmt(e.totalCost)}</div></div><div class="metric"><div class="label">إجمالي الإيرادات المحققة</div><div class="value">${fmt(e.totalRevenue)}</div></div><div class="metric ${e.actualProfit>=0?'good':'warn'}"><div class="label">الربح الفعلي</div><div class="value">${fmt(e.actualProfit)}</div></div><div class="metric"><div class="label">نصيب الأصول</div><div class="value">${fmt(e.assets)}</div></div><div class="metric"><div class="label">إيرادات أخرى</div><div class="value">${fmt(e.otherRevenue)}</div></div></div>
<div class="feasibility-formula">الربح = إجمالي الإيرادات (${fmt(e.totalRevenue)}) − إجمالي التكاليف (${fmt(e.totalCost)}) = ${fmt(e.actualProfit)}</div>
<div class="split" style="margin-top:16px"><div class="card"><h3>تفصيل التكلفة</h3><div class="table-wrap"><table><tbody><tr><td>شراء الحيوانات</td><td>${fmt(e.buy)}</td></tr><tr><td>العلف المستهلك</td><td>${fmt(e.feed)}</td></tr><tr><td>الصحة والعلاج</td><td>${fmt(e.health)}</td></tr><tr><td>ماء/كهرباء/عمالة/نقل ومصروفات فعلية</td><td>${fmt(e.expenses)}</td></tr><tr><td>نصيب الدورة من الأصول</td><td>${fmt(e.assets)}</td></tr><tr><th>الإجمالي</th><th>${fmt(e.totalCost)}</th></tr></tbody></table></div></div><div class="card"><h3>تفصيل الإيرادات</h3><div class="table-wrap"><table><tbody><tr><td>صافي بيع الحيوانات</td><td>${fmt(e.animalRevenue)}</td></tr><tr><td>بيع السماد/إيرادات أخرى فعلية</td><td>${fmt(e.otherRevenue)}</td></tr><tr><th>الإجمالي</th><th>${fmt(e.totalRevenue)}</th></tr></tbody></table></div></div></div>
<div class="card" style="margin-top:16px"><h3>مطابقة النموذج المرجعي</h3><div class="alerts"><div class="alert ${fiveCalves?'good':''}"><span class="dot"></span><div><strong>مثال خمسة عجول</strong><small>${fiveCalves?'الخطة تطابق عدد ووزن بداية المثال المرجعي (5 × 200 كجم). الوزن المرجعي المستهدف عند اليوم 90 = 1,450 كجم إجمالًا، وليس ضمانًا.':'المثال المرجعي المرجعي: 5 عجول × وزن مستهدف 290 كجم = 1,450 كجم. لا يفرض على خطة لا تطابق المثال.'}</small></div></div><div class="alert ${tenSheep?'good':''}"><span class="dot"></span><div><strong>تمرين 10 خراف</strong><small>${tenSheep?'هذه الخطة تحتوي 10 خراف؛ الدراسة الحالية تجمع شراء + علف + صحة + مصروفات + نصيب الأصول، ثم الإيرادات الفعلية.':'يمكن تطبيق نفس معادلة الدراسة على 10 خراف باستخدام أسعار السوق الفعلية؛ لا توجد حلًا رقميًا ثابتًا.'}</small></div></div></div></div>
<div class="card" style="margin-top:16px"><h3>مقارنة أداء الحيوانات</h3>${animalTable(p)}</div>`}

render();
</script>

<script>
/* UX_SIMPLIFICATION_V1 */
(function(){
  if(typeof state==='undefined') return;
  if(typeof state.uxGuidance!=='boolean') state.uxGuidance=false;
  if(['daily','feeds','treatments','expenses'].includes(state.currentPage)) state.currentPage='plans';

  const uxFullFeedingTab = typeof feedingTab==='function' ? feedingTab : null;
  const uxFullHealthTab = typeof healthTab==='function' ? healthTab : null;
  const uxFullSalesTab = typeof salesTab==='function' ? salesTab : null;

  function uxPhase(p){
    try{return typeof cyclePhase==='function'?cyclePhase(p):{name:'الدورة',key:'active'}}catch(_){return{name:'الدورة',key:'active'}}
  }
  function uxDay(p){try{return typeof cycleDay==='function'?cycleDay(p):Math.max(1,daysPassed(p)+1)}catch(_){return 1}}
  function uxNavKey(tab){return ['shelter','feeds','treatments','expenses','reports','cycle','daily'].includes(tab)?'more':tab}
  function uxBtnAction(label,fn,kind='') {return `<button class="btn small ${kind}" onclick="${fn}">${label}</button>`}
  function uxDaysSince(date){if(!date)return 999;const a=new Date(date+'T00:00:00'),b=new Date(today()+'T00:00:00');return Math.max(0,Math.floor((b-a)/86400000))}

  window.toggleUxGuidance=function(){state.uxGuidance=!state.uxGuidance;save();render()}
  window.openUxActions=function(pid){
    const hasEmergency=typeof openEmergencyModal==='function';
    modal(`<div class="modal-head"><div><h3>إجراء سريع</h3><div class="small muted">اختر المهمة فقط؛ التفاصيل ستظهر في الخطوة التالية.</div></div><button class="close" onclick="closeModal()">×</button></div>
      <div class="ux-more-grid">
        <div class="ux-more-card"><h3>✎ تسجيل اليوم</h3><p>وزن، حالة وملاحظة للحيوانات.</p><button class="btn primary" onclick="closeModal();openDailyModal('${pid}')">ابدأ</button></div>
        <div class="ux-more-card"><h3>🐄 إضافة حيوان</h3><p>اختيار وفحص الحيوان ثم إضافته للخطة.</p><button class="btn" onclick="closeModal();openAnimalModal('${pid}')">ابدأ</button></div>
        <div class="ux-more-card"><h3>🌾 شراء علف</h3><p>إضافة الكمية إلى المخزون.</p><button class="btn" onclick="closeModal();openFeedModal('${pid}')">ابدأ</button></div>
        <div class="ux-more-card"><h3>✚ تسجيل علاج</h3><p>علاج موثق مع فترة السحب عند الحاجة.</p><button class="btn" onclick="closeModal();openTreatmentModal('${pid}')">ابدأ</button></div>
        <div class="ux-more-card"><h3>◒ إضافة مصروف</h3><p>أي تكلفة فعلية مرتبطة بالدورة.</p><button class="btn" onclick="closeModal();openExpenseModal('${pid}')">ابدأ</button></div>
        <div class="ux-more-card"><h3>↗ تسجيل بيع</h3><p>بيع حيوان مع فحص فترة السحب والتسعير.</p><button class="btn" onclick="closeModal();openSaleModal('${pid}')">ابدأ</button></div>
        ${hasEmergency?`<div class="ux-more-card"><h3>🚨 تدخل سريع</h3><p>نفاخ، حموضة، إسهال أو طفيليات خارجية.</p><button class="btn danger" onclick="closeModal();openEmergencyModal('${pid}')">فتح</button></div>`:''}
      </div>`)
  }

  function uxAttention(p){
    const items=[];
    const animals=planAnimals(p.id).filter(a=>a.status!=='sold');
    if(!p.shelter?.ready) items.push({level:'danger',title:'جهّز الزريبة أولًا',sub:'التجهيز غير مكتمل، وهذا يمنع إضافة حيوانات جديدة.',act:`setTab('shelter')`,label:'فتح'});
    const pending=animals.filter(a=>a.health?.arrivalCompleted===false||a.health?.arrivalCompleted==null);
    if(pending.length) items.push({level:'warn',title:`استقبال صحي لـ ${pending.length} حيوان`,sub:'وثّق العزل والاستقبال قبل اعتبار الحيوان مستقرًا.',act:`setTab('health')`,label:'متابعة'});
    if(typeof planEmergencies==='function'){
      const open=planEmergencies(p.id).filter(e=>e.status!=='resolved');
      if(open.length) items.push({level:'danger',title:`${open.length} حالة تدخل سريع مفتوحة`,sub:'راجع الحالة وتواصل مع الطبيب عند الحاجة.',act:`setTab('health')`,label:'فتح'});
    }
    const wd=animals.filter(a=>typeof activeWithdrawal==='function'&&activeWithdrawal(a.id));
    if(wd.length) items.push({level:'warn',title:`${wd.length} حيوان داخل فترة سحب`,sub:'لن يسمح النظام ببيعه قبل انتهاء الفترة المسجلة.',act:`setTab('sales')`,label:'مراجعة'});
    const low=planFeeds(p.id).filter(f=>(Number(f.qtyKg)||0)>0 && ((Number(f.qtyKg)||0)-(Number(f.usedKg)||0))/(Number(f.qtyKg)||1)<=.2);
    if(low.length) items.push({level:'warn',title:'مخزون علف منخفض',sub:`${low.length} صنف وصل إلى 20% أو أقل من الكمية المشتراة.`,act:`setTab('feeds')`,label:'المخزون'});
    const due=animals.filter(a=>{const w=a.weights?.at(-1);return w&&uxDaysSince(w.date)>=15});
    if(due.length) items.push({level:'warn',title:`موعد وزن ${due.length} حيوان`,sub:'مرّ 15 يومًا أو أكثر على آخر وزن مسجل.',act:`openDailyModal('${p.id}')`,label:'تسجيل وزن'});
    if(uxDay(p)>=60 && typeof marketPlanReady==='function' && !marketPlanReady(p)) items.push({level:'warn',title:'خطة البيع غير مكتملة',sub:'اقتربت مرحلة البيع؛ حدّد السوق والتوقيت والأسعار.',act:`setTab('sales')`,label:'إعداد'});
    return items.slice(0,4);
  }

  function uxAttentionHtml(p){
    const list=uxAttention(p);
    if(!list.length) return `<div class="ux-task good"><div><strong>لا توجد مهمة حرجة الآن</strong><small>استمر في التسجيل اليومي والمتابعة المعتادة.</small></div><button class="btn small" onclick="openDailyModal('${p.id}')">تسجيل اليوم</button></div>`;
    return list.map(x=>`<div class="ux-task ${x.level}"><div><strong>${x.title}</strong><small>${x.sub}</small></div><button class="btn small" onclick="${x.act}">${x.label}</button></div>`).join('');
  }

  window.layout=function(body,title,sub=''){
    const navClient=[['dashboard','⌂','الرئيسية'],['plans','▣','خططي'],['sales','↗','البيع'],['reports','▥','التقارير']];
    const navAdmin=[['dashboard','⌂','لوحة الإدارة'],['clients','♟','العملاء'],['plans','▣','الخطط'],['reports','▥','التقارير']];
    const nav=state.role==='admin'?navAdmin:navClient;
    return `<div class="app ux-app ${state.uxGuidance?'ux-show-guidance':''}"><div class="sidebar-backdrop" onclick="closeMenu()"></div><aside class="sidebar">
      <div class="brand"><div class="brand-badge">🐄</div><div><h1>إدارة التسمين</h1><p>متابعة الدورة</p></div></div>
      <div class="nav-section">الرئيسية</div>${nav.map(n=>`<button class="nav-btn ${state.currentPage===n[0]?'active':''}" onclick="route('${n[0]}')"><span>${n[1]}</span><span>${n[2]}</span></button>`).join('')}
    </aside><main class="main"><header class="topbar"><div style="display:flex;align-items:center;gap:12px"><button class="mobile-toggle" onclick="toggleMenu()">☰</button><div><div class="topbar-title">${title}</div><div class="topbar-sub">${sub}</div></div></div>
      <div class="top-actions"><button class="ux-icon-btn" onclick="toggleUxGuidance()" title="${state.uxGuidance?'إخفاء الشروحات':'إظهار الشروحات'}">؟ <span class="ux-guidance-label">${state.uxGuidance?'إخفاء الشرح':'الشرح'}</span></button><button class="ux-icon-btn" onclick="setRole(state.role==='client'?'admin':'client')" title="تبديل وضع العرض">⇄ ${state.role==='client'?'أدمن':'عميل'}</button><div class="avatar">${state.role==='admin'?'A':client().name[0]}</div></div></header><section class="content">${body}</section></main></div>`;
  }

  function uxPlanRow(p){const s=stats(p),ph=uxPhase(p);return `<div class="ux-plan-row"><div><strong>${p.name}</strong><div class="ux-quiet">اليوم ${uxDay(p)} • ${ph.name} • ${statusBadge(p.status)}</div></div><div class="ux-stat"><div class="label">الحيوانات</div><div class="value">${s.remaining}</div></div><div class="ux-stat"><div class="label">التكلفة</div><div class="value">${fmt(s.total)}</div></div><div class="ux-stat ux-hide-mid"><div class="label">الربح المتوقع</div><div class="value">${fmt(s.profit)}</div></div><button class="btn primary small" onclick="openPlan('${p.id}')">فتح</button></div>`}

  window.dashboard=function(){
    if(state.role==='admin') return adminDashboard();
    const ps=state.plans.filter(p=>p.clientId===state.currentClientId),active=ps.filter(p=>p.status==='active'||p.status==='selling');
    const agg=active.reduce((a,p)=>{const s=stats(p);a.animals+=s.remaining;a.cost+=s.total;a.expected+=s.expected;a.profit+=s.profit;return a},{animals:0,cost:0,expected:0,profit:0});
    const attentions=active.flatMap(p=>uxAttention(p).map(x=>({...x,pid:p.id,pname:p.name}))).slice(0,4);
    const attentionHtml=attentions.length?attentions.map(x=>`<div class="ux-task ${x.level}"><div><strong>${x.title}</strong><small>${x.pname} • ${x.sub}</small></div><button class="btn small" onclick="openPlan('${x.pid}');${x.act}">${x.label}</button></div>`).join(''):`<div class="ux-task good"><div><strong>الأمور مستقرة</strong><small>لا توجد مهام حرجة في الخطط النشطة الآن.</small></div></div>`;
    const body=`<div class="page-head"><div><h2>مرحبًا، ${client().name}</h2><p>ما الذي يحتاج انتباهك اليوم؟</p></div><div class="actions"><button class="btn primary" onclick="openPlanModal()">+ خطة جديدة</button></div></div>
      <div class="grid metrics ux-compact-metrics"><div class="metric"><div class="label">الحيوانات الحالية</div><div class="value">${agg.animals}</div></div><div class="metric"><div class="label">التكلفة الحالية</div><div class="value">${fmt(agg.cost)}</div></div><div class="metric"><div class="label">البيع المتوقع</div><div class="value">${fmt(agg.expected)}</div></div><div class="metric good"><div class="label">الربح المتوقع</div><div class="value">${fmt(agg.profit)}</div></div></div>
      <div class="split"><div class="card"><div class="section-title"><div><h3>خططي النشطة</h3><div class="ux-quiet">افتح الخطة لتسجيل العمل اليومي.</div></div><button class="btn small" onclick="route('plans')">كل الخطط</button></div><div class="ux-plan-list">${active.map(uxPlanRow).join('')||empty('لا توجد خطط نشطة')}</div></div><div class="card"><h3>يحتاج انتباهك</h3><div class="ux-task-list">${attentionHtml}</div></div></div>`;
    return layout(body,'الرئيسية','مهام اليوم أولًا');
  }

  window.planPage=function(){
    const p=plan();if(!p)return plansPage();const s=stats(p),ph=uxPhase(p),navKey=uxNavKey(state.planTab||'overview');
    const tabs=[['overview','اليوم'],['animals','الحيوانات'],['feeding','التغذية'],['health','الصحة'],['sales','البيع'],['more','المزيد']];
    const head=`<div class="plan-summary"><div class="row"><div><div style="margin-bottom:7px">${statusBadge(p.status)} <span class="badge">اليوم ${uxDay(p)} • ${ph.name}</span></div><h2>${p.name}</h2><p>${state.clients.find(c=>c.id===p.clientId)?.name||''} • البداية ${p.start}</p></div><div class="actions"><button class="btn primary" onclick="openDailyModal('${p.id}')">✎ تسجيل اليوم</button><button class="btn" onclick="openUxActions('${p.id}')">＋ إجراءات</button></div></div><div class="kpis"><div class="kpi"><span>الحيوانات الحالية</span><strong>${s.remaining}</strong></div><div class="kpi"><span>إجمالي التكلفة</span><strong>${fmt(s.total)}</strong></div><div class="kpi"><span>الربح المتوقع</span><strong>${fmt(s.profit)}</strong></div></div></div><div class="tabs">${tabs.map(t=>`<button class="tab ${navKey===t[0]?'active':''}" onclick="setTab('${t[0]}')">${t[1]}</button>`).join('')}</div>`;
    return layout(head+tabContent(p,s),p.name,'نفّذ المهمة المطلوبة فقط');
  }

  window.overviewTab=function(p,s){
    const ph=uxPhase(p),items=uxAttention(p),animals=planAnimals(p.id).filter(a=>a.status!=='sold');
    const avg=animals.length?animals.reduce((z,a)=>z+(Number(a.weights?.at(-1)?.value)||Number(a.buyWeight)||0),0)/animals.length:0;
    const gain=animals.reduce((z,a)=>z+((Number(a.weights?.at(-1)?.value)||Number(a.buyWeight)||0)-(Number(a.buyWeight)||0)),0);
    return `<div class="ux-focus-card"><h3>ماذا تحتاج أن تفعل الآن؟</h3><div class="ux-quiet">بدل عرض كل تفاصيل الدورة، نعرض فقط ما يحتاج إجراء.</div><div class="ux-task-list">${uxAttentionHtml(p)}</div></div>
      <div class="ux-mini-grid"><div class="ux-mini"><span>مرحلة الدورة</span><strong>${ph.name}</strong><div class="ux-quiet">اليوم ${uxDay(p)}</div></div><div class="ux-mini"><span>متوسط الوزن الحالي</span><strong>${avg?avg.toFixed(1):'—'} كجم</strong></div><div class="ux-mini"><span>إجمالي الزيادة الحالية</span><strong>+${gain.toFixed(1)} كجم</strong></div></div>
      <div class="card"><div class="section-title"><div><h3>اختصارات اليوم</h3><div class="ux-quiet">أكثر المهام استخدامًا فقط.</div></div></div><div class="ux-action-strip"><button class="btn primary" onclick="openDailyModal('${p.id}')">✎ وزن وحالة</button>${typeof openFeedingLogModal==='function'?`<button class="btn" onclick="openFeedingLogModal('${p.id}')">🌾 تغذية اليوم</button>`:''}${typeof openHealthDailyModal==='function'?`<button class="btn" onclick="openHealthDailyModal('${p.id}')">♡ متابعة صحية</button>`:''}<button class="btn" onclick="openExpenseModal('${p.id}')">◒ مصروف</button></div></div>`;
  }

  window.moreTab=function(p){
    const shelter=p.shelter?.ready?'جاهزة':'تحتاج إعداد',feeds=planFeeds(p.id).length,treat=planTreatments(p.id).filter(t=>t.status==='active').length,expenses=planExpenses(p.id).length;
    const cycleBtn=typeof cycleTab==='function'?`<div class="ux-more-card"><h3>خطة 90–120 يوم</h3><p>المراحل، التقدم وأهداف الدورة.</p><button class="btn small" onclick="setTab('cycle')">فتح</button></div>`:'';
    return `<div class="card"><div class="section-title"><div><h3>إدارة متقدمة</h3><div class="ux-quiet">هذه الأشياء مهمة، لكنها ليست مهامًا تحتاجها في كل زيارة.</div></div></div><div class="ux-more-grid"><div class="ux-more-card"><h3>الزريبة</h3><p>الحالة: ${shelter}</p><button class="btn small" onclick="setTab('shelter')">فتح</button></div>${cycleBtn}<div class="ux-more-card"><h3>مخزون الأعلاف</h3><p>${feeds} صنف مسجل.</p><button class="btn small" onclick="setTab('feeds')">فتح</button></div><div class="ux-more-card"><h3>العلاجات</h3><p>${treat} علاج مستمر.</p><button class="btn small" onclick="setTab('treatments')">فتح</button></div><div class="ux-more-card"><h3>المصروفات</h3><p>${expenses} حركة مصروف.</p><button class="btn small" onclick="setTab('expenses')">فتح</button></div><div class="ux-more-card"><h3>دراسة الجدوى والتقارير</h3><p>التكلفة والإيراد والربح والأصول.</p><button class="btn small" onclick="setTab('reports')">فتح</button></div></div></div>`;
  }

  window.tabContent=function(p,s){
    if(state.planTab==='more')return moreTab(p);
    if(state.planTab==='shelter')return shelterTab(p);
    if(state.planTab==='animals')return animalsTab(p);
    if(state.planTab==='daily')return dailyTab(p);
    if(state.planTab==='feeding')return feedingTab(p);
    if(state.planTab==='feeds')return feedsTab(p);
    if(state.planTab==='health')return healthTab(p);
    if(state.planTab==='treatments')return treatmentsTab(p);
    if(state.planTab==='expenses')return expensesTab(p);
    if(state.planTab==='sales')return salesTab(p);
    if(state.planTab==='reports')return reportsTab(p);
    if(state.planTab==='cycle'&&typeof cycleTab==='function')return cycleTab(p);
    return overviewTab(p,s);
  }

  if(uxFullFeedingTab){
    window.feedingTab=function(p){
      const animals=planAnimals(p.id).filter(a=>a.status!=='sold');
      const type=typeof feedingAnimalType==='function'?feedingAnimalType(p):null;
      const totalC=type&&typeof concentrateTarget==='function'&&typeof latestWeightRecord==='function'?animals.reduce((z,a)=>z+Number(concentrateTarget(latestWeightRecord(a).value)||0),0):0;
      const due=typeof latestWeightRecord==='function'?animals.filter(a=>uxDaysSince(latestWeightRecord(a).date)>=15).length:0;
      const todayLogs=typeof planFeedingLogs==='function'?planFeedingLogs(p.id).filter(x=>x.date===today()).length:0;
      return `<div class="grid metrics ux-compact-metrics"><div class="metric hero"><div class="label">مركزات اليوم للقطيع</div><div class="value">${totalC?totalC.toFixed(2):'—'}</div><div class="note">كجم حسب آخر الأوزان</div></div><div class="metric ${due?'warn':'good'}"><div class="label">وزن مستحق</div><div class="value">${due}</div></div><div class="metric"><div class="label">سجلات تغذية اليوم</div><div class="value">${todayLogs}</div></div><div class="metric"><div class="label">أصناف المخزون</div><div class="value">${planFeeds(p.id).length}</div></div></div><div class="card"><div class="section-title"><div><h3>التغذية اليوم</h3><div class="ux-quiet">نفّذ التسجيل أولًا، وارجع للتفاصيل فقط عند الحاجة.</div></div></div><div class="ux-action-strip">${typeof openFeedingLogModal==='function'?`<button class="btn primary" onclick="openFeedingLogModal('${p.id}')">+ تسجيل تغذية اليوم</button>`:''}<button class="btn" onclick="setTab('feeds')">مخزون الأعلاف</button><button class="btn" onclick="openDailyModal('${p.id}')">تسجيل وزن</button></div></div><details class="ux-details"><summary>عرض الخلطات والتدرج والتخزين والإرشادات</summary><div class="ux-details-body">${uxFullFeedingTab(p)}</div></details>`;
    }
  }

  if(uxFullHealthTab){
    window.healthTab=function(p){
      const animals=planAnimals(p.id).filter(a=>a.status!=='sold');
      const pending=animals.filter(a=>a.health?.arrivalCompleted===false||a.health?.arrivalCompleted==null).length;
      const withdraw=animals.filter(a=>typeof activeWithdrawal==='function'&&activeWithdrawal(a.id)).length;
      const emergencies=typeof planEmergencies==='function'?planEmergencies(p.id).filter(e=>e.status!=='resolved').length:0;
      return `<div class="grid metrics ux-compact-metrics"><div class="metric ${emergencies?'warn':'good'}"><div class="label">حالات طارئة مفتوحة</div><div class="value">${emergencies}</div></div><div class="metric ${pending?'warn':'good'}"><div class="label">استقبال غير مكتمل</div><div class="value">${pending}</div></div><div class="metric ${withdraw?'warn':'good'}"><div class="label">فترة سحب فعالة</div><div class="value">${withdraw}</div></div><div class="metric"><div class="label">الحيوانات الحالية</div><div class="value">${animals.length}</div></div></div><div class="card"><div class="section-title"><div><h3>الصحة الآن</h3><div class="ux-quiet">اختر الإجراء المطلوب فقط.</div></div></div><div class="ux-action-strip">${typeof openHealthDailyModal==='function'?`<button class="btn primary" onclick="openHealthDailyModal('${p.id}')">♡ متابعة صحية</button>`:''}${typeof openEmergencyModal==='function'?`<button class="btn danger" onclick="openEmergencyModal('${p.id}')">🚨 تدخل سريع</button>`:''}${typeof openArrivalHealthModal==='function'?`<button class="btn" onclick="openArrivalHealthModal('${p.id}')">استقبال وعزل</button>`:''}${typeof openPreventiveEventModal==='function'?`<button class="btn" onclick="openPreventiveEventModal('${p.id}')">وقاية/تحصين</button>`:''}<button class="btn" onclick="setTab('treatments')">العلاجات</button></div></div><details class="ux-details"><summary>عرض السجل الصحي الكامل والإرشادات</summary><div class="ux-details-body">${uxFullHealthTab(p)}</div></details>`;
    }
  }

  if(uxFullSalesTab){
    window.salesTab=function(p){
      const econ=typeof lecture7Economics==='function'?lecture7Economics(p):null;
      const animals=planAnimals(p.id),blocked=animals.filter(a=>a.status!=='sold'&&typeof activeWithdrawal==='function'&&activeWithdrawal(a.id));
      const sold=animals.filter(a=>a.status==='sold').length,marketReady=typeof marketPlanReady==='function'?marketPlanReady(p):!!p.marketPlan;
      return `<div class="grid metrics ux-compact-metrics"><div class="metric"><div class="label">المباع</div><div class="value">${sold}</div></div><div class="metric"><div class="label">إجمالي التكلفة</div><div class="value">${fmt(econ?.totalCost??stats(p).total)}</div></div><div class="metric"><div class="label">الإيراد المحقق</div><div class="value">${fmt(econ?.totalRevenue??stats(p).actualSales)}</div></div><div class="metric ${(econ?.actualProfit??0)>=0?'good':'warn'}"><div class="label">الربح المحقق</div><div class="value">${fmt(econ?.actualProfit??0)}</div></div></div>${blocked.length?`<div class="ux-task danger" style="margin-bottom:12px"><div><strong>${blocked.length} حيوان لا يمكن بيعه الآن</strong><small>فترة السحب الدوائي ما زالت فعالة.</small></div></div>`:''}<div class="card"><div class="section-title"><div><h3>البيع</h3><div class="ux-quiet">جهّز السوق ثم سجّل الصفقة.</div></div></div><div class="ux-action-strip"><button class="btn ${marketReady?'':'primary'}" onclick="openMarketPlanModal('${p.id}')">${marketReady?'تحديث خطة السوق':'إعداد خطة السوق'}</button><button class="btn primary" onclick="openSaleModal('${p.id}')">+ تسجيل بيع</button>${typeof openOtherRevenueModal==='function'?`<button class="btn" onclick="openOtherRevenueModal('${p.id}')">+ إيراد آخر/سماد</button>`:''}</div></div><details class="ux-details"><summary>عرض التفاوض، القنوات، الزبائن والأصول ودراسة البيع</summary><div class="ux-details-body">${uxFullSalesTab(p)}</div></details>`;
    }
  }

  save();
  render();
})();
</script>


<script>
/* BEGINNER_FLOW_V2_JS */
(()=>{
  const _detailedHealth=window.openHealthDailyModal;
  const _detailedFeeding=window.openFeedingLogModal;
  function ezDateDays(date){if(!date)return 999;const a=new Date(date+'T00:00:00'),b=new Date(today()+'T00:00:00');return Math.max(0,Math.floor((b-a)/86400000))}
  window.ezDay=function ezDay(p){const a=new Date(p.start+'T00:00:00'),b=new Date(today()+'T00:00:00');if(b<a)return 0;return Math.floor((b-a)/86400000)+1}
  window.ezPhase=function ezPhase(p){const d=ezDay(p);return d===0?'قبل البداية':d<=21?'التأسيس':d<=66?'بناء اللحم':d<=90?'التشطيب':d<=Number(p.duration||90)?'تمديد مراقَب':'انتهت المدة'}
  function ezAnimals(p){return planAnimals(p.id).filter(a=>a.status!=='sold')}
  function ezPendingArrival(p){return ezAnimals(p).filter(a=>a.health?.arrivalCompleted!==true)}
  function ezOpenEmergencies(p){return typeof planEmergencies==='function'?planEmergencies(p.id).filter(e=>e.status!=='resolved'):[]}
  function ezFeedDone(p){return typeof planFeedingLogs==='function'&&planFeedingLogs(p.id).some(x=>x.date===today())}
  function ezHealthDoneIds(p){const logs=typeof planHealthLogs==='function'?planHealthLogs(p.id).filter(x=>x.date===today()):[];return new Set(logs.map(x=>x.animalId))}
  function ezAllHealthDone(p){const a=ezAnimals(p);const done=ezHealthDoneIds(p);return a.length>0&&a.every(x=>done.has(x.id))}
  function ezDueWeight(p){return ezAnimals(p).filter(a=>{const w=a.weights?.at(-1);return !w||ezDateDays(w.date)>=15})}
  function ezStockReady(p){const fs=planFeeds(p.id);const rem=f=>(Number(f.qtyKg)||0)-(Number(f.usedKg)||0);return fs.some(f=>f.category==='concentrate'&&rem(f)>0)&&fs.some(f=>f.category==='roughage'&&rem(f)>0)}
  window.ezNext=function ezNext(p){
    const animals=ezAnimals(p),em=ezOpenEmergencies(p),pending=ezPendingArrival(p),due=ezDueWeight(p);
    if(em.length)return{key:'emergency',title:'راجع الحالة الطارئة الآن',sub:`لديك ${em.length} حالة مفتوحة. السلامة أولًا قبل أي تسجيل آخر.`,button:'فتح الصحة'};
    if(!p.shelter?.ready)return{key:'shelter',title:'جهّز الزريبة',sub:'هذه أول خطوة. لن تحتاج التفكير في الحيوانات أو العلف قبل تجهيز المكان.',button:'ابدأ تجهيز الزريبة'};
    if(!animals.length)return{key:'animal',title:'أضف أول حيوان',sub:'الزريبة جاهزة. الآن سجّل الحيوان بعد فحصه.',button:'إضافة حيوان'};
    if(pending.length)return{key:'arrival',title:'وثّق استقبال الحيوان',sub:`يوجد ${pending.length} حيوان لم يكتمل استقبالُه الصحي بعد.`,button:'تسجيل الاستقبال'};
    if(!ezStockReady(p))return{key:'stock',title:'أدخل العلف الموجود عندك',sub:'سجّل علفًا مركزًا وعلفًا مالئًا حتى يستطيع النظام متابعة الاستهلاك.',button:'إضافة علف للمخزون'};
    if(!ezFeedDone(p))return{key:'feed',title:'سجّل تغذية اليوم',sub:'أدخل ما قدمته للقطيع اليوم. الكمية المقترحة ستظهر لك تلقائيًا.',button:'تسجيل التغذية'};
    if(!ezAllHealthDone(p))return{key:'health',title:'افحص الحيوانات صحيًا',sub:'إذا كان الجميع طبيعيًا يمكنك إنهاء الفحص بضغطة واحدة.',button:'فحص الصحة'};
    if(due.length)return{key:'weight',title:`سجّل وزن ${due.length} حيوان`,sub:'حان موعد الوزن الدوري. أدخل الوزن فقط؛ لا تحتاج تعبئة بقية السجل.',button:'تسجيل الوزن'};
    if(ezDay(p)>=60&&typeof marketPlanReady==='function'&&!marketPlanReady(p))return{key:'market',title:'جهّز خطة البيع',sub:'اقترب وقت البيع. حدّد السوق والتوقيت والأسعار قبل الوصول إلى يوم البيع.',button:'تجهيز البيع'};
    return{key:'done',title:'مهام اليوم مكتملة',sub:'لا يوجد شيء مطلوب الآن. سجّل فقط أي مصروف أو علاج أو حدث جديد إذا حدث.',button:'إجراء آخر'};
  }
  window.ezRunNext=function(pid){const p=plan(pid),n=ezNext(p);if(n.key==='emergency'){setTab('health');return}if(n.key==='shelter'){setTab('shelter');return}if(n.key==='animal'){openAnimalModal(pid);return}if(n.key==='arrival'){openArrivalHealthModal(pid);return}if(n.key==='stock'){openFeedModal(pid);return}if(n.key==='feed'){openFeedingLogModal(pid);return}if(n.key==='health'){openHealthDailyModal(pid);return}if(n.key==='weight'){openEasyWeightModal(pid);return}if(n.key==='market'){setTab('sales');return}openEasyActions(pid)}

  function ezSetupHtml(p){
    const animals=ezAnimals(p),pending=ezPendingArrival(p);const steps=[
      {done:!!p.shelter?.ready,title:'جهّز الزريبة',sub:p.shelter?.ready?'تم':'ابدأ من هنا'},
      {done:animals.length>0,title:'أضف الحيوانات',sub:animals.length?`${animals.length} حيوان`:'لم تضف بعد'},
      {done:animals.length>0&&!pending.length,title:'سجل الاستقبال',sub:pending.length?`${pending.length} غير مكتمل`:(animals.length?'تم':'بعد إضافة الحيوان')},
      {done:animals.length>0&&!pending.length&&ezStockReady(p),title:'ابدأ المتابعة',sub:ezStockReady(p)?'جاهز':'أدخل العلف'}];

  window.saveFxRatesV3=function(ev){ev.preventDefault();const f=new FormData(ev.target),sar=Number(f.get('sarRate'))||0,usd=Number(f.get('usdRate'))||0;if(sar<=0){alert('أدخل سعر صرف الريال مقابل الجنيه السوداني. مثال الصيغة: 1 ريال = عدد من الجنيهات السودانية.');return}state.fxRates={SARtoSDG:sar,USDtoSDG:usd,updatedAt:today()};save();render()}

  window.feedsTab=function(p){
    const fs=planFeeds(p.id),purchased=fs.reduce((z,f)=>z+(Number(f.qtyKg)||0)*(Number(f.unitCost)||0),0),used=fs.reduce((z,f)=>z+(Number(f.usedKg)||0)*(Number(f.unitCost)||0),0),remaining=purchased-used;

    return `<div class="card"><div class="feed-toolbar"><div><h3 style="margin:0">الأعلاف والأسعار</h3><div class="small muted">الأسعار المالية داخل الحسابات تُوحّد بالجنيه السوداني، مع الاحتفاظ بالسعر الأصلي وعملة الشراء.</div></div><button class="btn primary" onclick="openFeedModal('${p.id}')"><span class="icon-button-label">${uiIcon('plus',17)} إضافة أعلاف</span></button></div><form class="fx-panel" onsubmit="saveFxRatesV3(event)"><div class="fx-note"><strong>سعر الصرف اليدوي</strong><br>لأن سعر الصرف يتغير، أدخله أنت ويستخدمه النظام في التحويل. لا يتم جلب سعر تلقائي من الإنترنت.</div><div class="field"><label>1 ريال سعودي = كم جنيه سوداني؟</label><input name="sarRate" type="number" min="0" step=".01" value="${rates.SARtoSDG||''}" placeholder="أدخل السعر" required></div><div class="field"><label>1 دولار = كم جنيه سوداني؟</label><input name="usdRate" type="number" min="0" step=".01" value="${rates.USDtoSDG||''}" placeholder="اختياري حتى تستخدم الدولار"></div><button class="btn" type="submit">حفظ الصرف</button></form><div class="grid metrics ux-compact-metrics"><div class="metric"><div class="label">قيمة المشتريات</div><div class="value">${moneyV3(purchased,'SDG')}</div></div><div class="metric"><div class="label">العلف المستهلك</div><div class="value">${moneyV3(used,'SDG')}</div></div><div class="metric"><div class="label">قيمة المخزون المتبقي</div><div class="value">${moneyV3(remaining,'SDG')}</div></div><div class="metric"><div class="label">أصناف مسجلة</div><div class="value">${fs.length}</div></div></div><div style="margin-top:14px">${cards?`<div class="feed-stock-grid">${cards}</div>`:`<div class="feed-empty">${uiIcon('feed',28)}<div style="margin-top:7px">لا توجد أعلاف في المخزون بعد. اضغط «إضافة أعلاف» واخترها من القائمة.</div></div>`}</div></div>`;

  function catalogHtmlV3(){const groups=[...new Set(FEED_CATALOG_V3.map(x=>x.group))];return groups.map(g=>`<div class="feed-catalog-section"><h4>${g}</h4><div class="feed-picker-grid">${FEED_CATALOG_V3.filter(x=>x.group===g).map(x=>`<label class="feed-pick"><input type="checkbox" name="feedCode" value="${x.code}" onchange="toggleFeedPurchaseV3('${x.code}',this.checked)"><span class="feed-symbol">${uiIcon(feedIconV3(x.category),17)}</span><span><strong>${x.name}</strong><small>${feedCatV3(x.category)}</small></span></label>`).join('')}</div></div>`).join('')}

  window.openFeedModal=function(pid){const r=state.fxRates||{};modal(`<div class="modal-head"><div><h3>إضافة أعلاف للمخزون</h3><div class="small muted">1) اختر الأعلاف من القائمة  2) أدخل الكمية والسعر  3) احفظ.</div></div><button class="close" onclick="closeModal()">×</button></div><div class="ez-modal-intro"><strong>العملات المتاحة:</strong> جنيه سوداني، ريال سعودي، دولار. ${r.SARtoSDG?`سعر الريال المحفوظ: 1 ر.س = ${moneyV3(r.SARtoSDG,'SDG')}`:'لم تسجل سعر صرف الريال بعد.'}</div><form id="feedPurchaseV3" onsubmit="createFeedChecklistV3(event,'${pid}')" oninput="updateFeedPurchasePreviewV3()"><div class="feed-catalog-groups">${catalogHtmlV3()}</div><div id="feedSelectedV3" class="feed-selected-list"></div><div class="selection-box"><h4>فحص ظاهر للأعلاف المختارة</h4><div class="check-grid"><label class="check-item"><input type="checkbox" name="cleanDry">جافة ونظيفة ولا يوجد بلل أو رائحة منفرة ظاهرة</label><label class="check-item"><input type="checkbox" name="noMold">لا توجد علامات عفن ظاهرة</label></div></div><div class="field" style="margin-top:12px"><label>تاريخ الشراء</label><input name="date" type="date" value="${today()}" required></div><div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">إلغاء</button><button class="btn primary"><span class="icon-button-label">${uiIcon('check',17)} حفظ الأعلاف المختارة</span></button></div></form>`)};

  window.toggleFeedPurchaseV3=function(code,checked){const box=document.getElementById('feedSelectedV3'),x=feedLookupV3(code);if(!box||!x)return;const old=document.getElementById('feedEntry_'+code);if(!checked){if(old)old.remove();return}if(old)return;box.insertAdjacentHTML('beforeend',`<div class="feed-entry" id="feedEntry_${code}"><div class="feed-entry-head"><strong>${x.name}</strong><span class="currency-chip">${feedCatV3(x.category)}</span></div><div class="form-grid"><div class="field"><label>الكمية — كجم</label><input name="qty_${code}" type="number" min="0.001" step=".001" required></div><div class="field"><label>سعر الكيلو</label><input name="cost_${code}" type="number" min="0" step=".01" required></div><div class="field"><label>العملة</label><select name="currency_${code}" required><option value="SDG">جنيه سوداني</option><option value="SAR">ريال سعودي</option><option value="USD">دولار</option></select><div class="conversion-preview" id="preview_${code}"></div></div></div></div>`);updateFeedPurchasePreviewV3()};

  window.updateFeedPurchasePreviewV3=function(){const form=document.getElementById('feedPurchaseV3');if(!form)return;form.querySelectorAll('input[name="feedCode"]:checked').forEach(cb=>{const code=cb.value,curr=form.elements['currency_'+code]?.value||'SDG',cost=Number(form.elements['cost_'+code]?.value)||0,rate=fxRateV3(curr),p=document.getElementById('preview_'+code);if(!p)return;if(curr!=='SDG'&&!rate){p.textContent=`أدخل سعر صرف ${currencyLabelV3(curr)} من شاشة الأعلاف أولًا`;p.style.color='var(--danger)'}else{p.textContent=cost?`≈ ${moneyV3(cost*rate,'SDG')} لكل كجم`:' ';p.style.color='var(--primary)'}})};

  window.createFeedChecklistV3=function(ev,pid){ev.preventDefault();const form=ev.target,f=new FormData(form),codes=f.getAll('feedCode');if(!codes.length){alert('اختر علفًا واحدًا على الأقل من القائمة.');return}const quality=!!f.get('cleanDry')&&!!f.get('noMold'),date=f.get('date')||today(),items=[];for(const code of codes){const x=feedLookupV3(code),qty=Number(f.get('qty_'+code))||0,cost=Number(f.get('cost_'+code))||0,curr=f.get('currency_'+code)||'SDG',rate=fxRateV3(curr);if(!x||qty<=0){alert('أدخل كمية صحيحة لكل علف اخترته.');return}if(curr!=='SDG'&&rate<=0){alert(`لا يوجد سعر صرف محفوظ لـ ${currencyLabelV3(curr)}. احفظ سعر الصرف من شاشة الأعلاف أولًا.`);return}items.push({x,qty,cost,curr,rate})}for(const it of items){state.feeds.push({id:uid('f'),planId:pid,name:it.x.name,catalogCode:it.x.code,category:it.x.category,qtyKg:it.qty,usedKg:0,originalUnitCost:it.cost,currency:it.curr,fxRate:it.rate,unitCost:it.cost*it.rate,purchased:date,qualityOk:quality})}save();closeModal();state.planTab='feeds';render();if(!quality)setTimeout(()=>alert('تم حفظ الأعلاف، لكنها ستظهر بحاجة لمراجعة الجودة حتى تؤكد الجفاف وعدم وجود عفن ظاهر.'),0)};

  window.planPage=function(){const p=plan();if(!p)return plansPage();const s=stats(p),n=ezNext(p);const nav=state.planTab||'overview';const tabs=[['overview','اليوم'],['animals','الحيوانات'],['feeding','العلف'],['health','الصحة'],['sales','البيع']];const head=`<div class="plan-summary"><div class="row"><div><div style="margin-bottom:7px">${statusBadge(p.status)} <span class="badge">اليوم ${ezDay(p)} • ${ezPhase(p)}</span></div><h2>${p.name}</h2><p>${state.clients.find(c=>c.id===p.clientId)?.name||''}</p></div><div class="actions"><button class="btn primary" onclick="ezRunNext('${p.id}')"><span class="icon-button-label">${uiIcon('arrow',17)} ${n.button}</span></button><button class="btn" onclick="openEasyManage('${p.id}')" aria-label="إعدادات الخطة">${uiIcon('settings',18)}</button></div></div></div><div class="tabs">${tabs.map(t=>`<button class="tab ${nav===t[0]?'active':''}" onclick="setTab('${t[0]}')">${t[1]}</button>`).join('')}</div>`;return layout(head+tabContent(p,s),p.name,'نفّذ الخطوة التالية ثم ارجع لليوم')};

  if(_overviewV3)window.overviewTab=function(p,s){return _overviewV3(p,s).replace('<div class="emoji">🐄</div>',`<div class="empty-icon">${uiIcon('animal',28)}</div>`).replace(/حدث آخر/g,'إجراء آخر')};

  const _dashboardV3=window.dashboard;
  window.dashboard=function(){if(state.role==='admin')return adminDashboard();const ps=state.plans.filter(p=>p.clientId===state.currentClientId),active=ps.filter(p=>p.status==='active'||p.status==='selling');const body=`<div class="page-head"><div><h2>ماذا تريد أن تفعل اليوم؟</h2><p>افتح خطتك وسيظهر لك الإجراء التالي مباشرة.</p></div><button class="btn primary" onclick="openPlanModal()"><span class="icon-button-label">${uiIcon('plus',17)} إنشاء خطة</span></button></div>${active.length?`<div class="card"><h3>الخطط النشطة</h3><div class="ez-plan-list">${active.map(p=>{const n=ezNext(p);return `<div class="ez-plan-card"><div><h3>${p.name}</h3><div class="small muted">اليوم ${ezDay(p)} • ${ezPhase(p)}</div></div><div class="next"><span>الخطوة التالية</span><strong>${n.title}</strong></div><div class="actions"><button class="btn primary small" onclick="openPlan('${p.id}');setTimeout(()=>ezRunNext('${p.id}'),0)"><span class="icon-button-label">${uiIcon('arrow',15)} ابدأ</span></button><button class="btn small" onclick="openPlan('${p.id}')">فتح الخطة</button></div></div>`}).join('')}</div></div>`:`<div class="ez-primary-step"><div class="eyebrow">لا توجد خطة نشطة</div><h2>أنشئ أول خطة تسمين</h2><p>بعدها سيقودك النظام خطوة بخطوة.</p><button class="btn" onclick="openPlanModal()"><span class="icon-button-label">${uiIcon('plus',16)} إنشاء الخطة</span></button></div>`}`;return layout(body,'الرئيسية','واجهة بسيطة للمهام اليومية')};

  const _plansV3=window.plansPage;
  window.plansPage=function(){if(state.role==='admin')return _plansV3();const ps=state.plans.filter(p=>p.clientId===state.currentClientId);return layout(`<div class="page-head"><div><h2>خططي</h2><p>اختر الخطة التي تعمل عليها.</p></div><button class="btn primary" onclick="openPlanModal()"><span class="icon-button-label">${uiIcon('plus',17)} خطة جديدة</span></button></div><div class="ez-plan-list">${ps.map(p=>{const n=ezNext(p);return `<div class="ez-plan-card"><div><h3>${p.name}</h3><div class="small muted">${statusBadge(p.status)} • اليوم ${ezDay(p)}</div></div><div class="next"><span>التالي</span><strong>${n.title}</strong></div><button class="btn primary" onclick="openPlan('${p.id}')">فتح</button></div>`}).join('')||empty('لا توجد خطط بعد.')}</div>`,'خططي','كل خطة لها خطوة تالية واضحة')};

  save();
  render();
})();

<script>
/* USABILITY_V4_HERD_TIMELINE_FEEDING */
(()=>{
  if(typeof state==='undefined') return;
  state.herdTimelineVersion=4;
  state.plans.forEach(p=>{p.feeding=p.feeding||{};if(typeof p.feeding.taperComplete!=='boolean')p.feeding.taperComplete=false;if(!p.feeding.cakeCode)p.feeding.cakeCode='peanut_cake';});

  const oldTabContent=window.tabContent;
  const oldFeedingTab=window.feedingTab;
  const nowIso=()=>new Date().toISOString();
  const batchId=()=>uid('evb');
  const activeAnimals=p=>planAnimals(p.id).filter(a=>a.status!=='sold');
  const latest=a=>typeof latestWeightRecord==='function'?latestWeightRecord(a):{value:(a.weights?.at(-1)?.value||a.buyWeight),date:(a.weights?.at(-1)?.date||a.buyDate||'')};
  const rem=f=>(Number(f.qtyKg)||0)-(Number(f.usedKg)||0);
  const localTime=iso=>{if(!iso)return'وقت غير مسجل';try{return new Date(iso).toLocaleTimeString('ar-SA',{hour:'2-digit',minute:'2-digit'})}catch(_){return'وقت غير مسجل'}};
  const tag=aid=>state.animals.find(a=>a.id===aid)?.tag||aid||'-';
  const esc=x=>String(x??'').replace(/[&<>\"]/g,c=>c==='&'?'&amp;':c==='<'?'&lt;':c==='>'?'&gt;':'&quot;');

  function stampNew(name,keys){
    const fn=window[name]; if(typeof fn!=='function'||fn.__v4stamp)return;
    const wrapped=function(...args){
      const before=Object.fromEntries(keys.map(k=>[k,(state[k]||[]).length]));
      const b=batchId(),at=nowIso(),out=fn.apply(this,args);let changed=false;
      keys.forEach(k=>{const arr=state[k]||[];arr.slice(before[k]).forEach(x=>{if(!x.createdAt){x.createdAt=at;changed=true}if(!x.eventBatchId){x.eventBatchId=b;changed=true}})});
      if(changed)save();return out;
    };wrapped.__v4stamp=true;window[name]=wrapped;
  }
  [
    ['createDaily',['daily']],['saveEasyWeights',['daily']],['ezAllHealthy',['healthLogs']],
    ['createHealthDaily',['healthLogs']],['saveHealthDaily',['healthLogs']],['saveArrivalHealth',['healthEvents']],
    ['createArrivalHealth',['healthEvents']],['savePreventiveEvent',['healthEvents']],['createPreventiveEvent',['healthEvents']],
    ['createTreatment',['treatments']],['createExpense',['expenses']],['createSale',['sales']],
    ['saveEmergency',['emergencies']],['createEmergency',['emergencies']],['createFeedChecklistV3',['feeds']],
    ['createOtherRevenue',['otherRevenues']],['createAnimal',['animals']]
  ].forEach(x=>stampNew(x[0],x[1]));

  window.quickCleanShelter=function(pid){
    const exists=state.daily.some(d=>d.planId===pid&&d.date===today()&&d.shelterCleaned===true);
    if(exists){alert('نظافة الزريبة مسجلة اليوم بالفعل.');return}
    state.daily.push({id:uid('d'),planId:pid,date:today(),note:'نظافة الزريبة',shelterCleaned:true,entries:[],createdAt:nowIso(),eventBatchId:batchId()});
    save();render();
  };

  function healthDone(p){const ids=new Set(planHealthLogs(p.id).filter(x=>x.date===today()).map(x=>x.animalId));const a=activeAnimals(p);return a.length>0&&a.every(x=>ids.has(x.id))}
  function cleanDone(p){return state.daily.some(d=>d.planId===p.id&&d.date===today()&&d.shelterCleaned===true)}
  function feedDone(p){return planFeedingLogs(p.id).some(x=>x.date===today())}
  function dueWeights(p){return activeAnimals(p).filter(a=>{const w=a.weights?.at(-1);if(!w)return true;const d=Math.floor((new Date(today()+'T00:00:00')-new Date(w.date+'T00:00:00'))/86400000);return d>=15})}
  function stockReady(p){const fs=planFeeds(p.id);return fs.some(f=>f.category==='roughage'&&rem(f)>0)&&fs.some(f=>(f.category==='concentrate'||['sorghum','peanut_cake','sesame_cake','wheat_bran'].includes(f.catalogCode))&&rem(f)>0)}
  window.ezNext=function(p){
    const animals=activeAnimals(p),em=typeof planEmergencies==='function'?planEmergencies(p.id).filter(e=>e.status!=='resolved'):[],pending=animals.filter(a=>a.health?.arrivalCompleted!==true),due=dueWeights(p);
    if(em.length)return{key:'emergency',title:'راجع الحالة الطارئة',sub:`هناك ${em.length} حالة مفتوحة.`,button:'فتح الصحة'};
    if(!p.shelter?.ready)return{key:'shelter',title:'جهّز الزريبة',sub:'ابدأ بهذه الخطوة فقط.',button:'تجهيز الزريبة'};
    if(!animals.length)return{key:'animal',title:'أضف أول حيوان',sub:'بعد فحص الشراء سجّل الحيوان.',button:'إضافة حيوان'};
    if(pending.length)return{key:'arrival',title:'أكمل استقبال الحيوان',sub:`${pending.length} حيوان لم يكتمل استقباله الصحي.`,button:'تسجيل الاستقبال'};
    if(!stockReady(p))return{key:'stock',title:'أدخل الأعلاف الموجودة',sub:'أضف مكونات العلف والمالئ إلى المخزون.',button:'إضافة أعلاف'};
    if(!feedDone(p))return{key:'feed',title:'سجّل تغذية اليوم',sub:'ستظهر كمية كل حيوان والخلطة في شاشة واحدة.',button:'تسجيل التغذية'};
    if(!cleanDone(p))return{key:'clean',title:'هل نُظفت الزريبة اليوم؟',sub:'إذا تم التنظيف سجله بضغطة واحدة.',button:'تم تنظيف الزريبة'};
    if(!healthDone(p))return{key:'health',title:'افحص صحة القطيع',sub:'إذا كان الجميع طبيعيًا سجّلها بضغطة واحدة.',button:'فحص الصحة'};
    if(due.length)return{key:'weight',title:`حان وزن ${due.length} حيوان`,sub:'أدخل الوزن الجديد فقط.',button:'تسجيل الوزن'};
    if((typeof ezDay==='function'?ezDay(p):cycleDay(p))>=60&&typeof marketPlanReady==='function'&&!marketPlanReady(p))return{key:'market',title:'جهّز خطة البيع',sub:'حدد السوق والتوقيت قبل يوم البيع.',button:'تجهيز البيع'};
    return{key:'done',title:'انتهت مهام اليوم',sub:'لا يوجد إجراء مطلوب الآن.',button:'تسجيل حدث آخر'};
  };
  window.ezRunNext=function(pid){const p=plan(pid),n=ezNext(p);if(n.key==='clean'){quickCleanShelter(pid);return}if(n.key==='emergency'){setTab('health');return}if(n.key==='shelter'){setTab('shelter');return}if(n.key==='animal'){openAnimalModal(pid);return}if(n.key==='arrival'){openArrivalHealthModal(pid);return}if(n.key==='stock'){openFeedModal(pid);return}if(n.key==='feed'){openFeedingLogModal(pid);return}if(n.key==='health'){openHealthDailyModal(pid);return}if(n.key==='weight'){openEasyWeightModal(pid);return}if(n.key==='market'){setTab('sales');return}openEasyActions(pid)};

  function courseStep(a,p){
    const d=Math.max(1,typeof ezDay==='function'?ezDay(p):cycleDay(p)),w=Number(latest(a).value)||Number(a.buyWeight)||0,target=concentrateTarget(w);
    if(a.animalType==='calf'&&Number(a.buyWeight)===200){if(d<=3)return{qty:2,label:'التدرج المرجعي: الأيام 1–3'};if(d<=7)return{qty:3,label:'التدرج المرجعي: الأيام 4–7'};if(d<=10)return{qty:4,label:'التدرج المرجعي: الأيام 8–10'};return{qty:target,label:'الكمية الكاملة: 3% من آخر وزن'}}
    if(a.animalType==='sheep'&&Number(a.buyWeight)===20){if(d<=3)return{qty:.2,label:'التدرج المرجعي: الأيام 1–3'};if(d<=7)return{qty:.3,label:'التدرج المرجعي: الأيام 4–7'};if(d<=10)return{qty:.5,label:'التدرج المرجعي: الأيام 8–10'};return{qty:target,label:'الكمية الكاملة: 3% من آخر وزن'}}
    if(p.feeding?.taperComplete)return{qty:target,label:'بعد اكتمال التدرج: 3% من آخر وزن'};
    return{qty:null,label:`الهدف بعد التدرج ${target.toFixed(2)} كجم — لا يوجد رقم تدرج موثق لهذا الوزن`};
  }
  window.markTaperCompleteV4=function(pid){const p=plan(pid);p.feeding=p.feeding||{};p.feeding.taperComplete=true;p.feeding.taperCompletedAt=today();save();closeModal();openFeedingLogModal(pid)};
  window.resetTaperV4=function(pid){const p=plan(pid);p.feeding.taperComplete=false;p.feeding.taperCompletedAt='';save();render()};

  function recipe(type,cake='peanut_cake'){
    return type==='sheep'
      ?[['sorghum','فتريتة مدروشة',.50],[cake,cake==='sesame_cake'?'أمباز سمسم':'أمباز فول سوداني',.20],['wheat_bran','ردة قمح',.25],['minerals','أملاح معدنية وفيتامينات',.03],['limestone','جير مطفي مخصص للأعلاف',.02]]
      :[['sorghum','فتريتة مدروشة',.50],[cake,cake==='sesame_cake'?'أمباز سمسم':'أمباز فول سوداني',.30],['wheat_bran','ردة قمح',.15],['minerals','أملاح معدنية وفيتامينات',.03],['limestone','جير مطفي مخصص للأعلاف',.02]];
  }
  function feedMatch(pid,code){const fs=planFeeds(pid).filter(f=>rem(f)>0);const byCode=fs.find(f=>f.catalogCode===code);if(byCode)return byCode;const tests={sorghum:/فتريت|ذرة/,peanut_cake:/أمباز.*فول/,sesame_cake:/أمباز.*سمسم/,wheat_bran:/ردة/,minerals:/أملاح.*معدنية|فيتامين/,limestone:/جير|حجر.*جيري/};return fs.find(f=>tests[code]?.test(f.name||''))||null}
  function preferredCake(pid,p){const saved=p.feeding?.cakeCode||'peanut_cake';if(feedMatch(pid,saved))return saved;const other=saved==='peanut_cake'?'sesame_cake':'peanut_cake';return feedMatch(pid,other)?other:saved}
  function recipeAvailability(pid,type,cake){const items=recipe(type,cake).map(x=>({code:x[0],name:x[1],ratio:x[2],stock:feedMatch(pid,x[0])}));return{items,ok:items.every(x=>x.stock)}}
  function readyConcentrates(pid){return planFeeds(pid).filter(f=>rem(f)>0&&f.category==='concentrate'&&!['sorghum','peanut_cake','sesame_cake','wheat_bran'].includes(f.catalogCode))}
  window.feedV4SyncRow=function(input){const row=input.closest('.v4-animal-feed'),r=row?.querySelector('[data-rough]');if(r&&!r.dataset.manual)r.value=(Number(input.value||0)*1.5).toFixed(3)};
  window.feedV4ManualRough=function(input){input.dataset.manual='1'};
  window.feedV4Mode=function(sel){const f=sel.form;f.querySelector('[data-lecture-mode]').style.display=sel.value==='lecture'?'block':'none';f.querySelector('[data-ready-mode]').style.display=sel.value==='ready'?'block':'none'};

  window.openFeedingLogModal=function(pid){
    const p=plan(pid),animals=activeAnimals(p),type=feedingAnimalType(p),rough=planFeeds(pid).filter(f=>f.category==='roughage'&&rem(f)>0),ready=readyConcentrates(pid),cake=preferredCake(pid,p);
    if(!animals.length){alert('لا توجد حيوانات نشطة.');return}
    if(!rough.length){modal(`<div class="modal-head"><h3>أضف العلف المالئ أولًا</h3><button class="close" onclick="closeModal()">×</button></div><div class="v4-feed-note">لا يوجد تبن/قش/دريس مسجل في المخزون.</div><button class="btn primary" onclick="closeModal();openFeedModal('${pid}')">إضافة أعلاف</button>`);return}
    const avail=recipeAvailability(pid,type,cake),canLecture=avail.ok,mode=canLecture?'lecture':(ready.length?'ready':'lecture');
    const animalRows=animals.map(a=>{const s=courseStep(a,p),w=Number(latest(a).value)||a.buyWeight,q=s.qty,r=q==null?'':roughageGeneral(q);return `<div class="v4-animal-feed" data-animal="${a.id}"><div class="who"><strong>#${esc(a.tag)} — ${w} كجم</strong><small>${esc(s.label)}</small></div><div class="field"><label>المركز اليوم — كجم</label><input name="conc_${a.id}" type="number" min="0" step=".001" value="${q==null?'':q}" placeholder="أدخل الكمية الفعلية" oninput="feedV4SyncRow(this)" required></div><div class="field"><label>المالئ اليوم — كجم</label><input data-rough name="rough_${a.id}" type="number" min="0" step=".001" value="${r}" oninput="feedV4ManualRough(this)" required><div class="v4-feed-source">القاعدة العامة: المركز × 1.5</div></div></div>`}).join('');
    const missing=avail.items.filter(x=>!x.stock).map(x=>x.name);
    const recipeHtml=recipe(type,cake).map(x=>`<div><strong>${x[1]}</strong>${Math.round(x[2]*100)} كجم / 100</div>`).join('');
    modal(`<div class="modal-head"><div><h3>تغذية اليوم</h3><div class="small muted">اكتب ما قُدم فعلًا؛ كل حيوان في سطر واحد.</div></div><button class="close" onclick="closeModal()">×</button></div>
    ${animals.some(a=>courseStep(a,p).qty==null)?`<div class="v4-feed-note"><strong>التدرج:</strong> الأرقام اليومية المرجعية متاحة فقط لعجل 200 كجم وخروف 20 كجم. للحيوانات الأخرى يعرض النظام هدف 3% لكنه لا يخترع خطوات تدرج. إذا كنت أكملت التدرج فعلًا، <button type="button" class="btn small" onclick="markTaperCompleteV4('${pid}')">أكملت التدرج</button></div>`:''}
    <form id="feedingV4Form" onsubmit="createFeedingLogV4(event,'${pid}')"><input type="hidden" name="date" value="${today()}">${animalRows}
      <div class="card" style="margin-top:12px"><div class="section-title"><div><h3>من أين تأتي المركزات؟</h3><div class="small muted">اختر الخلطة أو علفًا جاهزًا.</div></div></div><div class="field"><label>طريقة المركزات</label><select name="mixMode" onchange="feedV4Mode(this)"><option value="lecture" ${mode==='lecture'?'selected':''}>الخلطة القياسية — خصم المكونات تلقائيًا</option>${ready.length?`<option value="ready" ${mode==='ready'?'selected':''}>علف مركز جاهز من المخزون</option>`:''}</select></div>
      <div data-lecture-mode style="display:${mode==='lecture'?'block':'none'}"><div class="v4-mini-recipe">${recipeHtml}</div>${canLecture?`<div class="assessment ok" style="margin-top:9px">✓ مكونات الخلطة موجودة في المخزون.</div>`:`<div class="v4-feed-note">ينقص من المخزون: ${missing.map(esc).join('، ')}. أضفها أو استخدم علفًا مركزًا جاهزًا إن كان لديك.</div>`}<div class="field" style="margin-top:9px"><label>نوع الأمباز في هذه الخلطة</label><select name="cakeCode"><option value="peanut_cake" ${cake==='peanut_cake'?'selected':''}>أمباز فول سوداني</option><option value="sesame_cake" ${cake==='sesame_cake'?'selected':''}>أمباز سمسم</option></select></div></div>
      <div data-ready-mode style="display:${mode==='ready'?'block':'none'}"><div class="field"><label>العلف المركز الجاهز</label><select name="readyFeed">${ready.map(f=>`<option value="${f.id}">${esc(f.name)} — متبقي ${rem(f).toFixed(2)} كجم</option>`).join('')}</select></div></div>
      <div class="field" style="margin-top:9px"><label>العلف المالئ المستخدم</label><select name="roughFeed" required>${rough.map(f=>`<option value="${f.id}">${esc(f.name)} — متبقي ${rem(f).toFixed(2)} كجم</option>`).join('')}</select></div>
      <div class="source-note">الخلطة القياسية للعجول: 50 فتريتة + 30 أمباز + 15 ردة + 3 أملاح/فيتامينات + 2 جير. للضأن: 50 + 20 + 25 + 3 + 2. يُقدَّم المالئ منفصلًا عن المركزات.</div></div>
      <details class="v4-advanced"><summary>تفاصيل اختيارية</summary><div class="check-grid" style="margin-top:10px"><label class="check-item"><input type="checkbox" name="waterOk">الماء متوفر ونظيف</label><label class="check-item"><input type="checkbox" name="twoMeals">قُسمت الكمية على وجبتين</label><label class="check-item"><input type="checkbox" name="diarrhea">ظهر إسهال</label><label class="check-item"><input type="checkbox" name="lowAppetite">شهية ضعيفة</label><label class="check-item"><input type="checkbox" name="bloat">نفاخ</label><label class="check-item"><input type="checkbox" name="lethargy">خمول</label></div><div class="field"><label>ملاحظة</label><input name="note" placeholder="اختياري"></div></details>
      <div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">إلغاء</button><button class="btn primary">حفظ تغذية اليوم</button></div></form>`);
  };

  window.createFeedingLogV4=function(ev,pid){
    ev.preventDefault();const f=new FormData(ev.target),p=plan(pid),animals=activeAnimals(p),animalEntries=[];let totalC=0,totalR=0;
    for(const a of animals){const c=Number(f.get('conc_'+a.id)),r=Number(f.get('rough_'+a.id));if(!(c>=0)||!(r>=0)){alert('راجع كمية المركز والمالئ لكل حيوان.');return}animalEntries.push({animalId:a.id,concentrateKg:c,roughageKg:r});totalC+=c;totalR+=r}
    const roughFeed=state.feeds.find(x=>x.id===f.get('roughFeed'));if(!roughFeed||rem(roughFeed)+1e-9<totalR){alert('كمية العلف المالئ في المخزون لا تكفي الكمية المسجلة.');return}
    const mode=f.get('mixMode')||'lecture',consumed=[];
    if(mode==='lecture'){
      const cake=f.get('cakeCode')||p.feeding?.cakeCode||'peanut_cake',a=recipeAvailability(pid,feedingAnimalType(p),cake);if(!a.ok){alert('مكونات الخلطة القياسية غير مكتملة في المخزون.');return}
      for(const x of a.items){const need=totalC*x.ratio;if(rem(x.stock)+1e-9<need){alert(`المخزون لا يكفي: ${x.name}. المطلوب ${need.toFixed(2)} كجم.`);return}}
      a.items.forEach(x=>{const q=totalC*x.ratio;x.stock.usedKg=(Number(x.stock.usedKg)||0)+q;consumed.push({feedId:x.stock.id,name:x.stock.name,kg:q})});p.feeding.cakeCode=cake;
    }else{
      const cf=state.feeds.find(x=>x.id===f.get('readyFeed'));if(!cf||rem(cf)+1e-9<totalC){alert('العلف المركز الجاهز في المخزون لا يكفي.');return}cf.usedKg=(Number(cf.usedKg)||0)+totalC;consumed.push({feedId:cf.id,name:cf.name,kg:totalC});
    }
    roughFeed.usedKg=(Number(roughFeed.usedKg)||0)+totalR;consumed.push({feedId:roughFeed.id,name:roughFeed.name,kg:totalR});
    const log={id:uid('fl'),planId:pid,date:f.get('date')||today(),createdAt:nowIso(),eventBatchId:batchId(),animalEntries,totalConcentrateKg:+totalC.toFixed(3),totalRoughageKg:+totalR.toFixed(3),concentrateKg:+totalC.toFixed(3),roughageKg:+totalR.toFixed(3),mixMode:mode,feedConsumption:consumed,waterAvailable:!!f.get('waterOk'),morningMeal:!!f.get('twoMeals'),afternoonMeal:!!f.get('twoMeals'),diarrhea:!!f.get('diarrhea'),lowAppetite:!!f.get('lowAppetite'),bloat:!!f.get('bloat'),lethargy:!!f.get('lethargy'),note:f.get('note')||''};
    state.feedingLogs.push(log);save();closeModal();render();
    if(log.diarrhea||log.lowAppetite||log.bloat||log.lethargy)setTimeout(()=>alert('تم حفظ التغذية مع علامة غير طبيعية. وفق الإرشادات المعتمدة: ارجع خطوة في التدرج عند ظهور العلامات، والنفاخ الشديد يحتاج تدخلًا سريعًا/طبيبًا.'),0);
  };
  window.createFeedingLog=window.createFeedingLogV4;

  function feedEventDetail(log){
    if(log.animalEntries?.length)return log.animalEntries.map(e=>`الحيوان #${esc(tag(e.animalId))}: ${Number(e.concentrateKg||0).toFixed(2)} كجم مركز + ${Number(e.roughageKg||0).toFixed(2)} كجم مالئ`).join('<br>');
    return `المركزات: ${Number(log.concentrateKg||0).toFixed(2)} كجم • المالئ: ${Number(log.roughageKg||0).toFixed(2)} كجم`;
  }
  function pushEvent(out,e){if(e.date)out.push(e)}
  window.herdEventsV4=function(p){
    const out=[];
    planFeedingLogs(p.id).forEach(l=>pushEvent(out,{date:l.date,createdAt:l.createdAt,type:'feed',icon:'🌾',title:'تغذية القطيع',scope:'القطيع',summary:`${Number((l.totalConcentrateKg??l.concentrateKg)||0).toFixed(2)} كجم مركز • ${Number((l.totalRoughageKg??l.roughageKg)||0).toFixed(2)} كجم مالئ`,details:feedEventDetail(l)}));
    state.daily.filter(d=>d.planId===p.id).forEach(d=>{if(d.shelterCleaned)pushEvent(out,{date:d.date,createdAt:d.createdAt,type:'clean',icon:'🧹',title:'نظافة الزريبة',scope:'القطيع',summary:'تم تسجيل نظافة الزريبة',details:d.note||''});const ws=(d.entries||[]).filter(x=>x.weight);if(ws.length)pushEvent(out,{date:d.date,createdAt:d.createdAt,type:'weight',icon:'⚖️',title:'تسجيل أوزان',scope:ws.length>1?'القطيع':'#'+tag(ws[0].animalId),summary:`تم تسجيل وزن ${ws.length} حيوان`,details:ws.map(x=>`#${esc(tag(x.animalId))}: ${x.weight} كجم`).join('<br>')})});
    const healthGroups=new Map();planHealthLogs(p.id).forEach(l=>{const k=l.eventBatchId||('health-'+l.date+'-'+(l.note?.startsWith('فحص سريع')?'quick':l.id));if(!healthGroups.has(k))healthGroups.set(k,[]);healthGroups.get(k).push(l)});healthGroups.forEach(ls=>{const first=ls[0],bad=ls.filter(x=>(typeof healthDanger==='function'&&healthDanger(x).length)||x.diarrhea||x.leftBloat||x.lethargy);pushEvent(out,{date:first.date,createdAt:first.createdAt,type:'health',icon:'♡',title:bad.length?'متابعة صحية — توجد ملاحظات':'فحص صحي للقطيع',scope:ls.length>1?'القطيع':'#'+tag(first.animalId),summary:bad.length?`${bad.length} حالة بها ملاحظة`:`تم فحص ${ls.length} حيوان`,details:ls.map(x=>`#${esc(tag(x.animalId))}: ${esc(x.note||((typeof healthDanger==='function'&&healthDanger(x).join('، '))||'طبيعي'))}`).join('<br>')})});
    planHealthEvents(p.id).forEach(e=>pushEvent(out,{date:e.date,createdAt:e.createdAt,type:'preventive',icon:'💉',title:typeof healthEventLabel==='function'?healthEventLabel(e.kind):'إجراء وقائي',scope:e.animalId?'#'+tag(e.animalId):'القطيع',summary:e.guidance||'إجراء وقائي مسجل',details:e.note||''}));
    planTreatments(p.id).forEach(t=>pushEvent(out,{date:t.start,createdAt:t.createdAt,type:'treatment',icon:'💊',title:`علاج: ${esc(t.name)}`,scope:(t.animalIds||[]).length===1?'#'+tag(t.animalIds[0]):`${(t.animalIds||[]).length} حيوانات`,summary:t.dose?`الجرعة المسجلة: ${esc(t.dose)}`:(t.reason||'علاج مسجل'),details:[t.reason,t.route?`الطريقة: ${t.route}`:'',t.withdrawalUntil?`فترة السحب حتى ${t.withdrawalUntil}`:''].filter(Boolean).map(esc).join('<br>')}));
    planExpenses(p.id).forEach(e=>pushEvent(out,{date:e.date,createdAt:e.createdAt,type:'expense',icon:'💰',title:`مصروف: ${esc(e.type||'مصروف')}`,scope:e.animalId?'#'+tag(e.animalId):'الخطة',summary:fmt(Number(e.amount)||0),details:e.desc||e.note||e.description||''}));
    planSales(p.id).forEach(s=>pushEvent(out,{date:s.date,createdAt:s.createdAt,type:'sale',icon:'↗',title:'بيع حيوان',scope:(s.animalIds||[]).map(x=>'#'+tag(x)).join('، ')||'بيع',summary:`${fmt(Number(s.amount)||0)}${s.buyer?' • '+esc(s.buyer):''}`,details:s.place||''}));
    (state.emergencies||[]).filter(e=>e.planId===p.id).forEach(e=>pushEvent(out,{date:e.date||e.createdAt?.slice(0,10),createdAt:e.createdAt,type:'emergency',icon:'🚨',title:typeof emergencyTypeLabel==='function'?emergencyTypeLabel(e.type):'حالة طارئة',scope:e.animalId?'#'+tag(e.animalId):'القطيع',summary:e.status==='resolved'?'تم إغلاق الحالة':'حالة مفتوحة',details:e.note||''}));
    planFeeds(p.id).forEach(f=>pushEvent(out,{date:f.purchased,createdAt:f.createdAt,type:'feedbuy',icon:'📦',title:`شراء علف: ${esc(f.name)}`,scope:'المخزون',summary:`${Number(f.qtyKg||0).toFixed(2)} كجم`,details:f.currency&&f.originalUnitCost!=null?`سعر الكيلو: ${esc(f.originalUnitCost)} ${esc(f.currency)}`:''}));
    planAnimals(p.id).forEach(a=>pushEvent(out,{date:a.buyDate,createdAt:a.createdAt,type:'animal',icon:'🐄',title:'إضافة حيوان للقطيع',scope:'#'+tag(a.id),summary:`وزن الشراء ${Number(a.buyWeight||0).toFixed(1)} كجم${a.buyPlace?' • '+esc(a.buyPlace):''}`,details:a.buyPrice?`سعر الشراء: ${fmt(Number(a.buyPrice)||0)}`:''}));
    planAnimals(p.id).forEach(a=>(a.notes||[]).forEach(n=>pushEvent(out,{date:n.date,createdAt:n.createdAt,type:'note',icon:'✎',title:'ملاحظة على حيوان',scope:'#'+tag(a.id),summary:esc(n.text||''),details:''})));
    (state.otherRevenues||[]).filter(x=>x.planId===p.id).forEach(r=>pushEvent(out,{date:r.date,createdAt:r.createdAt,type:'revenue',icon:'＋',title:'إيراد آخر',scope:'الخطة',summary:fmt(Number(r.amount)||0),details:r.note||r.description||''}));
    return out.sort((a,b)=>((b.date||'')+(b.createdAt||'')).localeCompare((a.date||'')+(a.createdAt||'')));
  };
  function dateLabel(d){if(d===today())return'اليوم';const y=new Date();y.setDate(y.getDate()-1);if(d===y.toISOString().slice(0,10))return'أمس';try{return new Date(d+'T00:00:00').toLocaleDateString('ar-SA',{weekday:'long',day:'numeric',month:'short'})}catch(_){return d}}
  function eventCard(e){const has=e.details&&String(e.details).trim();return `<div class="v4-event"><div class="v4-time">${localTime(e.createdAt)}</div><div class="v4-evicon">${e.icon}</div><div><h4>${e.title}<span class="v4-scope">${esc(e.scope)}</span></h4><p>${e.summary||''}</p>${has?`<details><summary>التفاصيل</summary><div class="v4-event-details">${e.details}</div></details>`:''}</div></div>`}
  window.timelineHtmlV4=function(p,limitDays=0){const es=herdEventsV4(p),groups={};es.forEach(e=>(groups[e.date]||(groups[e.date]=[])).push(e));const dates=Object.keys(groups).sort().reverse(),show=limitDays?dates.slice(0,limitDays):dates;if(!show.length)return empty('لا توجد أحداث مسجلة بعد.');return `<div class="v4-timeline">${show.map((d,i)=>`<details class="v4-day" ${i===0?'open':''}><summary><span>${dateLabel(d)}</span><span class="v4-day-count">${groups[d].length} حدث</span></summary><div class="v4-events">${groups[d].map(eventCard).join('')}</div></details>`).join('')}</div>`}
  window.timelineTab=function(p){return `<div class="page-head"><div><h2>سجل القطيع</h2><p>كل ما حدث مرتب حسب اليوم؛ التفاصيل مخفية حتى تحتاجها.</p></div><button class="btn primary" onclick="openEasyActions('${p.id}')">+ تسجيل حدث</button></div>${timelineHtmlV4(p)}`};

  window.feedingTab=function(p){
    const animals=activeAnimals(p),type=feedingAnimalType(p),cake=preferredCake(p.id,p),avail=recipeAvailability(p.id,type,cake),todayLog=planFeedingLogs(p.id).find(x=>x.date===today());
    const list=animals.map(a=>{const s=courseStep(a,p);return `<div class="v4-simple-feed-row"><div><strong>#${esc(a.tag)} — ${Number(latest(a).value)||a.buyWeight} كجم</strong><small>${esc(s.label)}</small></div><div>${s.qty==null?`<span class="badge sell">أدخل التدرج الفعلي</span>`:`<strong>${Number(s.qty).toFixed(2)} كجم مركز</strong><small>${roughageGeneral(s.qty).toFixed(2)} كجم مالئ</small>`}</div></div>`}).join('');
    return `<div class="card"><div class="section-title"><div><h3>العلف اليوم</h3><div class="small muted">الكمية لكل حيوان أولًا.</div></div>${todayLog?'<span class="v4-done-chip">✓ تم التسجيل اليوم</span>':`<button class="btn primary" onclick="openFeedingLogModal('${p.id}')">سجل تغذية اليوم</button>`}</div><div class="v4-simple-feed-list">${list||empty('لا توجد حيوانات')}</div></div>
    <div class="card" style="margin-top:12px"><div class="section-title"><div><h3>خلطة ${type==='sheep'?'الضأن':'العجول'}</h3><div class="small muted">100 كجم — يخصم النظام مكوناتها تلقائيًا عند استخدامها</div></div><button class="btn" onclick="openFeedModal('${p.id}')">المخزون</button></div><div class="v4-mini-recipe">${recipe(type,cake).map(x=>`<div><strong>${x[1]}</strong>${Math.round(x[2]*100)} كجم</div>`).join('')}</div><div class="assessment ${avail.ok?'ok':'review'}" style="margin-top:9px">${avail.ok?'✓ مكونات الخلطة متوفرة في المخزون.':'بعض مكونات الخلطة غير موجودة؛ أضفها أو استخدم علفًا مركزًا جاهزًا.'}</div>${p.feeding?.taperComplete?`<div class="small muted" style="margin-top:8px">تم تأكيد اكتمال التدرج بتاريخ ${p.feeding.taperCompletedAt||'-'} • <button class="btn small" onclick="resetTaperV4('${p.id}')">إعادة حالة التدرج</button></div>`:''}</div>
    <details class="v4-advanced"><summary>المرجع والتفاصيل المتقدمة</summary><div style="margin-top:10px">${oldFeedingTab?oldFeedingTab(p):''}</div></details>`;
  };

  window.overviewTab=function(p,s){
    const n=ezNext(p),a=activeAnimals(p),feed=feedDone(p),health=healthDone(p),clean=cleanDone(p),due=dueWeights(p).length;
    const task=(done,title,sub,act)=>`<button class="v4-action ${done?'done':''}" onclick="${act}"><span class="v4-state">${done?'✓':'›'}</span><strong>${title}</strong><small>${sub}</small></button>`;
    return `<div class="v4-next"><div class="eyebrow">افعل هذا الآن</div><h2>${n.title}</h2><p>${n.sub}</p><button class="btn primary" onclick="ezRunNext('${p.id}')">${n.button}</button></div>
    ${a.length?`<div class="v4-actions">${task(feed,'التغذية',feed?'تم تسجيلها اليوم':'سجل كمية كل حيوان',`openFeedingLogModal('${p.id}')`)}${task(clean,'نظافة الزريبة',clean?'تمت اليوم':'ضغطة واحدة بعد التنفيذ',`quickCleanShelter('${p.id}')`)}${task(health,'فحص الصحة',health?'تم فحص القطيع':'طبيعي للجميع أو توجد مشكلة',`openHealthDailyModal('${p.id}')`)}${task(due===0,'الوزن',due?`${due} حيوان حان وزنه`:'ليس مطلوبًا الآن',`openEasyWeightModal('${p.id}')`)}</div>`:''}
    <div class="card"><div class="section-title"><div><h3>آخر أحداث القطيع</h3><div class="small muted">الأحداث مجمعة حسب التاريخ؛ الوقت يضاف تلقائيًا للأحداث الجديدة.</div></div><button class="btn small" onclick="setTab('timeline')">فتح السجل</button></div>${timelineHtmlV4(p,2)}</div>`;
  };

  window.tabContent=function(p,s){if(state.planTab==='timeline')return timelineTab(p);return oldTabContent?oldTabContent(p,s):overviewTab(p,s)};
  window.planPage=function(){const p=plan();if(!p)return plansPage();const s=stats(p),n=ezNext(p),nav=state.planTab||'overview';const tabs=[['overview','اليوم'],['timeline','السجل'],['animals','القطيع'],['feeding','العلف'],['health','الصحة'],['sales','البيع']];const head=`<div class="plan-summary"><div class="row"><div><div style="margin-bottom:7px">${statusBadge(p.status)} <span class="badge">اليوم ${typeof ezDay==='function'?ezDay(p):cycleDay(p)} • ${typeof ezPhase==='function'?ezPhase(p):cyclePhase(p).name}</span></div><h2>${p.name}</h2></div><div class="actions"><button class="btn primary" onclick="ezRunNext('${p.id}')">${n.button}</button><button class="btn" onclick="openEasyManage('${p.id}')" aria-label="إعدادات الخطة">⚙</button></div></div></div><div class="tabs">${tabs.map(t=>`<button class="tab ${nav===t[0]?'active':''}" onclick="setTab('${t[0]}')">${t[1]}</button>`).join('')}</div>`;return layout(head+window.tabContent(p,s),p.name,'نفّذ الخطوة الظاهرة فقط')};

  save();render();
})();
</script>
<style>
