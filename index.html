function expensesPage(){const ps=state.role==='admin'?state.plans:state.plans.filter(p=>p.clientId===state.currentClientId);return layout(`<div class="page-head"><div><h2>المصروفات</h2><p>كل مصروف يجب أن يرتبط بخطة محددة.</p></div></div><div class="plan-grid">${ps.map(p=>`<div class="plan-card"><h3>${p.name}</h3><div class="plan-numbers"><div class="plan-number"><span>المصروفات</span><strong>${fmt(planExpenses(p.id).reduce((s,e)=>s+e.amount,0))}</strong></div><div class="plan-number"><span>إجمالي التكلفة</span><strong>${fmt(stats(p).total)}</strong></div></div><button class="btn primary" onclick="openExpenseModal('${p.id}')">+ مصروف لهذه الخطة</button></div>`).join('')}</div>`,'المصروفات','مصروفات مستقلة لكل خطة');}
function salesPage(){const ps=state.plans.filter(p=>p.clientId===state.currentClientId);return layout(`<div class="page-head"><div><h2>البيع</h2><p>سجل البيع الجزئي أو الكامل دون فقد تاريخ الحيوان.</p></div></div><div class="plan-grid">${ps.filter(p=>p.status!=='closed').map(p=>`<div class="plan-card"><h3>${p.name}</h3><div class="plan-numbers"><div class="plan-number"><span>مباع</span><strong>${stats(p).sold}</strong></div><div class="plan-number"><span>متبقي</span><strong>${stats(p).remaining}</strong></div></div><button class="btn primary" onclick="openSaleModal('${p.id}')">تسجيل بيع</button></div>`).join('')}</div>`,'البيع','من المتوقع إلى الربح الفعلي');}
function reportsPage(){const ps=state.role==='admin'?state.plans:state.plans.filter(p=>p.clientId===state.currentClientId);return layout(`<div class="page-head"><div><h2>${state.role==='admin'?'التقارير العامة':'التقارير ومقارنة الخطط'}</h2><p>قارن التكلفة والبيع والربح بين الخطط.</p></div></div><div class="card"><div class="table-wrap"><table><thead><tr><th>الخطة</th>${state.role==='admin'?'<th>العميل</th>':''}<th>الحيوانات</th><th>التكلفة</th><th>البيع المتوقع</th><th>الربح المتوقع</th><th>الربح المستهدف</th></tr></thead><tbody>${ps.map(p=>{const s=stats(p);return `<tr><td><strong>${p.name}</strong></td>${state.role==='admin'?`<td>${state.clients.find(c=>c.id===p.clientId)?.name}</td>`:''}<td>${s.animals.length}</td><td>${fmt(s.total)}</td><td>${fmt(s.expected)}</td><td class="${s.profit>=0?'money-positive':'money-negative'}">${fmt(s.profit)}</td><td>${p.profitTarget}%</td></tr>`}).join('')}</tbody></table></div></div>`,'التقارير','تحليل وربحية الخطط');}
function empty(t){return `<div class="empty"><div class="emoji">📋</div>${t}</div>`}

function modal(html){document.body.insertAdjacentHTML('beforeend',`<div class="modal-backdrop" id="modal"><div class="modal">${html}</div></div>`)}function closeModal(){document.getElementById('modal')?.remove()}
function openPlanModal(admin=false){modal(`<div class="modal-head"><div><h3>إنشاء خطة تسمين جديدة</h3><div class="small muted">البيانات الأساسية فقط، وباقي التفاصيل تضاف داخل الخطة.</div></div><button class="close" onclick="closeModal()">×</button></div><form onsubmit="createPlan(event)"><div class="form-grid">${admin?`<div class="field"><label>العميل</label><select name="clientId" required>${state.clients.map(c=>`<option value="${c.id}">${c.name}</option>`).join('')}</select></div>`:''}<div class="field"><label>اسم الخطة</label><input name="name" placeholder="مثال: دورة تسمين سبتمبر" required></div><div class="field"><label>تاريخ البداية</label><input name="start" type="date" value="${today()}" required></div><div class="field"><label>مدة الدورة المتوقعة بالأيام</label><input name="duration" type="number" value="90" min="90" max="120" required><div class="form-help">قاعدة النظام: من 90 إلى 120 يومًا كحد أقصى. المحاضرة المرجعية مبنية على أول 90 يومًا.</div></div><div class="field"><label>مكان البيع المتوقع</label><input name="sellPlace" placeholder="مثال: سوق مدني" required></div><div class="field"><label>نسبة الربح المستهدفة %</label><input name="profit" type="number" value="20" min="0" step=".1" required></div><div class="field"><label>البيع المتوقع حاليًا</label><input name="expected" type="number" min="0" placeholder="يمكن تحديثه لاحقًا"></div></div><div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">إلغاء</button><button class="btn primary">إنشاء الخطة</button></div></form>`)}
function createPlan(ev){ev.preventDefault();const f=new FormData(ev.target),duration=+f.get('duration');if(duration<90||duration>120){alert('مدة دورة التسمين في النظام يجب أن تكون من 90 إلى 120 يومًا كحد أقصى.');return;}const p={id:uid('p'),clientId:f.get('clientId')||state.currentClientId,name:f.get('name'),start:f.get('start'),duration,sellPlace:f.get('sellPlace'),profitTarget:+f.get('profit'),status:'active',expectedSale:+f.get('expected')||0,projectType:'fattening',shelter:null,feeding:{storage:null},marketPlan:null,groups:[{id:uid('g'),name:'المجموعة الرئيسية'}]};state.plans.push(p);state.currentPlanId=p.id;state.currentPage='plan';state.planTab='shelter';save();closeModal();render()}
function openClientModal(){modal(`<div class="modal-head"><h3>إضافة عميل</h3><button class="close" onclick="closeModal()">×</button></div><form onsubmit="createClient(event)"><div class="form-grid"><div class="field"><label>اسم العميل</label><input name="name" required></div><div class="field"><label>رقم الجوال</label><input name="phone" required></div><div class="field"><label>المدينة / المنطقة</label><input name="city"></div><div class="field"><label>الحالة</label><select name="active"><option value="1">نشط</option><option value="0">غير نشط</option></select></div></div><div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">إلغاء</button><button class="btn primary">حفظ العميل</button></div></form>`)}
function createClient(ev){ev.preventDefault();const f=new FormData(ev.target);state.clients.push({id:uid('c'),name:f.get('name'),phone:f.get('phone'),city:f.get('city'),active:f.get('active')==='1'});save();closeModal();render()}
function openExpenseModal(pid){const p=plan(pid),as=planAnimals(pid);modal(`<div class="modal-head"><div><h3>إضافة مصروف</h3><div class="small muted">${p.name}</div></div><button class="close" onclick="closeModal()">×</button></div><form onsubmit="createExpense(event,'${pid}')"><div class="form-grid"><div class="field"><label>نوع المصروف</label><select name="type"><option>نقل</option><option>عمالة</option><option>إيجار</option><option>عمولة</option><option>صيانة</option><option>علاج</option><option>أخرى</option></select></div><div class="field"><label>المبلغ</label><input name="amount" type="number" min="0" required></div><div class="field"><label>التاريخ</label><input name="date" type="date" value="${today()}" required></div><div class="field"><label>نطاق المصروف</label><select name="scope" onchange="this.form.animalId.disabled=this.value!=='animal'"><option value="plan">الخطة كاملة</option><option value="animal">حيوان معين</option></select></div><div class="field"><label>الحيوان</label><select name="animalId" disabled><option value="">اختر</option>${as.map(a=>`<option value="${a.id}">#${a.tag}</option>`).join('')}</select></div><div class="field full"><label>الوصف / الملاحظة</label><textarea name="desc" placeholder="سبب أو تفاصيل المصروف"></textarea></div></div><div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">إلغاء</button><button class="btn primary">حفظ المصروف وتحديث الحسابات</button></div></form>`)}
function createExpense(ev,pid){ev.preventDefault();const f=new FormData(ev.target);state.expenses.push({id:uid('e'),planId:pid,type:f.get('type'),amount:+f.get('amount'),date:f.get('date'),scope:f.get('scope'),animalId:f.get('animalId')||null,desc:f.get('desc')});save();closeModal();render()}
function openDailyModal(pid){const as=planAnimals(pid).filter(a=>a.status!=='sold');modal(`<div class="modal-head"><div><h3>السجل اليومي</h3><div class="small muted">${plan(pid).name} — املأ فقط ما حدث اليوم.</div></div><button class="close" onclick="closeModal()">×</button></div><form onsubmit="createDaily(event,'${pid}')"><div class="field" style="margin-bottom:14px"><label>التاريخ</label><input name="date" type="date" value="${today()}"></div><div class="selection-box"><h4>النظافة اليومية للزريبة</h4><label class="check-item"><input type="checkbox" name="shelterCleaned">تم تنفيذ النظافة اليومية</label><div class="source-note">ورد روتين النظافة اليومي كمحور في المحاضرة، لكن تفاصيل خطواته لم تُحفظ؛ لذلك يسجل النظام التنفيذ فقط.</div></div><div class="table-wrap"><table><thead><tr><th>الحيوان</th><th>الوزن</th><th>الحالة</th><th>ملاحظة خاصة</th></tr></thead><tbody>${as.map(a=>`<tr><td><strong>#${a.tag}</strong></td><td><input style="width:90px" name="weight_${a.id}" type="number" step=".1" placeholder="كجم"></td><td><select name="status_${a.id}"><option value="">بدون تغيير</option><option value="normal">طبيعي</option><option value="treatment">يحتاج متابعة</option></select></td><td><input name="note_${a.id}" placeholder="ملاحظة خاصة بالحيوان"></td></tr>`).join('')}</tbody></table></div><div class="field" style="margin-top:14px"><label>ملاحظة عامة للمجموعة</label><textarea name="groupNote" placeholder="مثال: تم تغيير نوع العلف اليوم"></textarea></div><div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">إلغاء</button><button class="btn primary">حفظ السجل اليومي</button></div></form>`)}
function createDaily(ev,pid){ev.preventDefault();const f=new FormData(ev.target),entries=[];for(const a of planAnimals(pid)){const w=f.get('weight_'+a.id),st=f.get('status_'+a.id),n=f.get('note_'+a.id);if(w||st||n){entries.push({animalId:a.id,weight:w?+w:null,status:st||a.status,note:n||''});if(w)a.weights.push({date:f.get('date'),value:+w});if(st)a.status=st;if(n)a.notes.push({date:f.get('date'),text:n});}}state.daily.push({id:uid('d'),planId:pid,date:f.get('date'),note:f.get('groupNote'),shelterCleaned:!!f.get('shelterCleaned'),entries});save();closeModal();render()}
function breedField(type='calf'){
  if(type==='sheep') return `<select name="breed" id="breedInput" required onchange="updateBreedNote(this.value)"><option value="">اختر السلالة</option><option>الكباشي</option><option>الحمري</option><option>الدمازين</option><option>البلدي</option><option>النيلي</option><option>أخرى</option></select><div id="breedNote" class="breed-note" style="display:none"></div>`;
  return `<input name="breed" id="breedInput" placeholder="اكتب السلالة" required><div class="form-help">المحاضرة لم تحدد قائمة نهائية لسلالات العجول، لذلك لا يفرض النظام سلالة من عنده.</div>`;
}
function animalTypeChanged(v){const holder=document.getElementById('breedHolder');if(holder)holder.innerHTML=breedField(v);const label=document.getElementById('coatLabel');if(label)label.textContent=v==='sheep'?'الصوف نظيف وبحالة جيدة':'الشعر لامع وناعم';updateAnimalAssessment();}
function updateBreedNote(v){const el=document.getElementById('breedNote');if(!el)return;const notes={'الكباشي':'أسرع مكسب حسب خلاصة المحاضرة، ومطلوب جدًا.','الحمري':'ذكرت المحاضرة أنه مناسب للبيع في العيد.','الدمازين':'ذكرت المحاضرة أنه يتميز بزيادة وزن سريعة.','البلدي':'ذكرت المحاضرة أنه مناسب لرأس المال البسيط.','النيلي':'ذكرت المحاضرة أنه خيار للعمل في الشمالية.'};if(notes[v]){el.style.display='block';el.textContent=notes[v]}else el.style.display='none';}
const purchaseCheckNames=['breedGrowth','breedHeat','breedDisease','breedMeat','breedLocal','legs','back','bodyBalance','noDefects','movement','eyes','nose','coat','active','noCough','noDiarrhea','noWounds','skin','hoof','rearClean','teeth','marketAnimals','marketTraders'];
function updateAnimalAssessment(){const form=document.getElementById('animalSelectionForm'),box=document.getElementById('animalAssessment');if(!form||!box)return;const sex=form.elements.sex?.value;const checked=purchaseCheckNames.filter(n=>form.elements[n]?.checked).length;if(sex==='أنثى'){box.className='assessment bad';box.textContent='غير مناسب للاعتماد للتسمين وفق المحاضرة: الدكتورة حذرت من شراء الإناث بغرض التسمين.';return;}if(checked===purchaseCheckNames.length){box.className='assessment ok';box.textContent='مناسب مبدئيًا للتسمين حسب قائمة فحص المحاضرة الأولى. يظل الفحص البيطري/الخبير مستحسنًا عند الشراء.';return;}box.className='assessment review';box.textContent=`يحتاج مراجعة قبل الاعتماد — تم تأكيد ${checked} من ${purchaseCheckNames.length} نقطة فحص.`;}
function openAnimalModal(pid){const p=plan(pid);if(!p.shelter?.ready){alert('أكمل تقييم وتجهيز الزريبة من تبويب الزريبة قبل إضافة حيوان جديد.');state.planTab='shelter';save();render();return;}const current=planAnimals(pid).filter(a=>a.status!=='sold').length;if(p.shelter.headCount&&current>=p.shelter.headCount){alert('عدد الحيوانات وصل إلى العدد الذي تم تقييم الزريبة عليه. عدّل عدد الحيوانات وتجهيز الزريبة أولًا إذا أردت التوسع.');state.planTab='shelter';save();render();return;}const g=p.groups[0],fixedType=p.shelter.animalType||'calf';modal(`<div class="modal-head"><div><h3>اختيار وإضافة حيوان للتسمين</h3><div class="small muted">قائمة الفحص أدناه مأخوذة من المحاضرة الأولى فقط، ولا تضيف عمرًا أو معيارًا لم تحدده الدكتورة.</div></div><button class="close" onclick="closeModal()">×</button></div><form id="animalSelectionForm" onsubmit="createAnimal(event,'${pid}','${g.id}')" onchange="updateAnimalAssessment()"><div class="form-grid"><div class="field"><label>نوع الحيوان</label><input type="hidden" name="animalType" value="${fixedType}"><input value="${fixedType==='sheep'?'ضأن':'عجل'}" disabled><div class="form-help">نوع الحيوان ثابت حسب تجهيز الزريبة لهذه الخطة.</div></div><div class="field"><label>الجنس</label><select name="sex" required><option>ذكر</option><option>أنثى</option></select><div class="form-help">المحاضرة حذرت من شراء الإناث بغرض التسمين.</div></div><div class="field"><label>رقم الحيوان</label><input name="tag" required></div><div class="field"><label>تاريخ الشراء</label><input name="buyDate" type="date" value="${today()}" required></div><div class="field"><label>مكان الشراء</label><input name="buyPlace" required></div><div class="field"><label>وزن الشراء كجم</label><input name="weight" type="number" step=".1" required></div><div class="field"><label>سعر الشراء</label><input name="price" type="number" required></div><div class="field"><label>السلالة</label><div id="breedHolder">${breedField(fixedType)}</div></div></div>${fixedType==='sheep'?`<div class="breed-note">تذكير من المحاضرة الثانية: ذكرت الدكتورة للحملان شراء الحمل بعد العمر التقريبي 4–6 أشهر، ثم دورة تسمين قصيرة نحو شهرين إلى ثلاثة أشهر. لا يحول النظام هذا إلى حكم آلي على العمر.</div>`:''}
<div class="selection-box"><h4>1) صلاحية السلالة للتسمين</h4><p>لا يكفي اسم السلالة؛ أكّد معايير الاختيار التي ذكرتها الدكتورة.</p><div class="check-grid"><label class="check-item"><input type="checkbox" name="breedGrowth">سرعة نمو وكفاءة تحويل العلف مناسبة</label><label class="check-item"><input type="checkbox" name="breedHeat">متكيفة مع حرارة السودان</label><label class="check-item"><input type="checkbox" name="breedDisease">مقاومتها للأمراض الشائعة مناسبة</label><label class="check-item"><input type="checkbox" name="breedMeat">جودة اللحم وطلب السوق مناسبان</label><label class="check-item"><input type="checkbox" name="breedLocal">متوفرة محليًا بسعر مناسب</label></div></div>
<div class="selection-box"><h4>2) بنية الجسم والحركة</h4><p>افحص الحيوان على أرض مستوية كما أوصت المحاضرة.</p><div class="check-grid"><label class="check-item"><input type="checkbox" name="legs">الأرجل سليمة وتباعد الخلفيتين جيد</label><label class="check-item"><input type="checkbox" name="back">الظهر مستقيم</label><label class="check-item"><input type="checkbox" name="bodyBalance">خط الظهر متوازن مع خط البطن</label><label class="check-item"><input type="checkbox" name="noDefects">لا توجد عيوب خلقية ظاهرة</label><label class="check-item"><input type="checkbox" name="movement">الحركة طبيعية ولا يوجد عرج</label></div></div>
<div class="selection-box"><h4>3) علامات الحيوان السليم</h4><div class="check-grid"><label class="check-item"><input type="checkbox" name="eyes">العينان لامعتان ولا دمع أو إفرازات</label><label class="check-item"><input type="checkbox" name="nose">الأنف رطب وبارد</label><label class="check-item"><input type="checkbox" name="coat"><span id="coatLabel">الشعر لامع وناعم</span></label><label class="check-item"><input type="checkbox" name="active">الحيوان نشيط ويرفع رأسه</label><label class="check-item"><input type="checkbox" name="noCough">لا توجد كحة</label><label class="check-item"><input type="checkbox" name="noDiarrhea">لا يوجد إسهال</label><label class="check-item"><input type="checkbox" name="noWounds">لا توجد جروح</label><label class="check-item"><input type="checkbox" name="skin">الجلد سليم وغير متضرر</label><label class="check-item"><input type="checkbox" name="hoof">الحافر جاف ولا توجد علامات التهاب</label><label class="check-item"><input type="checkbox" name="rearClean">المنطقة الخلفية نظيفة ولا آثار إسهال</label></div></div>
<div class="selection-box"><h4>4) العمر والأسنان والسوق</h4><p>المحاضرة لم تعطِ عمرًا رقميًا نهائيًا، لذلك نطلب فقط توثيق الفحص والمقارنة.</p><div class="check-grid"><label class="check-item"><input type="checkbox" name="teeth">تم فحص الأسنان لتقدير العمر</label><label class="check-item"><input type="checkbox" name="marketAnimals">تمت مقارنة أكثر من حيوان</label><label class="check-item"><input type="checkbox" name="marketTraders">تمت مقارنة أكثر من تاجر / سعر</label><label class="check-item"><input type="checkbox" name="expert">استعنت بطبيب بيطري أو شخص خبير (مستحسن)</label></div></div>
<div id="animalAssessment" class="assessment review">يحتاج مراجعة قبل الاعتماد — أكمل قائمة الفحص.</div><div class="source-note">هذه النتيجة أداة تذكير مبنية على المحاضرة، وليست تشخيصًا بيطريًا.</div><div class="field full" style="margin-top:14px"><label>ملاحظة مهمة مثبتة</label><textarea name="note" placeholder="اختياري — تظهر أعلى ملف الحيوان"></textarea></div><div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">إلغاء</button><button class="btn primary">اعتماد الحيوان وإضافته للخطة</button></div></form>`);updateAnimalAssessment()}
function createAnimal(ev,pid,gid){ev.preventDefault();const p=plan(pid),f=new FormData(ev.target);if(!p.shelter?.ready){alert('لا يمكن إضافة الحيوان قبل اكتمال تجهيز الزريبة.');return;}if(p.shelter.animalType&&f.get('animalType')!==p.shelter.animalType){alert('نوع الحيوان يجب أن يطابق نوع الزريبة المعتمد للخطة.');return;}if(planAnimals(pid).filter(a=>a.status!=='sold').length>=p.shelter.headCount){alert('تجاوزت العدد الذي تم تقييم الزريبة عليه.');return;}if(f.get('sex')!=='ذكر'){alert('لا يمكن اعتماد الأنثى للتسمين وفق تحذير المحاضرة الأولى.');return;}const missing=purchaseCheckNames.filter(n=>!f.get(n));if(missing.length){alert('لا يمكن اعتماد الحيوان قبل إكمال جميع نقاط الفحص الأساسية في المحاضرة الأولى.');return;}const w=+f.get('weight'),d=f.get('buyDate');const selection={result:'suitable',checkedAt:today(),expertChecked:!!f.get('expert'),criteria:Object.fromEntries(purchaseCheckNames.map(n=>[n,true]))};state.animals.push({id:uid('a'),planId:pid,groupId:gid,animalType:f.get('animalType'),tag:f.get('tag'),buyDate:d,buyPlace:f.get('buyPlace'),buyWeight:w,buyPrice:+f.get('price'),breed:f.get('breed'),sex:f.get('sex'),status:'quarantine',selection,health:{arrivalCompleted:false,isolation:null,separateTools:null},pinnedNote:f.get('note'),weights:[{date:d,value:w}],notes:[]});save();closeModal();state.planTab='health';save();render();setTimeout(()=>alert('تم اعتماد الحيوان من فحص الشراء. الخطوة التالية: توثيق الاستقبال والعزل من الصحة الوقائية.'),0)}
function openAnimal(id){const a=state.animals.find(x=>x.id===id),p=plan(a.planId),last=a.weights.at(-1)?.value||a.buyWeight,type=a.animalType==='sheep'?'ضأن':a.animalType==='calf'?'عجل':'غير محدد',selection=a.selection?.result==='suitable'?'<span class="badge active">اجتاز فحص الاختيار</span>':'<span class="badge">سجل قديم — لم يمر بقائمة الفحص الجديدة</span>';modal(`<div class="modal-head"><div class="animal-head"><div class="animal-icon">${a.animalType==='sheep'?'🐑':'🐂'}</div><div><h3 style="margin:0">الحيوان #${a.tag}</h3><div class="small muted">${p.name} • ${type} • ${animalStatus(a.status)}</div></div></div><button class="close" onclick="closeModal()">×</button></div>${a.pinnedNote?`<div class="note-pin">📌 <strong>ملاحظة مهمة:</strong> ${a.pinnedNote}</div>`:''}<div style="margin-top:12px">${selection} ${a.health?.arrivalCompleted?'<span class="badge active">استقبال صحي موثق</span>':a.health?.arrivalCompleted===false?'<span class="badge sell">بانتظار توثيق الاستقبال والعزل</span>':'<span class="badge">الاستقبال الصحي غير موثق في السجل القديم</span>'} ${activeWithdrawal(a.id)?`<span class="badge treat">فترة سحب حتى ${activeWithdrawal(a.id)}</span>`:''}</div><div class="grid metrics" style="margin-top:15px"><div class="metric"><div class="label">وزن الشراء</div><div class="value">${a.buyWeight}</div><div class="note">كجم</div></div><div class="metric"><div class="label">آخر وزن</div><div class="value">${last}</div><div class="note">كجم</div></div><div class="metric good"><div class="label">إجمالي الزيادة</div><div class="value">+${last-a.buyWeight}</div><div class="note">كجم</div></div></div><div class="card" style="box-shadow:none;margin-top:12px"><h3>السجل الأولي الثابت</h3><div class="form-grid"><div><div class="small muted">نوع الحيوان</div><strong>${type}</strong></div><div><div class="small muted">تاريخ الشراء</div><strong>${a.buyDate}</strong></div><div><div class="small muted">مكان الشراء</div><strong>${a.buyPlace}</strong></div><div><div class="small muted">سعر الشراء</div><strong>${fmt(a.buyPrice)}</strong></div><div><div class="small muted">السلالة / الجنس</div><strong>${a.breed||'-'} / ${a.sex}</strong></div><div><div class="small muted">فحص خبير/بيطري</div><strong>${a.selection?.expertChecked?'تم':'غير مسجل'}</strong></div></div></div><div class="card" style="box-shadow:none;margin-top:12px"><h3>الملاحظات اليومية</h3>${a.notes.length?a.notes.slice().reverse().map(n=>`<div class="alert good"><span class="dot"></span><div><strong>${n.date}</strong><small>${n.text}</small></div></div>`).join(''):empty('لا توجد ملاحظات يومية')}</div>`)}
function openFeedModal(pid){modal(`<div class="modal-head"><div><h3>شراء علف</h3><div class="small muted">يسجل المخزون، بينما طريقة التقديم اليومية تُدار من «برنامج التغذية».</div></div><button class="close" onclick="closeModal()">×</button></div><form onsubmit="createFeed(event,'${pid}')"><div class="form-grid"><div class="field"><label>اسم العلف</label><input name="name" required placeholder="مثال: فتريتة، تبن، علف مركز"></div><div class="field"><label>التصنيف</label><select name="category" required><option value="concentrate">علف مركز</option><option value="roughage">علف مالئ / ألياف</option><option value="other">إضافة / أخرى</option></select></div><div class="field"><label>الكمية بالكيلو</label><input name="qty" type="number" min="0" step=".001" required></div><div class="field"><label>تكلفة الكيلو</label><input name="cost" type="number" min="0" step=".01" required></div><div class="field"><label>تاريخ الشراء</label><input name="date" type="date" value="${today()}"></div></div><div class="selection-box"><h4>فحص ظاهر للعلف عند الإدخال</h4><div class="check-grid"><label class="check-item"><input type="checkbox" name="cleanDry">العلف جاف ونظيف ولا توجد رائحة منفرة أو بلل ظاهر</label><label class="check-item"><input type="checkbox" name="noMold">لا توجد علامات عفن ظاهرة</label></div><div class="source-note">إذا لم تُؤكد النقطتين سيُحفظ المخزون، لكنه يظهر «لا يُقدّم قبل المراجعة» حتى لا يعتبر النظام علفًا فاسدًا صالحًا تلقائيًا.</div></div><div class="modal-actions"><button class="btn" type="button" onclick="closeModal()">إلغاء</button><button class="btn primary">حفظ</button></div></form>`)}
function createFeed(ev,pid){ev.preventDefault();const f=new FormData(ev.target),quality=!!f.get('cleanDry')&&!!f.get('noMold');state.feeds.push({id:uid('f'),planId:pid,name:f.get('name'),category:f.get('category'),qtyKg:+f.get('qty'),unitCost:+f.get('cost'),purchased:f.get('date'),usedKg:0,qualityOk:quality});save();closeModal();render();if(!quality)setTimeout(()=>alert('تم حفظ المخزون، لكنه غير معتمد للتقديم حتى تتأكد أنه جاف ونظيف وخالٍ من العفن الظاهر.'),0)}
function openTreatmentModal(pid){const as=planAnimals(pid).filter(a=>a.status!=='sold');modal(`<div class="modal-head"><div><h3>تسجيل علاج موثق</h3><div class="small muted">المحاضرة تشترط الوزن وقراءة العبوة/التركيز والرجوع للطبيب خصوصًا في الحقن والحالات المرضية.</div></div><button class="close" onclick="closeModal()">×</button></div><form onsubmit="createTreatment(event,'${pid}')"><div class="form-grid"><div class="field"><label>اسم العلاج/المستحضر</label><input name="name" required></div><div class="field"><label>التصنيف</label><select name="category" required><option value="other">علاج/مستحضر آخر</option><option value="antibiotic">مضاد حيوي</option><option value="preventive">إجراء وقائي</option></select></div><div class="field"><label>الحيوان</label><select name="animal" required>${as.map(a=>`<option value="${a.id}">#${a.tag} — آخر وزن ${a.weights.at(-1)?.value||a.buyWeight} كجم</option>`).join('')}</select></div><div class="field"><label>طريقة الإعطاء</label><select name="route" required><option value="oral">بالفم</option><option value="injection">حقن</option><option value="water">في الماء</option><option value="topical">موضعي</option><option value="other">أخرى</option></select></div><div class="field"><label>تاريخ البداية</label><input name="start" type="date" value="${today()}" required></div><div class="field"><label>عدد الأيام</label><input name="days" type="number" value="1" min="1" required></div><div class="field"><label>الجرعة كما على العبوة/الطبيب</label><input name="dose" required placeholder="اكتبها كما تم اعتمادها — لا يحسبها النظام"></div><div class="field"><label>تركيز/وصف العبوة</label><input name="concentration" required></div><div class="field"><label>مصدر الجرعة</label><select name="doseSource" required><option>ملصق المنتج</option><option>طبيب بيطري</option></select></div><div class="field"><label>انتهاء فترة السحب</label><input name="withdrawalUntil" type="date"><div class="form-help">إلزامي عند تسجيل مضاد حيوي؛ يسجل حسب الطبيب/ملصق المنتج، وليس رقمًا ثابتًا من المحاضرة.</div></div><div class="field"><label>تكلفة الكمية المستخدمة</label><input name="cost" type="number" value="0" min="0"></div><div class="field"><label>السبب</label><input name="reason"></div></div><div class="selection-box"><h4>تأكيدات الأمان</h4><div class="check-grid"><label class="check-item"><input type="checkbox" name="labelConfirmed" required>تم التأكد من وزن الحيوان وقراءة جرعة العبوة وتركيز المستحضر</label><label class="check-item"><input type="checkbox" name="vetConfirmed">تم الرجوع إلى طبيب بيطري/شخص متمرس لطريقة الحقن أو الحالة المرضية</label></div></div><div class="modal-actions"><button class="btn" type="button" onclick="closeModal()">إلغاء</button><button class="btn primary">حفظ العلاج</button></div></form>`)}
function createTreatment(ev,pid){ev.preventDefault();const f=new FormData(ev.target),aid=f.get('animal'),cat=f.get('category'),route=f.get('route'),vet=!!f.get('vetConfirmed');if((cat==='antibiotic'||route==='injection')&&!vet){alert('المحاضرة تشدد على الرجوع للطبيب/المتمرس خصوصًا في المضادات الحيوية والحقن. وثّق هذا التوجيه قبل الحفظ.');return;}if(cat==='antibiotic'&&!f.get('withdrawalUntil')){alert('سجّل تاريخ انتهاء فترة السحب كما حدده الطبيب/ملصق المنتج قبل حفظ المضاد الحيوي.');return;}state.treatments.push({id:uid('t'),planId:pid,animalIds:[aid],name:f.get('name'),category:cat,route,start:f.get('start'),days:+f.get('days'),dose:f.get('dose'),concentration:f.get('concentration'),doseSource:f.get('doseSource'),withdrawalUntil:f.get('withdrawalUntil')||'',labelConfirmed:true,vetConfirmed:vet,usedCost:+f.get('cost'),status:'active',reason:f.get('reason')});state.animals.find(a=>a.id===aid).status='treatment';save();closeModal();render()}
function openSaleModal(pid){const as=planAnimals(pid).filter(a=>a.status!=='sold'),blocked=as.filter(a=>activeWithdrawal(a.id));modal(`<div class="modal-head"><div><h3>تسجيل بيع</h3><div class="small muted">يمكن بيع حيوان واحد الآن وبقية القطيع لاحقًا.</div></div><button class="close" onclick="closeModal()">×</button></div>${blocked.length?`<div class="alert danger"><span class="dot"></span><div><strong>${blocked.length} حيوان داخل فترة سحب</strong><small>${blocked.map(a=>`#${a.tag} حتى ${activeWithdrawal(a.id)}`).join(' • ')} — سيمنع النظام بيع أي منها قبل انتهاء الفترة المسجلة.</small></div></div>`:''}<form onsubmit="createSale(event,'${pid}')"><div class="form-grid"><div class="field"><label>الحيوان</label><select name="animal" required>${as.map(a=>`<option value="${a.id}">#${a.tag}${activeWithdrawal(a.id)?' — فترة سحب حتى '+activeWithdrawal(a.id):''}</option>`).join('')}</select></div><div class="field"><label>تاريخ البيع</label><input name="date" type="date" value="${today()}" required></div><div class="field"><label>مكان البيع</label><input name="place" value="${plan(pid).sellPlace}"></div><div class="field"><label>طريقة البيع</label><select name="method"><option value="head">بالرأس</option><option value="weight">بالوزن</option></select></div><div class="field"><label>سعر البيع الفعلي</label><input name="amount" type="number" required></div><div class="field"><label>مصروفات البيع</label><input name="fees" type="number" value="0"></div><div class="field"><label>المشتري</label><input name="buyer"></div><div class="field"><label>وزن البيع (اختياري)</label><input name="weight" type="number" step=".1"></div></div><div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">إلغاء</button><button class="btn primary">تسجيل البيع</button></div></form>`)}
function createSale(ev,pid){ev.preventDefault();const f=new FormData(ev.target),aid=f.get('animal'),a=state.animals.find(x=>x.id===aid),saleDate=f.get('date'),wd=activeWithdrawal(aid,saleDate);if(wd){alert(`لا يمكن تسجيل بيع الحيوان #${a.tag} في ${saleDate}. توجد فترة سحب دواء مسجلة حتى ${wd}. راجع الطبيب/ملصق المنتج.`);return;}state.sales.push({id:uid('s'),planId:pid,animalIds:[aid],date:saleDate,place:f.get('place'),method:f.get('method'),amount:+f.get('amount'),fees:+f.get('fees'),buyer:f.get('buyer')});a.status='sold';if(f.get('weight'))a.weights.push({date:saleDate,value:+f.get('weight')});save();closeModal();render()}
function render(){let html;switch(state.currentPage){case'plans':html=plansPage();break;case'clients':html=clientsPage();break;case'plan':html=planPage();break;case'daily':html=dailyPage();break;case'feeds':html=feedsPage();break;case'treatments':html=treatmentsPage();break;case'expenses':html=expensesPage();break;case'sales':html=salesPage();break;case'reports':html=reportsPage();break;default:html=dashboard();}document.getElementById('app').innerHTML=html}
render();
</script></body></html>
