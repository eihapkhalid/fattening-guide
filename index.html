/* FEED_CURRENCY_CARDS_V3 — professional visual system */
:root{
  --bg:#f7f6f2;--surface:#ffffff;--surface-2:#f1f3ef;--text:#1f2a25;--muted:#6d7772;
  --primary:#204a3d;--primary-2:#315f50;--primary-soft:#e9f1ed;--accent:#ad7430;
  --danger:#b64343;--warning:#a7681f;--success:#2e7456;--border:#dce1dc;
  --shadow:0 3px 12px rgba(32,74,61,.055);--radius:14px;--radius-sm:10px;
}
html,body,button,input,select,textarea{font-family:"IBM Plex Sans Arabic",Tahoma,Arial,sans-serif}
body{letter-spacing:0;background:var(--bg)}
.sidebar{background:#173d33;box-shadow:none}
.brand-badge{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);font-size:0;border-radius:10px}
.card,.metric,.plan-card,.ez-plan-card{box-shadow:var(--shadow);border-color:var(--border)}
.card,.metric,.plan-card{border-radius:14px}.plan-summary{background:#204a3d;border-radius:16px;box-shadow:none}
.metric.hero{background:#204a3d}.btn{border-radius:9px;box-shadow:none;transition:background .15s,border-color .15s,color .15s}.btn:hover{transform:none}
.btn.primary{background:#204a3d;border-color:#204a3d}.btn.primary:hover{background:#183c31}
.tabs{background:#ecefea;border-radius:10px;padding:4px}.tab{border-radius:7px}.tab.active{box-shadow:none;border:1px solid var(--border)}
.topbar{box-shadow:none;background:rgba(255,255,255,.96)}
.ui-icon{width:1.15em;height:1.15em;display:inline-block;vertical-align:-.2em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}

let state = JSON.parse(localStorage.getItem('fatteningGuideState')||'null') || seed;

if(!state.feedingLogs)state.feedingLogs=[];

if(!state.healthSettings)state.healthSettings={};
state.plans.forEach(p=>{if(!state.healthSettings[p.id])state.healthSettings[p.id]={vetName:'',vetPhone:'',cabinet:{}};});
state.animals.forEach(a=>{if(!('health' in a))a.health={arrivalCompleted:null,isolation:null,separateTools:null};});
state.treatments.forEach(t=>{if(!('category' in t))t.category='other';if(!('route' in t))t.route='';if(!('dose' in t))t.dose='';if(!('concentration' in t))t.concentration='';if(!('doseSource' in t))t.doseSource='';if(!('withdrawalUntil' in t))t.withdrawalUntil='';if(!('vetConfirmed' in t))t.vetConfirmed=null;if(!('labelConfirmed' in t))t.labelConfirmed=null;});

function save(){ localStorage.setItem('fatteningGuideState',JSON.stringify(state)); }
function client(){ return state.clients.find(c=>c.id===state.currentClientId)||state.clients[0]; }
function plan(id=state.currentPlanId){ return state.plans.find(p=>p.id===id); }
function planAnimals(pid){ return state.animals.filter(a=>a.planId===pid); }
function planFeeds(pid){ return state.feeds.filter(x=>x.planId===pid); }
function planFeedingLogs(pid){ return state.feedingLogs.filter(x=>x.planId===pid); }
function planHealthLogs(pid){ return state.healthLogs.filter(x=>x.planId===pid); }

function planTreatments(pid){ return state.treatments.filter(x=>x.planId===pid); }

function planSales(pid){ return state.sales.filter(x=>x.planId===pid); }
function stats(p){
  const animals=planAnimals(p.id), buy=animals.reduce((s,a)=>s+a.buyPrice,0);
  const feedUsed=planFeeds(p.id).reduce((s,f)=>s+f.usedKg*f.unitCost,0);
  const treatment=planTreatments(p.id).reduce((s,t)=>s+t.usedCost,0);
  const other=planExpenses(p.id).filter(e=>e.type!=='علاج').reduce((s,e)=>s+e.amount,0);
  const total=buy+feedUsed+treatment+other;
  const required=total*(1+p.profitTarget/100);
  const actualSales=planSales(p.id).reduce((s,x)=>s+x.amount-x.fees,0);
  const expected=p.expectedSale||0;
  const profit=expected-total;
  const soldIds=new Set(planSales(p.id).flatMap(s=>s.animalIds));
  return {animals,buy,feedUsed,treatment,other,total,required,actualSales,expected,profit,sold:soldIds.size,remaining:animals.length-soldIds.size};
}
function daysPassed(p){ return Math.max(0,Math.floor((new Date()-new Date(p.start))/(86400000))); }
function cycleDay(p){const now=new Date(today()+'T00:00:00'),start=new Date(p.start+'T00:00:00');if(now<start)return 0;return Math.floor((now-start)/86400000)+1}
function cyclePhase(p){const d=cycleDay(p);if(d===0)return {key:'before',name:'قبل البداية',from:0,to:0};if(d<=21)return {key:'foundation',name:'التأسيس',from:1,to:21};if(d<=66)return {key:'build',name:'بناء اللحم',from:22,to:66};if(d<=90)return {key:'finish',name:'التشطيب',from:67,to:90};if(d<=Math.max(90,p.duration||90))return {key:'extension',name:'تمديد مراقَب',from:91,to:p.duration};return {key:'ended',name:'تجاوز المدة المخططة',from:p.duration,to:p.duration}}
function cycleRemaining(p){return Math.max(0,(p.duration||90)-cycleDay(p)+1)}
function lecture5Target(a,phaseKey){const isCalf=a.animalType==='calf'&&Number(a.buyWeight)===200,isSheep=a.animalType==='sheep'&&Number(a.buyWeight)===20;if(!isCalf&&!isSheep)return null;if(isCalf){const m={foundation:{feed:'من 2 إلى 5 كجم تدريجيًا',gain:'+10 كجم',target:'210 كجم'},build:{feed:'6 كجم يوميًا',gain:'+55 كجم',target:'265 كجم'},finish:{feed:'6 كجم + 1 كجم عيش ناشف مبلول',gain:'+25 كجم',target:'290 كجم'},extension:{feed:'لا توجد وصفة إضافية في الإرشادات المعتمدة',gain:'لا يوجد هدف رقمي موثق',target:'الهدف المرجعي عند اليوم 90: 290 كجم'}};return {kind:'عجل 200 كجم',final:'290 كجم',totalGain:'90 كجم',...(m[phaseKey]||{})}}const m={foundation:{feed:'من 200 إلى 500 جرام تدريجيًا',gain:'+2 كجم',target:'22 كجم'},build:{feed:'600 جرام يوميًا',gain:'+8 كجم',target:'30 كجم'},finish:{feed:'600 جرام + 200 جرام عيش أو مولاس',gain:'+3 كجم',target:'32–35 كجم عند نهاية الدورة'},extension:{feed:'لا توجد وصفة إضافية في الإرشادات المعتمدة',gain:'لا يوجد هدف رقمي موثق',target:'الهدف المرجعي عند اليوم 90: 32–35 كجم'}};return {kind:'خروف 20 كجم',final:'32–35 كجم',totalGain:'12–15 كجم',...(m[phaseKey]||{})}}

function openMarketPlanModal(pid){const p=plan(pid),m=p.marketPlan||{};modal(`<div class="modal-head"><div><h3>خطة السوق والبيع</h3><div class="small muted">يُوصى بـ دراسة الموسم والسوق والأسعار والتوقيت؛ أدخل معلوماتك المحلية الفعلية.</div></div><button class="close" onclick="closeModal()">×</button></div><form onsubmit="saveMarketPlan(event,'${pid}')"><div class="form-grid"><div class="field"><label>موسم / حالة الطلب</label><input name="season" value="${m.season||''}" required placeholder="مثال: طلب مرتفع / موسم محدد"></div><div class="field"><label>حجم السوق</label><input name="marketSize" value="${m.marketSize||''}" required placeholder="اكتب ملاحظتك الفعلية"></div><div class="field"><label>الأسعار السائدة</label><input name="prices" value="${m.prices||''}" required placeholder="اكتب الأسعار التي جمعتها"></div><div class="field"><label>موعد البيع المخطط</label><input name="saleTiming" value="${m.saleTiming||''}" required></div><div class="field"><label>طريقة البيع</label><select name="saleMethod" required><option value="" ${!m.saleMethod?'selected':''}>اختر</option><option ${m.saleMethod==='منفردة'?'selected':''}>منفردة</option><option ${m.saleMethod==='دفعة واحدة'?'selected':''}>دفعة واحدة</option><option ${m.saleMethod==='حسب ظروف السوق'?'selected':''}>حسب ظروف السوق</option></select></div><div class="field"><label>سبب التمديد بعد 90 يومًا — إن كانت الخطة أطول</label><input name="extensionReason" value="${m.extensionReason||''}" placeholder="اختياري حتى اليوم 90"></div></div><div class="source-note">إذا كانت الخطة 91–120 يومًا فسبب التمديد يساعد على توثيق القرار، لكنه لا يحوّل الأيام الإضافية إلى توصية علمية من الإرشادات المعتمدة.</div><div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">إلغاء</button><button class="btn primary">حفظ خطة السوق</button></div></form>`)}

function overviewTab(p,s){const shelter=p.shelter?.ready?`<div class="alert good" style="margin-bottom:16px"><span class="dot"></span><div><strong>الزريبة جاهزة حسب قائمة فحص معايير تجهيز الزريبة</strong><small>${p.shelter.animalType==='sheep'?`العدد المخطط ${p.shelter.headCount} رأس • المساحة المسقوفة المحسوبة ${p.shelter.headCount} م² تقريبًا`:'لم يُفرض رقم لمساحة العجل لأن الإرشادات المعتمدة غير محدد رقمًا واضحًا.'}</small></div><button class="btn small" onclick="setTab('shelter')">فتح الفحص</button></div>`:`<div class="alert danger" style="margin-bottom:16px"><span class="dot"></span><div><strong>تجهيز الزريبة غير مكتمل</strong><small>أكمل فحص الزريبة من معايير تجهيز الزريبة قبل إضافة حيوانات جديدة.</small></div><button class="btn small" onclick="setTab('shelter')">تجهيز الزريبة</button></div>`;const ph=cyclePhase(p),cycleAlert=`<div class="alert ${ph.key==='extension'?'danger':'good'}" style="margin-bottom:16px"><span class="dot"></span><div><strong>اليوم ${cycleDay(p)} — ${ph.name}</strong><small>${ph.key==='extension'?'الخطة تجاوزت اليوم 90 المرجعي؛ افتح خطة 90–120 يوم لمراجعة قرار التمديد.':ph.key==='ended'?'تجاوزت المدة المخططة.':'تابع المرحلة الحالية وأهدافها من تبويب خطة 90–120 يوم.'}</small></div><button class="btn small" onclick="setTab('cycle')">فتح الدورة</button></div>`;return `${shelter}${cycleAlert}<div class="grid metrics"><div class="metric"><div class="label">الحيوانات الحالية</div><div class="value">${s.remaining}</div><div class="note">${s.sold} مباع</div></div><div class="metric"><div class="label">شراء الحيوانات</div><div class="value">${fmt(s.buy)}</div></div><div class="metric"><div class="label">العلف المستهلك</div><div class="value">${fmt(s.feedUsed)}</div></div><div class="metric"><div class="label">العلاجات المستخدمة</div><div class="value">${fmt(s.treatment)}</div></div><div class="metric"><div class="label">مصروفات أخرى</div><div class="value">${fmt(s.other)}</div></div></div><div class="split"><div class="card"><div class="section-title"><h3>الحيوانات</h3><button class="btn small" onclick="setTab('animals')">عرض الكل</button></div>${animalTable(p,true)}</div><div class="card"><h3>آخر النشاطات</h3><div class="timeline"><div class="event"><div class="line"></div><div class="event-body"><strong>تم تحديث أوزان الحيوانات</strong><small>12 أغسطس 2026</small></div></div><div class="event"><div class="line"></div><div class="event-body"><strong>إضافة علاج للحيوان 002</strong><small>11 أغسطس 2026</small></div></div><div class="event"><div class="line"></div><div class="event-body"><strong>شراء علف مركز</strong><small>1 أغسطس 2026</small></div></div></div></div></div>`}
function animalTable(p,limit=false){let a=planAnimals(p.id);if(limit)a=a.slice(0,5);return `<div class="table-wrap"><table><thead><tr><th>الحيوان</th><th>وزن الشراء</th><th>آخر وزن</th><th>الزيادة</th><th>الحالة</th><th></th></tr></thead><tbody>${a.map(x=>{const last=x.weights.at(-1)?.value||x.buyWeight;return `<tr><td><strong>#${x.tag}</strong>${x.pinnedNote?'<div class="small muted">📌 لديه ملاحظة مهمة</div>':''}</td><td>${x.buyWeight} كجم</td><td>${last} كجم</td><td class="money-positive">+${last-x.buyWeight} كجم</td><td>${animalStatus(x.status)}</td><td><button class="btn small" onclick="openAnimal('${x.id}')">فتح</button></td></tr>`}).join('')}</tbody></table></div>`}
const shelterCheckNames=['roofRain','floorRaised','floorSlope','drainage','ventilation','feeders','waterers','lickStone','lickSeparate'];
const shelterCheckLabels={roofRain:'السقف يمنع دخول المطر',floorRaised:'الأرضية مرتفعة عن مستوى المياه المحيطة',floorSlope:'الأرضية بها ميل يساعد الماء على الخروج',drainage:'لا تُترك المياه راكدة داخل الزريبة',ventilation:'توجد تهوية مناسبة',feeders:'المعالف متوفرة',waterers:'المساقي متوفرة',lickStone:'حجر اللحوس متوفر',lickSeparate:'حجر اللحوس موضوع أو معلق منفصلًا عن العلف'};
function shelterCheck(name,s){return `<label class="check-item"><input type="checkbox" name="${name}" ${s?.[name]?'checked':''}>${shelterCheckLabels[name]}</label>`}
function shelterAssessment(s){if(!s)return{cls:'review',text:'لم يتم تقييم الزريبة بعد.'};const missing=shelterCheckNames.filter(n=>!s[n]);if(s.projectType!=='fattening')return{cls:'bad',text:'هذا النظام مخصص لدورات التسمين. مشروع التربية أطول وله احتياجات مختلفة وفق متطلبات هذا النوع من المشاريع.'};if(!s.headCount||s.headCount<1)return{cls:'review',text:'حدد عدد الحيوانات الذي ستجهز الزريبة له.'};if(s.roofMaterial==='zinc'&&!s.insulation)return{cls:'bad',text:'الزنك دون عازل حراري لا يطابق ما أوصت به الإرشادات المعتمدة في ظروف الحرارة.'};if(missing.length)return{cls:'review',text:`الزريبة تحتاج مراجعة — لم يتم تأكيد ${missing.length} نقطة أساسية.`};return{cls:'ok',text:'الزريبة مستوفية للنقاط الأساسية المحفوظة من معايير تجهيز الزريبة.'}}

function shelterTab(p){const s=p.shelter||{},a=shelterAssessment(s),roof=s.roofMaterial||'straw',animalType=s.animalType||'calf',project=s.projectType||'fattening',waste=s.wasteUse||'undecided',calfSpace=Number(s.calfSpacePerHead)||3;return `<div class="split"><div class="card"><div class="section-title"><div><h3>تجهيز وفحص الزريبة</h3><div class="small muted">تطبق هذه الشاشة فقط ما ورد بوضوح في معايير تجهيز الزريبة.</div></div></div><form id="shelterForm" onsubmit="saveShelter(event,'${p.id}')" onchange="updateShelterAssessment()"><div class="form-grid"><div class="field"><label>نوع المشروع</label><select name="projectType" required><option value="fattening" ${project==='fattening'?'selected':''}>تسمين</option><option value="breeding" ${project==='breeding'?'selected':''}>تربية</option></select><div class="form-help">الموقع مخصص لإدارة التسمين؛ التربية دورة أطول واحتياجاتها مختلفة.</div></div><div class="field"><label>نوع الحيوان</label><select name="animalType" required><option value="calf" ${animalType==='calf'?'selected':''}>عجول</option><option value="sheep" ${animalType==='sheep'?'selected':''}>ضأن</option></select></div><div class="field"><label>عدد الحيوانات المخطط</label><input name="headCount" type="number" min="1" value="${s.headCount||''}" required></div><div class="field" id="calfSpaceField" style="${animalType==='calf'?'':'display:none'}"><label>المساحة المعتمدة لكل عجل (م²)</label><input name="calfSpacePerHead" type="number" min="0.1" step="0.1" value="${calfSpace}" required><div class="form-help">القيمة التشغيلية الحالية 3 م² لكل عجل. يمكن تعديلها لاحقًا عند اعتماد قيمة جديدة.</div></div><div class="field"><label>مكان التسمين</label><select name="locationType"><option value="home" ${s.locationType==='home'?'selected':''}>حوش المنزل</option><option value="dedicated" ${s.locationType==='dedicated'?'selected':''}>زريبة مستقلة</option><option value="other" ${s.locationType==='other'?'selected':''}>مكان آخر</option></select><div class="form-help">الإرشادات المعتمدة أجازت حوش المنزل إذا توفرت المساحة والمواصفات المناسبة.</div></div><div class="field"><label>مادة السقف</label><select name="roofMaterial" required><option value="straw" ${roof==='straw'?'selected':''}>قش / تغطية تقليدية</option><option value="zinc" ${roof==='zinc'?'selected':''}>زنك</option><option value="other" ${roof==='other'?'selected':''}>مادة أخرى</option></select></div><div class="field" id="insulationField" style="${roof==='zinc'?'':'display:none'}"><label>عازل حراري تحت الزنك</label><label class="check-item"><input type="checkbox" name="insulation" ${s.insulation?'checked':''}>موجود</label></div></div><div id="shelterSpaceNote" class="breed-note" style="margin-top:14px"></div><div id="shelterRoofNote" class="source-note"></div><div class="selection-box"><h4>فحص الأرضية والسقف والتهوية</h4><div class="check-grid">${['roofRain','floorRaised','floorSlope','drainage','ventilation'].map(n=>shelterCheck(n,s)).join('')}</div></div><div class="selection-box"><h4>الأدوات الأساسية</h4><div class="check-grid">${['feeders','waterers','lickStone','lickSeparate'].map(n=>shelterCheck(n,s)).join('')}<label class="check-item"><input type="checkbox" name="tapeMeasure" ${s.tapeMeasure?'checked':''}>الميزان الشريطي متوفر</label></div><div class="source-note">وردت المعالف والمساقي والميزان الشريطي ضمن محاور الإرشادات المعتمدة، لكن أبعادها وطريقة استخدام الميزان لم تُحفظ؛ لذلك لا يضع النظام مقاسات أو طريقة غير موثقة.</div></div><div class="selection-box"><h4>الروث والمنتجات الثانوية</h4><div class="field"><label>طريقة التعامل مع الروث</label><select name="wasteUse"><option value="undecided" ${waste==='undecided'?'selected':''}>لم أحدد بعد</option><option value="regular" ${waste==='regular'?'selected':''}>تنظيف / التخلص المنتظم</option><option value="fertilizer" ${waste==='fertilizer'?'selected':''}>الاستفادة كسماد عضوي</option><option value="biogas" ${waste==='biogas'?'selected':''}>دراسة مشروع غاز حيوي</option></select></div><div id="wasteNote" class="source-note"></div></div><label class="check-item" style="margin-top:14px"><input type="checkbox" name="firstCycle" ${s.firstCycle?'checked':''}>هذه أول دورة تسمين لي</label><div id="beginnerNote" class="source-note"></div><div id="shelterAssessment" class="assessment ${a.cls}">${a.text}</div><div class="source-note">مساحة العجل التشغيلية المعتمدة حاليًا هي 3 م² للرأس. يمكن تعديلها من الحقل أعلاه مستقبلًا دون تغيير بقية حسابات الزريبة. أما أبعاد المعالف والمساقي وتفاصيل الأمان غير المحددة فتبقى دون افتراضات إضافية.</div><div class="modal-actions"><button class="btn primary">حفظ تقييم الزريبة</button></div></form></div><div class="card"><h3>المعايير الأساسية للزريبة</h3><div class="alerts"><div class="alert good"><span class="dot"></span><div><strong>الضأن: 1 م² مسقوف تقريبًا للرأس</strong><small>يظهر الحساب فقط عند اختيار الضأن.</small></div></div><div class="alert good"><span class="dot"></span><div><strong>العجول: 3 م² لكل رأس</strong><small>هذه هي القيمة التشغيلية الحالية، ويمكن تعديلها لاحقًا من إعداد الزريبة.</small></div></div><div class="alert"><span class="dot"></span><div><strong>السقف الزنك</strong><small>يتطلب عازلًا حراريًا وتهوية جيدة قبل اعتبار الزريبة جاهزة.</small></div></div><div class="alert"><span class="dot"></span><div><strong>حجر اللحوس</strong><small>يُسجل منفصلًا عن العلف وفق الإرشادات المعتمدة.</small></div></div></div></div></div>`}
function updateShelterAssessment(){const f=document.getElementById('shelterForm');if(!f)return;const type=f.elements.animalType.value,count=+f.elements.headCount.value||0,roof=f.elements.roofMaterial.value,calfSpace=Math.max(.1,Number(f.elements.calfSpacePerHead?.value)||3);const space=document.getElementById('shelterSpaceNote'),roofNote=document.getElementById('shelterRoofNote'),ins=document.getElementById('insulationField'),calfSpaceField=document.getElementById('calfSpaceField'),wasteNote=document.getElementById('wasteNote'),beginner=document.getElementById('beginnerNote'),box=document.getElementById('shelterAssessment');if(ins)ins.style.display=roof==='zinc'?'':'none';if(calfSpaceField)calfSpaceField.style.display=type==='calf'?'grid':'none';if(space)space.textContent=type==='sheep'?(count?`المساحة المسقوفة المطلوبة تقريبًا: ${count} م² (${count} رأس × 1 م²).`:'للضأن: متر مربع مسقوف تقريبًا لكل رأس.'):(count?`المساحة المطلوبة للعجول: ${Number((count*calfSpace).toFixed(2))} م² (${count} رأس × ${calfSpace} م²).`:`للعجول: ${calfSpace} م² لكل رأس.`);if(roofNote)roofNote.textContent=roof==='zinc'?'الزنك يرفع الحرارة إذا استُخدم وحده؛ يلزم عازل حراري مع تهوية مناسبة.':roof==='straw'?'مواد التغطية التقليدية مثل القش أنسب حراريًا، مع ضرورة منع دخول المطر.':'للمادة الأخرى لا توجد مواصفات حرارية رقمية؛ تبقى شروط منع المطر والتهوية مطلوبة.';const waste=f.elements.wasteUse.value;if(wasteNote)wasteNote.textContent=waste==='biogas'?'الاستفادة في الغاز الحيوي تحتاج متخصصًا وحسابًا مستقلًا؛ لا يعتمد النظام أرقامًا اقتصادية غير مؤكدة.':waste==='fertilizer'?'يمكن الاستفادة من الروث كسماد طبيعي/عضوي؛ تفاصيل التصنيع تأتي لاحقًا في الدورة.':waste==='undecided'?'يمكن التفكير في الروث كمنتج جانبي، دون افتراض عائد مالي.':'';if(beginner)beginner.textContent=f.elements.firstCycle.checked&&count>5?'للمبتدئ التوصية للمبتدئ هي بالبدء بعدد صغير نحو 4–5 رؤوس وتجربة دورة قبل التوسع.':f.elements.firstCycle.checked?'العدد يقع ضمن البداية الصغيرة التي نصحت بها الإرشادات المعتمدة للمبتدئ إذا كان 4–5 رؤوس.':'';const data={projectType:f.elements.projectType.value,headCount:count,roofMaterial:roof,insulation:!!f.elements.insulation?.checked};for(const n of shelterCheckNames)data[n]=!!f.elements[n]?.checked;const a=shelterAssessment(data);if(box){box.className=`assessment ${a.cls}`;box.textContent=a.text}if(type==='sheep'&&space&&count)space.textContent+=` وتتضمن الإرشادات أن دورة تسمين الحملان تكون قصيرة، نحو شهرين إلى ثلاثة أشهر، بعد شراء الحمل في العمر التقريبي المذكور بالإرشادات المعتمدة.`}
function saveShelter(ev,pid){ev.preventDefault();const f=new FormData(ev.target),p=plan(pid);const data={projectType:f.get('projectType'),animalType:f.get('animalType'),headCount:+f.get('headCount'),calfSpacePerHead:Math.max(.1,+f.get('calfSpacePerHead')||3),locationType:f.get('locationType'),roofMaterial:f.get('roofMaterial'),insulation:!!f.get('insulation'),tapeMeasure:!!f.get('tapeMeasure'),wasteUse:f.get('wasteUse'),firstCycle:!!f.get('firstCycle')};for(const n of shelterCheckNames)data[n]=!!f.get(n);const a=shelterAssessment(data);data.ready=a.cls==='ok';data.checkedAt=today();p.projectType=data.projectType;p.shelter=data;save();render();setTimeout(()=>alert(data.ready?'تم حفظ التقييم: الزريبة جاهزة حسب النقاط المحفوظة من معايير تجهيز الزريبة.':'تم حفظ التقييم، لكن الزريبة ما زالت تحتاج مراجعة قبل إضافة حيوانات جديدة.'),0)}
function animalsTab(p){return `<div class="card"><div class="section-title"><div><h3>حيوانات الخطة</h3><div class="small muted">السجل الأولي منفصل عن السجلات اليومية.</div></div><button class="btn primary small" onclick="openAnimalModal('${p.id}')">+ إضافة حيوان</button></div>${animalTable(p)}</div>`}
function dailyTab(p){const rows=state.daily.filter(d=>d.planId===p.id).map(d=>`<tr><td>${d.date}</td><td>${d.entries.length}</td><td>${d.shelterCleaned===true?'تم':d.shelterCleaned===false?'لم يُسجل':'-'}</td><td>${d.note||'-'}</td><td><button class="btn small" onclick="openDailyModal('${p.id}')">إضافة سجل جديد</button></td></tr>`).join('');return `<div class="card"><div class="section-title"><div><h3>السجل اليومي للمجموعة</h3><div class="small muted">سجل الوزن والحالة والملاحظة، مع توثيق تنفيذ النظافة اليومية دون إضافة تفاصيل غير محددة غير محددها الإرشادات المعتمدة.</div></div><button class="btn primary small" onclick="openDailyModal('${p.id}')">+ تسجيل يومي</button></div><div class="table-wrap"><table><thead><tr><th>التاريخ</th><th>الحيوانات المحدثة</th><th>نظافة الزريبة</th><th>ملاحظة المجموعة</th><th></th></tr></thead><tbody>${rows||'<tr><td colspan="5">لا توجد سجلات يومية بعد.</td></tr>'}</tbody></table></div></div>`}

const feedingStorageNames=['dryStorage','ventilatedStorage','groundProtected','rainProtected','noSpoiledFeed'];
const feedingStorageLabels={dryStorage:'مكان حفظ العلف جاف',ventilatedStorage:'مكان الحفظ جيد التهوية',groundProtected:'العلف محمي من رطوبة الأرض',rainProtected:'العلف محمي من مياه المطر',noSpoiledFeed:'لا يُقدّم علف ظهرت عليه علامات عفن أو فساد'};
function dayDiff(from,to=today()){if(!from)return 999;const a=new Date(from+'T00:00:00'),b=new Date(to+'T00:00:00');return Math.max(0,Math.floor((b-a)/86400000))}
function latestWeightRecord(a){return a.weights?.length?a.weights[a.weights.length-1]:{date:a.buyDate,value:a.buyWeight}}
function feedingAnimalType(p){return p.shelter?.animalType||planAnimals(p.id).find(a=>a.animalType)?.animalType||null}
function feedingTypeName(t){return t==='sheep'?'ضأن':t==='calf'?'عجول':'غير محدد'}
function concentrateTarget(weight){return +(Number(weight||0)*.03).toFixed(3)}
function roughageGeneral(concentrate){return +(Number(concentrate||0)*1.5).toFixed(3)}

function openFeedingLogModal(pid){
  const p=plan(pid),type=feedingAnimalType(p),animals=planAnimals(pid).filter(a=>a.status!=='sold'),totalC=animals.reduce((z,a)=>z+concentrateTarget(latestWeightRecord(a).value),0),totalR=roughageGeneral(totalC),conc=planFeeds(pid).filter(f=>f.category==='concentrate'&&f.qtyKg>f.usedKg),rough=planFeeds(pid).filter(f=>f.category==='roughage'&&f.qtyKg>f.usedKg);

function createFeedingLog(ev,pid){
  ev.preventDefault();const f=new FormData(ev.target),c=+f.get('concentrateKg')||0,r=+f.get('roughageKg')||0,cf=state.feeds.find(x=>x.id===f.get('concFeed')),rf=state.feeds.find(x=>x.id===f.get('roughFeed'));
  if(cf&&c>cf.qtyKg-cf.usedKg){alert('كمية المركزات أكبر من المخزون المتبقي.');return}if(rf&&r>rf.qtyKg-rf.usedKg){alert('كمية المالئ أكبر من المخزون المتبقي.');return}
  const log={id:uid('fl'),planId:pid,date:f.get('date'),concentrateKg:c,roughageKg:r,temperature:+f.get('temperature')||null,note:f.get('note')||'',concFeedId:cf?.id||null,roughFeedId:rf?.id||null};
  for(const n of ['waterBefore','waterAvailable','troughWashed','waterCool','waterShade','changedMorning','changedAfternoon','morningMeal','afternoonMeal','concentrateFirst','roughageSeparate','diarrhea','lowAppetite','bloat','lethargy'])log[n]=!!f.get(n);
  if(cf)cf.usedKg+=c;if(rf)rf.usedKg+=r;state.feedingLogs.push(log);save();closeModal();render();
  const danger=dangerText(log);setTimeout(()=>{if(danger)alert(`تم حفظ السجل. علامات تحتاج متابعة: ${danger}. وفق الإرشادات المعتمدة: ارجع خطوة في التدرج وقلل الكمية حتى تخف الأعراض، والنفاخ الشديد يحتاج طبيبًا بيطريًا.`);else if(log.temperature>35)alert('تم حفظ السجل. تنبيه من الجدول المنشور: الحرارة فوق 35° تقلل التحويل الغذائي 30%.');},0)

function emergencyCard(p){
 const es=planEmergencies(p.id).slice().reverse(),open=es.filter(e=>e.status!=='resolved'),st=state.healthSettings[p.id]||{};
 return `<div class="card emergency-card" style="margin-bottom:16px"><div class="section-title"><div><h3>🚨 التدخل السريع — قاعدة الدقائق الثلاث</h3><div class="small muted">لاحظ العلامة → نفّذ الإسعاف البسيط الموثق → اتصل بالطبيب → لا تنفذ إجراءً خطيرًا بنفسك.</div></div><button class="btn danger" onclick="openEmergencyModal('${p.id}')">تسجيل حالة طارئة</button></div><div class="emergency-rule"><span><strong>1</strong><br>لاحظ بسرعة</span><span><strong>2</strong><br>إسعاف بسيط فقط</span><span><strong>3</strong><br>اتصل بالطبيب</span><span><strong>4</strong><br>لا تدخل خطير</span></div><div class="emergency-grid"><div class="emergency-case"><strong>نفاخ</strong>انتفاخ الجهة اليسرى</div><div class="emergency-case"><strong>حموضة</strong>توقف أكل + خمول + رائحة حامضة</div><div class="emergency-case"><strong>إسهال</strong>والدم يعني طبيبًا فورًا</div><div class="emergency-case"><strong>قراد</strong>رش/مغطس حسب العدد مع تعليمات العبوة</div></div>${st.vetPhone?`<div class="emergency-call"><a class="btn danger small" href="tel:${st.vetPhone}">📞 ${st.vetName||'الطبيب البيطري'} — ${st.vetPhone}</a></div>`:`<div class="alert danger"><span class="dot"></span><div><strong>رقم الطبيب غير مسجل</strong><small>أضفه من «الطبيب وصيدلية الزريبة» قبل الطوارئ.</small></div></div>`}${open.length?`<div class="table-wrap" style="margin-top:12px"><table><thead><tr><th>التاريخ</th><th>الحيوان</th><th>الحالة</th><th>الطبيب</th><th>المتابعة</th><th></th></tr></thead><tbody>${open.slice(0,6).map(e=>`<tr><td>${e.date}</td><td>#${state.animals.find(a=>a.id===e.animalId)?.tag||'-'}</td><td><span class="badge treat">${emergencyTypeLabel(e.type)}</span></td><td>${e.vetContacted?'تم التواصل':'لم يوثق'}</td><td>${e.nextReview||'-'}</td><td><button class="btn small" onclick="markEmergencyResolved('${e.id}')">إغلاق الحالة</button></td></tr>`).join('')}</tbody></table></div>`:''}<div class="source-note">الوحدة تعرض فقط الإسعافات والمقادير التي المعتمدة في بروتوكول التدخل السريع، ولا تستبدل التشخيص والعلاج البيطري.</div></div>`;
}
function openEmergencyModal(pid){const as=planAnimals(pid).filter(a=>a.status!=='sold');modal(`<div class="modal-head"><div><h3>🚨 تسجيل تدخل سريع</h3><div class="small muted">الإسعاف الأولي إلى أن يصل الطبيب — لا تستخدم هذه الشاشة بدل التشخيص.</div></div><button class="close" onclick="closeModal()">×</button></div><form onsubmit="saveEmergency(event,'${pid}')"><div class="form-grid"><div class="field"><label>الحيوان</label><select name="animal" required>${as.map(a=>`<option value="${a.id}">#${a.tag}</option>`).join('')}</select></div><div class="field"><label>التاريخ</label><input name="date" type="date" value="${today()}" required></div><div class="field"><label>الحالة</label><select id="emergencyType" name="type" onchange="updateEmergencyCase('${pid}')" required><option value="bloat">نفاخ</option><option value="acidosis">حموضة</option><option value="diarrhea">إسهال</option><option value="ticks">قراد / طفيليات خارجية</option></select></div></div><div id="emergencyGuide">${emergencyGuideHtml('bloat',pid)}</div><div class="selection-box"><h4>ما الذي لاحظته أو نفذته؟</h4><div id="emergencyCaseFields">${emergencyFieldsHtml('bloat')}</div></div><div class="field full" style="margin-top:12px"><label>ملاحظة الحالة / توجيه الطبيب</label><textarea name="note"></textarea></div><div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">إلغاء</button><button class="btn danger">حفظ الحالة</button></div></form>`)}
function saveEmergency(ev,pid){ev.preventDefault();const f=new FormData(ev.target),type=f.get('type'),aid=f.get('animal'),date=f.get('date'),boolNames=['leftBloat','moved','paraffin','vetContacted','noRumenIntervention','stoppedEating','lethargy','sourBreath','diarrhea','feedStopped24','bicarbonateSolution','looseStool','blood','concentrateStopped','warmSaltSugar','ticksSeen','spray','dip','labelChecked'];const actions=Object.fromEntries(boolNames.map(n=>[n,!!f.get(n)]));if(type==='ticks'&&(actions.spray||actions.dip)&&!actions.labelChecked){alert('لا تسجل رشًا أو مغطسًا قبل توثيق مراجعة تعليمات العبوة/الطبيب للتركيز والتخفيف.');return;}const urgent=type==='bloat'||(type==='diarrhea'&&actions.blood),nextReview=type==='ticks'&&(actions.spray||actions.dip)?addDaysDate(date,14):'';state.emergencies=state.emergencies||[];state.emergencies.push({id:uid('em'),planId:pid,animalId:aid,date,type,status:'open',urgent,vetContacted:actions.vetContacted,actions,caseScale:f.get('caseScale')||'',nextReview,note:f.get('note')});const a=state.animals.find(x=>x.id===aid);if(a&&type!=='ticks'&&a.status!=='sold')a.status='treatment';save();closeModal();render();setTimeout(()=>{if(urgent&&!actions.vetContacted)alert('تم حفظ الحالة، لكن يلزم على الاتصال بالطبيب فورًا في هذه الحالة.');else if(type==='ticks'&&nextReview)alert(`تم حفظ الإجراء. موعد المراجعة التالي حسب تكرار 14 يومًا المعتمد: ${nextReview}. راجع العبوة والطبيب ولا تعتبر هذا التذكير جرعة تلقائية.`);else alert('تم حفظ التدخل السريع في سجل الحيوان.');},0)}
function markEmergencyResolved(id){state.emergencies=state.emergencies||[];const e=state.emergencies.find(x=>x.id===id);if(!e)return;e.status='resolved';e.resolvedAt=today();save();render()}

function openArrivalHealthModal(pid){const as=planAnimals(pid).filter(a=>a.status!=='sold');modal(`<div class="modal-head"><div><h3>استقبال وعزل الحيوان</h3><div class="small muted">سجّل تنفيذ العزل والملاحظة؛ مدة العزل تُحدد حسب الحالة والتوجيه البيطري.</div></div><button class="close" onclick="closeModal()">×</button></div><form onsubmit="saveArrivalHealth(event,'${pid}')"><div class="form-grid"><div class="field"><label>الحيوان</label><select name="animal" required>${as.map(a=>`<option value="${a.id}">#${a.tag}</option>`).join('')}</select></div><div class="field"><label>تاريخ الاستقبال/التوثيق</label><input name="date" type="date" value="${today()}" required></div></div><div class="selection-box"><h4>العزل والمراقبة</h4><div class="check-grid"><label class="check-item"><input type="checkbox" name="isolated" required>وُضع الحيوان الجديد في مكان منفصل</label><label class="check-item"><input type="checkbox" name="separateTools" required>خصصت له أدوات أكل وشرب منفصلة</label><label class="check-item"><input type="checkbox" name="observed" required>تمت مراقبة الحالة الصحية والتعرف على مكان الأكل والشرب</label></div></div><div class="selection-box"><h4>مكافحة الطفيليات والفيتامينات</h4><p>سجل ما تم فعليًا وفق ملصق المنتج/الطبيب، ولا تعتبر الخانات وصفة تلقائية.</p><div class="check-grid"><label class="check-item"><input type="checkbox" name="labelChecked" required>تمت مراجعة الوزن وملصق المنتج/التركيز قبل أي دواء</label><label class="check-item"><input type="checkbox" name="albendazole">تم إعطاء الألبندازول حسب التوجيه المناسب</label><label class="check-item"><input type="checkbox" name="ivermectin">تم إعطاء الإيفرمكتين حسب التوجيه المناسب</label><label class="check-item"><input type="checkbox" name="vitamins">تم دعم الحيوان بالفيتامينات حسب العبوة/التوجيه</label></div></div><div class="field full" style="margin-top:12px"><label>ملاحظة</label><textarea name="note"></textarea></div><div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">إلغاء</button><button class="btn primary">حفظ الاستقبال</button></div></form>`)}
function saveArrivalHealth(ev,pid){ev.preventDefault();const f=new FormData(ev.target),a=state.animals.find(x=>x.id===f.get('animal'));a.health={arrivalCompleted:true,date:f.get('date'),isolation:true,separateTools:true,observed:true,labelChecked:true,albendazole:!!f.get('albendazole'),ivermectin:!!f.get('ivermectin'),vitamins:!!f.get('vitamins'),note:f.get('note')};if(a.status==='quarantine')a.status='normal';for(const k of ['albendazole','ivermectin'])if(f.get(k))state.healthEvents.push({id:uid('h'),planId:pid,animalId:a.id,kind:k,date:f.get('date'),guidance:'حسب ملصق المنتج/الطبيب'});if(f.get('vitamins'))state.healthEvents.push({id:uid('h'),planId:pid,animalId:a.id,kind:'vitamin',date:f.get('date'),guidance:'حسب العبوة/التوجيه'});save();closeModal();render()}
function openHealthDailyModal(pid){const as=planAnimals(pid).filter(a=>a.status!=='sold');modal(`<div class="modal-head"><div><h3>متابعة صحية يومية</h3><div class="small muted">أي علامة خطر فورية ستظهر بتنبيه واضح للطبيب.</div></div><button class="close" onclick="closeModal()">×</button></div><form onsubmit="saveHealthDaily(event,'${pid}')"><div class="form-grid"><div class="field"><label>الحيوان</label><select name="animal" required>${as.map(a=>`<option value="${a.id}">#${a.tag}</option>`).join('')}</select></div><div class="field"><label>التاريخ</label><input name="date" type="date" value="${today()}" required></div></div><div class="selection-box"><h4>المتابعة بالنظر والملاحظة</h4><div class="check-grid"><label class="check-item"><input type="checkbox" name="appetiteOk">أكل بصورة طبيعية</label><label class="check-item"><input type="checkbox" name="drinkingOk">يشرب بصورة طبيعية</label><label class="check-item"><input type="checkbox" name="missedBothMeals">ترك وجبتي الصباح والعصر ولم يأكل طوال اليوم</label><label class="check-item"><input type="checkbox" name="diarrhea">يوجد إسهال</label><label class="check-item"><input type="checkbox" name="bloodyDiarrhea">يوجد دم في الروث</label><label class="check-item"><input type="checkbox" name="leftBloat">انتفاخ واضح في الجهة اليسرى</label><label class="check-item"><input type="checkbox" name="woundOrDischarge">جروح أو إفرازات</label><label class="check-item"><input type="checkbox" name="severeWound">جرح شديد/عميق/ملتهب أو به ديدان</label><label class="check-item"><input type="checkbox" name="sourBreath">رائحة غير معتادة/حامضة من الفم</label><label class="check-item"><input type="checkbox" name="ticks">وجود قراد أو طفيليات خارجية على الجلد</label><label class="check-item"><input type="checkbox" name="lethargy">خمول أو تغير مفاجئ في السلوك</label><label class="check-item"><input type="checkbox" name="suddenStopFoodWater">توقف مفاجئ عن الأكل والشرب</label></div></div><div class="selection-box"><h4>عند الاشتباه بالمرض</h4><div class="check-grid"><label class="check-item"><input type="checkbox" name="isolated">تم عزل الحيوان عن القطيع</label><label class="check-item"><input type="checkbox" name="separateTools">تم تخصيص معلفة ومسقاة وأدوات منفصلة</label></div></div><div class="field full" style="margin-top:12px"><label>ملاحظة</label><textarea name="note"></textarea></div><div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">إلغاء</button><button class="btn primary">حفظ المتابعة</button></div></form>`)}
function saveHealthDaily(ev,pid){ev.preventDefault();const f=new FormData(ev.target),l={id:uid('hl'),planId:pid,animalId:f.get('animal'),date:f.get('date'),appetiteOk:!!f.get('appetiteOk'),drinkingOk:!!f.get('drinkingOk'),missedBothMeals:!!f.get('missedBothMeals'),diarrhea:!!f.get('diarrhea'),bloodyDiarrhea:!!f.get('bloodyDiarrhea'),leftBloat:!!f.get('leftBloat'),woundOrDischarge:!!f.get('woundOrDischarge'),severeWound:!!f.get('severeWound'),sourBreath:!!f.get('sourBreath'),ticks:!!f.get('ticks'),lethargy:!!f.get('lethargy'),suddenStopFoodWater:!!f.get('suddenStopFoodWater'),isolated:!!f.get('isolated'),separateTools:!!f.get('separateTools'),note:f.get('note')};state.healthLogs.push(l);const a=state.animals.find(x=>x.id===l.animalId),dg=healthDanger(l);if((l.diarrhea||l.bloodyDiarrhea||l.leftBloat||l.woundOrDischarge||l.sourBreath||l.ticks||l.lethargy||l.suddenStopFoodWater)&&a.status!=='sold')a.status='treatment';save();closeModal();render();if(dg.length)setTimeout(()=>alert('علامة خطر تستدعي التواصل مع الطبيب فورًا وفق الإرشادات المعتمدة: '+dg.join('، ')+(l.isolated?'':'\nكما لم يتم توثيق عزل الحيوان.')+'\nافتح «التدخل السريع» من تبويب الصحة الوقائية لتسجيل الإسعاف الأولي.'),0)}
function openPreventiveEventModal(pid){const as=planAnimals(pid).filter(a=>a.status!=='sold');modal(`<div class="modal-head"><div><h3>تسجيل إجراء وقائي/تحصين</h3><div class="small muted">التسجيل يوثق ما تم حسب العبوة أو الطبيب أو الجهة البيطرية.</div></div><button class="close" onclick="closeModal()">×</button></div><form onsubmit="savePreventiveEvent(event,'${pid}')"><div class="form-grid"><div class="field"><label>الإجراء</label><select name="kind" required><option value="ivermectin">إيفرمكتين</option><option value="albendazole">ألبندازول</option><option value="enterotoxemia">لقاح التسمم المعوي</option><option value="anthrax">لقاح الأنثراكس / الجمرة الخبيثة</option><option value="vitamin">فيتامينات</option></select></div><div class="field"><label>النطاق</label><select name="animal"><option value="">القطيع / الخطة</option>${as.map(a=>`<option value="${a.id}">#${a.tag}</option>`).join('')}</select></div><div class="field"><label>التاريخ</label><input name="date" type="date" value="${today()}" required></div><div class="field"><label>مصدر التوجيه</label><select name="guidance" required><option>ملصق المنتج</option><option>طبيب بيطري</option><option>الخدمات البيطرية / وزارة الزراعة</option></select></div></div><div class="source-note">لا يضع النظام جرعة رقمية للقاحات، ولا يضع تكرارًا ثابتًا للأنثراكس لأن يرتبط ببرنامج المنطقة.</div><div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">إلغاء</button><button class="btn primary">حفظ</button></div></form>`)}
function savePreventiveEvent(ev,pid){ev.preventDefault();const f=new FormData(ev.target);state.healthEvents.push({id:uid('h'),planId:pid,animalId:f.get('animal')||'',kind:f.get('kind'),date:f.get('date'),guidance:f.get('guidance')});save();closeModal();render()}
function openHealthSettingsModal(pid){const st=state.healthSettings[pid]||{vetName:'',vetPhone:'',cabinet:{}};modal(`<div class="modal-head"><div><h3>الطبيب وصيدلية الزريبة</h3><div class="small muted">قائمة تجهيز مستخرجة من برنامج الصحة الوقائية، وليست قائمة علاج ذاتي.</div></div><button class="close" onclick="closeModal()">×</button></div><form onsubmit="saveHealthSettings(event,'${pid}')"><div class="form-grid"><div class="field"><label>اسم الطبيب/الجهة</label><input name="vetName" value="${st.vetName||''}"></div><div class="field"><label>رقم الطبيب</label><input name="vetPhone" value="${st.vetPhone||''}"></div></div><div class="selection-box"><h4>المستلزمات المتوفرة</h4><div class="check-grid">${healthCabinetItems.map(k=>`<label class="check-item"><input type="checkbox" name="${k}" ${st.cabinet?.[k]?'checked':''}>${healthCabinetLabels[k]}</label>`).join('')}</div></div><div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">إلغاء</button><button class="btn primary">حفظ</button></div></form>`)}
function saveHealthSettings(ev,pid){ev.preventDefault();const f=new FormData(ev.target),cabinet={};for(const k of healthCabinetItems)cabinet[k]=!!f.get(k);state.healthSettings[pid]={vetName:f.get('vetName'),vetPhone:f.get('vetPhone'),cabinet};save();closeModal();render()}
function treatmentsTab(p){const ts=planTreatments(p.id);return `<div class="alert good" style="margin-bottom:16px"><span class="dot"></span><div><strong>قاعدة أمان الدواء</strong><small>لا تُحسب الجرعة تلقائيًا. سجّل الوزن، جرعة/تركيز العبوة، مصدر التوجيه وفترة السحب. الحقن والمضادات الحيوية تتطلب توثيق الرجوع للطبيب/المتمرس.</small></div></div><div class="card"><div class="section-title"><div><h3>العلاجات والمتابعة</h3><div class="small muted">العلاج منفصل عن برنامج الوقاية، لكنه يشارك معه فترة السحب وحالة الحيوان.</div></div><button class="btn primary small" onclick="openTreatmentModal('${p.id}')">+ تسجيل علاج</button></div><div class="table-wrap"><table><thead><tr><th>العلاج</th><th>الحيوانات</th><th>البداية</th><th>الجرعة/المصدر</th><th>فترة السحب</th><th>الحالة</th><th>التكلفة</th></tr></thead><tbody>${ts.map(t=>`<tr><td><strong>${t.name}</strong><div class="small muted">${t.reason||'-'} • ${t.category==='antibiotic'?'مضاد حيوي':t.category==='preventive'?'وقائي':'علاج/مستحضر آخر'}</div></td><td>${t.animalIds.map(id=>'#'+state.animals.find(a=>a.id===id)?.tag).join('، ')}</td><td>${t.start}</td><td>${t.dose||'-'}${t.concentration?' • '+t.concentration:''}<div class="small muted">${t.doseSource||'-'}</div></td><td>${t.withdrawalUntil?`<span class="badge ${today()<=t.withdrawalUntil?'treat':'active'}">حتى ${t.withdrawalUntil}</span>`:'غير مسجلة/غير مطلوبة'}</td><td>${t.status==='active'?'<span class="badge treat">مستمر</span>':'<span class="badge active">مكتمل</span>'}</td><td>${fmt(t.usedCost)}</td></tr>`).join('')}</tbody></table></div></div>`}
function expensesTab(p){const es=planExpenses(p.id);return `<div class="card"><div class="section-title"><div><h3>مصروفات الخطة</h3><div class="small muted">كل مصروف مرتبط بالخطة، ويمكن تخصيصه للمجموعة أو الحيوان.</div></div><button class="btn primary small" onclick="openExpenseModal('${p.id}')">+ إضافة مصروف</button></div><div class="table-wrap"><table><thead><tr><th>التاريخ</th><th>النوع</th><th>النطاق</th><th>الوصف</th><th>المبلغ</th></tr></thead><tbody>${es.map(e=>`<tr><td>${e.date}</td><td>${e.type}</td><td>${e.scope==='animal'?'حيوان '+(state.animals.find(a=>a.id===e.animalId)?.tag||''):'الخطة كاملة'}</td><td>${e.desc}</td><td><strong>${fmt(e.amount)}</strong></td></tr>`).join('')}</tbody></table></div></div>`}
function salesTab(p){const ss=planSales(p.id),s=stats(p),blocked=planAnimals(p.id).filter(a=>a.status!=='sold'&&activeWithdrawal(a.id)),preSale=cycleRemaining(p)>0&&cycleRemaining(p)<=7;return `${preSale?`<div class="alert danger" style="margin-bottom:16px"><span class="dot"></span><div><strong>أسبوع ما قبل موعد البيع المخطط</strong><small>راجع الأدوية وفترات السحب والطبيب. لا تفترض أن 7 أيام تكفي لكل دواء، ولا توقف علاجًا ضروريًا دون توجيه بيطري.</small></div></div>`:''}${blocked.length?`<div class="alert danger" style="margin-bottom:16px"><span class="dot"></span><div><strong>بيع محظور مؤقتًا لـ ${blocked.length} حيوان بسبب فترة السحب</strong><small>${blocked.map(a=>`#${a.tag}: حتى ${activeWithdrawal(a.id)}`).join(' • ')}</small></div></div>`:''}<div class="grid metrics"><div class="metric"><div class="label">الحيوانات المباعة</div><div class="value">${s.sold}</div></div><div class="metric"><div class="label">الإيراد المحقق</div><div class="value">${fmt(s.actualSales)}</div></div><div class="metric"><div class="label">الحيوانات المتبقية</div><div class="value">${s.remaining}</div></div></div><div class="card"><div class="section-title"><div><h3>عمليات البيع</h3><div class="small muted">البيع الجزئي لا يغلق الخطة، وفترة السحب الدوائي تُفحص قبل الحفظ.</div></div><button class="btn primary small" onclick="openSaleModal('${p.id}')">+ تسجيل بيع</button></div><div class="table-wrap"><table><thead><tr><th>التاريخ</th><th>الحيوانات</th><th>المكان</th><th>المشتري</th><th>صافي البيع</th></tr></thead><tbody>${ss.map(x=>`<tr><td>${x.date}</td><td>${x.animalIds.map(id=>'#'+state.animals.find(a=>a.id===id)?.tag).join('، ')}</td><td>${x.place}</td><td>${x.buyer||'-'}</td><td class="money-positive">${fmt(x.amount-x.fees)}</td></tr>`).join('')||'<tr><td colspan="5">لم يتم تسجيل مبيعات لهذه الخطة بعد.</td></tr>'}</tbody></table></div></div>`}
function reportsTab(p){const s=stats(p);return `<div class="grid metrics"><div class="metric"><div class="label">إجمالي التكلفة</div><div class="value">${fmt(s.total)}</div></div><div class="metric"><div class="label">البيع المتوقع</div><div class="value">${fmt(s.expected)}</div></div><div class="metric good"><div class="label">الربح المتوقع</div><div class="value">${fmt(s.profit)}</div></div><div class="metric"><div class="label">العلف من التكلفة</div><div class="value">${s.total?pct(s.feedUsed/s.total*100):'0%'}</div></div><div class="metric"><div class="label">العلاجات من التكلفة</div><div class="value">${s.total?pct(s.treatment/s.total*100):'0%'}</div></div></div><div class="card"><h3>مقارنة أداء الحيوانات</h3>${animalTable(p)}</div>`}

function dailyPage(){const ps=state.role==='admin'?state.plans:state.plans.filter(p=>p.clientId===state.currentClientId);return layout(`<div class="page-head"><div><h2>السجل اليومي</h2><p>اختر الخطة أولًا ثم سجل ما حدث للمجموعة أو لحيوان بعينه.</p></div></div><div class="plan-grid">${ps.filter(p=>p.status==='active').map(p=>`<div class="plan-card"><h3>${p.name}</h3><p class="muted small">${planAnimals(p.id).length} حيوان</p><button class="btn primary" onclick="openDailyModal('${p.id}')">إضافة سجل يومي</button></div>`).join('')}</div>`,'السجل اليومي','تسجيل جماعي سريع مع ملاحظات خاصة');}
function feedsPage(){const ps=state.plans.filter(p=>p.clientId===state.currentClientId);return layout(`<div class="page-head"><div><h2>الأعلاف</h2><p>اختر الخطة لمراجعة المخزون والاستهلاك.</p></div></div><div class="plan-grid">${ps.filter(p=>p.status==='active').map(p=>`<div class="plan-card"><h3>${p.name}</h3><p class="muted small">${planFeeds(p.id).length} أصناف علف</p><button class="btn primary" onclick="openPlan('${p.id}');setTab('feeds')">فتح الأعلاف</button></div>`).join('')}</div>`,'الأعلاف','المشتريات والمخزون والاستهلاك');}
function treatmentsPage(){const ps=state.plans.filter(p=>p.clientId===state.currentClientId);return layout(`<div class="page-head"><div><h2>العلاجات</h2><p>العلاجات المبدئية والطارئة والمتابعة.</p></div></div><div class="plan-grid">${ps.filter(p=>p.status==='active').map(p=>`<div class="plan-card"><h3>${p.name}</h3><p class="muted small">${planTreatments(p.id).filter(t=>t.status==='active').length} علاج مستمر</p><button class="btn primary" onclick="openPlan('${p.id}');setTab('treatments')">فتح العلاجات</button></div>`).join('')}</div>`,'العلاجات','الشراء والاستخدام والمتابعة');}
function expensesPage(){const ps=state.role==='admin'?state.plans:state.plans.filter(p=>p.clientId===state.currentClientId);return layout(`<div class="page-head"><div><h2>المصروفات</h2><p>كل مصروف يجب أن يرتبط بخطة محددة.</p></div></div><div class="plan-grid">${ps.map(p=>`<div class="plan-card"><h3>${p.name}</h3><div class="plan-numbers"><div class="plan-number"><span>المصروفات</span><strong>${fmt(planExpenses(p.id).reduce((s,e)=>s+e.amount,0))}</strong></div><div class="plan-number"><span>إجمالي التكلفة</span><strong>${fmt(stats(p).total)}</strong></div></div><button class="btn primary" onclick="openExpenseModal('${p.id}')">+ مصروف لهذه الخطة</button></div>`).join('')}</div>`,'المصروفات','مصروفات مستقلة لكل خطة');}
function salesPage(){const ps=state.plans.filter(p=>p.clientId===state.currentClientId);return layout(`<div class="page-head"><div><h2>البيع</h2><p>سجل البيع الجزئي أو الكامل دون فقد تاريخ الحيوان.</p></div></div><div class="plan-grid">${ps.filter(p=>p.status!=='closed').map(p=>`<div class="plan-card"><h3>${p.name}</h3><div class="plan-numbers"><div class="plan-number"><span>مباع</span><strong>${stats(p).sold}</strong></div><div class="plan-number"><span>متبقي</span><strong>${stats(p).remaining}</strong></div></div><button class="btn primary" onclick="openSaleModal('${p.id}')">تسجيل بيع</button></div>`).join('')}</div>`,'البيع','من المتوقع إلى الربح الفعلي');}
function reportsPage(){const ps=state.role==='admin'?state.plans:state.plans.filter(p=>p.clientId===state.currentClientId);return layout(`<div class="page-head"><div><h2>${state.role==='admin'?'التقارير العامة':'التقارير ومقارنة الخطط'}</h2><p>قارن التكلفة والبيع والربح بين الخطط.</p></div></div><div class="card"><div class="table-wrap"><table><thead><tr><th>الخطة</th>${state.role==='admin'?'<th>العميل</th>':''}<th>الحيوانات</th><th>التكلفة</th><th>البيع المتوقع</th><th>الربح المتوقع</th><th>الربح المستهدف</th></tr></thead><tbody>${ps.map(p=>{const s=stats(p);return `<tr><td><strong>${p.name}</strong></td>${state.role==='admin'?`<td>${state.clients.find(c=>c.id===p.clientId)?.name}</td>`:''}<td>${s.animals.length}</td><td>${fmt(s.total)}</td><td>${fmt(s.expected)}</td><td class="${s.profit>=0?'money-positive':'money-negative'}">${fmt(s.profit)}</td><td>${p.profitTarget}%</td></tr>`}).join('')}</tbody></table></div></div>`,'التقارير','تحليل وربحية الخطط');}
function empty(t){return `<div class="empty"><div class="emoji">📋</div>${t}</div>`}

function modal(html){document.body.insertAdjacentHTML('beforeend',`<div class="modal-backdrop" id="modal"><div class="modal">${html}</div></div>`)}function closeModal(){document.getElementById('modal')?.remove()}
function openPlanModal(admin=false){modal(`<div class="modal-head"><div><h3>إنشاء خطة تسمين جديدة</h3><div class="small muted">البيانات الأساسية فقط، وباقي التفاصيل تضاف داخل الخطة.</div></div><button class="close" onclick="closeModal()">×</button></div><form onsubmit="createPlan(event)"><div class="form-grid">${admin?`<div class="field"><label>العميل</label><select name="clientId" required>${state.clients.map(c=>`<option value="${c.id}">${c.name}</option>`).join('')}</select></div>`:''}<div class="field"><label>اسم الخطة</label><input name="name" placeholder="مثال: دورة تسمين سبتمبر" required></div><div class="field"><label>تاريخ البداية</label><input name="start" type="date" value="${today()}" required></div><div class="field"><label>مدة الدورة المتوقعة بالأيام</label><input name="duration" type="number" value="90" min="90" max="120" required><div class="form-help">قاعدة النظام: من 90 إلى 120 يومًا كحد أقصى. الخطة المرجعية مبنية على أول 90 يومًا.</div></div><div class="field"><label>مكان البيع المتوقع</label><input name="sellPlace" placeholder="مثال: سوق مدني" required></div><div class="field"><label>نسبة الربح المستهدفة %</label><input name="profit" type="number" value="20" min="0" step=".1" required></div><div class="field"><label>البيع المتوقع حاليًا</label><input name="expected" type="number" min="0" placeholder="يمكن تحديثه لاحقًا"></div></div><div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">إلغاء</button><button class="btn primary">إنشاء الخطة</button></div></form>`)}
function createPlan(ev){ev.preventDefault();const f=new FormData(ev.target),duration=+f.get('duration');if(duration<90||duration>120){alert('مدة دورة التسمين في النظام يجب أن تكون من 90 إلى 120 يومًا كحد أقصى.');return;}const p={id:uid('p'),clientId:f.get('clientId')||state.currentClientId,name:f.get('name'),start:f.get('start'),duration,sellPlace:f.get('sellPlace'),profitTarget:+f.get('profit'),status:'active',expectedSale:+f.get('expected')||0,projectType:'fattening',shelter:null,feeding:{storage:null},marketPlan:null,groups:[{id:uid('g'),name:'المجموعة الرئيسية'}]};state.plans.push(p);state.currentPlanId=p.id;state.currentPage='plan';state.planTab='shelter';save();closeModal();render()}
function openClientModal(){modal(`<div class="modal-head"><h3>إضافة عميل</h3><button class="close" onclick="closeModal()">×</button></div><form onsubmit="createClient(event)"><div class="form-grid"><div class="field"><label>اسم العميل</label><input name="name" required></div><div class="field"><label>رقم الجوال</label><input name="phone" required></div><div class="field"><label>المدينة / المنطقة</label><input name="city"></div><div class="field"><label>الحالة</label><select name="active"><option value="1">نشط</option><option value="0">غير نشط</option></select></div></div><div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">إلغاء</button><button class="btn primary">حفظ العميل</button></div></form>`)}
function createClient(ev){ev.preventDefault();const f=new FormData(ev.target);state.clients.push({id:uid('c'),name:f.get('name'),phone:f.get('phone'),city:f.get('city'),active:f.get('active')==='1'});save();closeModal();render()}
function openExpenseModal(pid){const p=plan(pid),as=planAnimals(pid);modal(`<div class="modal-head"><div><h3>إضافة مصروف</h3><div class="small muted">${p.name}</div></div><button class="close" onclick="closeModal()">×</button></div><form onsubmit="createExpense(event,'${pid}')"><div class="form-grid"><div class="field"><label>نوع المصروف</label><select name="type"><option>نقل</option><option>عمالة</option><option>إيجار</option><option>عمولة</option><option>صيانة</option><option>علاج</option><option>أخرى</option></select></div><div class="field"><label>المبلغ</label><input name="amount" type="number" min="0" required></div><div class="field"><label>التاريخ</label><input name="date" type="date" value="${today()}" required></div><div class="field"><label>نطاق المصروف</label><select name="scope" onchange="this.form.animalId.disabled=this.value!=='animal'"><option value="plan">الخطة كاملة</option><option value="animal">حيوان معين</option></select></div><div class="field"><label>الحيوان</label><select name="animalId" disabled><option value="">اختر</option>${as.map(a=>`<option value="${a.id}">#${a.tag}</option>`).join('')}</select></div><div class="field full"><label>الوصف / الملاحظة</label><textarea name="desc" placeholder="سبب أو تفاصيل المصروف"></textarea></div></div><div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">إلغاء</button><button class="btn primary">حفظ المصروف وتحديث الحسابات</button></div></form>`)}
function createExpense(ev,pid){ev.preventDefault();const f=new FormData(ev.target);state.expenses.push({id:uid('e'),planId:pid,type:f.get('type'),amount:+f.get('amount'),date:f.get('date'),scope:f.get('scope'),animalId:f.get('animalId')||null,desc:f.get('desc')});save();closeModal();render()}
function openDailyModal(pid){const as=planAnimals(pid).filter(a=>a.status!=='sold');modal(`<div class="modal-head"><div><h3>السجل اليومي</h3><div class="small muted">${plan(pid).name} — املأ فقط ما حدث اليوم.</div></div><button class="close" onclick="closeModal()">×</button></div><form onsubmit="createDaily(event,'${pid}')"><div class="field" style="margin-bottom:14px"><label>التاريخ</label><input name="date" type="date" value="${today()}"></div><div class="selection-box"><h4>النظافة اليومية للزريبة</h4><label class="check-item"><input type="checkbox" name="shelterCleaned">تم تنفيذ النظافة اليومية</label><div class="source-note">يُسجل النظافة اليومي كمحور في الإرشادات المعتمدة، لكن تفاصيل خطواته لم تُحفظ؛ لذلك يسجل النظام التنفيذ فقط.</div></div><div class="table-wrap"><table><thead><tr><th>الحيوان</th><th>الوزن</th><th>الحالة</th><th>ملاحظة خاصة</th></tr></thead><tbody>${as.map(a=>`<tr><td><strong>#${a.tag}</strong></td><td><input style="width:90px" name="weight_${a.id}" type="number" step=".1" placeholder="كجم"></td><td><select name="status_${a.id}"><option value="">بدون تغيير</option><option value="normal">طبيعي</option><option value="treatment">يحتاج متابعة</option></select></td><td><input name="note_${a.id}" placeholder="ملاحظة خاصة بالحيوان"></td></tr>`).join('')}</tbody></table></div><div class="field" style="margin-top:14px"><label>ملاحظة عامة للمجموعة</label><textarea name="groupNote" placeholder="مثال: تم تغيير نوع العلف اليوم"></textarea></div><div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">إلغاء</button><button class="btn primary">حفظ السجل اليومي</button></div></form>`)}
function createDaily(ev,pid){ev.preventDefault();const f=new FormData(ev.target),entries=[];for(const a of planAnimals(pid)){const w=f.get('weight_'+a.id),st=f.get('status_'+a.id),n=f.get('note_'+a.id);if(w||st||n){entries.push({animalId:a.id,weight:w?+w:null,status:st||a.status,note:n||''});if(w)a.weights.push({date:f.get('date'),value:+w});if(st)a.status=st;if(n)a.notes.push({date:f.get('date'),text:n});}}state.daily.push({id:uid('d'),planId:pid,date:f.get('date'),note:f.get('groupNote'),shelterCleaned:!!f.get('shelterCleaned'),entries});save();closeModal();render()}
function breedField(type='calf'){
  if(type==='sheep') return `<select name="breed" id="breedInput" required onchange="updateBreedNote(this.value)"><option value="">اختر السلالة</option><option>الكباشي</option><option>الحمري</option><option>الدمازين</option><option>البلدي</option><option>النيلي</option><option>أخرى</option></select><div id="breedNote" class="breed-note" style="display:none"></div>`;
  return `<input name="breed" id="breedInput" placeholder="اكتب السلالة" required><div class="form-help">لا يوجد تحديد قائمة نهائية لسلالات العجول، لذلك لا يفرض النظام سلالة غير موثقة.</div>`;
}
function animalTypeChanged(v){const holder=document.getElementById('breedHolder');if(holder)holder.innerHTML=breedField(v);const label=document.getElementById('coatLabel');if(label)label.textContent=v==='sheep'?'الصوف نظيف وبحالة جيدة':'الشعر لامع وناعم';updateAnimalAssessment();}
function updateBreedNote(v){const el=document.getElementById('breedNote');if(!el)return;const notes={'الكباشي':'أسرع مكسب وفق البيانات المرجعية، ومطلوب جدًا.','الحمري':'تتضمن الإرشادات أنه مناسب للبيع في العيد.','الدمازين':'تتضمن الإرشادات أنه يتميز بزيادة وزن سريعة.','البلدي':'تتضمن الإرشادات أنه مناسب لرأس المال البسيط.','النيلي':'تتضمن الإرشادات أنه خيار للعمل في الشمالية.'};if(notes[v]){el.style.display='block';el.textContent=notes[v]}else el.style.display='none';}
const purchaseCheckNames=['breedGrowth','breedHeat','breedDisease','breedMeat','breedLocal','legs','back','bodyBalance','noDefects','movement','eyes','nose','coat','active','noCough','noDiarrhea','noWounds','skin','hoof','rearClean','teeth','marketAnimals','marketTraders'];
function updateAnimalAssessment(){const form=document.getElementById('animalSelectionForm'),box=document.getElementById('animalAssessment');if(!form||!box)return;const sex=form.elements.sex?.value;const checked=purchaseCheckNames.filter(n=>form.elements[n]?.checked).length;if(sex==='أنثى'){box.className='assessment bad';box.textContent='غير مناسب للاعتماد للتسمين وفق الإرشادات المعتمدة: تنبيه: من شراء الإناث بغرض التسمين.';return;}if(checked===purchaseCheckNames.length){box.className='assessment ok';box.textContent='مناسب مبدئيًا للتسمين حسب قائمة فحص معايير اختيار الحيوان. يظل الفحص البيطري/الخبير مستحسنًا عند الشراء.';return;}box.className='assessment review';box.textContent=`يحتاج مراجعة قبل الاعتماد — تم تأكيد ${checked} من ${purchaseCheckNames.length} نقطة فحص.`;}
function openAnimalModal(pid){const p=plan(pid);if(!p.shelter?.ready){alert('أكمل تقييم وتجهيز الزريبة من تبويب الزريبة قبل إضافة حيوان جديد.');state.planTab='shelter';save();render();return;}const current=planAnimals(pid).filter(a=>a.status!=='sold').length;if(p.shelter.headCount&&current>=p.shelter.headCount){alert('عدد الحيوانات وصل إلى العدد الذي تم تقييم الزريبة عليه. عدّل عدد الحيوانات وتجهيز الزريبة أولًا إذا أردت التوسع.');state.planTab='shelter';save();render();return;}const g=p.groups[0],fixedType=p.shelter.animalType||'calf';modal(`<div class="modal-head"><div><h3>اختيار وإضافة حيوان للتسمين</h3><div class="small muted">قائمة الفحص أدناه مأخوذة من معايير اختيار الحيوان فقط، ولا تضيف عمرًا أو معيارًا لم تحدده الإرشادات المعتمدة.</div></div><button class="close" onclick="closeModal()">×</button></div><form id="animalSelectionForm" onsubmit="createAnimal(event,'${pid}','${g.id}')" onchange="updateAnimalAssessment()"><div class="form-grid"><div class="field"><label>نوع الحيوان</label><input type="hidden" name="animalType" value="${fixedType}"><input value="${fixedType==='sheep'?'ضأن':'عجل'}" disabled><div class="form-help">نوع الحيوان ثابت حسب تجهيز الزريبة لهذه الخطة.</div></div><div class="field"><label>الجنس</label><select name="sex" required><option>ذكر</option><option>أنثى</option></select><div class="form-help">هذه الخطة مخصصة للذكور في دورة التسمين.</div></div><div class="field"><label>رقم الحيوان</label><input name="tag" required></div><div class="field"><label>تاريخ الشراء</label><input name="buyDate" type="date" value="${today()}" required></div><div class="field"><label>مكان الشراء</label><input name="buyPlace" required></div><div class="field"><label>وزن الشراء كجم</label><input name="weight" type="number" step=".1" required></div><div class="field"><label>سعر الشراء</label><input name="price" type="number" required></div><div class="field"><label>السلالة</label><div id="breedHolder">${breedField(fixedType)}</div></div></div>${fixedType==='sheep'?`<div class="breed-note">تذكير من معايير تجهيز الزريبة: تتضمن الإرشادات للحملان شراء الحمل بعد العمر التقريبي 4–6 أشهر، ثم دورة تسمين قصيرة نحو شهرين إلى ثلاثة أشهر. لا يحول النظام هذا إلى حكم آلي على العمر.</div>`:''}
<div class="selection-box"><h4>1) صلاحية السلالة للتسمين</h4><p>لا يكفي اسم السلالة؛ أكّد معايير الاختيار التي ذكرتها الإرشادات المعتمدة.</p><div class="check-grid"><label class="check-item"><input type="checkbox" name="breedGrowth">سرعة نمو وكفاءة تحويل العلف مناسبة</label><label class="check-item"><input type="checkbox" name="breedHeat">متكيفة مع حرارة السودان</label><label class="check-item"><input type="checkbox" name="breedDisease">مقاومتها للأمراض الشائعة مناسبة</label><label class="check-item"><input type="checkbox" name="breedMeat">جودة اللحم وطلب السوق مناسبان</label><label class="check-item"><input type="checkbox" name="breedLocal">متوفرة محليًا بسعر مناسب</label></div></div>
<div class="selection-box"><h4>2) بنية الجسم والحركة</h4><p>افحص الحيوان على أرض مستوية وفق الفحص الموصى به.</p><div class="check-grid"><label class="check-item"><input type="checkbox" name="legs">الأرجل سليمة وتباعد الخلفيتين جيد</label><label class="check-item"><input type="checkbox" name="back">الظهر مستقيم</label><label class="check-item"><input type="checkbox" name="bodyBalance">خط الظهر متوازن مع خط البطن</label><label class="check-item"><input type="checkbox" name="noDefects">لا توجد عيوب خلقية ظاهرة</label><label class="check-item"><input type="checkbox" name="movement">الحركة طبيعية ولا يوجد عرج</label></div></div>
<div class="selection-box"><h4>3) علامات الحيوان السليم</h4><div class="check-grid"><label class="check-item"><input type="checkbox" name="eyes">العينان لامعتان ولا دمع أو إفرازات</label><label class="check-item"><input type="checkbox" name="nose">الأنف رطب وبارد</label><label class="check-item"><input type="checkbox" name="coat"><span id="coatLabel">الشعر لامع وناعم</span></label><label class="check-item"><input type="checkbox" name="active">الحيوان نشيط ويرفع رأسه</label><label class="check-item"><input type="checkbox" name="noCough">لا توجد كحة</label><label class="check-item"><input type="checkbox" name="noDiarrhea">لا يوجد إسهال</label><label class="check-item"><input type="checkbox" name="noWounds">لا توجد جروح</label><label class="check-item"><input type="checkbox" name="skin">الجلد سليم وغير متضرر</label><label class="check-item"><input type="checkbox" name="hoof">الحافر جاف ولا توجد علامات التهاب</label><label class="check-item"><input type="checkbox" name="rearClean">المنطقة الخلفية نظيفة ولا آثار إسهال</label></div></div>
<div class="selection-box"><h4>4) العمر والأسنان والسوق</h4><p>لا توجدِ عمرًا رقميًا نهائيًا، لذلك نطلب فقط توثيق الفحص والمقارنة.</p><div class="check-grid"><label class="check-item"><input type="checkbox" name="teeth">تم فحص الأسنان لتقدير العمر</label><label class="check-item"><input type="checkbox" name="marketAnimals">تمت مقارنة أكثر من حيوان</label><label class="check-item"><input type="checkbox" name="marketTraders">تمت مقارنة أكثر من تاجر / سعر</label><label class="check-item"><input type="checkbox" name="expert">استعنت بطبيب بيطري أو شخص خبير (مستحسن)</label></div></div>
<div id="animalAssessment" class="assessment review">يحتاج مراجعة قبل الاعتماد — أكمل قائمة الفحص.</div><div class="source-note">هذه النتيجة مؤشر أولي للمساعدة في القرار، ولا تغني عن الفحص البيطري عند الحاجة.</div><div class="field full" style="margin-top:14px"><label>ملاحظة مهمة مثبتة</label><textarea name="note" placeholder="اختياري — تظهر أعلى ملف الحيوان"></textarea></div><div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">إلغاء</button><button class="btn primary">اعتماد الحيوان وإضافته للخطة</button></div></form>`);updateAnimalAssessment()}
function createAnimal(ev,pid,gid){ev.preventDefault();const p=plan(pid),f=new FormData(ev.target);if(!p.shelter?.ready){alert('لا يمكن إضافة الحيوان قبل اكتمال تجهيز الزريبة.');return;}if(p.shelter.animalType&&f.get('animalType')!==p.shelter.animalType){alert('نوع الحيوان يجب أن يطابق نوع الزريبة المعتمد للخطة.');return;}if(planAnimals(pid).filter(a=>a.status!=='sold').length>=p.shelter.headCount){alert('تجاوزت العدد الذي تم تقييم الزريبة عليه.');return;}if(f.get('sex')!=='ذكر'){alert('لا يمكن اعتماد الأنثى للتسمين وفق تحذير معايير اختيار الحيوان.');return;}const missing=purchaseCheckNames.filter(n=>!f.get(n));if(missing.length){alert('لا يمكن اعتماد الحيوان قبل إكمال جميع نقاط الفحص الأساسية في معايير اختيار الحيوان.');return;}const w=+f.get('weight'),d=f.get('buyDate');const selection={result:'suitable',checkedAt:today(),expertChecked:!!f.get('expert'),criteria:Object.fromEntries(purchaseCheckNames.map(n=>[n,true]))};state.animals.push({id:uid('a'),planId:pid,groupId:gid,animalType:f.get('animalType'),tag:f.get('tag'),buyDate:d,buyPlace:f.get('buyPlace'),buyWeight:w,buyPrice:+f.get('price'),breed:f.get('breed'),sex:f.get('sex'),status:'quarantine',selection,health:{arrivalCompleted:false,isolation:null,separateTools:null},pinnedNote:f.get('note'),weights:[{date:d,value:w}],notes:[]});save();closeModal();state.planTab='health';save();render();setTimeout(()=>alert('تمت إضافة الحيوان بنجاح. الخطوة التالية: سجّل الاستقبال الصحي والعزل.'),0)}
function openAnimal(id){const a=state.animals.find(x=>x.id===id),p=plan(a.planId),last=a.weights.at(-1)?.value||a.buyWeight,type=a.animalType==='sheep'?'ضأن':a.animalType==='calf'?'عجل':'غير محدد',selection=a.selection?.result==='suitable'?'<span class="badge active">اجتاز فحص الاختيار</span>':'<span class="badge">سجل قديم — لم يمر بقائمة الفحص الجديدة</span>';modal(`<div class="modal-head"><div class="animal-head"><div class="animal-icon">${a.animalType==='sheep'?'🐑':'🐂'}</div><div><h3 style="margin:0">الحيوان #${a.tag}</h3><div class="small muted">${p.name} • ${type} • ${animalStatus(a.status)}</div></div></div><button class="close" onclick="closeModal()">×</button></div>${a.pinnedNote?`<div class="note-pin">📌 <strong>ملاحظة مهمة:</strong> ${a.pinnedNote}</div>`:''}<div style="margin-top:12px">${selection} ${a.health?.arrivalCompleted?'<span class="badge active">استقبال صحي موثق</span>':a.health?.arrivalCompleted===false?'<span class="badge sell">بانتظار توثيق الاستقبال والعزل</span>':'<span class="badge">الاستقبال الصحي غير موثق في السجل القديم</span>'} ${activeWithdrawal(a.id)?`<span class="badge treat">فترة سحب حتى ${activeWithdrawal(a.id)}</span>`:''}</div><div class="grid metrics" style="margin-top:15px"><div class="metric"><div class="label">وزن الشراء</div><div class="value">${a.buyWeight}</div><div class="note">كجم</div></div><div class="metric"><div class="label">آخر وزن</div><div class="value">${last}</div><div class="note">كجم</div></div><div class="metric good"><div class="label">إجمالي الزيادة</div><div class="value">+${last-a.buyWeight}</div><div class="note">كجم</div></div></div><div class="card" style="box-shadow:none;margin-top:12px"><h3>السجل الأولي الثابت</h3><div class="form-grid"><div><div class="small muted">نوع الحيوان</div><strong>${type}</strong></div><div><div class="small muted">تاريخ الشراء</div><strong>${a.buyDate}</strong></div><div><div class="small muted">مكان الشراء</div><strong>${a.buyPlace}</strong></div><div><div class="small muted">سعر الشراء</div><strong>${fmt(a.buyPrice)}</strong></div><div><div class="small muted">السلالة / الجنس</div><strong>${a.breed||'-'} / ${a.sex}</strong></div><div><div class="small muted">فحص خبير/بيطري</div><strong>${a.selection?.expertChecked?'تم':'غير مسجل'}</strong></div></div></div><div class="card" style="box-shadow:none;margin-top:12px"><h3>الملاحظات اليومية</h3>${a.notes.length?a.notes.slice().reverse().map(n=>`<div class="alert good"><span class="dot"></span><div><strong>${n.date}</strong><small>${n.text}</small></div></div>`).join(''):empty('لا توجد ملاحظات يومية')}</div>`)}
function openFeedModal(pid){modal(`<div class="modal-head"><div><h3>شراء علف</h3><div class="small muted">يسجل المخزون، بينما طريقة التقديم اليومية تُدار من «برنامج التغذية».</div></div><button class="close" onclick="closeModal()">×</button></div><form onsubmit="createFeed(event,'${pid}')"><div class="form-grid"><div class="field"><label>اسم العلف</label><input name="name" required placeholder="مثال: فتريتة، تبن، علف مركز"></div><div class="field"><label>التصنيف</label><select name="category" required><option value="concentrate">علف مركز</option><option value="roughage">علف مالئ / ألياف</option><option value="other">إضافة / أخرى</option></select></div><div class="field"><label>الكمية بالكيلو</label><input name="qty" type="number" min="0" step=".001" required></div><div class="field"><label>تكلفة الكيلو</label><input name="cost" type="number" min="0" step=".01" required></div><div class="field"><label>تاريخ الشراء</label><input name="date" type="date" value="${today()}"></div></div><div class="selection-box"><h4>فحص ظاهر للعلف عند الإدخال</h4><div class="check-grid"><label class="check-item"><input type="checkbox" name="cleanDry">العلف جاف ونظيف ولا توجد رائحة منفرة أو بلل ظاهر</label><label class="check-item"><input type="checkbox" name="noMold">لا توجد علامات عفن ظاهرة</label></div><div class="source-note">إذا لم تُؤكد النقطتين سيُحفظ المخزون، لكنه يظهر «لا يُقدّم قبل المراجعة» حتى لا يعتبر النظام علفًا فاسدًا صالحًا تلقائيًا.</div></div><div class="modal-actions"><button class="btn" type="button" onclick="closeModal()">إلغاء</button><button class="btn primary">حفظ</button></div></form>`)}
function createFeed(ev,pid){ev.preventDefault();const f=new FormData(ev.target),quality=!!f.get('cleanDry')&&!!f.get('noMold');state.feeds.push({id:uid('f'),planId:pid,name:f.get('name'),category:f.get('category'),qtyKg:+f.get('qty'),unitCost:+f.get('cost'),purchased:f.get('date'),usedKg:0,qualityOk:quality});save();closeModal();render();if(!quality)setTimeout(()=>alert('تم حفظ المخزون، لكنه غير معتمد للتقديم حتى تتأكد أنه جاف ونظيف وخالٍ من العفن الظاهر.'),0)}
function openTreatmentModal(pid){const as=planAnimals(pid).filter(a=>a.status!=='sold');modal(`<div class="modal-head"><div><h3>تسجيل علاج موثق</h3><div class="small muted">تحقق من وزن الحيوان وتركيز المستحضر ومصدر الجرعة، وارجع للطبيب خصوصًا في الحقن والحالات المرضية.</div></div><button class="close" onclick="closeModal()">×</button></div><form onsubmit="createTreatment(event,'${pid}')"><div class="form-grid"><div class="field"><label>اسم العلاج/المستحضر</label><input name="name" required></div><div class="field"><label>التصنيف</label><select name="category" required><option value="other">علاج/مستحضر آخر</option><option value="antibiotic">مضاد حيوي</option><option value="preventive">إجراء وقائي</option></select></div><div class="field"><label>الحيوان</label><select name="animal" required>${as.map(a=>`<option value="${a.id}">#${a.tag} — آخر وزن ${a.weights.at(-1)?.value||a.buyWeight} كجم</option>`).join('')}</select></div><div class="field"><label>طريقة الإعطاء</label><select name="route" required><option value="oral">بالفم</option><option value="injection">حقن</option><option value="water">في الماء</option><option value="topical">موضعي</option><option value="other">أخرى</option></select></div><div class="field"><label>تاريخ البداية</label><input name="start" type="date" value="${today()}" required></div><div class="field"><label>عدد الأيام</label><input name="days" type="number" value="1" min="1" required></div><div class="field"><label>الجرعة كما على العبوة/الطبيب</label><input name="dose" required placeholder="اكتبها كما تم اعتمادها — لا يحسبها النظام"></div><div class="field"><label>تركيز/وصف العبوة</label><input name="concentration" required></div><div class="field"><label>مصدر الجرعة</label><select name="doseSource" required><option>ملصق المنتج</option><option>طبيب بيطري</option></select></div><div class="field"><label>انتهاء فترة السحب</label><input name="withdrawalUntil" type="date"><div class="form-help">إلزامي عند تسجيل مضاد حيوي؛ يسجل حسب الطبيب/ملصق المنتج، وليس رقمًا ثابتًا من الإرشادات المعتمدة.</div></div><div class="field"><label>تكلفة الكمية المستخدمة</label><input name="cost" type="number" value="0" min="0"></div><div class="field"><label>السبب</label><input name="reason"></div></div><div class="selection-box"><h4>تأكيدات الأمان</h4><div class="check-grid"><label class="check-item"><input type="checkbox" name="labelConfirmed" required>تم التأكد من وزن الحيوان وقراءة جرعة العبوة وتركيز المستحضر</label><label class="check-item"><input type="checkbox" name="vetConfirmed">تم الرجوع إلى طبيب بيطري/شخص متمرس لطريقة الحقن أو الحالة المرضية</label></div></div><div class="modal-actions"><button class="btn" type="button" onclick="closeModal()">إلغاء</button><button class="btn primary">حفظ العلاج</button></div></form>`)}
function createTreatment(ev,pid){ev.preventDefault();const f=new FormData(ev.target),aid=f.get('animal'),cat=f.get('category'),route=f.get('route'),vet=!!f.get('vetConfirmed');if((cat==='antibiotic'||route==='injection')&&!vet){alert('يلزم توثيق الرجوع إلى الطبيب أو المختص قبل حفظ المضادات الحيوية أو الحقن.');return;}if(cat==='antibiotic'&&!f.get('withdrawalUntil')){alert('سجّل تاريخ انتهاء فترة السحب كما حدده الطبيب/ملصق المنتج قبل حفظ المضاد الحيوي.');return;}state.treatments.push({id:uid('t'),planId:pid,animalIds:[aid],name:f.get('name'),category:cat,route,start:f.get('start'),days:+f.get('days'),dose:f.get('dose'),concentration:f.get('concentration'),doseSource:f.get('doseSource'),withdrawalUntil:f.get('withdrawalUntil')||'',labelConfirmed:true,vetConfirmed:vet,usedCost:+f.get('cost'),status:'active',reason:f.get('reason')});state.animals.find(a=>a.id===aid).status='treatment';save();closeModal();render()}
function openSaleModal(pid){const as=planAnimals(pid).filter(a=>a.status!=='sold'),blocked=as.filter(a=>activeWithdrawal(a.id));modal(`<div class="modal-head"><div><h3>تسجيل بيع</h3><div class="small muted">يمكن بيع حيوان واحد الآن وبقية القطيع لاحقًا.</div></div><button class="close" onclick="closeModal()">×</button></div>${blocked.length?`<div class="alert danger"><span class="dot"></span><div><strong>${blocked.length} حيوان داخل فترة سحب</strong><small>${blocked.map(a=>`#${a.tag} حتى ${activeWithdrawal(a.id)}`).join(' • ')} — سيمنع النظام بيع أي منها قبل انتهاء الفترة المسجلة.</small></div></div>`:''}<form onsubmit="createSale(event,'${pid}')"><div class="form-grid"><div class="field"><label>الحيوان</label><select name="animal" required>${as.map(a=>`<option value="${a.id}">#${a.tag}${activeWithdrawal(a.id)?' — فترة سحب حتى '+activeWithdrawal(a.id):''}</option>`).join('')}</select></div><div class="field"><label>تاريخ البيع</label><input name="date" type="date" value="${today()}" required></div><div class="field"><label>مكان البيع</label><input name="place" value="${plan(pid).sellPlace}"></div><div class="field"><label>طريقة البيع</label><select name="method"><option value="head">بالرأس</option><option value="weight">بالوزن</option></select></div><div class="field"><label>سعر البيع الفعلي</label><input name="amount" type="number" required></div><div class="field"><label>مصروفات البيع</label><input name="fees" type="number" value="0"></div><div class="field"><label>المشتري</label><input name="buyer"></div><div class="field"><label>وزن البيع (اختياري)</label><input name="weight" type="number" step=".1"></div></div><div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">إلغاء</button><button class="btn primary">تسجيل البيع</button></div></form>`)}
function createSale(ev,pid){ev.preventDefault();const f=new FormData(ev.target),aid=f.get('animal'),a=state.animals.find(x=>x.id===aid),saleDate=f.get('date'),wd=activeWithdrawal(aid,saleDate);if(wd){alert(`لا يمكن تسجيل بيع الحيوان #${a.tag} في ${saleDate}. توجد فترة سحب دواء مسجلة حتى ${wd}. راجع الطبيب/ملصق المنتج.`);return;}state.sales.push({id:uid('s'),planId:pid,animalIds:[aid],date:saleDate,place:f.get('place'),method:f.get('method'),amount:+f.get('amount'),fees:+f.get('fees'),buyer:f.get('buyer')});a.status='sold';if(f.get('weight'))a.weights.push({date:saleDate,value:+f.get('weight')});save();closeModal();render()}
function render(){let html;switch(state.currentPage){case'plans':html=plansPage();break;case'clients':html=clientsPage();break;case'plan':html=planPage();break;case'daily':html=dailyPage();break;case'feeds':html=feedsPage();break;case'treatments':html=treatmentsPage();break;case'expenses':html=expensesPage();break;case'sales':html=salesPage();break;case'reports':html=reportsPage();break;default:html=dashboard();}document.getElementById('app').innerHTML=html}
render();
</script>

<script>
/* LECTURE7_MARKETING_FEASIBILITY_MODULE */
if(!state.assets)state.assets=[];

function planAssets(pid){return state.assets.filter(x=>x.planId===pid)}
function planOtherRevenues(pid){return state.otherRevenues.filter(x=>x.planId===pid)}
function assetShare(pid){return planAssets(pid).reduce((s,a)=>s+(Number(a.totalCost)||0)/Math.max(1,Number(a.expectedCycles)||1),0)}
function otherRevenueTotal(pid){return planOtherRevenues(pid).filter(x=>x.mode!=='use').reduce((s,x)=>s+(Number(x.amount)||0),0)}
function lecture7Economics(p){
  const animals=planAnimals(p.id),buy=animals.reduce((s,a)=>s+(Number(a.buyPrice)||0),0);
  const feed=planFeeds(p.id).reduce((s,f)=>s+(Number(f.usedKg)||0)*(Number(f.unitCost)||0),0);
  const health=planTreatments(p.id).reduce((s,t)=>s+(Number(t.usedCost)||0),0);
  const expenses=planExpenses(p.id).filter(e=>e.type!=='علاج').reduce((s,e)=>s+(Number(e.amount)||0),0);
  const assets=assetShare(p.id),totalCost=buy+feed+health+expenses+assets;
  const animalRevenue=planSales(p.id).reduce((s,x)=>s+(Number(x.amount)||0)-(Number(x.fees)||0),0);
  const otherRevenue=otherRevenueTotal(p.id),totalRevenue=animalRevenue+otherRevenue;
  const actualProfit=totalRevenue-totalCost;
  return {animals,buy,feed,health,expenses,assets,totalCost,animalRevenue,otherRevenue,totalRevenue,actualProfit,profitPct:totalCost?actualProfit/totalCost*100:0};
}

stats = function(p){
  const e=lecture7Economics(p),required=e.totalCost*(1+(Number(p.profitTarget)||0)/100),expected=Number(p.expectedSale)||0;
  const soldIds=new Set(planSales(p.id).flatMap(s=>s.animalIds));
  return {animals:e.animals,buy:e.buy,feedUsed:e.feed,treatment:e.health,other:e.expenses+e.assets,total:e.totalCost,required,actualSales:e.totalRevenue,expected,profit:expected-e.totalCost,actualProfit:e.actualProfit,otherRevenue:e.otherRevenue,sold:soldIds.size,remaining:e.animals.length-soldIds.size};
}
