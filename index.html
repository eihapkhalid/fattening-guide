let state = JSON.parse(localStorage.getItem('fatteningGuideState')||'null') || seed;
state.plans.forEach(p=>{if(!('shelter' in p))p.shelter=null;if(!p.projectType)p.projectType='fattening';if(!('feeding' in p))p.feeding={storage:null};});
if(!state.feedingLogs)state.feedingLogs=[];
state.daily.forEach(d=>{if(!('shelterCleaned' in d))d.shelterCleaned=null;});
state.feeds.forEach(f=>{if(!f.category){const n=f.name||'';f.category=(n.includes('تبن')||n.includes('قش')||n.includes('دريس')||n.includes('رودس'))?'roughage':(n.includes('مركز')||n.includes('فتريت')||n.includes('أمباز')||n.includes('ردة'))?'concentrate':'other'}if(!('qualityOk' in f))f.qualityOk=null;});
function save(){ localStorage.setItem('fatteningGuideState',JSON.stringify(state)); }
function client(){ return state.clients.find(c=>c.id===state.currentClientId)||state.clients[0]; }
function plan(id=state.currentPlanId){ return state.plans.find(p=>p.id===id); }
function planAnimals(pid){ return state.animals.filter(a=>a.planId===pid); }
function planFeeds(pid){ return state.feeds.filter(x=>x.planId===pid); }
function planFeedingLogs(pid){ return state.feedingLogs.filter(x=>x.planId===pid); }
function planTreatments(pid){ return state.treatments.filter(x=>x.planId===pid); }
function planExpenses(pid){ return state.expenses.filter(x=>x.planId===pid); }
function planSales(pid){ return state.sales.filter(x=>x.planId===pid); }
function stats(p){
  const animals=planAnimals(p.id), buy=animals.reduce((s,a)=>s+a.buyPrice,0);
  const feedUsed=planFeeds(p.id).reduce((s,f)=>s+f.usedKg*f.unitCost,0);
  const treatment=planTreatments(p.id).reduce((s,t)=>s+t.usedCost,0);
  const other=planExpenses(p.id).filter(e=>e.type!=='علاج').reduce((s,e)=>s+e.amount,0);
  const total=buy+feedUsed+treatment+other;
  const required=total*(1+p.profitTarget/100);
  const actualSales=planSales(p.id).reduce((s,x)=>s+x.amount-x.fees,0);
  const expected=p.expectedSale||0;
  const profit=expected-total;
  const soldIds=new Set(planSales(p.id).flatMap(s=>s.animalIds));
  return {animals,buy,feedUsed,treatment,other,total,required,actualSales,expected,profit,sold:soldIds.size,remaining:animals.length-soldIds.size};
}
function daysPassed(p){ return Math.max(0,Math.floor((new Date()-new Date(p.start))/(86400000))); }
function statusBadge(s){ return s==='active'?'<span class="badge active"><i class="dot-inline"></i>نشطة</span>':s==='selling'?'<span class="badge sell"><i class="dot-inline"></i>مرحلة البيع</span>':s==='closed'?'<span class="badge closed"><i class="dot-inline"></i>مكتملة</span>':'<span class="badge">مسودة</span>'; }
function animalStatus(s){ return s==='treatment'?'<span class="badge treat">تحت علاج</span>':s==='sold'?'<span class="badge closed">مباع</span>':'<span class="badge active">طبيعي</span>'; }
function route(page){ state.currentPage=page; save(); render(); closeMenu(); }
function setRole(role){ state.role=role; state.currentPage='dashboard'; save(); render(); }
function openPlan(id){ state.currentPlanId=id; state.planTab='overview'; state.currentPage='plan'; save(); render(); }
function setTab(tab){ state.planTab=tab; save(); render(); }
function closeMenu(){ document.querySelector('.sidebar')?.classList.remove('open');document.querySelector('.sidebar-backdrop')?.classList.remove('open'); }
function toggleMenu(){ document.querySelector('.sidebar')?.classList.toggle('open');document.querySelector('.sidebar-backdrop')?.classList.toggle('open'); }

function layout(body,title,sub=''){
  const navClient=[['dashboard','⌂','الرئيسية'],['plans','▣','خططي'],['daily','✎','السجل اليومي'],['feeds','◫','الأعلاف'],['treatments','✚','العلاجات'],['expenses','◒','المصروفات'],['sales','↗','البيع'],['reports','▥','التقارير']];
  const navAdmin=[['dashboard','⌂','لوحة الإدارة'],['clients','♟','العملاء'],['plans','▣','الخطط'],['daily','✎','السجل اليومي'],['expenses','◒','المصروفات'],['reports','▥','التقارير العامة']];
  const nav=state.role==='admin'?navAdmin:navClient;
  return `<div class="app"><div class="sidebar-backdrop" onclick="closeMenu()"></div><aside class="sidebar">
    <div class="brand"><div class="brand-badge">🐄</div><div><h1>إدارة التسمين</h1><p>متابعة التكلفة والنمو والربحية</p></div></div>
    <div class="nav-section">القائمة الرئيسية</div>${nav.map(n=>`<button class="nav-btn ${state.currentPage===n[0]?'active':''}" onclick="route('${n[0]}')"><span>${n[1]}</span><span>${n[2]}</span></button>`).join('')}
    ${state.role==='admin'?`<div class="nav-section">الإدارة</div><button class="nav-btn"><span>⚙</span><span>إدارة المستخدمين</span></button>`:''}
  </aside><main class="main"><header class="topbar"><div style="display:flex;align-items:center;gap:12px"><button class="mobile-toggle" onclick="toggleMenu()">☰</button><div><div class="topbar-title">${title}</div><div class="topbar-sub">${sub}</div></div></div>
    <div class="top-actions"><div class="role-switch"><button class="${state.role==='client'?'active':''}" onclick="setRole('client')">عميل</button><button class="${state.role==='admin'?'active':''}" onclick="setRole('admin')">أدمن</button></div><div class="avatar">${state.role==='admin'?'A':client().name[0]}</div></div></header><section class="content">${body}<div class="footer-note">نسخة تجريبية محسّنة — جميع الأرقام في هذا النموذج توضيحية</div></section></main></div>`;
}

function dashboard(){
  if(state.role==='admin') return adminDashboard();
  const ps=state.plans.filter(p=>p.clientId===state.currentClientId), active=ps.filter(p=>p.status==='active'||p.status==='selling');
  const agg=active.reduce((a,p)=>{const s=stats(p);a.animals+=s.remaining;a.cost+=s.total;a.expected+=s.expected;a.profit+=s.profit;return a},{animals:0,cost:0,expected:0,profit:0});
  const body=`<div class="page-head"><div><h2>مرحبًا، ${client().name}</h2><p>هذه صورة سريعة عن خطط التسمين الخاصة بك اليوم.</p></div><div class="actions"><button class="btn primary" onclick="openPlanModal()">+ إنشاء خطة تسمين</button></div></div>
  <div class="grid metrics"><div class="metric"><div class="label">الخطط النشطة</div><div class="value">${active.length}</div><div class="note">من أصل ${ps.length} خطة</div></div><div class="metric"><div class="label">الحيوانات الحالية</div><div class="value">${agg.animals}</div><div class="note">في الخطط النشطة</div></div><div class="metric"><div class="label">إجمالي التكلفة الحالية</div><div class="value">${fmt(agg.cost)}</div><div class="note">شراء + علف + علاج + مصروفات</div></div><div class="metric hero"><div class="label">البيع المتوقع</div><div class="value">${fmt(agg.expected)}</div><div class="note">حسب تقديرات الخطط الحالية</div></div><div class="metric good"><div class="label">الربح المتوقع</div><div class="value">${fmt(agg.profit)}</div><div class="note">قبل إغلاق الخطط</div></div></div>
  <div class="split"><div class="card"><div class="section-title"><h3>خططي النشطة</h3><button class="btn small" onclick="route('plans')">عرض الكل</button></div><div class="plan-grid">${active.map(planCard).join('')||empty('لا توجد خطط نشطة')}</div></div>
  <div class="card"><h3>يحتاج انتباهك</h3><div class="alerts"><div class="alert danger"><span class="dot"></span><div><strong>الحيوان 002 تحت العلاج</strong><small>لديه جرعة علاجية تحتاج متابعة اليوم.</small></div></div><div class="alert"><span class="dot"></span><div><strong>مراجعة مخزون العلف</strong><small>العلف المركز المتبقي أقل من نصف الكمية المشتراة.</small></div></div><div class="alert good"><span class="dot"></span><div><strong>الأوزان محدثة</strong><small>تم تسجيل أوزان المجموعة الرئيسية اليوم.</small></div></div></div></div></div>`;
  return layout(body,'لوحة العميل','تابع خططك وتكلفتك وربحك المتوقع');
}
function adminDashboard(){
  const active=state.plans.filter(p=>p.status==='active'||p.status==='selling'); const costs=active.reduce((s,p)=>s+stats(p).total,0);
  const body=`<div class="page-head"><div><h2>لوحة الإدارة</h2><p>متابعة العملاء والخطط والتدخل عند تعثر العميل.</p></div><div class="actions"><button class="btn" onclick="openClientModal()">+ إضافة عميل</button><button class="btn primary" onclick="openPlanModal(true)">+ إنشاء خطة لعميل</button></div></div>
  <div class="grid metrics"><div class="metric"><div class="label">العملاء</div><div class="value">${state.clients.length}</div><div class="note">${state.clients.filter(c=>c.active).length} نشط</div></div><div class="metric"><div class="label">الخطط النشطة</div><div class="value">${active.length}</div></div><div class="metric"><div class="label">الحيوانات الحالية</div><div class="value">${active.reduce((s,p)=>s+stats(p).remaining,0)}</div></div><div class="metric hero"><div class="label">تكلفة الخطط النشطة</div><div class="value">${fmt(costs)}</div></div><div class="metric"><div class="label">الخطط المكتملة</div><div class="value">${state.plans.filter(p=>p.status==='closed').length}</div></div></div>
  <div class="split"><div class="card"><div class="section-title"><h3>الخطط النشطة</h3><button class="btn small" onclick="route('plans')">كل الخطط</button></div><div class="table-wrap"><table><thead><tr><th>الخطة</th><th>العميل</th><th>الحيوانات</th><th>التكلفة</th><th>الحالة</th><th></th></tr></thead><tbody>${active.map(p=>`<tr><td><strong>${p.name}</strong></td><td>${state.clients.find(c=>c.id===p.clientId)?.name||'-'}</td><td>${stats(p).animals.length}</td><td>${fmt(stats(p).total)}</td><td>${statusBadge(p.status)}</td><td><button class="btn small" onclick="openPlan('${p.id}')">فتح</button></td></tr>`).join('')}</tbody></table></div></div><div class="card"><h3>تنبيهات الإدارة</h3><div class="alerts"><div class="alert danger"><span class="dot"></span><div><strong>حالة علاج تحتاج متابعة</strong><small>محمد أحمد — دورة أغسطس — الحيوان 002.</small></div></div><div class="alert"><span class="dot"></span><div><strong>عميل غير نشط</strong><small>يمكن للأدمن تحديث بياناته أو مساعدته في الدخول.</small></div></div></div></div></div>`;
  return layout(body,'لوحة الإدارة','نظرة شاملة على العملاء والخطط');
}
function planCard(p){const s=stats(p), progress=Math.min(100,Math.round(daysPassed(p)/p.duration*100));return `<div class="plan-card"><div class="plan-top"><div><h3>${p.name}</h3><div class="small muted">${p.sellPlace} • ${p.duration} يوم</div></div>${statusBadge(p.status)}</div><div class="progress"><i style="width:${progress}%"></i></div><div class="small muted" style="margin-top:6px">${progress}% من المدة المتوقعة</div><div class="plan-numbers"><div class="plan-number"><span>الحيوانات</span><strong>${s.remaining}</strong></div><div class="plan-number"><span>التكلفة الحالية</span><strong>${fmt(s.total)}</strong></div><div class="plan-number"><span>البيع المطلوب</span><strong>${fmt(s.required)}</strong></div><div class="plan-number"><span>الربح المتوقع</span><strong class="${s.profit>=0?'money-positive':'money-negative'}">${fmt(s.profit)}</strong></div></div><div class="plan-footer"><span class="small muted">الربح المستهدف ${p.profitTarget}%</span><button class="btn soft small" onclick="openPlan('${p.id}')">فتح الخطة ←</button></div></div>`}
function plansPage(){
 const ps=state.role==='admin'?state.plans:state.plans.filter(p=>p.clientId===state.currentClientId);
 const body=`<div class="page-head"><div><h2>${state.role==='admin'?'إدارة الخطط':'خططي'}</h2><p>${state.role==='admin'?'جميع خطط العملاء في مكان واحد.':'أنشئ أكثر من خطة وتابع ربحية كل خطة بشكل مستقل.'}</p></div><button class="btn primary" onclick="openPlanModal(${state.role==='admin'})">+ خطة جديدة</button></div><div class="pillbar" style="margin-bottom:15px"><span class="pill active">الكل ${ps.length}</span><span class="pill">نشطة ${ps.filter(p=>p.status==='active').length}</span><span class="pill">مكتملة ${ps.filter(p=>p.status==='closed').length}</span></div><div class="plan-grid">${ps.map(planCard).join('')}</div>`;
 return layout(body,state.role==='admin'?'الخطط':'خططي','كل خطة مستقلة في تكلفتها وبيعها وربحها');
}
function clientsPage(){
 const rows=state.clients.map(c=>{const ps=state.plans.filter(p=>p.clientId===c.id),a=ps.filter(p=>p.status==='active').length;return `<tr><td><strong>${c.name}</strong><div class="small muted">${c.city}</div></td><td>${c.phone}</td><td>${ps.length}</td><td>${a}</td><td>${c.active?'<span class="badge active">نشط</span>':'<span class="badge closed">غير نشط</span>'}</td><td><button class="btn small" onclick="impersonate('${c.id}')">فتح العميل</button></td></tr>`}).join('');
 const body=`<div class="page-head"><div><h2>العملاء</h2><p>الأدمن يستطيع إضافة العميل وإدارة خططه نيابة عنه عند الحاجة.</p></div><button class="btn primary" onclick="openClientModal()">+ إضافة عميل</button></div><div class="card"><div class="table-wrap"><table><thead><tr><th>العميل</th><th>الجوال</th><th>الخطط</th><th>النشطة</th><th>الحالة</th><th></th></tr></thead><tbody>${rows}</tbody></table></div></div>`;return layout(body,'العملاء','إدارة حسابات وملفات العملاء');
}
function impersonate(id){state.currentClientId=id;state.role='client';state.currentPage='dashboard';save();render();}
function planPage(){const p=plan(); if(!p)return plansPage(); const s=stats(p); const tabs=[['overview','نظرة عامة'],['shelter','الزريبة'],['animals','الحيوانات'],['daily','السجل اليومي'],['feeding','برنامج التغذية'],['feeds','مخزون الأعلاف'],['treatments','العلاجات'],['expenses','المصروفات'],['sales','البيع'],['reports','التقارير']];
 const head=`<div class="plan-summary"><div class="row"><div><div style="margin-bottom:9px">${statusBadge(p.status)}</div><h2>${p.name}</h2><p>${state.clients.find(c=>c.id===p.clientId)?.name} • البداية ${p.start} • مكان البيع المتوقع: ${p.sellPlace} • الزريبة: ${p.shelter?.ready?'جاهزة':'تحتاج إعداد'}</p></div><div class="actions"><button class="btn" onclick="openExpenseModal('${p.id}')">+ مصروف</button><button class="btn" onclick="openDailyModal('${p.id}')">+ تسجيل يومي</button><button class="btn primary" onclick="openSaleModal('${p.id}')">تسجيل بيع</button></div></div><div class="kpis"><div class="kpi"><span>إجمالي التكلفة</span><strong>${fmt(s.total)}</strong></div><div class="kpi"><span>البيع المطلوب لتحقيق ${p.profitTarget}%</span><strong>${fmt(s.required)}</strong></div><div class="kpi"><span>البيع المتوقع حاليًا</span><strong>${fmt(s.expected)}</strong></div><div class="kpi"><span>الربح المتوقع</span><strong>${fmt(s.profit)}</strong></div></div></div><div class="tabs">${tabs.map(t=>`<button class="tab ${state.planTab===t[0]?'active':''}" onclick="setTab('${t[0]}')">${t[1]}</button>`).join('')}</div>`;
 return layout(head+tabContent(p,s),p.name,'مركز إدارة دورة التسمين');}
function tabContent(p,s){if(state.planTab==='shelter')return shelterTab(p);if(state.planTab==='animals')return animalsTab(p);if(state.planTab==='daily')return dailyTab(p);if(state.planTab==='feeding')return feedingTab(p);if(state.planTab==='feeds')return feedsTab(p);if(state.planTab==='treatments')return treatmentsTab(p);if(state.planTab==='expenses')return expensesTab(p);if(state.planTab==='sales')return salesTab(p);if(state.planTab==='reports')return reportsTab(p);return overviewTab(p,s)}
function overviewTab(p,s){const shelter=p.shelter?.ready?`<div class="alert good" style="margin-bottom:16px"><span class="dot"></span><div><strong>الزريبة جاهزة حسب قائمة فحص المحاضرة الثانية</strong><small>${p.shelter.animalType==='sheep'?`العدد المخطط ${p.shelter.headCount} رأس • المساحة المسقوفة المحسوبة ${p.shelter.headCount} م² تقريبًا`:'لم يُفرض رقم لمساحة العجل لأن المحاضرة لم تحفظ رقمًا واضحًا.'}</small></div><button class="btn small" onclick="setTab('shelter')">فتح الفحص</button></div>`:`<div class="alert danger" style="margin-bottom:16px"><span class="dot"></span><div><strong>تجهيز الزريبة غير مكتمل</strong><small>أكمل فحص الزريبة من المحاضرة الثانية قبل إضافة حيوانات جديدة.</small></div><button class="btn small" onclick="setTab('shelter')">تجهيز الزريبة</button></div>`;return `${shelter}<div class="grid metrics"><div class="metric"><div class="label">الحيوانات الحالية</div><div class="value">${s.remaining}</div><div class="note">${s.sold} مباع</div></div><div class="metric"><div class="label">شراء الحيوانات</div><div class="value">${fmt(s.buy)}</div></div><div class="metric"><div class="label">العلف المستهلك</div><div class="value">${fmt(s.feedUsed)}</div></div><div class="metric"><div class="label">العلاجات المستخدمة</div><div class="value">${fmt(s.treatment)}</div></div><div class="metric"><div class="label">مصروفات أخرى</div><div class="value">${fmt(s.other)}</div></div></div><div class="split"><div class="card"><div class="section-title"><h3>الحيوانات</h3><button class="btn small" onclick="setTab('animals')">عرض الكل</button></div>${animalTable(p,true)}</div><div class="card"><h3>آخر النشاطات</h3><div class="timeline"><div class="event"><div class="line"></div><div class="event-body"><strong>تم تحديث أوزان الحيوانات</strong><small>12 أغسطس 2026</small></div></div><div class="event"><div class="line"></div><div class="event-body"><strong>إضافة علاج للحيوان 002</strong><small>11 أغسطس 2026</small></div></div><div class="event"><div class="line"></div><div class="event-body"><strong>شراء علف مركز</strong><small>1 أغسطس 2026</small></div></div></div></div></div>`}
function animalTable(p,limit=false){let a=planAnimals(p.id);if(limit)a=a.slice(0,5);return `<div class="table-wrap"><table><thead><tr><th>الحيوان</th><th>وزن الشراء</th><th>آخر وزن</th><th>الزيادة</th><th>الحالة</th><th></th></tr></thead><tbody>${a.map(x=>{const last=x.weights.at(-1)?.value||x.buyWeight;return `<tr><td><strong>#${x.tag}</strong>${x.pinnedNote?'<div class="small muted">📌 لديه ملاحظة مهمة</div>':''}</td><td>${x.buyWeight} كجم</td><td>${last} كجم</td><td class="money-positive">+${last-x.buyWeight} كجم</td><td>${animalStatus(x.status)}</td><td><button class="btn small" onclick="openAnimal('${x.id}')">فتح</button></td></tr>`}).join('')}</tbody></table></div>`}
const shelterCheckNames=['roofRain','floorRaised','floorSlope','drainage','ventilation','feeders','waterers','lickStone','lickSeparate'];
const shelterCheckLabels={roofRain:'السقف يمنع دخول المطر',floorRaised:'الأرضية مرتفعة عن مستوى المياه المحيطة',floorSlope:'الأرضية بها ميل يساعد الماء على الخروج',drainage:'لا تُترك المياه راكدة داخل الزريبة',ventilation:'توجد تهوية مناسبة',feeders:'المعالف متوفرة',waterers:'المساقي متوفرة',lickStone:'حجر اللحوس متوفر',lickSeparate:'حجر اللحوس موضوع أو معلق منفصلًا عن العلف'};
function shelterCheck(name,s){return `<label class="check-item"><input type="checkbox" name="${name}" ${s?.[name]?'checked':''}>${shelterCheckLabels[name]}</label>`}
function shelterAssessment(s){if(!s)return{cls:'review',text:'لم يتم تقييم الزريبة بعد.'};const missing=shelterCheckNames.filter(n=>!s[n]);if(s.projectType!=='fattening')return{cls:'bad',text:'هذا النظام مخصص لدورات التسمين. مشروع التربية أطول وله احتياجات مختلفة كما أوضحت المحاضرة.'};if(!s.headCount||s.headCount<1)return{cls:'review',text:'حدد عدد الحيوانات الذي ستجهز الزريبة له.'};if(s.roofMaterial==='zinc'&&!s.insulation)return{cls:'bad',text:'الزنك دون عازل حراري لا يطابق ما أوصت به الدكتورة في ظروف الحرارة.'};if(missing.length)return{cls:'review',text:`الزريبة تحتاج مراجعة — لم يتم تأكيد ${missing.length} نقطة أساسية.`};return{cls:'ok',text:'الزريبة مستوفية للنقاط الأساسية المحفوظة من المحاضرة الثانية.'}}
function shelterTab(p){const s=p.shelter||{},a=shelterAssessment(s),roof=s.roofMaterial||'straw',animalType=s.animalType||'calf',project=s.projectType||'fattening',waste=s.wasteUse||'undecided';return `<div class="split"><div class="card"><div class="section-title"><div><h3>تجهيز وفحص الزريبة</h3><div class="small muted">تطبق هذه الشاشة فقط ما ورد بوضوح في المحاضرة الثانية.</div></div></div><form id="shelterForm" onsubmit="saveShelter(event,'${p.id}')" onchange="updateShelterAssessment()"><div class="form-grid"><div class="field"><label>نوع المشروع</label><select name="projectType" required><option value="fattening" ${project==='fattening'?'selected':''}>تسمين</option><option value="breeding" ${project==='breeding'?'selected':''}>تربية</option></select><div class="form-help">الموقع مخصص لإدارة التسمين؛ التربية دورة أطول واحتياجاتها مختلفة.</div></div><div class="field"><label>نوع الحيوان</label><select name="animalType" required><option value="calf" ${animalType==='calf'?'selected':''}>عجول</option><option value="sheep" ${animalType==='sheep'?'selected':''}>ضأن</option></select></div><div class="field"><label>عدد الحيوانات المخطط</label><input name="headCount" type="number" min="1" value="${s.headCount||''}" required></div><div class="field"><label>مكان التسمين</label><select name="locationType"><option value="home" ${s.locationType==='home'?'selected':''}>حوش المنزل</option><option value="dedicated" ${s.locationType==='dedicated'?'selected':''}>زريبة مستقلة</option><option value="other" ${s.locationType==='other'?'selected':''}>مكان آخر</option></select><div class="form-help">المحاضرة أجازت حوش المنزل إذا توفرت المساحة والمواصفات المناسبة.</div></div><div class="field"><label>مادة السقف</label><select name="roofMaterial" required><option value="straw" ${roof==='straw'?'selected':''}>قش / تغطية تقليدية</option><option value="zinc" ${roof==='zinc'?'selected':''}>زنك</option><option value="other" ${roof==='other'?'selected':''}>مادة أخرى</option></select></div><div class="field" id="insulationField" style="${roof==='zinc'?'':'display:none'}"><label>عازل حراري تحت الزنك</label><label class="check-item"><input type="checkbox" name="insulation" ${s.insulation?'checked':''}>موجود</label></div></div><div id="shelterSpaceNote" class="breed-note" style="margin-top:14px"></div><div id="shelterRoofNote" class="source-note"></div><div class="selection-box"><h4>فحص الأرضية والسقف والتهوية</h4><div class="check-grid">${['roofRain','floorRaised','floorSlope','drainage','ventilation'].map(n=>shelterCheck(n,s)).join('')}</div></div><div class="selection-box"><h4>الأدوات الأساسية</h4><div class="check-grid">${['feeders','waterers','lickStone','lickSeparate'].map(n=>shelterCheck(n,s)).join('')}<label class="check-item"><input type="checkbox" name="tapeMeasure" ${s.tapeMeasure?'checked':''}>الميزان الشريطي متوفر</label></div><div class="source-note">وردت المعالف والمساقي والميزان الشريطي ضمن محاور المحاضرة، لكن أبعادها وطريقة استخدام الميزان لم تُحفظ؛ لذلك لا يضع النظام مقاسات أو طريقة من عنده.</div></div><div class="selection-box"><h4>الروث والمنتجات الثانوية</h4><div class="field"><label>طريقة التعامل مع الروث</label><select name="wasteUse"><option value="undecided" ${waste==='undecided'?'selected':''}>لم أحدد بعد</option><option value="regular" ${waste==='regular'?'selected':''}>تنظيف / التخلص المنتظم</option><option value="fertilizer" ${waste==='fertilizer'?'selected':''}>الاستفادة كسماد عضوي</option><option value="biogas" ${waste==='biogas'?'selected':''}>دراسة مشروع غاز حيوي</option></select></div><div id="wasteNote" class="source-note"></div></div><label class="check-item" style="margin-top:14px"><input type="checkbox" name="firstCycle" ${s.firstCycle?'checked':''}>هذه أول دورة تسمين لي</label><div id="beginnerNote" class="source-note"></div><div id="shelterAssessment" class="assessment ${a.cls}">${a.text}</div><div class="source-note">لم نحفظ تفاصيل أمان الزريبة، أبعاد المعالف والمساقي، مساحة العجل، تكلفة زريبة أربعة عجول أو روتين النظافة function updateShelterAssessment(){const f=document.getElementById('shelterForm');if(!f)return;const type=f.elements.animalType.value,count=+f.elements.headCount.value||0,roof=f.elements.roofMaterial.value;const space=document.getElementById('shelterSpaceNote'),roofNote=document.getElementById('shelterRoofNote'),ins=document.getElementById('insulationField'),wasteNote=document.getElementById('wasteNote'),beginner=document.getElementById('beginnerNote'),box=document.getElementById('shelterAssessment');if(ins)ins.style.display=roof==='zinc'?'':'none';if(space)space.textContent=type==='sheep'?(count?`المساحة المسقوفة المطلوبة تقريبًا: ${count} م² (${count} رأس × 1 م²).`:'للضأن: متر مربع مسقوف تقريبًا لكل رأس.'):'لم يظهر في المادة المتاحة رقم واضح لمساحة العجل الواحد؛ لذلك لا يحسب النظام رقمًا من عنده.';if(roofNote)roofNote.textContent=roof==='zinc'?'الزنك يرفع الحرارة إذا استُخدم وحده؛ يلزم عازل حراري مع تهوية مناسبة.':roof==='straw'?'مواد التغطية التقليدية مثل القش أنسب حراريًا، مع ضرورة منع دخول المطر.':'للمادة الأخرى لا تضيف المحاضرة مواصفات حرارية رقمية؛ تبقى شروط منع المطر والتهوية مطلوبة.';const waste=f.elements.wasteUse.value;if(wasteNote)wasteNote.textContent=waste==='biogas'?'الاستفادة في الغاز الحيوي تحتاج متخصصًا وحسابًا مستقلًا؛ لا يعتمد النظام أرقامًا اقتصادية غير مؤكدة.':waste==='fertilizer'?'يمكن الاستفادة من الروث كسماد طبيعي/عضوي؛ تفاصيل التصنيع تأتي لاحقًا في الدورة.':waste==='undecided'?'يمكن التفكير في الروث كمنتج جانبي، دون افتراض عائد مالي.':'';if(beginner)beginner.textContent=f.elements.firstCycle.checked&&count>5?'للمبتدئ نصحت الدكتورة بالبدء بعدد صغير نحو 4–5 رؤوس وتجربة دورة قبل التوسع.':f.elements.firstCycle.checked?'العدد يقع ضمن البداية الصغيرة التي نصحت بها الدكتورة للمبتدئ إذا كان 4–5 رؤوس.':'';const data={projectType:f.elements.projectType.value,headCount:count,roofMaterial:roof,insulation:!!f.elements.insulation?.checked};for(const n of shelterCheckNames)data[n]=!!f.elements[n]?.checked;const a=shelterAssessment(data);if(box){box.className=`assessment ${a.cls}`;box.textContent=a.text}if(type==='sheep'&&space&&count)space.textContent+=` وذكرت الدكتورة أن دورة تسمين الحملان تكون قصيرة، نحو شهرين إلى ثلاثة أشهر، بعد شراء الحمل في العمر التقريبي المذكور بالمحاضرة.`}
function saveShelter(ev,pid){ev.preventDefault();const f=new FormData(ev.target),p=plan(pid);const data={projectType:f.get('projectType'),animalType:f.get('animalType'),headCount:+f.get('headCount'),locationType:f.get('locationType'),roofMaterial:f.get('roofMaterial'),insulation:!!f.get('insulation'),tapeMeasure:!!f.get('tapeMeasure'),wasteUse:f.get('wasteUse'),firstCycle:!!f.get('firstCycle')};for(const n of shelterCheckNames)data[n]=!!f.get(n);const a=shelterAssessment(data);data.ready=a.cls==='ok';data.checkedAt=today();p.projectType=data.projectType;p.shelter=data;save();render();setTimeout(()=>alert(data.ready?'تم حفظ التقييم: الزريبة جاهزة حسب النقاط المحفوظة من المحاضرة الثانية.':'تم حفظ التقييم، لكن الزريبة ما زالت تحتاج مراجعة قبل إضافة حيوانات جديدة.'),0)}

function dailyTab(p){const rows=state.daily.filter(d=>d.planId===p.id).map(d=>`<tr><td>${d.date}</td><td>${d.entries.length}</td><td>${d.shelterCleaned===true?'تم':d.shelterCleaned===false?'لم يُسجل':'-'}</td><td>${d.note||'-'}</td><td><button class="btn small" onclick="openDailyModal('${p.id}')">إضافة سجل جديد</button></td></tr>`).join('');return `<div class="card"><div class="section-title"><div><h3>السجل اليومي للمجموعة</h3><div class="small muted">سجل الوزن والحالة والملاحظة، مع توثيق تنفيذ النظافة اليومية دون اختراع تفاصيل لم تحفظها المحاضرة.</div></div><button class="btn primary small" onclick="openDailyModal('${p.id}')">+ تسجيل يومي</button></div><div class="table-wrap"><table><thead><tr><th>التاريخ</th><th>الحيوانات المحدثة</th><th>نظافة الزريبة</th><th>ملاحظة المجموعة</th><th></th></tr></thead><tbody>${rows||'<tr><td colspan="5">لا توجد سجلات يومية بعد.</td></tr>'}</tbody></table></div></div>`}

const feedingStorageNames=['dryStorage','ventilatedStorage','groundProtected','rainProtected','noSpoiledFeed'];
const feedingStorageLabels={dryStorage:'مكان حفظ العلف جاف',ventilatedStorage:'مكان الحفظ جيد التهوية',groundProtected:'العلف محمي من رطوبة الأرض',rainProtected:'العلف محمي من مياه المطر',noSpoiledFeed:'لا يُقدّم علف ظهرت عليه علامات عفن أو فساد'};
function dayDiff(from,to=today()){if(!from)return 999;const a=new Date(from+'T00:00:00'),b=new Date(to+'T00:00:00');return Math.max(0,Math.floor((b-a)/86400000))}
function latestWeightRecord(a){return a.weights?.length?a.weights[a.weights.length-1]:{date:a.buyDate,value:a.buyWeight}}
function feedingAnimalType(p){return p.shelter?.animalType||planAnimals(p.id).find(a=>a.animalType)?.animalType||null}
function feedingTypeName(t){return t==='sheep'?'ضأن':t==='calf'?'عجول':'غير محدد'}
function concentrateTarget(weight){return +(Number(weight||0)*.03).toFixed(3)}
function roughageGeneral(concentrate){return +(Number(concentrate||0)*1.5).toFixed(3)}
function publishedGain(type,weight){const calf={200:[.8,1.2],250:[1,1.3],300:[1.1,1.5],350:[1,1.4],400:[.9,1.3]},sheep={15:[.12,.18],20:[.16,.23],25:[.19,.26],30:[.21,.28],35:[.2,.27],40:[.18,.25]};return (type==='calf'?calf:sheep)[Number(weight)]||null}
function mix100(type){return type==='sheep'?[['فتريتة مدروشة',50],['أمباز فول أو أمباز سمسم',20],['ردة قمح',25],['أملاح معدنية وفيتامينات',3],['جير مطفي مخصص للأعلاف',2]]:[['فتريتة مدروشة',50],['أمباز فول أو أمباز سمسم',30],['ردة قمح',15],['أملاح معدنية وفيتامينات',3],['جير مطفي مخصص للأعلاف',2]]}
function taperRows(type){return type==='sheep'?[['1–3','200 جرام'],['4–7','300 جرام'],['8–10','500 جرام'],['من اليوم 11','600 جرام']]:[['1–3','2 كجم'],['4–7','3 كجم'],['8–10','4 كجم'],['من اليوم 11','6 كجم']]}
function storageAssessment(st){if(!st)return{cls:'review',text:'لم يتم تقييم تخزين العلف بعد.'};const missing=feedingStorageNames.filter(n=>!st[n]);return missing.length?{cls:'review',text:`التخزين يحتاج مراجعة — لم يتم تأكيد ${missing.length} نقطة.`}:{cls:'ok',text:'تخزين العلف مستوفٍ للنقاط المحفوظة من المحاضرة الثالثة.'}}
function saveFeedingStorage(ev,pid){ev.preventDefault();const f=new FormData(ev.target),p=plan(pid),st={checkedAt:today()};for(const n of feedingStorageNames)st[n]=!!f.get(n);p.feeding=p.feeding||{};p.feeding.storage=st;save();render()}
function dangerText(log){const x=[];if(log.diarrhea)x.push('إسهال');if(log.lowAppetite)x.push('ضعف شهية');if(log.bloat)x.push('انتفاخ');if(log.lethargy)x.push('خمول');return x.join('، ')}
function feedingTab(p){
  const type=feedingAnimalType(p);
  if(!type)return `<div class="alert danger"><span class="dot"></span><div><strong>حدد نوع الحيوان أولًا من تجهيز الزريبة</strong><small>برنامج التغذية يعتمد على التفريق بين العجول والضأن كما ورد في المحاضرة الثالثة.</small></div><button class="btn small" onclick="setTab('shelter')">فتح الزريبة</button></div>`;
  const animals=planAnimals(p.id).filter(a=>a.status!=='sold'), rows=animals.map(a=>{const wr=latestWeightRecord(a),c=concentrateTarget(wr.value),r=roughageGeneral(c),age=dayDiff(wr.date),gain=publishedGain(type,wr.value),weigh=age>15?`<span class="badge treat">متأخر ${age} يوم</span>`:age>=10?`<span class="badge sell">موعد وزن ${age} يوم</span>`:`<span class="badge active">${age} يوم</span>`;return `<tr><td><strong>#${a.tag}</strong></td><td>${wr.value} كجم<br><span class="small muted">${wr.date}</span></td><td>${c} كجم/يوم</td><td>${r} كجم/يوم</td><td>${gain?`${gain[0]}–${gain[1]} كجم/يوم`:'لا يوجد صف مطابق في الجدول المنشور'}</td><td>${weigh}</td></tr>`}).join('');
  const totalC=animals.reduce((z,a)=>z+concentrateTarget(latestWeightRecord(a).value),0),totalR=roughageGeneral(totalC),due=animals.filter(a=>dayDiff(latestWeightRecord(a).date)>=10).length,ps=stats(p),feedShare=ps.total?ps.feedUsed/ps.total*100:0;
  const mix=mix100(type),st=p.feeding?.storage||null,sa=storageAssessment(st),logs=planFeedingLogs(p.id).slice().reverse();
  const remaining=Math.max(0,p.duration-daysPassed(p)),finish=remaining<=30&&p.status==='active',finishAmount=type==='sheep'?(animals.length*.2):animals.length;
  const taper=taperRows(type), example=type==='sheep'?'خروف وزنه 20 كجم — الهدف 600 جرام/يوم':'عجل وزنه 200 كجم — الهدف 6 كجم/يوم';
  return `<div class="grid metrics"><div class="metric hero"><div class="label">هدف المركزات الحالي</div><div class="value">${totalC.toFixed(2)}</div><div class="note">كجم/يوم للمجموعة — 3% من آخر وزن لكل حيوان</div></div><div class="metric"><div class="label">المالئ حسب قاعدة 60/40</div><div class="value">${totalR.toFixed(2)}</div><div class="note">كجم/يوم = المركزات × 1.5</div></div><div class="metric ${due?'warn':'good'}"><div class="label">إعادة الوزن</div><div class="value">${due}</div><div class="note">حيوان مرّ على وزنه 10 أيام أو أكثر</div></div><div class="metric"><div class="label">الحيوانات الحالية</div><div class="value">${animals.length}</div><div class="note">${feedingTypeName(type)}</div></div><div class="metric"><div class="label">العلف من التكلفة الفعلية</div><div class="value">${feedShare.toFixed(1)}%</div><div class="note">المحاضرة ذكرت نحو 70% من تكلفة التسمين بصورة عامة</div></div></div>

  <div class="card"><div class="section-title"><div><h3>حساب العليقة من آخر وزن</h3><div class="small muted">يتغير الهدف تلقائيًا كلما سجلت وزنًا جديدًا.</div></div><button class="btn primary small" onclick="openFeedingLogModal('${p.id}')">+ تسجيل تغذية اليوم</button></div><div class="table-wrap"><table><thead><tr><th>الحيوان</th><th>آخر وزن</th><th>المركزات 3%</th><th>المالئ العام ×1.5</th><th>الزيادة المنشورة عند وزن مطابق</th><th>موعد الوزن</th></tr></thead><tbody>${rows||'<tr><td colspan="6">لا توجد حيوانات نشطة.</td></tr>'}</tbody></table></div><div class="source-note">المحاضرة أوصت بإعادة الوزن كل 10–15 يومًا وتعديل 3% على الوزن الجديد. جداول الزيادة المنشورة تُعرض فقط عند تطابق الوزن حرفيًا؛ لا يقوم النظام بالاستيفاء بين الأوزان.</div></div>
  <div class="split" style="margin-top:16px"><div class="card"><h3>خلطة ${feedingTypeName(type)} — 100 كجم</h3><div class="table-wrap"><table><thead><tr><th>المكوّن</th><th>الكمية</th></tr></thead><tbody>${mix.map(x=>`<tr><td>${x[0]}</td><td>${x[1]} كجم</td></tr>`).join('')}<tr><td><strong>المجموع</strong></td><td><strong>100 كجم</strong></td></tr></tbody></table></div><div class="selection-box"><h4>إضافات ذكرتها الدكتورة لكل 100 كجم</h4><div class="small">1 كجم بيكربونات صوديوم للعلف • 1 كجم ملح طعام • 1 كجم مضاد سموم فطرية خصوصًا مع الرطوبة أو التخزين الطويل.</div><div class="source-note">لا يضيفها النظام تلقائيًا داخل المئة؛ لأن المحاضرة لم توضّح هل تُضاف فوق 100 كجم أم يُخصم مقابلها من مكونات الخلطة.</div></div><div class="selection-box"><h4>الأزولا والمولاس</h4><div class="small">الأزولا الجافة في المثال: اسحب 5 كجم فتريتة + 5 كجم أمباز، وأضف 10 كجم أزولا جافة. الأزولا الطازجة تُدخل تدريجيًا فوق العلف عند التقديم.</div><div class="small" style="margin-top:7px">المولاس: مصدر طاقة، ويُدخل تدريجيًا بدل جزء صغير من الذرة، ولا يتجاوز 6% من العليقة — أي بحد أقصى حسابي 6 كجم لكل 100 كجم.</div></div></div>
  <div class="card"><h3>التدرج المنشور — مرجع لا يُعمّم آليًا</h3><div class="breed-note">${example}</div><div class="table-wrap" style="margin-top:10px"><table><thead><tr><th>الأيام</th><th>المركزات في المثال</th></tr></thead><tbody>${taper.map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td></tr>`).join('')}</tbody></table></div><div class="source-note">المحور سُمّي «التدرج 14 يومًا»، لكن التسجيل يصل للكمية الكاملة من اليوم 11. لا يختلق النظام توزيعًا للأيام 11–14، ولا يحوّل أرقام المثال إلى نسب لحيوانات بأوزان أخرى.</div><div class="alert" style="margin-top:12px"><span class="dot"></span><div><strong>المالئ: طريقتان محفوظتان</strong><small>القاعدة العامة: 60% مالئ/40% مركز، والمالئ = المركز ×1.5. وفي جداول الزيادة ورد 1 كجم تبن للعجل و250–300 جرام للضأن. النظام لا يدمج الطريقتين لأن العلاقة بينهما لم تُحسم في المحاضرة.</small></div></div></div></div>
  <div class="split" style="margin-top:16px"><div class="card"><h3>تخزين العلف</h3><form onsubmit="saveFeedingStorage(event,'${p.id}')"><div class="check-grid">${feedingStorageNames.map(n=>`<label class="check-item"><input type="checkbox" name="${n}" ${st?.[n]?'checked':''}>${feedingStorageLabels[n]}</label>`).join('')}</div><div class="assessment ${sa.cls}">${sa.text}</div><div class="modal-actions"><button class="btn primary">حفظ تقييم التخزين</button></div></form></div><div class="card"><h3>قواعد التقديم اليومية</h3><div class="alerts"><div class="alert good"><span class="dot"></span><div><strong>الماء أولًا</strong><small>ماء نظيف ومستساغ وبارد، متاح للحيوان، مع غسل أوعية الشرب ووضعها في الظل وتغيير الماء صباحًا وعصرًا.</small></div></div><div class="alert"><span class="dot"></span><div><strong>ترتيب العلف</strong><small>المركز أولًا ثم المالئ، وكل واحد منفصل عن الآخر، صباحًا باكرًا وعصرًا. الخلطة مدروشة وجافة في الأصل، ويمكن رش قدر بسيط من الماء أو المولاس دون إغراقها أو تركها تتخمر.</small></div></div><div class="alert"><span class="dot"></span><div><strong>تغيير العلف وتقسيم الحيوانات</strong><small>لا تغيّر نوع العلف فجأة. قسّم الحيوانات بحسب الأوزان حتى لا تزاحم الكبيرة الصغيرة. وإذا تعذر وزن الجميع يمكن أخذ عينات من الأصغر والمتوسط والأكبر؛ لا يضع النظام حدودًا رقمية للفئات لأن المحاضرة لم تحددها.</small></div></div>${type==='sheep'?`<div class="alert"><span class="dot"></span><div><strong>ملاحظات الضأن المنشورة</strong><small>حددت الدكتورة البروتين عند 20%، وذكرت أن التحويل أسرع في أول 45 يومًا ويبدأ في الانخفاض بعد وزن 35 كجم.</small></div></div>`:''}<div class="alert danger"><span class="dot"></span><div><strong>علامات الخطر</strong><small>إسهال، انخفاض الشهية، انتفاخ، خمول. عند ظهورها: ارجع خطوة في التدرج وقلل الكمية؛ والنفاخ الشديد يحتاج طبيبًا بيطريًا.</small></div></div></div></div></div>
  <div class="card" style="margin-top:16px"><div class="section-title"><div><h3>سجل التغذية</h3><div class="small muted">يسجل الكميات الفعلية والماء وعلامات الخطر، ويمكنه خصم الاستهلاك من مخزون المركزات والمالئ.</div></div><button class="btn small" onclick="openFeedingLogModal('${p.id}')">+ سجل جديد</button></div><div class="table-wrap"><table><thead><tr><th>التاريخ</th><th>المركزات</th><th>المالئ</th><th>الماء والوجبتان</th><th>علامات الخطر</th><th>الحرارة</th></tr></thead><tbody>${logs.length?logs.map(l=>`<tr><td>${l.date}</td><td>${l.concentrateKg||0} كجم</td><td>${l.roughageKg||0} كجم</td><td>${l.waterBefore&&l.waterAvailable&&l.morningMeal&&l.afternoonMeal?'<span class="badge active">مكتمل</span>':'<span class="badge sell">ناقص</span>'}</td><td>${dangerText(l)?`<span class="badge treat">${dangerText(l)}</span>`:'<span class="badge active">لا توجد</span>'}</td><td>${l.temperature?`${l.temperature}°${l.temperature>35?' — تنبيه':''}`:'-'}</td></tr>`).join(''):'<tr><td colspan="6">لا توجد سجلات تغذية بعد.</td></tr>'}</tbody></table></div></div>`;
}
function openFeedingLogModal(pid){
  const p=plan(pid),type=feedingAnimalType(p),animals=planAnimals(pid).filter(a=>a.status!=='sold'),totalC=animals.reduce((z,a)=>z+concentrateTarget(latestWeightRecord(a).value),0),totalR=roughageGeneral(totalC),conc=planFeeds(pid).filter(f=>f.category==='concentrate'&&f.qtyKg>f.usedKg),rough=planFeeds(pid).filter(f=>f.category==='roughage'&&f.qtyKg>f.usedKg);
  modal(`<div class="modal-head"><div><h3>تسجيل تغذية اليوم</h3><div class="small muted">هدف المجموعة الحالي: ${totalC.toFixed(2)} كجم مركزات/يوم؛ المالئ العام حسب 60/40: ${totalR.toFixed(2)} كجم/يوم.</div></div><button class="close" onclick="closeModal()">×</button></div><form onsubmit="createFeedingLog(event,'${pid}')"><div class="form-grid"><div class="field"><label>التاريخ</label><input name="date" type="date" value="${today()}" required></div><div class="field"><label>الحرارة °م (اختياري)</label><input name="temperature" type="number" step=".1" placeholder="مثال 34"></div><div class="field"><label>كمية المركزات المقدمة فعليًا — كجم</label><input name="concentrateKg" type="number" min="0" step=".001" required></div><div class="field"><label>كمية المالئ المقدمة فعليًا — كجم</label><input name="roughageKg" type="number" min="0" step=".001" required></div><div class="field"><label>خصم المركزات من المخزون (اختياري)</label><select name="concFeed"><option value="">بدون خصم</option>${conc.map(f=>`<option value="${f.id}">${f.name} — متبقي ${(f.qtyKg-f.usedKg).toFixed(2)} كجم</option>`).join('')}</select></div><div class="field"><label>خصم المالئ من المخزون (اختياري)</label><select name="roughFeed"><option value="">بدون خصم</option>${rough.map(f=>`<option value="${f.id}">${f.name} — متبقي ${(f.qtyKg-f.usedKg).toFixed(2)} كجم</option>`).join('')}</select></div></div>
  <div class="selection-box"><h4>طريقة التقديم والماء</h4><div class="check-grid"><label class="check-item"><input type="checkbox" name="waterBefore">الماء النظيف جاهز قبل العلف</label><label class="check-item"><input type="checkbox" name="waterAvailable">الماء متاح للحيوانات</label><label class="check-item"><input type="checkbox" name="troughWashed">تم غسل أوعية الشرب</label><label class="check-item"><input type="checkbox" name="waterCool">الماء مستساغ وبارد لا ساخن</label><label class="check-item"><input type="checkbox" name="waterShade">أحواض الماء في الظل / تحت عريشة</label><label class="check-item"><input type="checkbox" name="changedMorning">تم تغيير الماء صباحًا</label><label class="check-item"><input type="checkbox" name="changedAfternoon">تم تغيير الماء عصرًا</label><label class="check-item"><input type="checkbox" name="morningMeal">تمت وجبة الصباح الباكر</label><label class="check-item"><input type="checkbox" name="afternoonMeal">تمت وجبة العصر</label><label class="check-item"><input type="checkbox" name="concentrateFirst">قُدمت المركزات أولًا</label><label class="check-item"><input type="checkbox" name="roughageSeparate">قُدم المالئ منفصلًا عن المركزات</label></div></div>
  <div class="selection-box"><h4>مراقبة علامات الخطر</h4><div class="check-grid"><label class="check-item"><input type="checkbox" name="diarrhea">ظهر إسهال</label><label class="check-item"><input type="checkbox" name="lowAppetite">انخفضت الشهية / توقف الأكل</label><label class="check-item"><input type="checkbox" name="bloat">ظهر انتفاخ / غازات</label><label class="check-item"><input type="checkbox" name="lethargy">ظهر خمول أو تغير سلوك</label></div><div class="source-note">وجود علامة خطر لا يعطي تشخيصًا. المحاضرة توصي بالرجوع خطوة في التدرج وتقليل الكمية حتى تخف الأعراض، والنفاخ الشديد يحتاج طبيبًا بيطريًا.</div></div><div class="field"><label>ملاحظة</label><textarea name="note" placeholder="نوع علف جديد، الشهية، الروث، أي ملاحظة..."></textarea></div><div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">إلغاء</button><button class="btn primary">حفظ سجل التغذية</button></div></form>`);
}
function createFeedingLog(ev,pid){
  ev.preventDefault();const f=new FormData(ev.target),c=+f.get('concentrateKg')||0,r=+f.get('roughageKg')||0,cf=state.feeds.find(x=>x.id===f.get('concFeed')),rf=state.feeds.find(x=>x.id===f.get('roughFeed'));
  if(cf&&c>cf.qtyKg-cf.usedKg){alert('كمية المركزات أكبر من المخزون المتبقي.');return}if(rf&&r>rf.qtyKg-rf.usedKg){alert('كمية المالئ أكبر من المخزون المتبقي.');return}
  const log={id:uid('fl'),planId:pid,date:f.get('date'),concentrateKg:c,roughageKg:r,temperature:+f.get('temperature')||null,note:f.get('note')||'',concFeedId:cf?.id||null,roughFeedId:rf?.id||null};
  for(const n of ['waterBefore','waterAvailable','troughWashed','waterCool','waterShade','changedMorning','changedAfternoon','morningMeal','afternoonMeal','concentrateFirst','roughageSeparate','diarrhea','lowAppetite','bloat','lethargy'])log[n]=!!f.get(n);
  if(cf)cf.usedKg+=c;if(rf)rf.usedKg+=r;state.feedingLogs.push(log);save();closeModal();render();
  const danger=dangerText(log);setTimeout(()=>{if(danger)alert(`تم حفظ السجل. علامات تحتاج متابعة: ${danger}. حسب المحاضرة: ارجع خطوة في التدرج وقلل الكمية حتى تخف الأعراض، والنفاخ الشديد يحتاج طبيبًا بيطريًا.`);else if(log.temperature>35)alert('تم حفظ السجل. تنبيه من الجدول المنشور: الحرارة فوق 35° تقلل التحويل الغذائي 30%.');},0)
}

function feedsTab(p){const fs=planFeeds(p.id),purchased=fs.reduce((s,f)=>s+f.qtyKg*f.unitCost,0),used=fs.reduce((s,f)=>s+f.usedKg*f.unitCost,0),cat=x=>x==='concentrate'?'مركز':x==='roughage'?'مالئ':'إضافة/أخرى';return `<div class="grid metrics"><div class="metric"><div class="label">قيمة المشتريات</div><div class="value">${fmt(purchased)}</div></div><div class="metric"><div class="label">العلف المستهلك</div><div class="value">${fmt(used)}</div></div><div class="metric"><div class="label">قيمة المخزون المتبقي</div><div class="value">${fmt(purchased-used)}</div></div></div><div class="card"><div class="section-title"><div><h3>مخزون الأعلاف</h3><div class="small muted">نفصل بين شراء العلف واستهلاكه الفعلي، ونصنف المركزات والمالئ حتى يمكن خصم سجل التغذية من المخزون.</div></div><div class="actions"><button class="btn small" onclick="setTab('feeding')">برنامج التغذية</button><button class="btn primary small" onclick="openFeedModal('${p.id}')">+ شراء علف</button></div></div><div class="table-wrap"><table><thead><tr><th>العلف</th><th>التصنيف</th><th>جودة العلف عند الإدخال</th><th>المشتَرى</th><th>المستهلك</th><th>المتبقي</th><th>تكلفة المستهلك</th></tr></thead><tbody>${fs.length?fs.map(f=>`<tr><td><strong>${f.name}</strong></td><td>${cat(f.category)}</td><td>${f.qualityOk===true?'<span class="badge active">جاف ولا عفن ظاهر</span>':f.qualityOk===false?'<span class="badge treat">لا يُقدّم قبل المراجعة</span>':'<span class="badge">غير مفحوص</span>'}</td><td>${f.qtyKg} كجم</td><td>${f.usedKg.toFixed?f.usedKg.toFixed(2):f.usedKg} كجم</td><td>${(f.qtyKg-f.usedKg).toFixed(2)} كجم</td><td>${fmt(f.usedKg*f.unitCost)}</td></tr>`).join(''):'<tr><td colspan="7">لا توجد مشتريات علف بعد.</td></tr>'}</tbody></table></div><div class="source-note">المحاضرة حذرت من العلف المتعفن أو المبلول وأوصت بحفظه جافًا وجيد التهوية. فحص الجودة هنا تذكير عملي وليس تحليلًا مخبريًا.</div></div>`}
function treatmentsTab(p){const ts=planTreatments(p.id);return `<div class="card"><div class="section-title"><div><h3>العلاجات والمتابعة</h3><div class="small muted">يمكن ربط العلاج بحيوان واحد أو مجموعة حيوانات.</div></div><button class="btn primary small" onclick="openTreatmentModal('${p.id}')">+ تسجيل علاج</button></div><div class="table-wrap"><table><thead><tr><th>العلاج</th><th>الحيوانات</th><th>البداية</th><th>المدة</th><th>الحالة</th><th>التكلفة المستخدمة</th></tr></thead><tbody>${ts.map(t=>`<tr><td><strong>${t.name}</strong><div class="small muted">${t.reason}</div></td><td>${t.animalIds.map(id=>'#'+state.animals.find(a=>a.id===id)?.tag).join('، ')}</td><td>${t.start}</td><td>${t.days} يوم</td><td>${t.status==='active'?'<span class="badge treat">مستمر</span>':'<span class="badge active">مكتمل</span>'}</td><td>${fmt(t.usedCost)}</td></tr>`).join('')}</tbody></table></div></div>`}
function expensesTab(p){const es=planExpenses(p.id);return `<div class="card"><div class="section-title"><div><h3>مصروفات الخطة</h3><div class="small muted">كل مصروف مرتبط بالخطة، ويمكن تخصيصه للمجموعة أو الحيوان.</div></div><button class="btn primary small" onclick="openExpenseModal('${p.id}')">+ إضافة مصروف</button></div><div class="table-wrap"><table><thead><tr><th>التاريخ</th><th>النوع</th><th>النطاق</th><th>الوصف</th><th>المبلغ</th></tr></thead><tbody>${es.map(e=>`<tr><td>${e.date}</td><td>${e.type}</td><td>${e.scope==='animal'?'حيوان '+(state.animals.find(a=>a.id===e.animalId)?.tag||''):'الخطة كاملة'}</td><td>${e.desc}</td><td><strong>${fmt(e.amount)}</strong></td></tr>`).join('')}</tbody></table></div></div>`}
function salesTab(p){const ss=planSales(p.id),s=stats(p);return `<div class="grid metrics"><div class="metric"><div class="label">الحيوانات المباعة</div><div class="value">${s.sold}</div></div><div class="metric"><div class="label">الإيراد المحقق</div><div class="value">${fmt(s.actualSales)}</div></div><div class="metric"><div class="label">الحيوانات المتبقية</div><div class="value">${s.remaining}</div></div></div><div class="card"><div class="section-title"><div><h3>عمليات البيع</h3><div class="small muted">البيع الجزئي لا يغلق الخطة.</div></div><button class="btn primary small" onclick="openSaleModal('${p.id}')">+ تسجيل بيع</button></div><div class="table-wrap"><table><thead><tr><th>التاريخ</th><th>الحيوانات</th><th>المكان</th><th>المشتري</th><th>صافي البيع</th></tr></thead><tbody>${ss.map(x=>`<tr><td>${x.date}</td><td>${x.animalIds.map(id=>'#'+state.animals.find(a=>a.id===id)?.tag).join('، ')}</td><td>${x.place}</td><td>${x.buyer||'-'}</td><td class="money-positive">${fmt(x.amount-x.fees)}</td></tr>`).join('')||'<tr><td colspan="5">لم يتم تسجيل مبيعات لهذه الخطة بعد.</td></tr>'}</tbody></table></div></div>`}
function reportsTab(p){const s=stats(p);return `<div class="grid metrics"><div class="metric"><div class="label">إجمالي التكلفة</div><div class="value">${fmt(s.total)}</div></div><div class="metric"><div class="label">البيع المتوقع</div><div class="value">${fmt(s.expected)}</div></div><div class="metric good"><div class="label">الربح المتوقع</div><div class="value">${fmt(s.profit)}</div></div><div class="metric"><div class="label">العلف من التكلفة</div><div class="value">${s.total?pct(s.feedUsed/s.total*100):'0%'}</div></div><div class="metric"><div class="label">العلاجات من التكلفة</div><div class="value">${s.total?pct(s.treatment/s.total*100):'0%'}</div></div></div><div class="card"><h3>مقارنة أداء الحيوانات</h3>${animalTable(p)}</div>`}

function dailyPage(){const ps=state.role==='admin'?state.plans:state.plans.filter(p=>p.clientId===state.currentClientId);return layout(`<div class="page-head"><div><h2>السجل اليومي</h2><p>اختر الخطة أولًا ثم سجل ما حدث للمجموعة أو لحيوان بعينه.</p></div></div><div class="plan-grid">${ps.filter(p=>p.status==='active').map(p=>`<div class="plan-card"><h3>${p.name}</h3><p class="muted small">${planAnimals(p.id).length} حيوان</p><button class="btn primary" onclick="openDailyModal('${p.id}')">إضافة سجل يومي</button></div>`).join('')}</div>`,'السجل اليومي','تسجيل جماعي سريع مع ملاحظات خاصة');}
function feedsPage(){const ps=state.plans.filter(p=>p.clientId===state.currentClientId);return layout(`<div class="page-head"><div><h2>الأعلاف</h2><p>اختر الخطة لمراجعة المخزون والاستهلاك.</p></div></div><div class="plan-grid">${ps.filter(p=>p.status==='active').map(p=>`<div class="plan-card"><h3>${p.name}</h3><p class="muted small">${planFeeds(p.id).length} أصناف علف</p><button class="btn primary" onclick="openPlan('${p.id}');setTab('feeds')">فتح الأعلاف</button></div>`).join('')}</div>`,'الأعلاف','المشتريات والمخزون والاستهلاك');}
function treatmentsPage(){const ps=state.plans.filter(p=>p.clientId===state.currentClientId);return layout(`<div class="page-head"><div><h2>العلاجات</h2><p>العلاجات المبدئية والطارئة والمتابعة.</p></div></div><div class="plan-grid">${ps.filter(p=>p.status==='active').map(p=>`<div class="plan-card"><h3>${p.name}</h3><p class="muted small">${planTreatments(p.id).filter(t=>t.status==='active').length} علاج مستمر</p><button class="btn primary" onclick="openPlan('${p.id}');setTab('treatments')">فتح العلاجات</button></div>`).join('')}</div>`,'العلاجات','الشراء والاستخدام والمتابعة');}
function expensesPage(){const ps=state.role==='admin'?state.plans:state.plans.filter(p=>p.clientId===state.currentClientId);return layout(`<div class="page-head"><div><h2>المصروفات</h2><p>كل مصروف يجب أن يرتبط بخطة محددة.</p></div></div><div class="plan-grid">${ps.map(p=>`<div class="plan-card"><h3>${p.name}</h3><div class="plan-numbers"><div class="plan-number"><span>المصروفات</span><strong>${fmt(planExpenses(p.id).reduce((s,e)=>s+e.amount,0))}</strong></div><div class="plan-number"><span>إجمالي التكلفة</span><strong>${fmt(stats(p).total)}</strong></div></div><button class="btn primary" onclick="openExpenseModal('${p.id}')">+ مصروف لهذه الخطة</button></div>`).join('')}</div>`,'المصروفات','مصروفات مستقلة لكل خطة');}
function salesPage(){const ps=state.plans.filter(p=>p.clientId===state.currentClientId);return layout(`<div class="page-head"><div><h2>البيع</h2><p>سجل البيع الجزئي أو الكامل دون فقد تاريخ الحيوان.</p></div></div><div class="plan-grid">${ps.filter(p=>p.status!=='closed').map(p=>`<div class="plan-card"><h3>${p.name}</h3><div class="plan-numbers"><div class="plan-number"><span>مباع</span><strong>${stats(p).sold}</strong></div><div class="plan-number"><span>متبقي</span><strong>${stats(p).remaining}</strong></div></div><button class="btn primary" onclick="openSaleModal('${p.id}')">تسجيل بيع</button></div>`).join('')}</div>`,'البيع','من المتوقع إلى الربح الفعلي');}
function reportsPage(){const ps=state.role==='admin'?state.plans:state.plans.filter(p=>p.clientId===state.currentClientId);return layout(`<div class="page-head"><div><h2>${state.role==='admin'?'التقارير العامة':'التقارير ومقارنة الخطط'}</h2><p>قارن التكلفة والبيع والربح بين الخطط.</p></div></div><div class="card"><div class="table-wrap"><table><thead><tr><th>الخطة</th>${state.role==='admin'?'<th>العميل</th>':''}<th>الحيوانات</th><th>التكلفة</th><th>البيع المتوقع</th><th>الربح المتوقع</th><th>الربح المستهدف</th></tr></thead><tbody>${ps.map(p=>{const s=stats(p);return `<tr><td><strong>${p.name}</strong></td>${state.role==='admin'?`<td>${state.clients.find(c=>c.id===p.clientId)?.name}</td>`:''}<td>${s.animals.length}</td><td>${fmt(s.total)}</td><td>${fmt(s.expected)}</td><td class="${s.profit>=0?'money-positive':'money-negative'}">${fmt(s.profit)}</td><td>${p.profitTarget}%</td></tr>`}).join('')}</tbody></table></div></div>`,'التقارير','تحليل وربحية الخطط');}
function empty(t){return `<div class="empty"><div class="emoji">📋</div>${t}</div>`}

function modal(html){document.body.insertAdjacentHTML('beforeend',`<div class="modal-backdrop" id="modal"><div class="modal">${html}</div></div>`)}function closeModal(){document.getElementById('modal')?.remove()}
function openPlanModal(admin=false){modal(`<div class="modal-head"><div><h3>إنشاء خطة تسمين جديدة</h3><div class="small muted">البيانات الأساسية فقط، وباقي التفاصيل تضاف داخل الخطة.</div></div><button class="close" onclick="closeModal()">×</button></div><form onsubmit="createPlan(event)"><div class="form-grid">${admin?`<div class="field"><label>العميل</label><select name="clientId" required>${state.clients.map(c=>`<option value="${c.id}">${c.name}</option>`).join('')}</select></div>`:''}<div class="field"><label>اسم الخطة</label><input name="name" placeholder="مثال: دورة تسمين سبتمبر" required></div><div class="field"><label>تاريخ البداية</label><input name="start" type="date" value="${today()}" required></div><div class="field"><label>مدة الدورة المتوقعة بالأيام</label><input name="duration" type="number" value="90" min="1" required></div><div class="field"><label>مكان البيع المتوقع</label><input name="sellPlace" placeholder="مثال: سوق مدني" required></div><div class="field"><label>نسبة الربح المستهدفة %</label><input name="profit" type="number" value="20" min="0" step=".1" required></div><div class="field"><label>البيع المتوقع حاليًا</label><input name="expected" type="number" min="0" placeholder="يمكن تحديثه لاحقًا"></div></div><div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">إلغاء</button><button class="btn primary">إنشاء الخطة</button></div></form>`)}
function createPlan(ev){ev.preventDefault();const f=new FormData(ev.target),p={id:uid('p'),clientId:f.get('clientId')||state.currentClientId,name:f.get('name'),start:f.get('start'),duration:+f.get('duration'),sellPlace:f.get('sellPlace'),profitTarget:+f.get('profit'),status:'active',expectedSale:+f.get('expected')||0,projectType:'fattening',shelter:null,feeding:{storage:null},groups:[{id:uid('g'),name:'المجموعة الرئيسية'}]};state.plans.push(p);state.currentPlanId=p.id;state.currentPage='plan';state.planTab='shelter';save();closeModal();render()}
function openClientModal(){modal(`<div class="modal-head"><h3>إضافة عميل</h3><button class="close" onclick="closeModal()">×</button></div><form onsubmit="createClient(event)"><div class="form-grid"><div class="field"><label>اسم العميل</label><input name="name" required></div><div class="field"><label>رقم الجوال</label><input name="phone" required></div><div class="field"><label>المدينة / المنطقة</label><input name="city"></div><div class="field"><label>الحالة</label><select name="active"><option value="1">نشط</option><option value="0">غير نشط</option></select></div></div><div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">إلغاء</button><button class="btn primary">حفظ العميل</button></div></form>`)}
function createClient(ev){ev.preventDefault();const f=new FormData(ev.target);state.clients.push({id:uid('c'),name:f.get('name'),phone:f.get('phone'),city:f.get('city'),active:f.get('active')==='1'});save();closeModal();render()}
function openExpenseModal(pid){const p=plan(pid),as=planAnimals(pid);modal(`<div class="modal-head"><div><h3>إضافة مصروف</h3><div class="small muted">${p.name}</div></div><button class="close" onclick="closeModal()">×</button></div><form onsubmit="createExpense(event,'${pid}')"><div class="form-grid"><div class="field"><label>نوع المصروف</label><select name="type"><option>نقل</option><option>عمالة</option><option>إيجار</option><option>عمولة</option><option>صيانة</option><option>علاج</option><option>أخرى</option></select></div><div class="field"><label>المبلغ</label><input name="amount" type="number" min="0" required></div><div class="field"><label>التاريخ</label><input name="date" type="date" value="${today()}" required></div><div class="field"><label>نطاق المصروف</label><select name="scope" onchange="this.form.animalId.disabled=this.value!=='animal'"><option value="plan">الخطة كاملة</option><option value="animal">حيوان معين</option></select></div><div class="field"><label>الحيوان</label><select name="animalId" disabled><option value="">اختر</option>${as.map(a=>`<option value="${a.id}">#${a.tag}</option>`).join('')}</select></div><div class="field full"><label>الوصف / الملاحظة</label><textarea name="desc" placeholder="سبب أو تفاصيل المصروف"></textarea></div></div><div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">إلغاء</button><button class="btn primary">حفظ المصروف وتحديث الحسابات</button></div></form>`)}
function createExpense(ev,pid){ev.preventDefault();const f=new FormData(ev.target);state.expenses.push({id:uid('e'),planId:pid,type:f.get('type'),amount:+f.get('amount'),date:f.get('date'),scope:f.get('scope'),animalId:f.get('animalId')||null,desc:f.get('desc')});save();closeModal();render()}
function openDailyModal(pid){const as=planAnimals(pid).filter(a=>a.status!=='sold');modal(`<div class="modal-head"><div><h3>السجل اليومي</h3><div class="small muted">${plan(pid).name} — املأ فقط ما حدث اليوم.</div></div><button class="close" onclick="closeModal()">×</button></div><form onsubmit="createDaily(event,'${pid}')"><div class="field" style="margin-bottom:14px"><label>التاريخ</label><input name="date" type="date" value="${today()}"></div><div class="selection-box"><h4>النظافة اليومية للزريبة</h4><label class="check-item"><input type="checkbox" name="shelterCleaned">تم تنفيذ النظافة اليومية</label><div class="source-note">ورد روتين النظافة اليومي كمحور في المحاضرة، لكن تفاصيل خطواته لم تُحفظ؛ لذلك يسجل النظام التنفيذ فقط.</div></div><div class="table-wrap"><table><thead><tr><th>الحيوان</th><th>الوزن</th><th>الحالة</th><th>ملاحظة خاصة</th></tr></thead><tbody>${as.map(a=>`<tr><td><strong>#${a.tag}</strong></td><td><input style="width:90px" name="weight_${a.id}" type="number" step=".1" placeholder="كجم"></td><td><select name="status_${a.id}"><option value="">بدون تغيير</option><option value="normal">طبيعي</option><option value="treatment">يحتاج متابعة</option></select></td><td><input name="note_${a.id}" placeholder="ملاحظة خاصة بالحيوان"></td></tr>`).join('')}</tbody></table></div><div class="field" style="margin-top:14px"><label>ملاحظة عامة للمجموعة</label><textarea name="groupNote" placeholder="مثال: تم تغيير نوع العلف اليوم"></textarea></div><div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">إلغاء</button><button class="btn primary">حفظ السجل اليومي</button></div></form>`)}
function createDaily(ev,pid){ev.preventDefault();const f=new FormData(ev.target),entries=[];for(const a of planAnimals(pid)){const w=f.get('weight_'+a.id),st=f.get('status_'+a.id),n=f.get('note_'+a.id);if(w||st||n){entries.push({animalId:a.id,weight:w?+w:null,status:st||a.status,note:n||''});if(w)a.weights.push({date:f.get('date'),value:+w});if(st)a.status=st;if(n)a.notes.push({date:f.get('date'),text:n});}}state.daily.push({id:uid('d'),planId:pid,date:f.get('date'),note:f.get('groupNote'),shelterCleaned:!!f.get('shelterCleaned'),entries});save();closeModal();render()}
function breedField(type='calf'){
  if(type==='sheep') return `<select name="breed" id="breedInput" required onchange="updateBreedNote(this.value)"><option value="">اختر السلالة</option><option>الكباشي</option><option>الحمري</option><option>الدمازين</option><option>البلدي</option><option>النيلي</option><option>أخرى</option></select><div id="breedNote" class="breed-note" style="display:none"></div>`;
  return `<input name="breed" id="breedInput" placeholder="اكتب السلالة" required><div class="form-help">المحاضرة لم تحدد قائمة نهائية لسلالات العجول، لذلك لا يفرض النظام سلالة من عنده.</div>`;
}
function animalTypeChanged(v){const holder=document.getElementById('breedHolder');if(holder)holder.innerHTML=breedField(v);const label=document.getElementById('coatLabel');if(label)label.textContent=v==='sheep'?'الصوف نظيف وبحالة جيدة':'الشعر لامع وناعم';updateAnimalAssessment();}
function updateBreedNote(v){const el=document.getElementById('breedNote');if(!el)return;const notes={'الكباشي':'أسرع مكسب حسب خلاصة المحاضرة، ومطلوب جدًا.','الحمري':'ذكرت المحاضرة أنه مناسب للبيع في العيد.','الدمازين':'ذكرت المحاضرة أنه يتميز بزيادة وزن سريعة.','البلدي':'ذكرت المحاضرة أنه مناسب لرأس المال البسيط.','النيلي':'ذكرت المحاضرة أنه خيار للعمل في الشمالية.'};if(notes[v]){el.style.display='block';el.textContent=notes[v]}else el.style.display='none';}
const purchaseCheckNames=['breedGrowth','breedHeat','breedDisease','breedMeat','breedLocal','legs','back','bodyBalance','noDefects','movement','eyes','nose','coat','active','noCough','noDiarrhea','noWounds','skin','hoof','rearClean','teeth','marketAnimals','marketTraders'];
function updateAnimalAssessment(){const form=document.getElementById('animalSelectionForm'),box=document.getElementById('animalAssessment');if(!form||!box)return;const sex=form.elements.sex?.value;const checked=purchaseCheckNames.filter(n=>form.elements[n]?.checked).length;if(sex==='أنثى'){box.className='assessment bad';box.textContent='غير مناسب للاعتماد للتسمين وفق المحاضرة: الدكتورة حذرت من شراء الإناث بغرض التسمين.';return;}if(checked===purchaseCheckNames.length){box.className='assessment ok';box.textContent='مناسب مبدئيًا للتسمين حسب قائمة فحص المحاضرة الأولى. يظل الفحص البيطري/الخبير مستحسنًا عند الشراء.';return;}box.className='assessment review';box.textContent=`يحتاج مراجعة قبل الاعتماد — تم تأكيد ${checked} من ${purchaseCheckNames.length} نقطة فحص.`;}
function openAnimalModal(pid){const p=plan(pid);if(!p.shelter?.ready){alert('أكمل تقييم وتجهيز الزريبة من تبويب الزريبة قبل إضافة حيوان جديد.');state.planTab='shelter';save();render();return;}const current=planAnimals(pid).filter(a=>a.status!=='sold').length;if(p.shelter.headCount&&current>=p.shelter.headCount){alert('عدد الحيوانات وصل إلى العدد الذي تم تقييم الزريبة عليه. عدّل عدد الحيوانات وتجهيز الزريبة أولًا إذا أردت التوسع.');state.planTab='shelter';save();render();return;}const g=p.groups[0],fixedType=p.shelter.animalType||'calf';modal(`<div class="modal-head"><div><h3>اختيار وإضافة حيوان للتسمين</h3><div class="small muted">قائمة الفحص أدناه مأخوذة من المحاضرة الأولى فقط، ولا تضيف عمرًا أو معيارًا لم تحدده الدكتورة.</div></div><button class="close" onclick="closeModal()">×</button></div><form id="animalSelectionForm" onsubmit="createAnimal(event,'${pid}','${g.id}')" onchange="updateAnimalAssessment()"><div class="form-grid"><div class="field"><label>نوع الحيوان</label><input type="hidden" name="animalType" value="${fixedType}"><input value="${fixedType==='sheep'?'ضأن':'عجل'}" disabled><div class="form-help">نوع الحيوان ثابت حسب تجهيز الزريبة لهذه الخطة.</div></div><div class="field"><label>الجنس</label><select name="sex" required><option>ذكر</option><option>أنثى</option></select><div class="form-help">المحاضرة حذرت من شراء الإناث بغرض التسمين.</div></div><div class="field"><label>رقم الحيوان</label><input name="tag" required></div><div class="field"><label>تاريخ الشراء</label><input name="buyDate" type="date" value="${today()}" required></div><div class="field"><label>مكان الشراء</label><input name="buyPlace" required></div><div class="field"><label>وزن الشراء كجم</label><input name="weight" type="number" step=".1" required></div><div class="field"><label>سعر الشراء</label><input name="price" type="number" required></div><div class="field"><label>السلالة</label><div id="breedHolder">${breedField(fixedType)}</div></div></div>${fixedType==='sheep'?`<div class="breed-note">تذكير من المحاضرة الثانية: ذكرت الدكتورة للحملان شراء الحمل بعد العمر التقريبي 4–6 أشهر، ثم دورة تسمين قصيرة نحو شهرين إلى ثلاثة أشهر. لا يحول النظام هذا إلى حكم آلي على العمر.</div>`:''}
<div class="selection-box"><h4>1) صلاحية السلالة للتسمين</h4><p>لا يكفي اسم السلالة؛ أكّد معايير الاختيار التي ذكرتها الدكتورة.</p><div class="check-grid"><label class="check-item"><input type="checkbox" name="breedGrowth">سرعة نمو وكفاءة تحويل العلف مناسبة</label><label class="check-item"><input type="checkbox" name="breedHeat">متكيفة مع حرارة السودان</label><label class="check-item"><input type="checkbox" name="breedDisease">مقاومتها للأمراض الشائعة مناسبة</label><label class="check-item"><input type="checkbox" name="breedMeat">جودة اللحم وطلب السوق مناسبان</label><label class="check-item"><input type="checkbox" name="breedLocal">متوفرة محليًا بسعر مناسب</label></div></div>
<div class="selection-box"><h4>2) بنية الجسم والحركة</h4><p>افحص الحيوان على أرض مستوية كما أوصت المحاضرة.</p><div class="check-grid"><label class="check-item"><input type="checkbox" name="legs">الأرجل سليمة وتباعد الخلفيتين جيد</label><label class="check-item"><input type="checkbox" name="back">الظهر مستقيم</label><label class="check-item"><input type="checkbox" name="bodyBalance">خط الظهر متوازن مع خط البطن</label><label class="check-item"><input type="checkbox" name="noDefects">لا توجد عيوب خلقية ظاهرة</label><label class="check-item"><input type="checkbox" name="movement">الحركة طبيعية ولا يوجد عرج</label></div></div>
<div class="selection-box"><h4>3) علامات الحيوان السليم</h4><div class="check-grid"><label class="check-item"><input type="checkbox" name="eyes">العينان لامعتان ولا دمع أو إفرازات</label><label class="check-item"><input type="checkbox" name="nose">الأنف رطب وبارد</label><label class="check-item"><input type="checkbox" name="coat"><span id="coatLabel">الشعر لامع وناعم</span></label><label class="check-item"><input type="checkbox" name="active">الحيوان نشيط ويرفع رأسه</label><label class="check-item"><input type="checkbox" name="noCough">لا توجد كحة</label><label class="check-item"><input type="checkbox" name="noDiarrhea">لا يوجد إسهال</label><label class="check-item"><input type="checkbox" name="noWounds">لا توجد جروح</label><label class="check-item"><input type="checkbox" name="skin">الجلد سليم وغير متضرر</label><label class="check-item"><input type="checkbox" name="hoof">الحافر جاف ولا توجد علامات التهاب</label><label class="check-item"><input type="checkbox" name="rearClean">المنطقة الخلفية نظيفة ولا آثار إسهال</label></div></div>
<div class="selection-box"><h4>4) العمر والأسنان والسوق</h4><p>المحاضرة لم تعطِ عمرًا رقميًا نهائيًا، لذلك نطلب فقط توثيق الفحص والمقارنة.</p><div class="check-grid"><label class="check-item"><input type="checkbox" name="teeth">تم فحص الأسنان لتقدير العمر</label><label class="check-item"><input type="checkbox" name="marketAnimals">تمت مقارنة أكثر من حيوان</label><label class="check-item"><input type="checkbox" name="marketTraders">تمت مقارنة أكثر من تاجر / سعر</label><label class="check-item"><input type="checkbox" name="expert">استعنت بطبيب بيطري أو شخص خبير (مستحسن)</label></div></div>
<div id="animalAssessment" class="assessment review">يحتاج مراجعة قبل الاعتماد — أكمل قائمة الفحص.</div><div class="source-note">هذه النتيجة أداة تذكير مبنية على المحاضرة، وليست تشخيصًا بيطريًا.</div><div class="field full" style="margin-top:14px"><label>ملاحظة مهمة مثبتة</label><textarea name="note" placeholder="اختياري — تظهر أعلى ملف الحيوان"></textarea></div><div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">إلغاء</button><button class="btn primary">اعتماد الحيوان وإضافته للخطة</button></div></form>`);updateAnimalAssessment()}
function createAnimal(ev,pid,gid){ev.preventDefault();const p=plan(pid),f=new FormData(ev.target);if(!p.shelter?.ready){alert('لا يمكن إضافة الحيوان قبل اكتمال تجهيز الزريبة.');return;}if(p.shelter.animalType&&f.get('animalType')!==p.shelter.animalType){alert('نوع الحيوان يجب أن يطابق نوع الزريبة المعتمد للخطة.');return;}if(planAnimals(pid).filter(a=>a.status!=='sold').length>=p.shelter.headCount){alert('تجاوزت العدد الذي تم تقييم الزريبة عليه.');return;}if(f.get('sex')!=='ذكر'){alert('لا يمكن اعتماد الأنثى للتسمين وفق تحذير المحاضرة الأولى.');return;}const missing=purchaseCheckNames.filter(n=>!f.get(n));if(missing.length){alert('لا يمكن اعتماد الحيوان قبل إكمال جميع نقاط الفحص الأساسية في المحاضرة الأولى.');return;}const w=+f.get('weight'),d=f.get('buyDate');const selection={result:'suitable',checkedAt:today(),expertChecked:!!f.get('expert'),criteria:Object.fromEntries(purchaseCheckNames.map(n=>[n,true]))};state.animals.push({id:uid('a'),planId:pid,groupId:gid,animalType:f.get('animalType'),tag:f.get('tag'),buyDate:d,buyPlace:f.get('buyPlace'),buyWeight:w,buyPrice:+f.get('price'),breed:f.get('breed'),sex:f.get('sex'),status:'normal',selection,pinnedNote:f.get('note'),weights:[{date:d,value:w}],notes:[]});save();closeModal();render()}
function openAnimal(id){const a=state.animals.find(x=>x.id===id),p=plan(a.planId),last=a.weights.at(-1)?.value||a.buyWeight,type=a.animalType==='sheep'?'ضأن':a.animalType==='calf'?'عجل':'غير محدد',selection=a.selection?.result==='suitable'?'<span class="badge active">اجتاز فحص الاختيار</span>':'<span class="badge">سجل قديم — لم يمر بقائمة الفحص الجديدة</span>';modal(`<div class="modal-head"><div class="animal-head"><div class="animal-icon">${a.animalType==='sheep'?'🐑':'🐂'}</div><div><h3 style="margin:0">الحيوان #${a.tag}</h3><div class="small muted">${p.name} • ${type} • ${animalStatus(a.status)}</div></div></div><button class="close" onclick="closeModal()">×</button></div>${a.pinnedNote?`<div class="note-pin">📌 <strong>ملاحظة مهمة:</strong> ${a.pinnedNote}</div>`:''}<div style="margin-top:12px">${selection}</div><div class="grid metrics" style="margin-top:15px"><div class="metric"><div class="label">وزن الشراء</div><div class="value">${a.buyWeight}</div><div class="note">كجم</div></div><div class="metric"><div class="label">آخر وزن</div><div class="value">${last}</div><div class="note">كجم</div></div><div class="metric good"><div class="label">إجمالي الزيادة</div><div class="value">+${last-a.buyWeight}</div><div class="note">كجم</div></div></div><div class="card" style="box-shadow:none;margin-top:12px"><h3>السجل الأولي الثابت</h3><div class="form-grid"><div><div class="small muted">نوع الحيوان</div><strong>${type}</strong></div><div><div class="small muted">تاريخ الشراء</div><strong>${a.buyDate}</strong></div><div><div class="small muted">مكان الشراء</div><strong>${a.buyPlace}</strong></div><div><div class="small muted">سعر الشراء</div><strong>${fmt(a.buyPrice)}</strong></div><div><div class="small muted">السلالة / الجنس</div><strong>${a.breed||'-'} / ${a.sex}</strong></div><div><div class="small muted">فحص خبير/بيطري</div><strong>${a.selection?.expertChecked?'تم':'غير مسجل'}</strong></div></div></div><div class="card" style="box-shadow:none;margin-top:12px"><h3>الملاحظات اليومية</h3>${a.notes.length?a.notes.slice().reverse().map(n=>`<div class="alert good"><span class="dot"></span><div><strong>${n.date}</strong><small>${n.text}</small></div></div>`).join(''):empty('لا توجد ملاحظات يومية')}</div>`)}
function openFeedModal(pid){modal(`<div class="modal-head"><div><h3>شراء علف</h3><div class="small muted">يسجل المخزون، بينما طريقة التقديم اليومية تُدار من «برنامج التغذية».</div></div><button class="close" onclick="closeModal()">×</button></div><form onsubmit="createFeed(event,'${pid}')"><div class="form-grid"><div class="field"><label>اسم العلف</label><input name="name" required placeholder="مثال: فتريتة، تبن، علف مركز"></div><div class="field"><label>التصنيف</label><select name="category" required><option value="concentrate">علف مركز</option><option value="roughage">علف مالئ / ألياف</option><option value="other">إضافة / أخرى</option></select></div><div class="field"><label>الكمية بالكيلو</label><input name="qty" type="number" min="0" step=".001" required></div><div class="field"><label>تكلفة الكيلو</label><input name="cost" type="number" min="0" step=".01" required></div><div class="field"><label>تاريخ الشراء</label><input name="date" type="date" value="${today()}"></div></div><div class="selection-box"><h4>فحص ظاهر للعلف عند الإدخال</h4><div class="check-grid"><label class="check-item"><input type="checkbox" name="cleanDry">العلف جاف ونظيف ولا توجد رائحة منفرة أو بلل ظاهر</label><label class="check-item"><input type="checkbox" name="noMold">لا توجد علامات عفن ظاهرة</label></div><div class="source-note">إذا لم تُؤكد النقطتين سيُحفظ المخزون، لكنه يظهر «لا يُقدّم قبل المراجعة» حتى لا يعتبر النظام علفًا فاسدًا صالحًا تلقائيًا.</div></div><div class="modal-actions"><button class="btn" type="button" onclick="closeModal()">إلغاء</button><button class="btn primary">حفظ</button></div></form>`)}
function createFeed(ev,pid){ev.preventDefault();const f=new FormData(ev.target),quality=!!f.get('cleanDry')&&!!f.get('noMold');state.feeds.push({id:uid('f'),planId:pid,name:f.get('name'),category:f.get('category'),qtyKg:+f.get('qty'),unitCost:+f.get('cost'),purchased:f.get('date'),usedKg:0,qualityOk:quality});save();closeModal();render();if(!quality)setTimeout(()=>alert('تم حفظ المخزون، لكنه غير معتمد للتقديم حتى تتأكد أنه جاف ونظيف وخالٍ من العفن الظاهر.'),0)}
function openTreatmentModal(pid){const as=planAnimals(pid).filter(a=>a.status!=='sold');modal(`<div class="modal-head"><h3>تسجيل علاج</h3><button class="close" onclick="closeModal()">×</button></div><form onsubmit="createTreatment(event,'${pid}')"><div class="form-grid"><div class="field"><label>اسم العلاج</label><input name="name" required></div><div class="field"><label>الحيوان</label><select name="animal" required>${as.map(a=>`<option value="${a.id}">#${a.tag}</option>`).join('')}</select></div><div class="field"><label>تاريخ البداية</label><input name="start" type="date" value="${today()}"></div><div class="field"><label>عدد الأيام</label><input name="days" type="number" value="1" min="1"></div><div class="field"><label>تكلفة الكمية المستخدمة</label><input name="cost" type="number" value="0"></div><div class="field"><label>السبب</label><input name="reason"></div></div><div class="modal-actions"><button class="btn" type="button" onclick="closeModal()">إلغاء</button><button class="btn primary">حفظ العلاج</button></div></form>`)}
function createTreatment(ev,pid){ev.preventDefault();const f=new FormData(ev.target),aid=f.get('animal');state.treatments.push({id:uid('t'),planId:pid,animalIds:[aid],name:f.get('name'),start:f.get('start'),days:+f.get('days'),usedCost:+f.get('cost'),status:'active',reason:f.get('reason')});state.animals.find(a=>a.id===aid).status='treatment';save();closeModal();render()}
function openSaleModal(pid){const as=planAnimals(pid).filter(a=>a.status!=='sold');modal(`<div class="modal-head"><div><h3>تسجيل بيع</h3><div class="small muted">يمكن بيع حيوان واحد الآن وبقية القطيع لاحقًا.</div></div><button class="close" onclick="closeModal()">×</button></div><form onsubmit="createSale(event,'${pid}')"><div class="form-grid"><div class="field"><label>الحيوان</label><select name="animal" required>${as.map(a=>`<option value="${a.id}">#${a.tag}</option>`).join('')}</select></div><div class="field"><label>تاريخ البيع</label><input name="date" type="date" value="${today()}"></div><div class="field"><label>مكان البيع</label><input name="place" value="${plan(pid).sellPlace}"></div><div class="field"><label>طريقة البيع</label><select name="method"><option value="head">بالرأس</option><option value="weight">بالوزن</option></select></div><div class="field"><label>سعر البيع الفعلي</label><input name="amount" type="number" required></div><div class="field"><label>مصروفات البيع</label><input name="fees" type="number" value="0"></div><div class="field"><label>المشتري</label><input name="buyer"></div><div class="field"><label>وزن البيع (اختياري)</label><input name="weight" type="number" step=".1"></div></div><div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">إلغاء</button><button class="btn primary">تسجيل البيع</button></div></form>`)}
function createSale(ev,pid){ev.preventDefault();const f=new FormData(ev.target),aid=f.get('animal'),a=state.animals.find(x=>x.id===aid);state.sales.push({id:uid('s'),planId:pid,animalIds:[aid],date:f.get('date'),place:f.get('place'),method:f.get('method'),amount:+f.get('amount'),fees:+f.get('fees'),buyer:f.get('buyer')});a.status='sold';if(f.get('weight'))a.weights.push({date:f.get('date'),value:+f.get('weight')});save();closeModal();render()}

function render(){let html;switch(state.currentPage){case'plans':html=plansPage();break;case'clients':html=clientsPage();break;case'plan':html=planPage();break;case'daily':html=dailyPage();break;case'feeds':html=feedsPage();break;case'treatments':html=treatmentsPage();break;case'expenses':html=expensesPage();break;case'sales':html=salesPage();break;case'reports':html=reportsPage();break;default:html=dashboard();}document.getElementById('app').innerHTML=html}
render();
</script></body></html>
