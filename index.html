<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>إدارة التسمين</title>
<style>
:root{--p:#174a3a;--p2:#24624f;--bg:#f5f7f5;--card:#fff;--txt:#17221d;--muted:#6a7771;--line:#dfe7e2;--ok:#24714e;--warn:#a65e0c}*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:var(--bg);color:var(--txt)}button,input,select,textarea{font:inherit}.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.side{background:linear-gradient(180deg,#123f32,var(--p));color:#fff;padding:20px 14px}.brand{font-size:20px;font-weight:800;padding:8px 10px 20px}.brand small{display:block;font-size:11px;color:#cfe1da;margin-top:5px}.nav button{width:100%;border:0;background:transparent;color:#eef7f3;text-align:right;padding:11px 12px;border-radius:10px;margin:2px 0;cursor:pointer}.nav button:hover,.nav button.on{background:#ffffff1e}.main{min-width:0}.top{height:68px;background:#fffc;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:0 24px;position:sticky;top:0}.role{display:flex;gap:6px;background:#edf2ef;padding:5px;border-radius:10px}.role button{border:0;background:transparent;padding:7px 10px;border-radius:8px}.role button.on{background:white;color:var(--p);font-weight:bold}.content{padding:24px;max-width:1400px;margin:auto}.head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:18px}.head h1{font-size:25px;margin:0 0 5px}.muted{color:var(--muted);font-size:13px}.btn{border:1px solid var(--line);background:white;padding:10px 13px;border-radius:10px;font-weight:700;cursor:pointer}.btn.primary{background:var(--p);color:#fff;border-color:var(--p)}.metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:13px;margin-bottom:16px}.card,.metric{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:17px}.metric span{font-size:11px;color:var(--muted)}.metric strong{display:block;font-size:23px;margin-top:9px}.metric.hero{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff}.metric.hero span{color:#d8eae3}.grid{display:grid;grid-template-columns:1.3fr .7fr;gap:14px}.card h3{margin:0 0 14px}.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.plan{background:#fff;border:1px solid var(--line);border-radius:15px;padding:16px}.plan h3{margin:0 0 5px}.plan .nums{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:13px 0}.box{background:#f8faf8;border-radius:10px;padding:9px}.box span{font-size:10px;color:var(--muted);display:block}.box b{font-size:13px}.badge{display:inline-block;background:#e7f4ed;color:var(--ok);padding:5px 8px;border-radius:99px;font-size:11px;font-weight:bold}.alert{background:#f8faf8;border:1px solid var(--line);padding:11px;border-radius:10px;margin:8px 0;font-size:12px}.tabs{display:flex;gap:5px;overflow:auto;background:#edf2ef;padding:5px;border-radius:12px;margin-bottom:14px}.tabs button{border:0;background:transparent;padding:8px 11px;border-radius:8px;white-space:nowrap}.tabs button.on{background:white;color:var(--p);font-weight:bold}.table{overflow:auto;border:1px solid var(--line);border-radius:12px}table{width:100%;border-collapse:collapse;min-width:760px;background:#fff}th,td{padding:11px 12px;border-bottom:1px solid var(--line);text-align:right;font-size:12px}th{background:#f7faf8;color:var(--muted)}.modal-bg{position:fixed;inset:0;background:#08171088;display:grid;place-items:center;padding:15px}.modal{background:white;width:min(650px,100%);max-height:90vh;overflow:auto;border-radius:18px;padding:20px}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:12px;font-weight:bold}.field input,.field select,.field textarea{padding:10px;border:1px solid var(--line);border-radius:9px}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:15px}.close{float:left;border:0;background:#edf2ef;border-radius:8px;width:34px;height:34px}.empty{text-align:center;padding:35px;color:var(--muted)}
@media(max-width:1000px){.metrics{grid-template-columns:repeat(3,1fr)}.plans{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}}@media(max-width:760px){.app{grid-template-columns:1fr}.side{position:static}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap;width:auto}.top{padding:0 12px}.content{padding:15px}.metrics{grid-template-columns:1fr 1fr}.plans{grid-template-columns:1fr}.head{flex-direction:column}.form{grid-template-columns:1fr}.field.full{grid-column:auto}}
</style>
</head>
<body><div id="app"></div>
<script>
const fmt=n=>new Intl.NumberFormat('ar-SD').format(Math.round(+n||0)); const id=p=>p+Math.random().toString(36).slice(2,8); const today=()=>new Date().toISOString().slice(0,10);
let S=JSON.parse(localStorage.getItem('fattening-v3')||'null')||{role:'client',page:'dashboard',client:'c1',plan:'p1',tab:'overview',clients:[{id:'c1',name:'محمد أحمد',phone:'0912345678',city:'مدني'}],plans:[{id:'p1',clientId:'c1',name:'دورة أغسطس 2026',start:'2026-08-01',days:90,profit:20,sellPlace:'سوق مدني',status:'active'}],animals:[{id:'a1',planId:'p1',tag:'001',buyWeight:180,lastWeight:214,buyPrice:850000,status:'normal',note:'الشهية جيدة'},{id:'a2',planId:'p1',tag:'002',buyWeight:175,lastWeight:198,buyPrice:820000,status:'treatment',note:'متابعة تورم بسيط'}],expenses:[{id:'e1',planId:'p1',type:'نقل',amount:150000,date:'2026-08-01'}],feeds:[{id:'f1',planId:'p1',name:'علف مركز',qty:500,cost:500000,used:180}],treatments:[{id:'t1',planId:'p1',animalId:'a2',name:'مضاد حيوي',cost:25000,status:'مستمر'}],sales:[]};
const save=()=>localStorage.setItem('fattening-v3',JSON.stringify(S)); const client=()=>S.clients.find(x=>x.id===S.client); const plan=()=>S.plans.find(x=>x.id===S.plan); const animals=p=>S.animals.filter(x=>x.planId===p); const plans=()=>S.role==='admin'?S.plans:S.plans.filter(x=>x.clientId===S.client);
function stats(p){let a=animals(p.id),buy=a.reduce((s,x)=>s+x.buyPrice,0),feed=S.feeds.filter(x=>x.planId===p.id).reduce((s,x)=>s+x.cost,0),t=S.treatments.filter(x=>x.planId===p.id).reduce((s,x)=>s+x.cost,0),e=S.expenses.filter(x=>x.planId===p.id).reduce((s,x)=>s+x.amount,0),sales=S.sales.filter(x=>x.planId===p.id).reduce((s,x)=>s+x.amount,0),cost=buy+feed+t+e,target=cost*(1+p.profit/100);return{count:a.filter(x=>x.status!=='sold').length,cost,target,sales,profit:sales-cost}}
function nav(){let items=S.role==='admin'?[['dashboard','لوحة الإدارة'],['clients','العملاء'],['plans','الخطط'],['reports','التقارير']]:[['dashboard','لوحة التحكم'],['plans','خططي'],['reports','التقارير']];return `<aside class="side"><div class="brand">إدارة التسمين<small>خطط • حيوانات • تكاليف • أرباح</small></div><div class="nav">${items.map(x=>`<button class="${S.page===x[0]?'on':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('')}</div></aside>`}
function shell(body){return `<div class="app">${nav()}<main class="main"><div class="top"><b>${S.role==='admin'?'لوحة الأدمن':'حساب العميل'}</b><div class="role"><button class="${S.role==='client'?'on':''}" onclick="role('client')">عميل</button><button class="${S.role==='admin'?'on':''}" onclick="role('admin')">أدمن</button></div></div><div class="content">${body}</div></main></div><div id="modal"></div>`}
function dash(){let pp=plans(),ss=pp.map(stats),cost=ss.reduce((s,x)=>s+x.cost,0),target=ss.reduce((s,x)=>s+x.target,0),cnt=ss.reduce((s,x)=>s+x.count,0);return `<div class="head"><div><h1>${S.role==='admin'?'نظرة عامة على النظام':'مرحبًا '+client().name}</h1><div class="muted">اعرف وضع خطط التسمين والتكلفة والربح من مكان واحد.</div></div><button class="btn primary" onclick="newPlan()">+ إنشاء خطة</button></div><div class="metrics"><div class="metric"><span>الخطط النشطة</span><strong>${pp.length}</strong></div><div class="metric"><span>الحيوانات الحالية</span><strong>${cnt}</strong></div><div class="metric"><span>إجمالي التكلفة</span><strong>${fmt(cost)}</strong></div><div class="metric hero"><span>البيع المطلوب للربح المستهدف</span><strong>${fmt(target)}</strong></div><div class="metric"><span>العملاء</span><strong>${S.role==='admin'?S.clients.length:1}</strong></div></div><div class="grid"><div class="card"><h3>الخطط النشطة</h3><div class="plans">${pp.map(planCard).join('')||'<div class="empty">لا توجد خطط</div>'}</div></div><div class="card"><h3>يحتاج انتباهك</h3><div class="alert">الحيوانات تحت العلاج: <b>${S.animals.filter(x=>x.status==='treatment').length}</b></div><div class="alert">كل مصروف أو علاج أو علف مرتبط بخطة محددة.</div><div class="alert">سعر البيع المطلوب يعاد حسابه تلقائيًا عند تغير التكلفة.</div></div></div>`}
function planCard(p){let s=stats(p);return `<div class="plan"><span class="badge">نشطة</span><h3>${p.name}</h3><div class="muted">${S.clients.find(c=>c.id===p.clientId)?.name||''}</div><div class="nums"><div class="box"><span>الحيوانات</span><b>${s.count}</b></div><div class="box"><span>التكلفة</span><b>${fmt(s.cost)}</b></div><div class="box"><span>الربح المستهدف</span><b>${p.profit}%</b></div><div class="box"><span>البيع المطلوب</span><b>${fmt(s.target)}</b></div></div><button class="btn primary" onclick="openPlan('${p.id}')">فتح الخطة</button></div>`}
function plansPage(){return `<div class="head"><div><h1>${S.role==='admin'?'كل الخطط':'خططي'}</h1><div class="muted">كل دورة تسمين مستقلة ماليًا وتشغيليًا.</div></div><button class="btn primary" onclick="newPlan()">+ خطة جديدة</button></div><div class="plans">${plans().map(planCard).join('')}</div>`}
function clientsPage(){return `<div class="head"><div><h1>العملاء</h1><div class="muted">الأدمن يستطيع إضافة العميل وإدارة خططه نيابة عنه.</div></div><button class="btn primary" onclick="newClient()">+ إضافة عميل</button></div><div class="table"><table><tr><th>العميل</th><th>الجوال</th><th>المدينة</th><th>عدد الخطط</th></tr>${S.clients.map(c=>`<tr><td><b>${c.name}</b></td><td>${c.phone}</td><td>${c.city}</td><td>${S.plans.filter(p=>p.clientId===c.id).length}</td></tr>`).join('')}</table></div>`}
function planPage(){let p=plan(),s=stats(p),a=animals(p.id),tabs=[['overview','نظرة عامة'],['animals','الحيوانات'],['feeds','الأعلاف'],['treatments','العلاجات'],['expenses','المصروفات'],['sales','البيع']];let body='';if(S.tab==='animals')body=`<button class="btn primary" onclick="addAnimal()">+ إضافة حيوان</button><div class="table" style="margin-top:12px"><table><tr><th>الحيوان</th><th>وزن الشراء</th><th>آخر وزن</th><th>الحالة</th><th>ملاحظة</th></tr>${a.map(x=>`<tr><td>#${x.tag}</td><td>${x.buyWeight}</td><td>${x.lastWeight}</td><td>${x.status==='treatment'?'تحت علاج':x.status==='sold'?'مباع':'طبيعي'}</td><td>${x.note||'-'}</td></tr>`).join('')}</table></div>`;else if(S.tab==='expenses')body=listOps('expense',p.id);else if(S.tab==='feeds')body=listOps('feed',p.id);else if(S.tab==='treatments')body=listOps('treatment',p.id);else if(S.tab==='sales')body=listOps('sale',p.id);else body=`<div class="grid"><div class="card"><h3>ملخص الخطة</h3><div class="alert">مكان البيع المتوقع: <b>${p.sellPlace}</b></div><div class="alert">مدة الدورة: <b>${p.days} يوم</b></div><div class="alert">نسبة الربح المستهدفة: <b>${p.profit}%</b></div></div><div class="card"><h3>قاعدة الحساب</h3><div class="alert">شراء الحيوانات + الأعلاف + العلاجات + المصروفات = إجمالي التكلفة</div><div class="alert">إجمالي التكلفة × (1 + نسبة الربح) = سعر البيع المطلوب</div></div></div>`;return `<div class="head"><div><h1>${p.name}</h1><div class="muted">${S.clients.find(c=>c.id===p.clientId).name} • ${p.start}</div></div><button class="btn" onclick="go('plans')">رجوع</button></div><div class="metrics"><div class="metric"><span>الحيوانات الحالية</span><strong>${s.count}</strong></div><div class="metric"><span>إجمالي التكلفة</span><strong>${fmt(s.cost)}</strong></div><div class="metric"><span>الربح المستهدف</span><strong>${p.profit}%</strong></div><div class="metric hero"><span>سعر البيع المطلوب</span><strong>${fmt(s.target)}</strong></div><div class="metric"><span>المبيعات الفعلية</span><strong>${fmt(s.sales)}</strong></div></div><div class="tabs">${tabs.map(t=>`<button class="${S.tab===t[0]?'on':''}" onclick="tab('${t[0]}')">${t[1]}</button>`).join('')}</div>${body}`}
function listOps(type,pid){let cfg={expense:['المصروفات','+ إضافة مصروف'],feed:['الأعلاف','+ شراء علف'],treatment:['العلاجات','+ تسجيل علاج'],sale:['المبيعات','+ تسجيل بيع']}[type],arr= type==='expense'?S.expenses.filter(x=>x.planId===pid):type==='feed'?S.feeds.filter(x=>x.planId===pid):type==='treatment'?S.treatments.filter(x=>x.planId===pid):S.sales.filter(x=>x.planId===pid);return `<div class="card"><div class="head"><h3>${cfg[0]}</h3><button class="btn primary" onclick="addOp('${type}')">${cfg[1]}</button></div>${arr.length?arr.map(x=>`<div class="alert"><b>${x.type||x.name||'عملية بيع'}</b> — ${fmt(x.amount||x.cost||0)} ${x.date||x.status||''}</div>`).join(''):'<div class="empty">لا توجد سجلات بعد</div>'}</div>`}
function reports(){return `<div class="head"><div><h1>التقارير</h1><div class="muted">مقارنة التكلفة والبيع المطلوب لكل خطة.</div></div></div><div class="table"><table><tr><th>الخطة</th><th>الحيوانات</th><th>التكلفة</th><th>البيع المطلوب</th><th>المبيعات</th></tr>${plans().map(p=>{let s=stats(p);return `<tr><td>${p.name}</td><td>${s.count}</td><td>${fmt(s.cost)}</td><td>${fmt(s.target)}</td><td>${fmt(s.sales)}</td></tr>`}).join('')}</table></div>`}
function go(p){S.page=p;save();render()} function role(r){S.role=r;if(r==='client'&&!S.client)S.client=S.clients[0]?.id;S.page='dashboard';save();render()} function openPlan(id){S.plan=id;S.page='plan';S.tab='overview';save();render()} function tab(t){S.tab=t;save();render()}
function modal(html){document.getElementById('modal').innerHTML=`<div class="modal-bg"><div class="modal"><button class="close" onclick="closeM()">×</button>${html}</div></div>`}function closeM(){document.getElementById('modal').innerHTML=''}
function newClient(){modal(`<h2>إضافة عميل</h2><form onsubmit="saveClient(event)" class="form"><div class="field"><label>الاسم</label><input name="name" required></div><div class="field"><label>الجوال</label><input name="phone" required></div><div class="field"><label>المدينة</label><input name="city"></div><div class="field full actions"><button class="btn primary">حفظ</button></div></form>`)}function saveClient(e){e.preventDefault();let f=new FormData(e.target);S.clients.push({id:id('c'),name:f.get('name'),phone:f.get('phone'),city:f.get('city')});save();closeM();render()}
function newPlan(){let opts=(S.role==='admin'?S.clients:[client()]).map(c=>`<option value="${c.id}">${c.name}</option>`).join('');modal(`<h2>إنشاء خطة تسمين</h2><form onsubmit="savePlan(event)" class="form"><div class="field"><label>العميل</label><select name="client">${opts}</select></div><div class="field"><label>اسم الخطة</label><input name="name" required></div><div class="field"><label>تاريخ البداية</label><input name="start" type="date" value="${today()}" required></div><div class="field"><label>المدة بالأيام</label><input name="days" type="number" value="90"></div><div class="field"><label>الربح المستهدف %</label><input name="profit" type="number" value="20"></div><div class="field"><label>مكان البيع المتوقع</label><input name="place"></div><div class="field full actions"><button class="btn primary">إنشاء الخطة</button></div></form>`)}function savePlan(e){e.preventDefault();let f=new FormData(e.target),p={id:id('p'),clientId:f.get('client'),name:f.get('name'),start:f.get('start'),days:+f.get('days'),profit:+f.get('profit'),sellPlace:f.get('place'),status:'active'};S.plans.push(p);S.plan=p.id;save();closeM();openPlan(p.id)}
function addAnimal(){modal(`<h2>إضافة حيوان</h2><form onsubmit="saveAnimal(event)" class="form"><div class="field"><label>رقم الحيوان</label><input name="tag" required></div><div class="field"><label>وزن الشراء كجم</label><input name="weight" type="number" required></div><div class="field"><label>سعر الشراء</label><input name="price" type="number" required></div><div class="field full"><label>ملاحظة خاصة بالحيوان</label><textarea name="note"></textarea></div><div class="field full actions"><button class="btn primary">إضافة</button></div></form>`)}function saveAnimal(e){e.preventDefault();let f=new FormData(e.target),w=+f.get('weight');S.animals.push({id:id('a'),planId:S.plan,tag:f.get('tag'),buyWeight:w,lastWeight:w,buyPrice:+f.get('price'),status:'normal',note:f.get('note')});save();closeM();render()}
function addOp(t){let fields=t==='expense'?`<div class="field"><label>نوع المصروف</label><input name="name" required></div><div class="field"><label>المبلغ</label><input name="amount" type="number" required></div>`:t==='feed'?`<div class="field"><label>نوع العلف</label><input name="name" required></div><div class="field"><label>الكمية كجم</label><input name="qty" type="number"></div><div class="field"><label>التكلفة</label><input name="amount" type="number" required></div>`:t==='treatment'?`<div class="field"><label>اسم العلاج</label><input name="name" required></div><div class="field"><label>التكلفة المستخدمة</label><input name="amount" type="number" required></div>`:`<div class="field"><label>سعر البيع الفعلي</label><input name="amount" type="number" required></div>`;modal(`<h2>إضافة سجل</h2><form onsubmit="saveOp(event,'${t}')" class="form">${fields}<div class="field"><label>التاريخ</label><input name="date" type="date" value="${today()}"></div><div class="field full actions"><button class="btn primary">حفظ</button></div></form>`)}function saveOp(e,t){e.preventDefault();let f=new FormData(e.target),base={id:id(t[0]),planId:S.plan,date:f.get('date')};if(t==='expense')S.expenses.push({...base,type:f.get('name'),amount:+f.get('amount')});if(t==='feed')S.feeds.push({...base,name:f.get('name'),qty:+f.get('qty'),cost:+f.get('amount'),used:0});if(t==='treatment')S.treatments.push({...base,name:f.get('name'),cost:+f.get('amount'),status:'مستمر'});if(t==='sale')S.sales.push({...base,amount:+f.get('amount')});save();closeM();render()}
function render(){let body=S.page==='plans'?plansPage():S.page==='clients'&&S.role==='admin'?clientsPage():S.page==='plan'?planPage():S.page==='reports'?reports():dash();document.getElementById('app').innerHTML=shell(body)}render();
</script></body></html>
